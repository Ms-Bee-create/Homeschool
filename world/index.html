<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge World 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html,body{margin:0;height:100%;background:#87ceeb;overflow:hidden;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
  canvas{display:block}
  #cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none}
  #cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
  #cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
  #prompt{position:fixed;left:50%;top:58%;transform:translateX(-50%);background:rgba(0,0,0,.65);border:3px solid #000;padding:8px 16px;font-size:20px;display:none}
  #hint{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-size:14px;padding:6px 12px;text-align:center}
  #who{position:fixed;left:10px;top:10px;background:rgba(0,0,0,.55);padding:4px 10px;font-size:14px;border:3px solid #000}
  #toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:#ffd23f;color:#222;border:3px solid #000;padding:8px 16px;font-size:18px;display:none}
  #start{position:fixed;inset:0;background:rgba(15,20,36,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
  #start button{font-size:24px;padding:14px 30px;background:#ffd23f;border:4px solid #000;cursor:pointer;font-family:inherit;font-weight:bold}
  #start p{max-width:560px;line-height:1.5}
</style>
</head>
<body>
<div id="who"></div>
<div id="cross"></div>
<div id="prompt"></div>
<div id="toast"></div>
<div id="hint">W A S D move · mouse look (click the world first) · Space jump · E go in a door · 1-6 emotes · V see yourself</div>
<div id="start">
  <h1>Forge World</h1>
  <p>Walk around, find the buildings, and walk up to a door to go in. Open this page in a second window to see another explorer. Take a break if you feel dizzy.</p>
  <button id="go">Click to play</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   THE ZONES. Each one is a building with a door. Change names and colors!
   ============================================================ */
var ZONES = [
  {key:"scratchos", name:"Scratch OS Town",       wall:"#5fae3a", roof:"#3d7a24", door:"#ffd23f"},
  {key:"underhood", name:"Under the Hood Caves",  wall:"#7c8088", roof:"#5d6168", door:"#ff9f43"},
  {key:"viewer",    name:"3D Viewer Workshop",    wall:"#e8d28a", roof:"#c9b16a", door:"#3fe0e6"},
  {key:"vrlab",     name:"VR Lab Tower",          wall:"#a8734a", roof:"#7a4a2a", door:"#ff6b9d"},
  {key:"johnnyos",  name:"JohnnyOS",              wall:"#6f8fe0", roof:"#3f5bb0", door:"#7dff6b"}
];
/* ============================================================ */

var P = {};   // who am I (the app can pass this in the link: #p=<json>)
try { var m = /[#&]p=([^&]*)/.exec(location.hash); if (m) P = JSON.parse(decodeURIComponent(m[1])); } catch (e) {}
var ME = {
  id: P.id || ("p" + Math.random().toString(36).slice(2, 8)),
  name: P.name || "Explorer",
  look: Object.assign({skin:"#e8b88a", hair:"#4a2c12", style:"short", outfit:"#3f7dff"}, P.look || {}),
  wear: P.wear || {}
};
document.getElementById("who").textContent = "You are " + ME.name;

/* ---------- the world: blocks on a grid ---------- */
var N = 64, HALF = 32, H = [], blocks = [], solid = {};
function key(x, y, z){ return x + "," + y + "," + z; }
function terrainH(x, z){
  var d = Math.sqrt(x * x + z * z);
  if (d < 20) return 1;
  var a = Math.sin(x * 0.21) + Math.cos(z * 0.17) + Math.sin((x + z) * 0.11);
  return Math.max(0, Math.min(5, Math.round(1.8 + a * 1.1 + (d - 20) * 0.06)));
}
for (var ix = 0; ix < N; ix++) for (var iz = 0; iz < N; iz++) H[ix * N + iz] = terrainH(ix - HALF, iz - HALF);
function hAt(x, z){ if (x < -HALF || x >= HALF || z < -HALF || z >= HALF) return 99; return H[(x + HALF) * N + (z + HALF)]; }
function solidAt(x, y, z){ return y <= hAt(x, z) || solid[key(x, y, z)] === true; }
function addBlock(x, y, z, color, isSolid){ blocks.push({x:x, y:y, z:z, c:color}); if (isSolid) solid[key(x, y, z)] = true; }

for (var x = -HALF; x < HALF; x++) for (var z = -HALF; z < HALF; z++){
  var h = hAt(x, z), top = h >= 5 ? "#e8eef5" : h >= 4 ? "#7c8088" : "#5fae3a";
  addBlock(x, h, z, top, false);
  var low = Math.min(hAt(x - 1, z), hAt(x + 1, z), hAt(x, z - 1), hAt(x, z + 1), h);
  for (var y = h - 1; y > low - 1 && y >= 0; y--) addBlock(x, y, z, h >= 4 ? "#6a6e75" : "#8a5a34", false);
}

var doorSpots = [];   // where each door is, so you can walk up to it
ZONES.forEach(function(zn, i){
  var ang = i / ZONES.length * Math.PI * 2 + 0.3, cx = Math.round(Math.cos(ang) * 13), cz = Math.round(Math.sin(ang) * 13);
  var base = 2, W = 7, half = 3;
  var axisX = Math.abs(cx) > Math.abs(cz), sx = axisX ? -Math.sign(cx) : 0, sz = axisX ? 0 : -Math.sign(cz);   // the door faces the middle of the world
  for (var dx = -half; dx <= half; dx++) for (var dz = -half; dz <= half; dz++){
    var edge = Math.abs(dx) === half || Math.abs(dz) === half;
    for (var yy = 0; yy < 4; yy++){
      var wx = cx + dx, wz = cz + dz, wy = base + yy;
      if (yy === 3) { addBlock(wx, wy, wz, zn.roof, true); continue; }
      if (!edge) continue;
      var onDoorSide = axisX ? (dx === sx * half) : (dz === sz * half);
      var doorCol = axisX ? (dz === 0) : (dx === 0);
      var postCol = axisX ? (Math.abs(dz) === 1) : (Math.abs(dx) === 1);
      if (onDoorSide && doorCol && yy < 2) continue;                     // the doorway
      if (onDoorSide && (postCol || (doorCol && yy === 2))) { addBlock(wx, wy, wz, zn.door, true); continue; }
      addBlock(wx, wy, wz, zn.wall, true);
    }
  }
  addBlock(cx, base, cz, zn.door, true);                                 // a lesson block inside
  doorSpots.push({zone:zn, x:cx + sx * (half + 1.5) + 0.5, z:cz + sz * (half + 1.5) + 0.5, sx:cx + 0.5, sy:base + 5.2, sz:cz + 0.5});
});

/* ---------- three.js scene ---------- */
var scene = new THREE.Scene(); scene.background = new THREE.Color(0x87ceeb); scene.fog = new THREE.Fog(0x87ceeb, 25, 70);
var camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 120);
var renderer = new THREE.WebGLRenderer({antialias:false}); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.75)); var sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(30, 60, 20); scene.add(sun);
addEventListener("resize", function(){ camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

(function(){
  var mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({color:0xffffff}), blocks.length);
  var d = new THREE.Object3D(), col = new THREE.Color();
  blocks.forEach(function(b, i){
    d.position.set(b.x + 0.5, b.y + 0.5, b.z + 0.5); d.updateMatrix(); mesh.setMatrixAt(i, d.matrix);
    col.set(b.c); var v = 0.9 + ((b.x * 7 + b.y * 13 + b.z * 17) % 5) * 0.03; col.multiplyScalar(v); mesh.setColorAt(i, col);
  });
  scene.add(mesh);
})();

function labelSprite(text, w, scale, bg){
  var c = document.createElement("canvas"); c.width = 512; c.height = 96; var g = c.getContext("2d");
  g.fillStyle = bg || "rgba(0,0,0,.6)"; g.fillRect(0, 0, 512, 96); g.fillStyle = "#fff"; g.font = "bold 44px Trebuchet MS, Verdana, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 256, 50);
  var s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthTest:false})); s.scale.set(w, w * 96 / 512, 1); s.renderOrder = 10; return s;
}
function emojiSprite(e){
  var c = document.createElement("canvas"); c.width = c.height = 128; var g = c.getContext("2d"); g.font = "96px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(e, 64, 70);
  var s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthTest:false})); s.scale.set(0.9, 0.9, 1); s.renderOrder = 11; return s;
}
doorSpots.forEach(function(ds){ var s = labelSprite(ds.zone.name, 6, 1); s.position.set(ds.sx, ds.sy, ds.sz); scene.add(s); });

/* ---------- explorers are made of boxes ---------- */
function box(w, h, d, color, x, y, z){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({color:color})); m.position.set(x, y, z); return m;
}
function buildAvatar(look, wear){
  var g = new THREE.Group(), L = look, W = wear || {};
  g.add(box(0.25, 0.7, 0.25, "#2b3a8f", -0.13, 0.35, 0)); g.add(box(0.25, 0.7, 0.25, "#2b3a8f", 0.13, 0.35, 0));
  g.add(box(0.5, 0.7, 0.25, L.outfit, 0, 1.05, 0));
  g.add(box(0.2, 0.7, 0.2, L.skin, -0.36, 1.05, 0)); g.add(box(0.2, 0.7, 0.2, L.skin, 0.36, 1.05, 0));
  g.add(box(0.5, 0.5, 0.5, L.skin, 0, 1.55, 0));
  g.add(box(0.08, 0.08, 0.02, "#111", -0.12, 1.58, -0.26)); g.add(box(0.08, 0.08, 0.02, "#111", 0.12, 1.58, -0.26));
  var hc = L.hair, st = L.style;
  if (st !== "cap") { g.add(box(0.54, 0.14, 0.54, hc, 0, 1.8, 0)); g.add(box(0.54, 0.12, 0.06, hc, 0, 1.7, -0.25)); }
  if (st === "long") { g.add(box(0.54, 0.8, 0.1, hc, 0, 1.4, 0.27)); g.add(box(0.08, 0.6, 0.3, hc, -0.29, 1.45, 0.1)); g.add(box(0.08, 0.6, 0.3, hc, 0.29, 1.45, 0.1)); }
  if (st === "ponytail") g.add(box(0.14, 0.5, 0.14, hc, 0, 1.5, 0.32));
  if (st === "braid") g.add(box(0.1, 0.65, 0.1, hc, 0, 1.3, 0.3));
  if (st === "spiky") { g.add(box(0.14, 0.22, 0.14, hc, -0.17, 1.95, 0)); g.add(box(0.14, 0.3, 0.14, hc, 0, 1.98, 0)); g.add(box(0.14, 0.22, 0.14, hc, 0.17, 1.95, 0)); }
  if (st === "curly") { g.add(box(0.18, 0.18, 0.18, hc, -0.3, 1.7, 0)); g.add(box(0.18, 0.18, 0.18, hc, 0.3, 1.7, 0)); g.add(box(0.2, 0.2, 0.2, hc, 0, 1.92, 0)); }
  if (st === "cap") { g.add(box(0.56, 0.16, 0.56, L.outfit, 0, 1.8, 0)); g.add(box(0.4, 0.04, 0.3, L.outfit, 0, 1.74, -0.38)); }
  if (W.hat) { g.add(box(0.7, 0.06, 0.7, "#3d1a6a", 0, 1.86, 0)); g.add(box(0.4, 0.25, 0.4, "#5b2a9a", 0, 2.0, 0)); g.add(box(0.2, 0.25, 0.2, "#5b2a9a", 0, 2.24, 0)); }
  if (W.shades) g.add(box(0.44, 0.1, 0.02, "#000", 0, 1.6, -0.27));
  if (W.bow) g.add(box(0.22, 0.12, 0.06, "#ff5fa2", 0.2, 1.9, -0.2));
  if (W.crown) [-0.2, 0, 0.2].forEach(function(cx){ g.add(box(0.1, 0.14, 0.1, "#ffd86b", cx, 1.95, -0.2)); });
  if (W.cape) g.add(box(0.5, 0.85, 0.05, "#c8282d", 0, 1.0, 0.17));
  if (W.pack) g.add(box(0.32, 0.42, 0.16, "#8a5a34", 0, 1.1, 0.2));
  if (W.wings) { var w1 = box(0.5, 0.7, 0.04, "#bfe8ff", -0.32, 1.15, 0.2); w1.rotation.z = 0.3; var w2 = box(0.5, 0.7, 0.04, "#bfe8ff", 0.32, 1.15, 0.2); w2.rotation.z = -0.3; g.add(w1); g.add(w2); }
  if (W.pick) { g.add(box(0.06, 0.7, 0.06, "#8a5a34", -0.5, 0.95, -0.2)); g.add(box(0.4, 0.07, 0.07, "#9aa4b2", -0.5, 1.3, -0.2)); }
  if (W.laptop) { g.add(box(0.3, 0.02, 0.22, "#8a93a8", -0.5, 0.78, -0.25)); g.add(box(0.3, 0.2, 0.02, "#3fe0e6", -0.5, 0.9, -0.14)); }
  if (W.robot) { g.add(box(0.3, 0.3, 0.25, "#9aa4b2", 0.7, 0.35, 0)); g.add(box(0.2, 0.18, 0.2, "#c9d1e0", 0.7, 0.6, 0)); g.add(box(0.04, 0.04, 0.02, "#c8282d", 0.65, 0.62, -0.11)); g.add(box(0.04, 0.04, 0.02, "#c8282d", 0.75, 0.62, -0.11)); }
  return g;
}

/* ---------- me ---------- */
var me = {x:0.5, y:2, z:0.5, vx:0, vy:0, vz:0, yaw:0, pitch:0, onGround:false, third:false};
var myAvatar = buildAvatar(ME.look, ME.wear); scene.add(myAvatar);
var myLabel = labelSprite(ME.name, 1.6, 1, "rgba(0,0,0,.5)"); myLabel.position.y = 2.5; myAvatar.add(myLabel);
var myEmote = null;
function collides(px, py, pz){
  var r = 0.3, ys = [0.05, 0.95, 1.75], xs = [-r, r];
  for (var a = 0; a < 2; a++) for (var b = 0; b < 2; b++) for (var c = 0; c < 3; c++){
    if (solidAt(Math.floor(px + xs[a]), Math.floor(py + ys[c]), Math.floor(pz + xs[b]))) return true;
  }
  return false;
}
var keys = {}, locked = false, dragging = false, lastMouse = null;
addEventListener("keydown", function(e){
  keys[e.code] = true;
  if (e.code === "Space") e.preventDefault();
  if (e.code === "KeyE") useDoor();
  if (e.code === "KeyV") me.third = !me.third;
  var n = parseInt(e.key, 10); if (n >= 1 && n <= 6) emote(EMOTES[n - 1]);
});
addEventListener("keyup", function(e){ keys[e.code] = false; });
var EMOTES = ["👋", "🎉", "😮", "👍", "❤️", "🤔"];
document.getElementById("go").onclick = function(){
  document.getElementById("start").style.display = "none";
  try { renderer.domElement.requestPointerLock(); } catch (e) {}
};
renderer.domElement.addEventListener("click", function(){ try { renderer.domElement.requestPointerLock(); } catch (e) {} });
document.addEventListener("pointerlockchange", function(){ locked = document.pointerLockElement === renderer.domElement; });
addEventListener("mousedown", function(e){ dragging = true; lastMouse = [e.clientX, e.clientY]; });
addEventListener("mouseup", function(){ dragging = false; });
addEventListener("mousemove", function(e){
  var dx = 0, dy = 0;
  if (locked) { dx = e.movementX; dy = e.movementY; }
  else if (dragging && lastMouse) { dx = e.clientX - lastMouse[0]; dy = e.clientY - lastMouse[1]; lastMouse = [e.clientX, e.clientY]; }
  me.yaw -= dx * 0.0025; me.pitch = Math.max(-1.4, Math.min(1.4, me.pitch - dy * 0.0025));
});

var toastT = null;
function toast(t){ var el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(function(){ el.style.display = "none"; }, 3500); }
function nearDoor(){
  for (var i = 0; i < doorSpots.length; i++){ var d = doorSpots[i]; if (Math.hypot(me.x - d.x, me.z - d.z) < 2.6) return d; }
  return null;
}
function useDoor(){
  var d = nearDoor(); if (!d) return;
  try { if (parent !== window) parent.postMessage({forge:"enterZone", key:d.zone.key}, "*"); } catch (e) {}
  toast("In the real app this opens the " + d.zone.name + " lessons.");
}
function emote(e){
  if (myEmote){ myAvatar.remove(myEmote); } myEmote = emojiSprite(e); myEmote.position.y = 2.9; myAvatar.add(myEmote); me.emote = e; me.emoteAt = Date.now(); sendNow();
}

/* ---------- other explorers: the transport is swappable (a local tab-to-tab channel now, a live connection later) ---------- */
var others = {};
var net = (function(){
  var ch = null; try { ch = new BroadcastChannel("forge-world"); } catch (e) {}
  return {send:function(m){ if (ch) ch.postMessage(m); }, onmsg:function(f){ if (ch) ch.onmessage = function(ev){ f(ev.data); }; }};
})();
net.onmsg(function(m){
  if (!m || m.id === ME.id) return;
  var o = others[m.id];
  if (!o){
    var g = buildAvatar(m.look, m.wear), lab = labelSprite(m.name || "Explorer", 1.6, 1, "rgba(0,0,0,.5)"); lab.position.y = 2.5; g.add(lab);
    scene.add(g); o = others[m.id] = {g:g, tx:m.x, ty:m.y, tz:m.z, yaw:m.yaw, seen:0, emote:null};
    g.position.set(m.x, m.y, m.z);
    toast(m.name + " joined the world!");
  }
  o.tx = m.x; o.ty = m.y; o.tz = m.z; o.yaw = m.yaw; o.seen = Date.now();
  if (m.emote && m.emoteAt !== o.lastEmoteAt){ o.lastEmoteAt = m.emoteAt; if (o.emote) o.g.remove(o.emote); o.emote = emojiSprite(m.emote); o.emote.position.y = 2.9; o.g.add(o.emote); o.emoteUntil = Date.now() + 3000; }
});
var lastSent = 0, lastPos = "";
function sendNow(){
  net.send({id:ME.id, name:ME.name, look:ME.look, wear:ME.wear, x:me.x, y:me.y, z:me.z, yaw:me.yaw, emote:me.emote, emoteAt:me.emoteAt});
  lastSent = Date.now();
}

/* ---------- the loop ---------- */
var prev = performance.now();
function frame(now){
  var dt = Math.min((now - prev) / 1000, 0.05); prev = now;
  // look with arrow keys or a controller as well
  var pads = navigator.getGamepads ? navigator.getGamepads() : [], pad = null; for (var i = 0; i < pads.length; i++) if (pads[i]) { pad = pads[i]; break; }
  if (keys.ArrowLeft) me.yaw += 1.8 * dt; if (keys.ArrowRight) me.yaw -= 1.8 * dt;
  if (keys.ArrowUp) me.pitch = Math.min(1.4, me.pitch + 1.2 * dt); if (keys.ArrowDown) me.pitch = Math.max(-1.4, me.pitch - 1.2 * dt);
  var mx = 0, mz = 0;
  if (keys.KeyW) mz += 1; if (keys.KeyS) mz -= 1; if (keys.KeyD) mx += 1; if (keys.KeyA) mx -= 1;
  var jump = !!keys.Space;
  if (pad){
    if (Math.abs(pad.axes[0]) > 0.2) mx += pad.axes[0]; if (Math.abs(pad.axes[1]) > 0.2) mz -= pad.axes[1];
    if (Math.abs(pad.axes[2] || 0) > 0.2) me.yaw -= pad.axes[2] * 2.2 * dt; if (Math.abs(pad.axes[3] || 0) > 0.2) me.pitch = Math.max(-1.4, Math.min(1.4, me.pitch - pad.axes[3] * 1.5 * dt));
    if (pad.buttons[0] && pad.buttons[0].pressed) jump = true;
    if (pad.buttons[2] && pad.buttons[2].pressed && !frame.xDown) useDoor(); frame.xDown = !!(pad.buttons[2] && pad.buttons[2].pressed);
  }
  var len = Math.hypot(mx, mz) || 1, speed = 4.3;
  var fx = -Math.sin(me.yaw), fz = -Math.cos(me.yaw), rx = Math.cos(me.yaw), rz = -Math.sin(me.yaw);
  me.vx = ((fx * mz + rx * mx) / len) * speed * (mx || mz ? 1 : 0); me.vz = ((fz * mz + rz * mx) / len) * speed * (mx || mz ? 1 : 0);
  if (jump && me.onGround){ me.vy = 8.2; me.onGround = false; }
  me.vy -= 24 * dt;
  var nx = me.x + me.vx * dt; if (!collides(nx, me.y, me.z)) me.x = nx;
  var nz = me.z + me.vz * dt; if (!collides(me.x, me.y, nz)) me.z = nz;
  var ny = me.y + me.vy * dt;
  if (!collides(me.x, ny, me.z)) { me.y = ny; me.onGround = false; }
  else { if (me.vy < 0) me.onGround = true; me.vy = 0; }
  if (me.y < -10) { me.x = 0.5; me.y = 4; me.z = 0.5; me.vy = 0; }

  myAvatar.position.set(me.x, me.y, me.z); myAvatar.rotation.y = me.yaw; myAvatar.visible = me.third;
  if (myEmote && Date.now() - me.emoteAt > 3000){ myAvatar.remove(myEmote); myEmote = null; me.emote = null; }
  var eye = new THREE.Vector3(me.x, me.y + 1.6, me.z);
  camera.rotation.order = "YXZ"; camera.rotation.set(me.pitch, me.yaw, 0);
  if (me.third){ var back = new THREE.Vector3(Math.sin(me.yaw), 0, Math.cos(me.yaw)).multiplyScalar(3.6); camera.position.set(eye.x + back.x, eye.y + 0.8, eye.z + back.z); }
  else camera.position.copy(eye);

  Object.keys(others).forEach(function(id){
    var o = others[id];
    if (Date.now() - o.seen > 6000){ scene.remove(o.g); delete others[id]; return; }
    o.g.position.x += (o.tx - o.g.position.x) * Math.min(1, dt * 10); o.g.position.y += (o.ty - o.g.position.y) * Math.min(1, dt * 10); o.g.position.z += (o.tz - o.g.position.z) * Math.min(1, dt * 10);
    o.g.rotation.y = o.yaw;
    if (o.emote && Date.now() > o.emoteUntil){ o.g.remove(o.emote); o.emote = null; }
  });
  var key2 = [me.x.toFixed(1), me.y.toFixed(1), me.z.toFixed(1), me.yaw.toFixed(1)].join();
  if ((key2 !== lastPos && Date.now() - lastSent > 200) || Date.now() - lastSent > 2000){ lastPos = key2; sendNow(); }
  var nd = nearDoor(), pr = document.getElementById("prompt");
  if (nd){ pr.textContent = "Press E to go in: " + nd.zone.name; pr.style.display = "block"; } else pr.style.display = "none";
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__world = {me:me, others:others, ME:ME, doorSpots:doorSpots, blocks:blocks};
</script>
