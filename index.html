  {d:7, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A fraction compares part of something to the whole. A bar of equal blocks lets you see it.\nYour Turn — 1. Decide what the whole is (the full disk or drive). 2. Build a bar of 10 equal blocks for the whole, or 100 for finer detail. 3. Color the blocks that stand for the part in the problem. 4. Write the fraction and the decimal from your bar. 5. Compare it to your paper work.\nCheck Yourself — Do your colored blocks over the total blocks equal your fraction?", title:"Fractions/decimals: a 650MB CD is what fraction of a 1.44MB floppy's capacity? Write as a fraction and a decimal.", xp:15, standard:"4.NR.4/4.NR.5", video:"https://www.youtube.com/watch?v=zRjLZROI7wc", mathSkill:"fraction", practice:["A 650MB CD compared to a 100MB Zip disk (popular in 1998) — write that as a fraction, and simplify if you can.","About how many floppies would it take to match one 650MB CD? Round 650 ÷ 1.44 to the nearest whole number."]},
  {d:7, subject:"Reading", passage:"Your Turn — 1. Open the Help from the Start menu. 2. Pick one topic that looks interesting. 3. Read it, then write a 3-sentence summary using First, Next, and Finally. 4. Note one thing the Help explained that you didn't know.", title:"Open Windows 98's built-in Help — read one topic and summarize it.", xp:10, standard:"ELAGSE4RI2"},
  {d:7, subject:"Independent", title:"Explore 3 built-in Windows 98 apps (Internet Explorer, Device Manager, Windows Update) and screenshot each.", xp:20, video:"https://www.youtube.com/watch?v=A4Bx_qB5DSg", standard:"3-5.F"},
  {d:7, subject:"Social Studies", passage:"Gather first — A map or a map website, and a grown-up if you need help.\nYour Turn — 1. Find the places named in the task on the map. 2. Mark them or screenshot them. 3. Use the map's scale or distance tool to estimate how far apart they are. 4. Say one thing the map tells you about how technology travels.", title:"Map it: trace how a Windows 98 CD might travel from a factory to a store near you — what geography is involved?", xp:10, standard:"SS4G1/SS4G2"},

  {d:8, subject:"ELA", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each, so a beginner can follow it.\nSee It Done — Example: 1. Click Start. 2. Point to Programs. 3. Click Notepad.\nYour Turn — 1. Do the task in your VM while you write down each click. 2. Write the steps as a numbered list. 3. Add a screenshot. 4. Test your guide by following your own steps exactly. Fix any step that did not work.", title:"Journal Day 9: Write the \"installing a USB device\" section of your User Guide.", xp:10, standard:"ELAGSE4W2"},
  {d:8, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Powers of 2 double every time: 1, 2, 4, 8, 16. Computers use this pattern everywhere because each switch is either on or off.\nYour Turn — 1. Build a staircase of rows where each row has twice as many blocks as the one before: 1, 2, 4, 8, 16, 32, 64, 128. 2. Put a sign on each row with its number. 3. Count a row to check it. 4. Write the first terms of the pattern in your notebook and explain how you get the next one.\nCheck Yourself — Can you predict the next row without building it?", title:"Patterns: USB and COM ports are numbered. List the first 8 powers of 2 again and compare to last week — what's the pattern?", xp:15, standard:"4.PAR.3", materials:"https://www.csunplugged.org/en/topics/binary-numbers/", video:"https://www.youtube.com/watch?v=hvteVokz7jE", mathSkill:"binary", practice:["What is 2 to the 9th power (2⁹)?","USB 1.1 (used with Windows 98) had a max speed of 12 megabits per second. Is 12 a power of 2? Why or why not?"]},
  {d:8, subject:"Reading", title:"Read about Windows Update — what was new about software fixing itself over the internet?", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Windows_Update"},
  {d:8, subject:"Independent", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each.\nYour Turn — 1. Do the task in your VM and write down each click as you go. 2. Write it up as a numbered list with a screenshot. 3. Follow your own steps exactly to test them and fix any that fail.", title:"Write the \"Troubleshooting\" section of your Windows 98 User Guide.", xp:20, standard:"ELAGSE4W2"},
  {d:8, subject:"Science", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Sound is vibration. Different speeds of vibration make different pitches, and a computer saves a sound by recording the vibration as numbers.\nYour Turn — 1. Place a row of note blocks in Minecraft and right-click each to change its pitch. 2. Play low to high and listen. 3. Put your hand lightly on your throat and hum a low and a high note to feel the vibration. 4. Write one sentence on how a sound could be stored as numbers.\nCheck Yourself — Can you explain what is different between a high note and a low note?", title:"The Windows 95 startup sound was composed by musician Brian Eno. Read about how sound (WAV files) stores vibration as data.", xp:10, standard:"S4P1/S4P2", materials:"https://faroutmagazine.co.uk/how-brian-eno-created-the-microsoft-windows-95-startup-sound/"},

  {d:9, subject:"ELA", passage:"Your Turn — 1. Ask your learner to sit at the keyboard. They do the clicking, not you. 2. Explain out loud, one step at a time. 3. Write 3 sentences: what they got right, where they got stuck, and what you would explain differently next time.", title:"Teach-Back: Teach a family member one Windows 98 feature, then write 3 sentences about how it went.", xp:15, standard:"ELAGSE4SL4"},
  {d:9, subject:"Math", title:"Review: redo one tricky problem from this week and explain your fix.", xp:10, standard:"4.NR.4/4.NR.5", video:"https://www.youtube.com/watch?v=zRjLZROI7wc", practice:["Which of this week's math topics (RAM math, timeline math, fractions, or binary patterns) felt trickiest, and why?"]},
  {d:9, subject:"Reading", passage:"Pick anything you like and read for 20 minutes. When you finish, say one thing you learned or one question you have.", title:"Free reading: 20 minutes of a book or article of your choice.", xp:10, standard:"ELAGSE4RI1"},
  {d:9, subject:"Independent", title:"Finish and save your Windows 98 User Guide.", xp:25, video:"https://www.youtube.com/watch?v=K5_JFrEHmTk", standard:"ELAGSE4W2"},
  {d:9, subject:"Social Studies", title:"Budget it: prices dropped since 1995. Budget $1,200 for a 1998-era PC across a tower, monitor, and printer — show your math.", xp:15, standard:"SS4E1/SS4E2", video:"https://www.youtube.com/watch?v=0-fR24PWEmo"},

  /* ===== Week 3 — Windows XP (released Oct 25, 2001) ===== */
  {d:10, subject:"ELA", passage:"Here's the Idea — A prediction is a smart guess you check later. Scientists and engineers make them all the time.\nYour Turn — 1. Write 3 predictions using this starter: I predict ___ because ___. 2. Circle the one you are most sure about. 3. Look back at it after the install to see whether you were right.", title:"Journal Day 11: What do you already know about Windows XP? Predict 3 differences from Windows 98.", xp:10, standard:"ELAGSE4W4"},
  {d:10, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Computer memory is counted in units that each hold 1024 of the next smaller unit. A chest can stand for one unit so you can see the math.\nYour Turn — 1. Place one chest for every MB of RAM in the problem. 2. Put a sign on each chest: 1 MB = 1024 KB. 3. Count your chests and multiply by 1024 to get the answer in KB. 4. Convert that answer one more step down to get bytes or the smaller unit asked for. 5. Write both answers in your notebook.\nCheck Yourself — Does the number on your signs match the answer you worked out on paper?", title:"RAM math: Windows XP recommends 128MB RAM. Convert 128MB to KB and to bytes.", xp:15, standard:"4.NR.1/4.NR.2", video:"https://www.youtube.com/watch?v=DaQlieZH1kk", mathSkill:"byte", practice:["Windows XP's minimum RAM was actually 64MB. Convert 64MB to KB.","A typical 2001-era hard drive held 20GB. Convert 20GB to MB."]},
  {d:10, subject:"Reading", title:"Read the Windows XP section of \"Microsoft Windows version history\" — note 3 facts.", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Microsoft_Windows_version_history"},
  {d:10, subject:"Independent", passage:"Gather first — All four VMs able to start, and your screenshot tool.\nYour Turn — 1. Start each Windows version and take a screenshot of its desktop with the VM's View menu. 2. Line the four screenshots up side by side in Paint or a photo app. 3. Look closely and notice what changed between versions.", title:"Retro Field Guide: Photo Wall. Screenshot the desktop of every Windows version you have running (95, 98, XP, 7) and line them up side by side in Paint or a photo app, like a museum wall — no writing needed, just the photos. Guided questions to look for while you build it (answer out loud or just point, don't write): Which one has the roundest icons? Which taskbar is the tallest? Which one looks the most like a phone screen? Which one looks the most \"empty\" or plain?", xp:20, standard:"3-5.F", crossSubjects:["Reading","ELA","Computer Science","Social Studies"]},
  {d:10, subject:"Social Studies", title:"US History reading (next era) — read about the causes and effects of the Civil War and note 3 facts.", xp:10, standard:"SS4H3", materials:"https://www.ducksters.com/history/civil_war.php", quiz:[
    {q:"Kind of like two incompatible operating systems that couldn't run on the same machine, the North and South split into two sides in the Civil War. What was the main issue dividing them?", choices:["Which language to speak","Slavery","Which sport to play","Where the capital should be"], answerIndex:1, explain:"The main issue dividing the North and South was slavery."},
    {q:"Who was president of the United States during the Civil War?", choices:["Abraham Lincoln","George Washington","Thomas Jefferson","Ulysses S. Grant"], answerIndex:0, explain:"Abraham Lincoln was president during the whole Civil War."},
    {q:"What was the name for the southern states that broke away and formed their own government during the war?", choices:["The Union","The Confederacy","The Colonies","The Territories"], answerIndex:1, explain:"The southern states that broke away formed their own government called the Confederacy."}
  ], quizRetry:[
    {q:"What do we call the northern states that stayed together as one country during the Civil War?", choices:["The Union","The Confederacy","The Colonies","The Allies"], answerIndex:0, explain:"The northern states that stayed together as one country were called the Union."},
    {q:"About what years did the Civil War take place?", choices:["1776-1783","1812-1815","1861-1865","1914-1918"], answerIndex:2, explain:"The Civil War was fought from 1861 to 1865."},
    {q:"Which famous speech did Lincoln give at a Civil War battlefield to honor the soldiers who died there?", choices:["The Gettysburg Address","The Declaration of Independence","The State of the Union","I Have a Dream"], answerIndex:0, explain:"Lincoln gave the Gettysburg Address at the Gettysburg battlefield to honor the soldiers who died there."}
  ]},

  {d:11, subject:"ELA", passage:"Your Turn — Write 4 sentences. 1. What step did I do today? 2. What worked? 3. What went wrong (copy the exact words of any error)? 4. What will I try next? Add one screenshot.", title:"Journal Day 12: Log today's install progress.", xp:10, standard:"ELAGSE4W4"},
  {d:11, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A timeline is a number line for years. If one block stands for one year, you can count the gap with your eyes.\nYour Turn — 1. Lay a straight line of blocks, one block per year, from the earlier year in the problem to the later year. 2. Put a sign at each release year. 3. Count the blocks between the signs. 4. Check that your count matches subtracting the years. 5. Answer the practice questions using your timeline.\nCheck Yourself — Does counting blocks give the same answer as subtracting?", title:"Timeline math: XP released in 2001, three years after Windows 98 (1998). How many years ago was 2001 from this year?", xp:15, standard:"4.MDR.6", video:"https://www.youtube.com/watch?v=UhMM68fq9FA", mathSkill:"timeline", practice:["Windows 7 came out 8 years after XP (2001). What year was that?","If a computer bought in 2001 was used until 2011, how many years was that?"]},
  {d:11, subject:"Reading", title:"Read about why XP was built on the \"NT kernel\" instead of DOS like 95/98 — what does more stable mean?", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Windows_NT_kernel"},
  {d:11, subject:"Independent", title:"Retro Field Guide: Spot the Differences. Look back at your photo wall from yesterday and take the quiz below — no writing, just pick what you see.", xp:15, standard:"3-5.F", quiz:[
    {q:"Which version in your photo wall was the first to have a Start button and taskbar at all?", choices:["Windows 95","Windows 98","Windows XP","Windows 7"], answerIndex:0, explain:"Windows 95 was the first version in your museum to have a Start button and a taskbar."},
    {q:"Which version has the colorful, rounded blue \"Luna\" theme as its default look?", choices:["Windows 95","Windows 98","Windows XP","Windows 7"], answerIndex:2, explain:"The rounded blue Luna theme was Windows XP's default look."},
    {q:"Which version added pinning programs directly onto the taskbar itself (not just a small Quick Launch strip)?", choices:["Windows 95","Windows 98","Windows XP","Windows 7"], answerIndex:3, explain:"Windows 7 let you pin programs right onto the taskbar itself."}
  ], quizRetry:[
    {q:"Which version in your photo wall looks the plainest/grayest overall?", choices:["Windows 95","Windows 98","Windows XP","Windows 7"], answerIndex:0, explain:"Windows 95 has the plainest, grayest look of the versions in your photo wall."},
    {q:"Which version's icons look the most like a modern phone app icon (glossy, colorful)?", choices:["Windows 95","Windows XP","Both look about the same","Neither"], answerIndex:1, explain:"Windows XP's glossy, colorful icons look the most like modern app icons."},
    {q:"Between XP and Windows 7, which one is the newer release?", choices:["XP","Windows 7"], answerIndex:1, explain:"Windows 7 came out in 2009 and XP in 2001, so Windows 7 is the newer release."}
  ], crossSubjects:["Reading","ELA","Computer Science","Social Studies"]},
  {d:11, subject:"Science", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Sound is vibration. Different speeds of vibration make different pitches, and a computer saves a sound by recording the vibration as numbers.\nYour Turn — 1. Place a row of note blocks in Minecraft and right-click each to change its pitch. 2. Play low to high and listen. 3. Put your hand lightly on your throat and hum a low and a high note to feel the vibration. 4. Write one sentence on how a sound could be stored as numbers.\nCheck Yourself — Can you explain what is different between a high note and a low note?", title:"XP's startup sound and login chime — read about how sound files (WAV) store vibrations as data.", xp:10, standard:"S4P1/S4P2", materials:"https://kids.britannica.com/students/article/sound/277144", video:"https://www.youtube.com/watch?v=5qmgB8ggm3g"},

  {d:12, subject:"ELA", passage:"Here's the Idea — A good intro tells the reader what this is and why they should care.\nYour Turn — Write 3 to 5 sentences that cover: what Windows XP is, about when it came out, one thing that made it special, and what people used it for. Starter: Windows XP came out in ___. It was special because ___. People used it to ___.", title:"Journal Day 13: Draft the intro paragraph of your Windows XP User Guide.", xp:10, standard:"ELAGSE4W2"},
  {d:12, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A fraction compares part of something to the whole. A bar of equal blocks lets you see it.\nYour Turn — 1. Decide what the whole is (the full disk or drive). 2. Build a bar of 10 equal blocks for the whole, or 100 for finer detail. 3. Color the blocks that stand for the part in the problem. 4. Write the fraction and the decimal from your bar. 5. Compare it to your paper work.\nCheck Yourself — Do your colored blocks over the total blocks equal your fraction?", title:"Fractions/decimals: a 700MB CD is what fraction of a 4.7GB DVD (XP-era media)? Write as a fraction and a decimal.", xp:15, standard:"4.NR.4/4.NR.5", video:"https://www.youtube.com/watch?v=zRjLZROI7wc", mathSkill:"fraction", practice:["A 4.7GB DVD compared to a 25GB Blu-ray disc — write that as a fraction, then as a decimal.","If a movie takes up 4.7GB and you only have 700MB CDs, about how many CDs would it take to hold the same movie?"]},
  {d:12, subject:"Reading", passage:"Your Turn — 1. Open the Help from the Start menu. 2. Pick one topic that looks interesting. 3. Read it, then write a 3-sentence summary using First, Next, and Finally. 4. Note one thing the Help explained that you didn't know.", title:"Open XP's built-in Help and Support Center — read one topic and summarize it.", xp:10, standard:"ELAGSE4RI2"},
  {d:12, subject:"Independent", title:"Explore 3 built-in XP apps (Windows Media Player, Paint, Solitaire) and screenshot each.", xp:20, video:"https://www.youtube.com/watch?v=-XTnL4Mang0", standard:"3-5.F"},
  {d:12, subject:"Social Studies", passage:"Gather first — A map or a map website, and a grown-up if you need help.\nYour Turn — 1. Find the places named in the task on the map. 2. Mark them or screenshot them. 3. Use the map's scale or distance tool to estimate how far apart they are. 4. Say one thing the map tells you about how technology travels.", title:"Map it: XP shipped in over 25 languages worldwide. Pick 2 countries it launched in and find them on a map.", xp:10, standard:"SS4G1/SS4G2"},

  {d:13, subject:"ELA", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each, so a beginner can follow it.\nSee It Done — Example: 1. Click Start. 2. Point to Programs. 3. Click Notepad.\nYour Turn — 1. Do the task in your VM while you write down each click. 2. Write the steps as a numbered list. 3. Add a screenshot. 4. Test your guide by following your own steps exactly. Fix any step that did not work.", title:"Journal Day 14: Write the \"Control Panel basics\" section of your User Guide.", xp:10, standard:"ELAGSE4W2"},
  {d:13, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — To convert gigabytes to megabytes, multiply by 1024. Breaking a big number into friendly pieces makes it easier.\nYour Turn — 1. Build a stack of 10 chests and put a sign on each: 1 GB = 1024 MB. 2. 10 chests is 10 times 1024, which is 10,240 MB. 3. Use that to work out 100 GB, then 30 GB, then 7 GB, and add them for 137 GB. 4. Write the steps in your notebook.\nCheck Yourself — Do your three pieces add up to the same answer as multiplying 137 by 1024?", title:"Patterns: XP supported drives up to 137GB with normal formatting. How many MB is that? Show your place-value work.", xp:15, standard:"4.PAR.3", video:"https://www.youtube.com/watch?v=DaQlieZH1kk", mathSkill:"binary", practice:["What is 2 to the 12th power (2¹²)? (Hint: computer people call that number \"4K.\")","XP could use up to about 4GB of RAM on 32-bit systems, because 2³² is about 4 billion. What is 2¹⁶?"]},
  {d:13, subject:"Reading", title:"Read about the \"Blue Screen of Death\" in early Windows — what was it, and why did XP have fewer of them?", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Blue_screen_of_death"},
  {d:13, subject:"Independent", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each.\nYour Turn — 1. Do the task in your VM and write down each click as you go. 2. Write it up as a numbered list with a screenshot. 3. Follow your own steps exactly to test them and fix any that fail.", title:"Write the \"Troubleshooting\" section of your Windows XP User Guide.", xp:20, standard:"ELAGSE4W2"},
  {d:13, subject:"Science", passage:"Gather first — A strip of tissue or light paper, tape, a ruler, a fan (a desk fan or a computer fan), and an adult nearby for safety. Keep fingers away from the blades.\nYour Turn — 1. Tape the tissue strip to a stick or the edge of a table. 2. Hold it at three distances from the running fan and measure with the ruler how high it lifts each time. 3. Write the three measurements. 4. Notice which fan settings and distances move the air most. 5. Find two simple machines in a computer or gadget (a screw is an inclined plane wrapped around a rod; a button can be a lever).\nCheck Yourself — Can you say how moving air helps keep a computer cool?", title:"XP-era PCs used bigger cooling fans. Read about how fans move air to cool electronics (forces & motion).", xp:10, standard:"S4P3", materials:"https://kids.britannica.com/students/article/fan/274175", video:"https://www.youtube.com/watch?v=5F76jSb2Byg"},

  {d:14, subject:"ELA", passage:"Your Turn — 1. Ask your learner to sit at the keyboard. They do the clicking, not you. 2. Explain out loud, one step at a time. 3. Write 3 sentences: what they got right, where they got stuck, and what you would explain differently next time.", title:"Teach-Back: Teach a family member one XP feature, then write 3 sentences about how it went.", xp:15, standard:"ELAGSE4SL4"},
  {d:14, subject:"Math", title:"Review: redo one tricky problem from this week and explain your fix.", xp:10, standard:"4.NR.4/4.NR.5", video:"https://www.youtube.com/watch?v=zRjLZROI7wc", practice:["Which of this week's math topics (RAM math, timeline math, fractions, or place-value patterns) felt trickiest, and why?"]},
  {d:14, subject:"Reading", passage:"Pick anything you like and read for 20 minutes. When you finish, say one thing you learned or one question you have.", title:"Free reading: 20 minutes of a book or article of your choice.", xp:10, standard:"ELAGSE4RI1"},
  {d:14, subject:"Independent", passage:"Your Turn — 1. Read your guide start to finish. 2. Check that every section has numbered steps and a screenshot. 3. Fix anything that is unclear. 4. Save it with the OS name in the file title.", title:"Finish and save your Windows XP User Guide.", xp:25, standard:"ELAGSE4W2"},

  /* ===== Week 4 — Windows 7 (released Oct 22, 2009) + Museum Night ===== */
  {d:15, subject:"ELA", passage:"Here's the Idea — A prediction is a smart guess you check later. Scientists and engineers make them all the time.\nYour Turn — 1. Write 3 predictions using this starter: I predict ___ because ___. 2. Circle the one you are most sure about. 3. Look back at it after the install to see whether you were right.", title:"Journal Day 16: What do you already know about Windows 7? Predict 3 differences from XP.", xp:10, standard:"ELAGSE4W4"},
  {d:15, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Computer memory is counted in units that each hold 1024 of the next smaller unit. A chest can stand for one unit so you can see the math.\nYour Turn — 1. Place one chest for every GB of RAM in the problem. 2. Put a sign on each chest: 1 GB = 1024 MB. 3. Count your chests and multiply by 1024 to get the answer in MB. 4. Convert that answer one more step down to get bytes or the smaller unit asked for. 5. Write both answers in your notebook.\nCheck Yourself — Does the number on your signs match the answer you worked out on paper?", title:"RAM math: Windows 7 recommends 2GB RAM (64-bit). Convert 2GB to MB and to KB.", xp:15, standard:"4.NR.1/4.NR.2", video:"https://www.youtube.com/watch?v=DaQlieZH1kk", mathSkill:"byte", practice:["Windows 7's minimum RAM (32-bit) was 1GB. Convert 1GB to MB and to KB.","A 2009-era laptop hard drive held 250GB. Convert 250GB to MB."]},
  {d:15, subject:"Reading", title:"Read the Windows 7 section of \"Microsoft Windows version history\" — note 3 facts.", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Microsoft_Windows_version_history", video:"https://www.youtube.com/watch?v=g6PT7_YHWCA"},
  {d:15, subject:"Independent", passage:"Gather first — Your two networked VMs and one more VM, ideally one older (95 or 98) and one newer (XP or 7).\nHere's the Idea — Older and newer Windows versions were built for different networks and speak slightly different ways, so connecting them can take extra steps.\nYour Turn — 1. Give the third VM an Internal Network adapter with the same network name and its own IP address on the same network. 2. Ping all three machines from each other. 3. If a newer machine will not answer, turn off its Windows Firewall inside the VM for this test, since XP after Service Pack 2 and Windows 7 block ping by default. 4. Screenshot all three seeing each other. 5. Think about why an old and a new computer might have more trouble talking than two similar ones.\nCheck Yourself — Can every machine ping every other machine?", installHelp:"vmnetwork", title:"VM Networking Challenge, Part 3: Add a third VM to your network — try connecting an older one (95 or 98) with a newer one (XP or 7). Screenshot all three seeing each other. Guided questions to think through: Was it harder to network the old one with the new one than the two you did before? Why might an old and new computer have more trouble talking to each other than two similar ones?", xp:20, standard:"3-5.F", crossSubjects:["Reading","ELA","Computer Science","Social Studies"]},
  {d:15, subject:"Social Studies", title:"US History reading (next era) — read about Reconstruction and note 3 facts.", xp:10, standard:"SS4H4", materials:"https://www.ducksters.com/history/civil_war/reconstruction.php", quiz:[
    {q:"Just like rebuilding a crashed computer after a bad install, Reconstruction was the period of rebuilding the country after the Civil War. About what years did it cover?", choices:["1776-1783","1865-1877","1900-1920","1941-1945"], answerIndex:1, explain:"Reconstruction was the period of rebuilding the country after the Civil War, about 1865 to 1877."},
    {q:"Which amendment to the Constitution, passed during Reconstruction, ended slavery in the United States?", choices:["1st Amendment","13th Amendment","19th Amendment","22nd Amendment"], answerIndex:1, explain:"The 13th Amendment ended slavery in the United States."},
    {q:"What were the newly freed African Americans who gained new rights and citizenship during Reconstruction generally called?", choices:["Freedmen","Loyalists","Settlers","Pioneers"], answerIndex:0, explain:"Newly freed African Americans who gained new rights during Reconstruction were generally called freedmen."}
  ], quizRetry:[
    {q:"Reconstruction happened right after which war ended?", choices:["The Revolutionary War","The Civil War","World War I","The War of 1812"], answerIndex:1, explain:"Reconstruction came right after the Civil War ended."},
    {q:"Which side's states needed to be rebuilt and brought back into the Union during Reconstruction?", choices:["The Northern states","The Southern states","The western territories","Canada"], answerIndex:1, explain:"The Southern states needed to be rebuilt and brought back into the Union during Reconstruction."},
    {q:"What was the name for the period right after the Civil War when the South's economy and government were rebuilt?", choices:["Reconstruction","Restoration","The Renaissance","The Gilded Age"], answerIndex:0, explain:"Reconstruction is the name for the period after the Civil War when the South was rebuilt."}
  ]},

  {d:16, subject:"ELA", passage:"Your Turn — Write 4 sentences. 1. What step did I do today? 2. What worked? 3. What went wrong (copy the exact words of any error)? 4. What will I try next? Add one screenshot.", title:"Journal Day 17: Log today's install progress.", xp:10, standard:"ELAGSE4W4"},
  {d:16, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A timeline is a number line for years. If one block stands for one year, you can count the gap with your eyes.\nYour Turn — 1. Lay a straight line of blocks, one block per year, from the earlier year in the problem to the later year. 2. Put a sign at each release year. 3. Count the blocks between the signs. 4. Check that your count matches subtracting the years. 5. Answer the practice questions using your timeline.\nCheck Yourself — Does counting blocks give the same answer as subtracting?", title:"Timeline math: Windows 7 released in 2009, eight years after XP (2001). How many years ago was 2009 from this year?", xp:15, standard:"4.MDR.6", video:"https://www.youtube.com/watch?v=UhMM68fq9FA", mathSkill:"timeline", practice:["Windows 8 came out 3 years after Windows 7 (2009). What year was that?","How many years passed between Windows 95 (1995) and Windows 7 (2009)?"]},
  {d:16, subject:"Reading", title:"Read about why Windows 7 was seen as fixing problems from Windows Vista — what does a \"follow-up release\" mean?", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/Windows_7"},
  {d:16, subject:"Independent", title:"Retro Field Guide Capstone: Give a spoken tour comparing two OS versions side by side to a parent (like Show & Teach) — point out 3 things that changed between them. Guided questions to use during your tour: Which one loads faster? Which one looks easier to use? Which one would confuse someone who's only ever used a phone? Then tap through the quiz below.", xp:25, standard:"ELAGSE4W4", quiz:[
    {q:"Which two versions in your museum share the same sturdier \"NT\" core under the hood (95 and 98 don't have this)?", choices:["95 & 98","98 & XP","XP & 7","95 & 7"], answerIndex:2, explain:"Of the versions in your museum, XP and Windows 7 share the sturdier NT core, while 95 and 98 do not."},
    {q:"Which version was the last one built on old-style MS-DOS instead of the newer, more stable system?", choices:["Windows 95","Windows 98","Windows XP","Windows 7"], answerIndex:1, explain:"Of the versions in your museum, Windows 98 was the last one built on old-style MS-DOS."},
    {q:"Windows 95 came out in 1995 and Windows 7 in 2009 — about how many years apart is that?", choices:["4 years","9 years","14 years","20 years"], answerIndex:2, explain:"2009 minus 1995 is 14, so Windows 95 and Windows 7 came out 14 years apart."}
  ], crossSubjects:["Reading","ELA","Computer Science","Social Studies"]},
  {d:16, subject:"Science", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A screen picture is made of tiny colored squares called pixels. Minecraft blocks can work like pixels.\nYour Turn — 1. Build a flat 16 by 16 square on the ground out of colored wool or concrete blocks. 2. Make a simple picture on it, like an icon or a face. 3. Stand back far enough that the blocks blend into one picture. 4. Take a screenshot and say how many blocks (pixels) your picture used in all.\nCheck Yourself — Can you work out the total number of pixels by multiplying rows by columns?", title:"Windows 7's taskbar previews use tiny live thumbnails. Read about how monitors use light (pixels) to show moving images.", xp:10, standard:"S4P1/S4P2", materials:"https://kids.britannica.com/students/article/television/277292", video:"https://www.youtube.com/watch?v=GSorr3ddKAo"},

  {d:17, subject:"ELA", passage:"Here's the Idea — A good intro tells the reader what this is and why they should care.\nYour Turn — Write 3 to 5 sentences that cover: what Windows 7 is, about when it came out, one thing that made it special, and what people used it for. Starter: Windows 7 came out in ___. It was special because ___. People used it to ___.", title:"Journal Day 18: Draft the intro paragraph of your Windows 7 User Guide.", xp:10, standard:"ELAGSE4W2"},
  {d:17, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — A fraction compares part of something to the whole. A bar of equal blocks lets you see it.\nYour Turn — 1. Decide what the whole is (the full disk or drive). 2. Build a bar of 10 equal blocks for the whole, or 100 for finer detail. 3. Color the blocks that stand for the part in the problem. 4. Write the fraction and the decimal from your bar. 5. Compare it to your paper work.\nCheck Yourself — Do your colored blocks over the total blocks equal your fraction?", title:"Fractions/decimals: a 4.7GB DVD is what fraction of a 25GB Blu-ray (Windows 7-era media)? Write as a fraction and a decimal.", xp:15, standard:"4.NR.4/4.NR.5", video:"https://www.youtube.com/watch?v=zRjLZROI7wc", mathSkill:"fraction", practice:["A 25GB Blu-ray compared to a 128GB USB flash drive (common by 2009) — write that as a fraction, then as a decimal.","Simplify the fraction 25/100."]},
  {d:17, subject:"Reading", passage:"Your Turn — 1. Open the Help from the Start menu. 2. Pick one topic that looks interesting. 3. Read it, then write a 3-sentence summary using First, Next, and Finally. 4. Note one thing the Help explained that you didn't know.", title:"Open Windows 7's Help and Support — read one topic and summarize it.", xp:10, standard:"ELAGSE4RI2"},
  {d:17, subject:"Independent", title:"Explore 3 built-in Windows 7 apps (Snipping Tool, Calculator, Paint) and screenshot each.", xp:20, video:"https://www.youtube.com/watch?v=M6tmK-NQ-EI", standard:"3-5.F"},
  {d:17, subject:"Social Studies", passage:"Gather first — A map or a map website, and a grown-up if you need help.\nYour Turn — 1. Find the places named in the task on the map. 2. Mark them or screenshot them. 3. Use the map's scale or distance tool to estimate how far apart they are. 4. Say one thing the map tells you about how technology travels.", title:"Map it: Windows 7 launched in 14 cities worldwide the same week. Pick 2 and find them on a map — how far apart are they?", xp:10, standard:"SS4G1/SS4G2"},

  {d:18, subject:"ELA", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each, so a beginner can follow it.\nSee It Done — Example: 1. Click Start. 2. Point to Programs. 3. Click Notepad.\nYour Turn — 1. Do the task in your VM while you write down each click. 2. Write the steps as a numbered list. 3. Add a screenshot. 4. Test your guide by following your own steps exactly. Fix any step that did not work.", title:"Journal Day 19: Write the \"Taskbar & Jump Lists\" section of your User Guide.", xp:10, standard:"ELAGSE4W2"},
  {d:18, subject:"Math", passage:"Gather first — Minecraft in Creative mode and your notebook. Take a screenshot or use Show it when you finish.\nHere's the Idea — Powers of 2 double every time: 1, 2, 4, 8, 16. Computers use this pattern everywhere because each switch is either on or off.\nYour Turn — 1. Build a staircase of rows where each row has twice as many blocks as the one before: 1, 2, 4, 8, 16, 32, 64, 128. 2. Put a sign on each row with its number. 3. Count a row to check it. 4. Write the first terms of the pattern in your notebook and explain how you get the next one.\nCheck Yourself — Can you predict the next row without building it?", title:"Patterns: Windows 7 came in 32-bit and 64-bit versions (2^32 vs 2^64). List the first 10 powers of 2 — what's the pattern doubling each time?", xp:15, standard:"4.PAR.3", materials:"https://www.csunplugged.org/en/topics/binary-numbers/", video:"https://www.youtube.com/watch?v=hvteVokz7jE", mathSkill:"binary", practice:["What is 2 to the 16th power (2¹⁶)? (Hint: computer people call that number \"64K.\")","64-bit Windows 7 could use way more RAM than 32-bit. About how many times bigger is 2⁶⁴ than 2³²? (Hint: it's 2 raised to what power?)"]},
  {d:18, subject:"Reading", title:"Read about why 64-bit computing could use more RAM than 32-bit — what does \"bit\" mean here?", xp:10, standard:"ELAGSE4RI1", materials:"https://en.wikipedia.org/wiki/64-bit_computing"},
  {d:18, subject:"Independent", passage:"Here's the Idea — A user guide section uses short numbered steps with one action each.\nYour Turn — 1. Do the task in your VM and write down each click as you go. 2. Write it up as a numbered list with a screenshot. 3. Follow your own steps exactly to test them and fix any that fail.", title:"Write the \"What's New\" section comparing Windows 7 to XP in your User Guide.", xp:20, standard:"ELAGSE4W2"},
  {d:18, subject:"Science", passage:"Gather first — A strip of tissue or light paper, tape, a ruler, a fan (a desk fan or a computer fan), and an adult nearby for safety. Keep fingers away from the blades.\nYour Turn — 1. Tape the tissue strip to a stick or the edge of a table. 2. Hold it at three distances from the running fan and measure with the ruler how high it lifts each time. 3. Write the three measurements. 4. Notice which fan settings and distances move the air most. 5. Find two simple machines in a computer or gadget (a screw is an inclined plane wrapped around a rod; a button can be a lever).\nCheck Yourself — Can you say how moving air helps keep a computer cool?", title:"Windows 7-era gaming PCs needed better cooling. Read about heat, airflow, and simple machines like fans.", xp:10, standard:"S4P3", materials:"https://kids.britannica.com/students/article/fan/274175", video:"https://www.youtube.com/watch?v=5F76jSb2Byg"},

  {d:19, subject:"ELA", passage:"Gather first — All four finished guides, your four VMs ready to show, and your family as the audience.\nYour Turn — 1. Set up the four VMs in order, oldest to newest. 2. Give a tour: for each Windows version say when it came out, show one feature, and read one step from your guide. 3. Ask the audience which version they would pick and why. 4. Write 3 to 5 sentences: which OS was your favorite to document, and why?\nCheck Yourself — Did your tour show how Windows changed from the oldest to the newest?", title:"Museum Night: Present all 4 of your User Guides (95, 98, XP, 7) to your family like a museum tour guide. Write a reflection: which OS was your favorite to document, and why?", xp:25, standard:"ELAGSE4SL4"},
  {d:19, subject:"Math", title:"Museum Night Review: Make a timeline poster showing all 4 release years (1995, 1998, 2001, 2009) with the years between each.", xp:20, standard:"4.MDR.6", video:"https://www.youtube.com/watch?v=UhMM68fq9FA"},
  {d:19, subject:"Reading", passage:"Pick anything you like and read for 20 minutes. When you finish, say one thing you learned or one question you have.", title:"Free reading: 20 minutes of a book or article of your choice.", xp:10, standard:"ELAGSE4RI1"},
  {d:19, subject:"Independent", passage:"Your Turn — 1. Read your guide start to finish. 2. Check that every section has numbered steps and a screenshot. 3. Fix anything that is unclear. 4. Save it with the OS name in the file title.", title:"Finish and save your Windows 7 User Guide — you now have a full 4-OS Retro Museum collection!", xp:25, standard:"ELAGSE4W2"},
  {d:19, subject:"Social Studies", title:"Budget it: if you could buy all 4 retro PCs (95/98/XP/7 era) today from a collector, budget $2,000 across all 4 — show your math and reasoning.", xp:20, standard:"SS4E1/SS4E2", video:"https://www.youtube.com/watch?v=0-fR24PWEmo"}

/* ---------- Arcade mini-games (Space Mission / Parkour Course) ---------- */
function grantXP(kidId, amount){
  if(!db || amount<=0) return;
  var kd = kidData(kidId);
  var oldXp = kd.xp||0, newXp = oldXp+amount;
  var lvl = levelUpBonus(kd, newXp);
  var updates = {xp:newXp};
  if(lvl.gained>0){ updates.mommaMoney = (kd.mommaMoney||0)+lvl.bonus; updates.lastMommaMoneyLevel = kd.lastMommaMoneyLevel; }
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update(updates);
  if(kidId===state.activeKid) renderXpBar();
  if(lvl.gained>0) logLevelUpReward(kidId, lvl);
}

/* Arcade mini-games (Space Mission / Parkour) were paying out XP per action with no ceiling, so a
   long play session could rack up level-ups and Momma Money fast — momma money that's meant to
   *limit* screen time was instead fueling it. This caps how much of that XP actually counts each
   day; he can keep playing for fun past the cap, it just stops paying out. */
var DAILY_MINIGAME_XP_CAP = 25;
function grantMiniGameXP(kidId, amount){
  if(amount<=0) return;
  var kd = kidData(kidId);
  var today = todayISO();
  var soFar = (kd.lastMiniGameXpDate===today) ? (kd.miniGameXpToday||0) : 0;
  var allowed = Math.max(0, Math.min(amount, DAILY_MINIGAME_XP_CAP-soFar));
  var updates = {miniGameXpToday: soFar+allowed, lastMiniGameXpDate: today};
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  if(db) db.doc("kids/"+kidId).update(updates);
  if(allowed>0) grantXP(kidId, allowed);
  /* soFar<CAP here means this action is the one that crossed the cap — show the notice once,
     not on every subsequent action once he's already at the ceiling. */
  if(allowed<amount && soFar<DAILY_MINIGAME_XP_CAP) toast("🎮 That's today's Arcade XP cap — keep playing for fun!");
}

function grantMommaMoney(kidId, amount){
  if(!db || amount<=0) return;
  var kd = kidData(kidId);
  var newMoney = (kd.mommaMoney||0)+amount;
  kd.mommaMoney = newMoney;
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update({mommaMoney: newMoney});
  if(kidId===state.activeKid) renderXpBar();
}

function cleanupMiniGame(){
  var mg = state.miniGame;
  if(mg){
    if(mg.raf) cancelAnimationFrame(mg.raf);
    if(mg.timeoutId) clearTimeout(mg.timeoutId);
    if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
    if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  }
  state.miniGame = null;
}

function startMiniGame(type){
  var qs = state.questions.filter(function(q){ return q.kidId===state.activeKid || q.kidId==="any"; });
  var key = type==="space" ? "ela" : "math";
  var pool = qs.filter(function(q){
    var sg = (q.studyGuide||"").toLowerCase();
    return sg.indexOf(key)>-1 && sg.indexOf("cfa")>-1;
  });
  if(!pool.length){
    pool = qs.filter(function(q){ return (q.subject||"").toLowerCase().indexOf(key)>-1; });
  }
  pool = pool.slice().sort(function(){ return Math.random()-.5; });
  state.miniGame = {
    type: type, pool: pool, qIdx: 0, fuel: 0, score: 0, lives: 3, running: false, raf: null, timeoutId: null,
    ship: {}, asteroids: [], boosting: false,
    runner: {}, platforms: []
  };
  renderArena();
}

function stopMiniGame(){
  cleanupMiniGame();
  renderArena();
}

function openMiniGameQuestion(){
  var mg = state.miniGame;
  if(!mg || !mg.pool.length) return;
  if(mg.raf){ cancelAnimationFrame(mg.raf); mg.raf=null; }
  mg.running = false;
  var q = mg.pool[mg.qIdx % mg.pool.length];

function answerMiniGameQuestion(choiceIdx, q){
  var mg = state.miniGame;
  if(!mg) return;
  var correct = choiceIdx===q.answerIndex;
  var opts = document.querySelectorAll(".qz-opt");
  opts.forEach(function(btn,i){
    btn.disabled = true;
    if(i===q.answerIndex) btn.classList.add("correct");
    else if(i===choiceIdx) btn.classList.add("wrong");
  });
  if(correct){
    mg.fuel += (mg.type==="space" ? 10 : 3);
    toast(mg.type==="space" ? "+10 Fuel Units! ⛽" : "+3 Jump Energy! ⚡");
  } else {
    toast("Not quite — no fuel this round");
  }
  mg.qIdx++;
  mg.timeoutId = setTimeout(function(){
    if(state.miniGame!==mg) return; // kid navigated away before this fired
    renderArena();
  }, 900);
}

function wireSpaceControls(ctr){
  var mg = state.miniGame;
  var left = ctr.querySelector("#mgLeft"), right = ctr.querySelector("#mgRight"), boost = ctr.querySelector("#mgBoost");
  var mv = null;
  ["mousedown","touchstart"].forEach(function(ev){
    left.addEventListener(ev, function(e){ e.preventDefault(); mv=-1; });
    right.addEventListener(ev, function(e){ e.preventDefault(); mv=1; });
  });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    left.addEventListener(ev, function(){ mv=null; });
    right.addEventListener(ev, function(){ mv=null; });
  });
  mg._mv = function(){ return mv; };
  boost.onclick = function(){
    if(mg.boosting) return;
    if(mg.fuel<10){ toast("Need 10 fuel to boost!"); return; }
    mg.fuel -= 10; mg.boosting = true;
  };
  if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
  if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  mg._keydown = function(e){ if(e.key==="ArrowLeft") mv=-1; if(e.key==="ArrowRight") mv=1; };
  mg._keyup = function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight") mv=null; };
  document.addEventListener("keydown", mg._keydown);
  document.addEventListener("keyup", mg._keyup);
}

function spaceLoop(ctx, canvas){
  var mg = state.miniGame;
  if(!mg || mg.type!=="space" || !mg.running) return;
  if(mg.ship.x===undefined) mg.ship.x = canvas.width/2;
  if(mg.ship.y===undefined) mg.ship.y = canvas.height-30;
  if(mg.padX===undefined) mg.padX = 40+Math.random()*(canvas.width-80);
  mg.frame = (mg.frame||0)+1;

  var mv = mg._mv ? mg._mv() : null;
  if(mv && !mg.boosting) mg.ship.x += mv*4;
  mg.ship.x = Math.max(16, Math.min(canvas.width-16, mg.ship.x));

  if(!mg.boosting){
    if(mg.frame%40===0) mg.asteroids.push({x:20+Math.random()*(canvas.width-40), y:-10, r:10+Math.random()*8, vy:1.5+Math.random()*1.5});
    mg.asteroids.forEach(function(a){ a.y += a.vy; });
    mg.asteroids.forEach(function(a){
      var dx=a.x-mg.ship.x, dy=a.y-mg.ship.y;
      if(Math.sqrt(dx*dx+dy*dy) < a.r+12) a.hit=true;
    });
    var hitAny = mg.asteroids.some(function(a){ return a.hit; });
    mg.asteroids = mg.asteroids.filter(function(a){ return !a.hit && a.y<canvas.height+20; });
    if(hitAny){
      mg.lives = Math.max(0, mg.lives-1);
      mg.flash = 8;
      toast("💥 Hit! "+mg.lives+" lives left");
      if(mg.lives<=0){ mg.lives=3; mg.fuel=Math.max(0,mg.fuel-5); toast("Ship reset — careful out there!"); }
    }
  } else {
    mg.ship.y -= 5;
    if(mg.ship.y<=30){
      mg.boosting = false;
      mg.ship.y = canvas.height-30;
      var dx = Math.abs(mg.ship.x-mg.padX);
      if(dx<30){ mg.score++; grantMiniGameXP(state.activeKid, 8); toast("🪐 Landed! +8 XP"); }
      else toast("Missed the pad — try again!");
      mg.padX = 40+Math.random()*(canvas.width-80);
    }
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for(var i=0;i<20;i++){ ctx.fillRect((i*37+(mg.frame*0.2))%canvas.width, (i*53)%canvas.height, 2, 2); }
  ctx.fillStyle = "#e0b155";
  ctx.fillRect(mg.padX-24, 20, 48, 8);
  ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("LANDING PAD", mg.padX, 16);
  ctx.fillStyle = "#b5602f";
  mg.asteroids.forEach(function(a){ ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); });
  ctx.fillStyle = mg.flash>0 ? "#ff5555" : "#6bbf8c";
  if(mg.flash>0) mg.flash--;
  ctx.beginPath();
  ctx.moveTo(mg.ship.x, mg.ship.y-14);
  ctx.lineTo(mg.ship.x-10, mg.ship.y+10);
  ctx.lineTo(mg.ship.x+10, mg.ship.y+10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("♥ "+mg.lives, 8, canvas.height-8);

  mg.raf = requestAnimationFrame(function(){ spaceLoop(ctx, canvas); });
}

function wireParkourControls(ctr){
  var mg = state.miniGame;
  var left = ctr.querySelector("#mgLeft"), right = ctr.querySelector("#mgRight"), jumpBtn = ctr.querySelector("#mgJump");
  var mv = null;
  ["mousedown","touchstart"].forEach(function(ev){
    left.addEventListener(ev, function(e){ e.preventDefault(); mv=-1; });
    right.addEventListener(ev, function(e){ e.preventDefault(); mv=1; });
  });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    left.addEventListener(ev, function(){ mv=null; });
    right.addEventListener(ev, function(){ mv=null; });
  });
  mg._mv = function(){ return mv; };
  function doJump(){
    if(mg.runner.jumping) return;
    if(mg.fuel<1){ toast("Need jump energy!"); return; }
    mg.fuel -= 1; mg.runner.jumping = true; mg.runner.vy = -11;
  }
  jumpBtn.onclick = doJump;
  if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
  if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  mg._keydown = function(e){
    if(e.code==="Space"){ e.preventDefault(); doJump(); }
    if(e.key==="ArrowLeft") mv=-1;
    if(e.key==="ArrowRight") mv=1;
  };
  mg._keyup = function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight") mv=null; };
  document.addEventListener("keydown", mg._keydown);
  document.addEventListener("keyup", mg._keyup);
}

/* Vertical platformer: the runner leaps upward from platform to platform (like a climbing tower),
   moving left/right to line up each jump. The camera scrolls up as he climbs higher, new platforms
   spawn above, and falling off the bottom just respawns him on fresh ground — no harsh penalty. */
function parkourLoop(ctx, canvas){
  var mg = state.miniGame;
  if(!mg || mg.type!=="parkour" || !mg.running) return;
  var groundY = canvas.height-40;

  function resetLadder(){
    mg.runner.x = canvas.width/2; mg.runner.y = groundY; mg.runner.vy = 0; mg.runner.jumping = false;
    mg.platforms = [{x: canvas.width/2-30, y: groundY, w:60, flag:false, scored:true}];
  }
  if(mg.runner.y===undefined) resetLadder();
  mg.frame = (mg.frame||0)+1;

  var mv = mg._mv ? mg._mv() : null;
  if(mv) mg.runner.x += mv*3.5;
  if(mg.runner.x < -14) mg.runner.x = canvas.width+14;
  if(mg.runner.x > canvas.width+14) mg.runner.x = -14;

  if(mg.runner.jumping){
    mg.runner.vy += 0.5;
    mg.runner.y += mg.runner.vy;
    if(mg.runner.vy>0){
      mg.platforms.forEach(function(p){
        if(p.landed) return;
        var withinX = mg.runner.x > p.x-6 && mg.runner.x < p.x+p.w+6;
        var withinY = mg.runner.y >= p.y-4 && mg.runner.y <= p.y+8;
        if(withinX && withinY){
          mg.runner.y = p.y; mg.runner.vy = 0; mg.runner.jumping = false;
          if(!p.scored){
            p.scored = true; mg.score++;
            grantMiniGameXP(state.activeKid, p.flag?8:2);
            toast(p.flag ? "🚩 Flag platform! +8 XP" : "+2 XP");
          }
        }
      });
    }
  }

  // camera: keep the runner from climbing past the upper third of the view by scrolling the world down
  var scrollLine = canvas.height*0.4;
  if(mg.runner.y < scrollLine){
    var scrollAmt = scrollLine - mg.runner.y;
    mg.runner.y += scrollAmt;
    mg.platforms.forEach(function(p){ p.y += scrollAmt; });
  }

  // keep the ladder stocked with platforms above the highest one
  while(mg.platforms.length && mg.platforms[mg.platforms.length-1].y > -20){
    var top = mg.platforms[mg.platforms.length-1];
    var newY = top.y - (55+Math.random()*30);
    var newX = 20+Math.random()*(canvas.width-100);
    mg.platforms.push({x:newX, y:newY, w:60, flag:(mg.platforms.length%4===0)});
  }
  mg.platforms = mg.platforms.filter(function(p){ return p.y < canvas.height+30; });

  if(mg.runner.y > canvas.height+20){
    toast("Fell! Climb again 🧗");
    resetLadder();
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  mg.platforms.forEach(function(p){
    ctx.fillStyle = "#e0b155";
    ctx.fillRect(p.x, p.y+4, p.w, 10);
    if(p.flag){
      ctx.fillStyle = "#b5602f";
      ctx.fillRect(p.x+p.w/2-1, p.y-20, 2, 24);
      ctx.fillRect(p.x+p.w/2+1, p.y-20, 10, 8);
    }
  });
  ctx.fillStyle = "#6bbf8c";
  ctx.beginPath(); ctx.arc(mg.runner.x, mg.runner.y-10, 14, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("Score "+mg.score, 8, 16);

  mg.raf = requestAnimationFrame(function(){ parkourLoop(ctx, canvas); });
}

/* Returns a copy of the question with its choices shuffled and answerIndex remapped to match —
   the underlying stored question/data never changes, so if the correct answer always happens to
   be written first (or in any other fixed spot), it still lands somewhere random each time a kid
   actually sees it instead of being guessable by position. */
function shuffleQuestionChoices(q){
  if(!Array.isArray(q.choices)) return q; // interactive types (order/build/sort/match) shuffle themselves
  /* Fisher-Yates, not the sort(()=>Math.random()-.5) trick — that one is a well-known biased
     shuffle (some positions come up far more than others), which would just trade one kind of
     guessable pattern for another instead of actually fixing it. */
  var order = q.choices.map(function(_,i){ return i; });
  for(var i=order.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  return Object.assign({}, q, {
    choices: order.map(function(i){ return q.choices[i]; }),
    answerIndex: order.indexOf(q.answerIndex)
  });
}
function startQuiz(subject, studyGuide){
  var pool = state.questions.filter(function(q){
    if(q.kidId!==state.activeKid && q.kidId!=="any") return false;
    if(studyGuide) return q.studyGuide===studyGuide;
    return q.subject===subject;
  });
  pool = pool.slice().sort(function(){return Math.random()-.5;});
  if(!studyGuide) pool = pool.slice(0,8); // subject quick-fire stays short; study guide mode covers everything so it can be replayed like a full study session
  pool = pool.map(shuffleQuestionChoices);
  state.quiz = {subject: subject, studyGuide: studyGuide||null, pool: pool, idx:0, score:0, xpEarned:0, phase:"question", timer:studyGuide?25:15, timerHandle:null, timeoutId:null};
  renderArena();
  armTimer();
}

function armTimer(){
  clearInterval(state.quiz.timerHandle);
  state.quiz.timer = state.quiz.studyGuide ? 25 : 15;
  state.quiz.timerHandle = setInterval(function(){
    if(!state.quiz) return clearInterval(state.quiz.timerHandle);
    state.quiz.timer--;
    var t = document.getElementById("qzTimer");
    if(t) t.textContent = Math.max(0,state.quiz.timer)+"s";
    if(state.quiz.timer<=0){
      clearInterval(state.quiz.timerHandle);
      answerQuiz(-1);
    }
  }, 1000);
}

function renderQuiz(){
  var quiz = state.quiz;
  els.view.innerHTML = "";
  if(quiz.phase==="done"){
    var kd = kidData(state.activeKid);
    var card = document.createElement("div");
    card.className = "qz-card qz-result";
    card.innerHTML =
      '<div class="muted">'+escapeHtml(quiz.studyGuide||quiz.subject)+' Run</div>'+
      '<div class="big">'+quiz.score+' / '+quiz.pool.length+' correct</div>'+
      '<div class="muted">+'+quiz.xpEarned+' XP earned</div>'+
      (quiz.studyGuide ? '<div class="muted" style="margin-top:6px">Go fill in what you got right on your paper study guide, then hit Play Again for more practice.</div>' : '')+

function answerQuiz(choiceIdx){
  var quiz = state.quiz;
  if(!quiz || quiz.phase!=="question") return;
  clearInterval(quiz.timerHandle);
  quiz.phase = "reveal";
  var q = quiz.pool[quiz.idx];
  var correct = choiceIdx===q.answerIndex;
  if(correct){ quiz.score++; quiz.xpEarned += (q.xp||15); }
  var opts = document.querySelectorAll(".qz-opt");
  opts.forEach(function(btn,i){
    btn.disabled = true;
    if(i===q.answerIndex) btn.classList.add("correct");
    else if(i===choiceIdx) btn.classList.add("wrong");
  });
  if(correct) toast("+"+(q.xp||15)+" XP!"); else toast("Not quite — keep going");
  quiz.timeoutId = setTimeout(function(){
    if(state.quiz!==quiz) return; // kid navigated away before this fired
    quiz.idx++;

      armTimer();

  }, 900);
}

function toRow(coll, obj){
  var map = FIELD_MAP[coll], row = {};
  Object.keys(obj).forEach(function(k){ row[map[k]||k] = obj[k]; });
  return row;

function fromRow(coll, row){
  var map = FIELD_MAP[coll], inv = {}, obj = {};
  Object.keys(map).forEach(function(k){ inv[map[k]] = k; });
  Object.keys(row).forEach(function(k){

  return obj;

/* supabase-js resolves (never rejects) with {data,error} even on a blocked/failed write,
   so a silently-swallowed .error looks like the tap did nothing — surface it instead. */
function checkWriteError(res){
  if(res && res.error){
    console.error("Academy Log sync error:", res.error);
    toast("⚠️ Couldn't save"+(res.error.message ? ": "+res.error.message : " — check your connection and try again"));
  }
  syncSoon();
  return res;
}
function doc(path){
  var parts = path.split("/"), coll = parts[0], id = parts[1];
  var table = TABLE[coll], keyCol = KEY_COL[coll];
  return {
    update: function(partial){
      return sb.from(table).update(toRow(coll, partial)).eq(keyCol, id).then(checkWriteError);
    },
    set: function(full){
      return sb.from(table).update(toRow(coll, full)).eq(keyCol, id).then(checkWriteError);
    },
    delete: function(){
      return sb.from(table).delete().eq(keyCol, id).then(checkWriteError);
    },
    onSnapshot: function(){ /* no-op: this build polls instead of pushing live snapshots per-doc */ }
  };
}
function collection(coll){
  var table = TABLE[coll];
  return {
    add: function(obj){
      var id = obj.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());
      var row = toRow(coll, obj);
      row.id = id; row.household_id = HOUSEHOLD_ID;
      return sb.from(table).insert(row).then(checkWriteError);
    },
    onSnapshot: function(){ /* no-op: this build polls instead of pushing live snapshots per-collection */ }
  };
}

/* Read-only: prints (via console.table) each curriculum assignment's stored date next to what
   date it "should" be if the 5-day Mon-Fri cadence were followed exactly from the Day-0 lesson's
   own actual date — and flags any that landed on a real Saturday/Sunday. Does not change anything;
   run this first to see how far a schedule has drifted before deciding whether/how to fix it. */
function diagnoseScheduleDates(kidId){
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){ byTitle[item.title] = item.d; });
  var rows = [];
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId) return;
    var d = byTitle[a.title];
    if(d==null) return;
    rows.push({id:id, d:d, subject:a.subject, title:a.title, date:a.date, done:a.done});
  });
  rows.sort(function(x,y){ return x.d-y.d; });
  var anchorRow = rows.filter(function(r){ return r.d===0; })[0];
  if(!anchorRow){ console.log("diagnoseScheduleDates: couldn't find a Day 0 assignment to anchor from."); return []; }
  var anchorDate = new Date(anchorRow.date+"T00:00:00");
  var out = rows.map(function(r){
    var week = Math.floor(r.d/5), weekday = r.d%5;
    var expected = new Date(anchorDate);
    expected.setDate(expected.getDate() + week*7 + weekday);
    var expectedISO = isoDate(expected);
    var dow = expected.getDay();
    return {
      day: r.d, subject: r.subject, title: r.title.length>55 ? r.title.slice(0,55)+"…" : r.title,
      storedDate: r.date, expectedFromDay0: expectedISO,
      mismatch: r.date!==expectedISO,
      fallsOnWeekend: (dow===0||dow===6),
      done: r.done
    };
  });
  console.table(out);
  return out;
}

/* Moves every NOT-YET-DONE curriculum assignment onto a fresh Monday-through-Friday-only schedule
   starting today (or the next school day, if today's a weekend) — grouping same-day lessons (across
   subjects) together so the sequence stays intact. Anything already marked done is left completely
   untouched (its date and completion stay as-is), so already-finished work is never re-dated or lost. */
function schoolDayOffset(start, i){
  var result = new Date(start);
  var count = 0;
  while(count < i){
    result.setDate(result.getDate()+1);
    var day = result.getDay();
    if(day!==0 && day!==6) count++;
  }
  return result;
}
function rescheduleFromToday(kidId){
  if(!db) return;
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){ byTitle[item.title] = item.d; });
  var groups = {};
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId || a.done) return;
    var d = byTitle[a.title];
    if(d==null) return;
    (groups[d] = groups[d]||[]).push(id);
  });
  var days = Object.keys(groups).map(Number).sort(function(x,y){ return x-y; });
  if(!days.length){ console.log("rescheduleFromToday: nothing to move — everything matched is already done."); return; }
  var today = new Date();
  var todayDow = today.getDay();
  var start = todayDow===6 ? schoolDayOffset(today,2) : todayDow===0 ? schoolDayOffset(today,1) : today;
  var count = 0;
  days.forEach(function(d, i){
    var iso = isoDate(schoolDayOffset(start, i));
    groups[d].forEach(function(id){
      state.assignments[id].date = iso;
      db.doc("assignments/"+id).update({date: iso});
      count++;
    });
  });
  console.log("rescheduleFromToday: moved "+count+" not-yet-done assignment(s) onto a Mon–Fri-only schedule starting "+isoDate(start)+".");
  renderView();
}
