function toggleAssignment(a){
  if(!db) return;
  var willDone = !a.done;
  var doneAt = willDone ? new Date().toISOString() : null;
  if(state.assignments[a.id]){ state.assignments[a.id].done = willDone; state.assignments[a.id].doneAt = doneAt; renderView(); }
  db.doc("assignments/"+a.id).update({done: willDone, doneAt: doneAt});
  var kd = kidData(a.kidId);
  var oldXp = kd.xp||0;
  var bonusXp = (willDone && a.crossCurricular) ? CROSS_CURRICULAR_BONUS_XP : 0;
  var delta = willDone ? (a.xp+bonusXp) : -(a.xp + (a.crossCurricular ? CROSS_CURRICULAR_BONUS_XP : 0));
  var newXp = Math.max(0, oldXp + delta);
  var updates = {xp: newXp};
  var newStreakDay = false;
  if(willDone){
    var last = kd.lastCompletedDate;
    var todayStr = new Date().toDateString();
    if(last !== todayStr){
      var intact = streakIntact(last);
      var wkend = isWeekendIso(todayISO());
      updates.streak = intact ? (kd.streak||0)+(wkend ? 0 : 1) : 1;
      updates.lastCompletedDate = todayStr;
      newStreakDay = !wkend || !intact;
    }
  }
  var lvl = willDone ? levelUpBonus(kd, newXp) : {gained:0, bonus:0, newLevel:levelFor(newXp)};
  if(lvl.gained>0){ updates.mommaMoney = (kd.mommaMoney||0) + lvl.bonus; updates.lastMommaMoneyLevel = kd.lastMommaMoneyLevel; }
  Object.assign(kd, updates);
  state.kids[a.kidId] = kd;
  db.doc("kids/"+a.kidId).update(updates);
  if(willDone && a.kidId===state.activeKid) petCheer("done");
  if(willDone) toast(bonusXp ? "+"+a.xp+" XP + "+bonusXp+" cross-curricular bonus! 🎉" : "+"+a.xp+" XP! Nice work 🎉");
  if(a.kidId===state.activeKid) renderXpBar();
  if(newStreakDay && a.kidId===state.activeKid && !isCalmMode(a.kidId)) celebrate();
  if(lvl.gained>0){
    logLevelUpReward(a.kidId, lvl);
  }
}

/* Victory chime (synthesized tone, no audio asset needed) + lightweight CSS confetti,
   fired once per day when a kid's streak first advances. */
function celebrate(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    [523.25, 659.25, 783.99].forEach(function(freq, i){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      var start = ctx.currentTime + i*0.12;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.35);
      osc.start(start); osc.stop(start+0.4);
    });
  } catch(e){ /* Web Audio unavailable — skip the chime, confetti still plays */ }

  var colors = ["#ffb703","#fb8500","#219ebc","#8ecae6","#2a9d8f"];
  for(var i=0; i<28; i++){
    var piece = document.createElement("div");
    var color = colors[i % colors.length];
    var left = Math.random()*100;
    var delay = Math.random()*0.3;
    var duration = 1.1 + Math.random()*0.6;
    var rotate = Math.random()*360;
    piece.style.cssText = "position:fixed;top:-12px;left:"+left+"vw;width:8px;height:14px;background:"+color+
      ";z-index:9999;pointer-events:none;opacity:0.9;transform:rotate("+rotate+"deg);"+
      "animation:confetti-fall "+duration+"s ease-in "+delay+"s forwards";
    document.body.appendChild(piece);
    (function(el, d, del){ setTimeout(function(){ el.remove(); }, (d+del)*1000+50); })(piece, duration, delay);
  }
}
if(!document.getElementById("confettiKeyframes")){
  var kf = document.createElement("style");
  kf.id = "confettiKeyframes";
  kf.textContent = "@keyframes confetti-fall{to{top:100vh;opacity:0.2;transform:rotate(540deg)}}";
  document.head.appendChild(kf);
}

/* $3 Momma Money per level gained; called after any XP change. Three separate places can trigger
   this (task completion, mini-games, quiz completion), and local state can lag behind a moment
   after a Supabase write — comparing old/new xp on every call let the same level-up get paid
   multiple times if two of those fired close together (e.g. 3 duplicate Level 4 deposits for one
   real level-up). Anchoring to a persisted "highest level already paid" watermark instead of a
   before/after delta makes this idempotent no matter how stale oldXp is or how many call sites
   race each other — a level can never be paid twice. */
function levelUpBonus(kd, newXp){
  var newLevel = levelFor(Math.max(0,newXp));
  var lastPaidLevel = kd.lastMommaMoneyLevel!=null ? kd.lastMommaMoneyLevel : levelFor(Math.max(0,kd.xp||0));
  var gained = Math.max(0, newLevel-lastPaidLevel);
  var result = {gained: gained, bonus: gained*3, newLevel: newLevel};
  if(gained>0) kd.lastMommaMoneyLevel = newLevel; // updated synchronously so a same-tick duplicate call sees it immediately
  return result;
}
function logLevelUpReward(kidId, lvl){
  if(db) db.collection("rewards").add({kidId: kidId, type:"level-up", level: lvl.newLevel, amount: lvl.bonus, at: new Date().toISOString()});
  showLevelUpBanner(kidId, lvl);
}
function showLevelUpBanner(kidId, lvl){

    '<button class="reward-skip" id="lvlDismiss" style="color:#fff;opacity:1">Nice!</button>';

/* ---------- Today: guided daily blocks ----------
   The day is broken into a fixed sequence of blocks. A block "unlocks" only once every block
   before it is complete — later blocks render locked and dimmed. This is deliberate: Ryan does
   better with one clear next step than a flat list he can skim past, and it mirrors the
   "what do I do next" structure that works for him elsewhere (see Leader's Guide, Show & Teach). */
var DAILY_BLOCKS = [
  {key:"morning", label:"Morning Launch", icon:"🌅"},
  {key:"math", label:"Math in the Machine", icon:"🧮", subjects:["Math"]},
  {key:"reading", label:"Reading Block", icon:"📖", subjects:["ELA","Reading"]},
  {key:"project", label:"Main Project", icon:"🛠️", subjects:["Independent","Related Arts","Live Lesson"]},
  {key:"sciSocial", label:"Science & Social Studies", icon:"🔬", subjects:["Science","Social Studies"]},
  {key:"faith", label:"Faith", icon:"✝️", subjects:["Faith"]},
  {key:"showTeach", label:"Show & Teach", icon:"🎤"}
];
/* Same six blocks, same keys/subjects (so assignment matching never changes) — just a different
   label/icon per kid so the day actually feels like theirs. Ryan gets the tech/retro default
   above; Anna gets something that matches her (unicorns, sunshine, rainbows), not his interests
   wearing a different name. Add more kids here as needed; a kid with no entry just gets the
   default DAILY_BLOCKS labels. */
var KID_BLOCK_THEME = {
  kid1: {
    morning: {label:"Sunshine Start", icon:"🌞"},
    math: {label:"Unicorn Math", icon:"🦄"},
    reading: {label:"Storytime", icon:"📚"},
    project: {label:"Creative Studio", icon:"🌈"},
    sciSocial: {label:"Discovery Time", icon:"🌸"},
    faith: {label:"God's Story Time", icon:"📖"},
    showTeach: {label:"Sparkle & Share", icon:"🌟"}
  },
  kid2: {
    faith: {label:"The Archive", icon:"🗄️"}
  }
};
function blocksForKid(kidId){
  var theme = KID_BLOCK_THEME[kidId];
  if(!theme) return DAILY_BLOCKS;
  return DAILY_BLOCKS.map(function(b){
    var override = theme[b.key];
    return override ? Object.assign({}, b, override) : b;
  });
}
function blockKeyFor(a){
  if(a.block) return a.block;
  for(var i=0;i<DAILY_BLOCKS.length;i++){
    var b = DAILY_BLOCKS[i];
    if(b.subjects && b.subjects.indexOf(a.subject)>=0) return b.key;
  }
  return "project";
}
/* Leader-customizable per kid — the six blocks always exist, but their sequence (which one shows
   first/last) can be reordered from the Leader tab. Falls back to the default order above if a
   kid has no custom order saved yet, or if the saved order is missing/adds a key (curriculum
   changes shouldn't be able to silently drop a block from view). */
function getBlockOrder(kidId){
  var kd = kidData(kidId);
  var saved = Array.isArray(kd.blockOrder) ? kd.blockOrder : null;
  if(!saved) return DAILY_BLOCKS.map(function(b){ return b.key; });
  var validKeys = DAILY_BLOCKS.map(function(b){ return b.key; });
  var order = saved.filter(function(k){ return validKeys.indexOf(k)>=0; });
  validKeys.forEach(function(k){ if(order.indexOf(k)<0) order.push(k); });
  return order;
}
function orderedBlocksFor(kidId){
  var order = getBlockOrder(kidId);
  var byKey = {};
  blocksForKid(kidId).forEach(function(b){ byKey[b.key] = b; });
  return order.map(function(k){ return byKey[k]; });
}
function saveBlockOrder(kidId, order){
  if(!db) return;
  var kd = kidData(kidId);
  kd.blockOrder = order;
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update({blockOrder: order});
}
/* Up/down arrows instead of real drag-and-drop: HTML5 drag events don't fire reliably on
   touchscreens without an extra JS library, and this is used almost entirely on phones — arrows
   get to the identical result (reordering the six blocks) without that reliability risk. */
function renderBlockOrderCard(kidId){
  var card = document.createElement("div");
  card.className = "card";
  var order = getBlockOrder(kidId);
  var byKey = {};
  blocksForKid(kidId).forEach(function(b){ byKey[b.key] = b; });
  order.forEach(function(key, i){
    var block = byKey[key];
    var row = document.createElement("div");

function journalEntryFor(kidId, iso){
  return (state.journalEntries||[]).filter(function(j){ return j.kidId===kidId && j.date===iso; })[0] || null;
}
function reflectionFor(kidId, iso){
  return (state.reflections||[]).filter(function(r){ return r.kidId===kidId && r.date===iso; })[0] || null;
}
/* Tasks sharing a choiceGroup are alternatives, not separate requirements — the group counts as
   done once any one member is done, matching the "pick one of 2-3" pool mechanic. A task without
   a choiceGroup is required on its own, same as before. */
function tasksUnitsComplete(tasks){
  var groupDone = {};
  return tasks.every(function(a){
    if(!a.choiceGroup) return !!a.done;
    if(!(a.choiceGroup in groupDone)){
      groupDone[a.choiceGroup] = tasks.some(function(t){ return t.choiceGroup===a.choiceGroup && t.done; });
    }
    return groupDone[a.choiceGroup];
  });
}
function blockComplete(blockKey, kidId, iso, tasksByBlock){
  if(blockKey==="morning"){
    var j = journalEntryFor(kidId, iso);
    return !!(j && j.launchMood && j.launchGoal);
  }
  if(blockKey==="showTeach") return !!reflectionFor(kidId, iso);
  var tasks = tasksByBlock[blockKey] || [];
  if(!tasks.length) return true; // nothing assigned to this block today — auto-pass, don't block the day on it
  return tasksUnitsComplete(tasks);
}
function disablePaste(el){ el.addEventListener("paste", function(e){ e.preventDefault(); }); }

/* ===== Anti-cheat guards for reflection/journaling text fields =====
   Three layers, since paste-blocking alone doesn't stop everything (drag-and-drop text, or a
   determined kid typing/pasting around the block on a device where events behave differently):
     1. Block paste, drag-drop, and right-click-paste outright.
     2. Reject suspiciously "not their own words" content on save — URLs, wall-of-text paragraphs,
        or a single absurdly long unbroken "word" (the shape copy-pasted text tends to have).
     3. Track whether a paste/drop was ever attempted on this field, so a leader reviewing the
        saved reflection later can see it even if the kid ultimately typed something valid instead. */
function isSuspiciousReflectionText(text, maxLen){
  if(!text) return null;
  if(text.length > maxLen) return "That's a lot for this box — try writing it in your own words.";
  if(/https?:\/\/|www\./i.test(text)) return "This field is for your own reflection.";
  if(text.split(/\s+/).some(function(w){ return w.length > 25; })) return "This field is for your own reflection.";
  if(/\n{2,}/.test(text) || text.split(/\s+/).length > 60) return "Try writing this in your own words.";
  return null;
}

/* Wires paste/drop blocking onto a text field and tracks attempts via el.dataset.pasteAttempted,
   which callers read at save time to persist alongside the entry. Purely a UI-layer guard — the
   real gate against bad content is isSuspiciousReflectionText() run again at save time below. */
function attachAntiCheatGuards(el){
  el.dataset.pasteAttempted = "0";
  el.addEventListener("paste", function(e){ e.preventDefault(); el.dataset.pasteAttempted = "1"; });
  el.addEventListener("drop", function(e){ e.preventDefault(); el.dataset.pasteAttempted = "1"; });
  el.addEventListener("dragover", function(e){ e.preventDefault(); });
}

/* Shows/hides the small inline rejection tooltip next to a guarded field. */
function showAntiCheatWarning(warnEl, message){
  if(!warnEl) return;
  if(!message){ warnEl.classList.remove("show"); return; }
  warnEl.innerHTML = '<span class="ac-warn-icon">⚠️</span> '+escapeHtml(message);
  warnEl.classList.add("show");
}

function renderToday(){
  els.view.innerHTML = "";
  var kidId = state.activeKid;
  var iso = todayISO();
  var focusOn = isFocusMode(kidId);

  var title = document.createElement("div");
  title.className = "section-title";
  title.textContent = kidId==="kid1" ? "✨ "+fmtDate(iso)+"'s Rainbow Day" : fmtDate(iso) + "'s Daily Rhythm";
  els.view.appendChild(title);
  els.view.appendChild(renderModeToggleRow(kidId));
  var planBar = planBarEl(kidId); if(planBar) els.view.appendChild(planBar);

  if(isWeekendIso(iso) && kidData(kidId).weekendExtrasOn){
    /* Weekends have no real curriculum assigned, so the usual 6 blocks would just show up as a
       row of "nothing assigned to this block today" placeholders — noise on what's supposed to be
       a free day. Weekend Extra mode replaces that whole list with just the project card. */
    els.view.appendChild(renderWeekendExtraCard(kidId, iso));
    return;
  }

  var blocks = orderedBlocksFor(kidId);
  var listOn = isListMode(kidId);
  var list = assignmentsFor(kidId, iso);
  var tasksByBlock = {};
  list.forEach(function(a){
    var k = blockKeyFor(a);
    tasksByBlock[k] = tasksByBlock[k] || [];
    tasksByBlock[k].push(a);
  });

  var firstIncompleteIdx = blocks.length;
  for(var i=0;i<blocks.length;i++){
    if(!blockComplete(blocks[i].key, kidId, iso, tasksByBlock)){ firstIncompleteIdx = i; break; }
  }

  state.lastBlockIdx = state.lastBlockIdx || {};
  if(state.lastBlockIdx[kidId]!=null && firstIncompleteIdx > state.lastBlockIdx[kidId]){
    var justDone = blocks[state.lastBlockIdx[kidId]];
    var next = blocks[firstIncompleteIdx];
    if(justDone) toast("🎉 "+justDone.label+" complete!"+(next?" Next: "+next.label:""));
  }
  state.lastBlockIdx[kidId] = firstIncompleteIdx;

  blocks.forEach(function(block, idx){
    /* Focus Mode: show only the one block that's actually actionable right now — no
       collapsed-done trail, no preview of what's coming. */
    if(focusOn && idx!==firstIncompleteIdx) return;
    els.view.appendChild(renderDailyBlockCard(block, kidId, iso, tasksByBlock[block.key]||[],
      idx<firstIncompleteIdx, idx===firstIncompleteIdx, listOn));
  });

  if(firstIncompleteIdx>=blocks.length){
    var done = document.createElement("div");
    done.className = "card empty";
    done.style.marginTop="12px";
    done.innerHTML = "🏁 <b>All of today's blocks complete!</b> Streak locked in.";
    els.view.appendChild(done);
  }
}

/* Order is a suggestion, not a lock: every block is always tappable, in any order. The current
   (first-incomplete) block auto-expands so there's still a clear "what's next," but nothing stops
   him from jumping ahead to a later block or back to review a done one. */
function renderDailyBlockCard(block, kidId, iso, tasks, isDone, isActive, listOn){
  var card = document.createElement("div");
  card.className = "card";
  card.style.marginBottom = "10px";
  if(isActive) card.style.borderColor = "var(--gold)";

  /* List Mode: every block shows fully expanded, no tapping a header to see the checkboxes —
     the flat, everything-visible layout he asked for instead of the guided one-at-a-time flow.
     A manual expand/collapse override is persisted (localStorage), not just held in memory, so
     tapping a block open and then reloading the page doesn't silently snap it back closed. */
  var overrideKey = "al_block_expanded_"+kidId+"_"+block.key+"_"+iso;
  var override = getSectionOverride(overrideKey);
  var showBody = listOn ? (override!==null ? override : true) : (override!==null ? override : isActive);

  var head = document.createElement("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px;"+(listOn?"":"cursor:pointer");
  head.innerHTML =
    '<span style="font-size:20px">'+(isDone?"✅":block.icon)+'</span>'+
    '<div style="flex:1">'+
      '<div style="font-weight:700">'+escapeHtml(block.label)+(isActive?' <span class="chip" style="background:var(--gold-soft);color:var(--gold);font-size:10.5px;vertical-align:middle">up next</span>':'')+'</div>'+
      (!listOn && isDone ? '<div class="muted" style="font-size:12px">'+(showBody?"Tap to collapse":"Done — tap to review")+
        (block.key==="morning" && !showBody ? ' <span id="selfStartStreakRow" class="launch-streak-row" style="display:inline">🔥 '+(kidData(kidId).selfStartStreak||0)+' day self-start streak</span>' : '')+
      '</div>' : '')+
    '</div>';
  if(!listOn){
    head.onclick = function(){
      setSectionOverride(overrideKey, !showBody);
      renderView();
    };
  }
  card.appendChild(head);

  if(showBody){
    var body = document.createElement("div");
    body.style.marginTop = "10px";
    if(block.key==="morning"){
      body.appendChild(renderMorningLaunch(kidId, iso));
    } else if(block.key==="showTeach"){
      body.appendChild(renderShowTeach(kidId, iso));
    } else if(!tasks.length){
      var empty = document.createElement("div");
      empty.className = "muted";
      empty.style.fontSize = "13px";
      empty.textContent = "Nothing assigned to this block today.";
      body.appendChild(empty);
    } else {
      /* Once one option in a choiceGroup is done, its siblings quietly disappear for the day
         instead of sticking around looking like unfinished work — he picked, that's the point. */
      tasks.forEach(function(a){
        if(a.choiceGroup && !a.done){
          var groupDone = tasks.some(function(t){ return t.choiceGroup===a.choiceGroup && t.done; });
          if(groupDone) return;
        }
        body.appendChild(taskRow(a));
      });
    }
    card.appendChild(body);
  }
  return card;
}

/* Morning Launch mood options and goal chips. Kept as simple data arrays so the set can be tweaked
   without touching the render/save logic below. */
var LAUNCH_MOODS = [
  {key:"waking", icon:"😴", label:"Waking up"},
  {key:"ready", icon:"🙂", label:"Ready"},
  {key:"goLetsGo", icon:"🚀", label:"Let's go"}
];
var LAUNCH_GOALS = ["Math first", "VM build", "Reading", "Project work", "Science block"];

/* Saves one field of today's journal/launch entry, creating the row if it doesn't exist yet —
   every tap (mood, goal, voice, photo) calls this so nothing waits on a separate Save button. */
function saveLaunchField(kidId, iso, existing, fieldUpdates){
  if(!db) return existing;
  if(existing && existing.id){
    Object.assign(existing, fieldUpdates);
    db.doc("journal/"+existing.id).update(fieldUpdates);
    return existing;
  }
  var newId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
  var localEntry = Object.assign({id:newId, kidId:kidId, date:iso, createdAt:new Date().toISOString()}, fieldUpdates);
  state.journalEntries = state.journalEntries || [];
  state.journalEntries.push(localEntry);
  db.collection("journal").add(localEntry);
  return localEntry;
}

/* Self-Start Streak: counts consecutive days a kid picked BOTH a mood and a goal on their own,
   separate from the general XP/task streak. Mirrors the date-comparison pattern toggleAssignment
   already uses for the main streak, so "did they do it today, was yesterday the last day" logic
   stays consistent across the app instead of drifting into a second implementation. */
function maybeAdvanceSelfStartStreak(kidId, entry){
  if(!entry || !entry.launchMood || !entry.launchGoal) return null;
  var kd = kidData(kidId);
  var todayStr = new Date().toDateString();
  if(kd.lastSelfStartDate === todayStr) return null; // already counted today
  var newStreak = streakIntact(kd.lastSelfStartDate) ? (kd.selfStartStreak||0)+(isWeekendIso(todayISO()) ? 0 : 1) : 1;
  var updates = {selfStartStreak: newStreak, lastSelfStartDate: todayStr};
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update(updates);
  return newStreak;
}

  noteEl.style.cssText = "width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:6px;box-sizing:border-box";

  var textEl = wrap.querySelector(".st-text");
  var stWarn = wrap.querySelector(".st-warn");
  textEl.value = existing && existing.type==="text" ? existing.text||"" : "";
  attachAntiCheatGuards(textEl);
  textEl.addEventListener("input", function(){ showAntiCheatWarning(stWarn, null); });

  var uploadedNote = wrap.querySelector(".st-uploaded");
  var pendingUpload = existing && existing.type!=="text" ? {type:existing.type, url:existing.url} : null;
  if(pendingUpload) uploadedNote.textContent = "Saved "+pendingUpload.type+" attached.";

  var uploadRow = wrap.querySelector(".st-upload-row");
  var saveBtn = wrap.querySelector(".st-save");
  /* An upload takes a moment over the network, but Save was always clickable — tap Save right
     after picking a file (the natural instinct) and the upload hadn't registered yet, so it fell
     through to "add a sentence," even though a kid genuinely had just attached something. Save is
     now disabled for the whole upload, so it can't be clicked out from under an in-flight upload. */
  function setUploading(isUploading){
    saveBtn.disabled = isUploading;
    saveBtn.style.opacity = isUploading ? "0.5" : "";
    saveBtn.style.cursor = isUploading ? "not-allowed" : "";
  }
  function makeUploadBtn(label, accept, type){
    var lbl = document.createElement("label");
    lbl.className = "reward-skip";
    lbl.style.cssText = "color:var(--ink);opacity:1;border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px";
    lbl.textContent = label;
    var input = document.createElement("input");
    input.type = "file"; input.accept = accept; input.style.display = "none";
    input.onchange = function(){
      var file = input.files[0];
      if(!file || !HOUSEHOLD_ID) return;
      var path = HOUSEHOLD_ID+"/show-teach/"+kidId+"/"+iso+"-"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      lbl.textContent = "Uploading…";
      setUploading(true);
      sb.storage.from("lesson-uploads").upload(path, file).then(function(res){
        lbl.textContent = label;
        setUploading(false);
        if(res.error){ toast("⚠️ Couldn't upload"+(res.error.message ? ": "+res.error.message : " — check your connection and try again")); return; }
        var url = sb.storage.from("lesson-uploads").getPublicUrl(path).data.publicUrl;
        pendingUpload = {type:type, url:url};
        uploadedNote.textContent = type+" ready — tap Save to finish.";
      });
    };
    lbl.appendChild(input);
    return lbl;
  }
  uploadRow.appendChild(makeUploadBtn("🎙️ Audio", "audio/*", "audio"));
  uploadRow.appendChild(makeUploadBtn("📸 Photo", "image/*", "photo"));
  uploadRow.appendChild(makeUploadBtn("🎥 Video", "video/*", "video"));

  saveBtn.onclick = function(){
    if(!db || saveBtn.disabled) return;
    var text = textEl.value.trim();
    var attemptedPaste = textEl.dataset.pasteAttempted === "1";
    if(!pendingUpload && text){
      var reason = isSuspiciousReflectionText(text, 200);
      if(reason){ showAntiCheatWarning(stWarn, reason); return; }
    }
    var payload;
    if(pendingUpload) payload = {type: pendingUpload.type, url: pendingUpload.url, text: text || null, attemptedPaste: attemptedPaste};
    else if(text) payload = {type:"text", text: text, url: null, attemptedPaste: attemptedPaste};
    else { toast("Add a sentence or an upload first"); return; }
    if(existing && existing.id){
      Object.assign(existing, payload);
      db.doc("reflections/"+existing.id).update(payload);
    } else {
      var newId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
      var localEntry = Object.assign({id:newId, kidId:kidId, date:iso, createdAt:new Date().toISOString()}, payload);
      state.reflections = state.reflections || [];
      state.reflections.push(localEntry);
      db.collection("reflections").add(localEntry);
    }
    toast("🎤 Show & Teach saved!");
    renderView();
  };
  return wrap;
}

/* ---------- Planner (Day / Week / Month) ---------- */
/* Non-editable, presentational only — a suggested rhythm to the day, not a schedule to maintain.
   Replaces the old free-text "Daily Rhythm" time editor per feedback that it wasn't worth keeping
   as a separate, always-slightly-stale thing to hand-edit. */
var BLOCK_SUGGESTED_TIME = {
  morning:"9:00a", math:"9:20a", reading:"10:30a", project:"11:15a", sciSocial:"1:00p", showTeach:"1:45p"
};
function plannerCompactTask(a){
  var el = document.createElement("div");
  el.className = "planner-task";
  el.innerHTML =
    '<button class="check'+(a.done?" done":"")+'" aria-label="Mark complete" style="width:18px;height:18px;flex:none"><svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg></button>'+
    '<span class="pt-title'+(a.done?" done":"")+'">'+escapeHtml(displayTitle(a, a.title.length>50?a.title.slice(0,50)+"…":a.title))+'</span>';
  el.querySelector(".check").onclick = function(e){ e.stopPropagation(); toggleAssignment(a); };
  el.onclick = function(){ state.lessonDetailId = a.id; renderView(); };
  return el;
}
function plannerJournalChip(done, label){
  var el = document.createElement("div");
  el.className = "planner-chip-line";
  el.style.cssText = "background:"+(done?"var(--success-soft)":"var(--paper)")+";color:"+(done?"var(--success)":"var(--text-dim)")+(done?"":";border:1px solid var(--border)");
  el.textContent = done ? "✅ "+label : "— "+label;
  return el;
}

function plannerViewSwitcher(kidId){
  var row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-bottom:14px";
  ["day","week","month"].forEach(function(v){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "reward-skip";
    var active = (state.plannerView||"week")===v;
    b.style.cssText = "opacity:1;border:1px solid var(--border);font-size:12.5px;padding:6px 14px;text-transform:capitalize;"+
      (active ? "background:var(--gold-soft);color:var(--ink);font-weight:700" : "background:var(--card);color:var(--text-dim)");
    b.textContent = v;
    b.onclick = function(){ state.plannerView = v; setModeFlagStr("al_plannerView", kidId, v); renderView(); };
    row.appendChild(b);
  });
  return row;
}

function renderPlanner(){
  els.view.innerHTML = "";
  var kidId = state.activeKid;
  if(state.plannerView==null) state.plannerView = getModeFlagStr("al_plannerView", kidId) || "week";
  if(!state.plannerDate) state.plannerDate = todayISO();

  var title = document.createElement("div");
  title.className = "section-title";
  title.textContent = "📅 Planner — " + kidData(kidId).name;
  els.view.appendChild(title);
  els.view.appendChild(plannerViewSwitcher(kidId));

  if(state.plannerView==="day") renderPlannerDay(kidId);
  else if(state.plannerView==="month") renderPlannerMonth(kidId);
  else renderPlannerWeek(kidId);

  if(state.plannerView==="week"){
    var wk = weekBoundsMonFri();
    var title2 = document.createElement("div");
    title2.className = "section-title";
    title2.style.marginTop = "16px";
    title2.textContent = "Upcoming Quests (beyond this week)";
    els.view.appendChild(title2);
    var afterThisWeek = isoDate(wk.end);
    var upcoming = assignmentsFor(kidId, function(d){ return d>afterThisWeek; });
    var byDate = {}, order = [];
    upcoming.forEach(function(a){ if(!byDate[a.date]){ byDate[a.date]=[]; order.push(a.date); } byDate[a.date].push(a); });
    order.sort();
    if(!order.length){
      var e = document.createElement("div");
      e.className = "card empty";
      e.textContent = "Nothing upcoming yet.";
      els.view.appendChild(e);
    }
    order.forEach(function(dt){
      var head = document.createElement("div");
      head.className = "day-head";
      head.style.marginTop = "10px";
      head.textContent = fmtDate(dt);
      els.view.appendChild(head);
      var card = document.createElement("div");
      card.className = "card";
      byDate[dt].forEach(function(a){ card.appendChild(taskRow(a)); });
      els.view.appendChild(card);
    });
  }
}

/* Week: days as columns, the six daily blocks as rows — a real planner grid instead of a long
   stacked list, so a whole week is visible (and comparable) at a glance. */
function renderPlannerWeek(kidId){
  var wk = weekBoundsMonFri();
  var dates = DAYS.map(function(d,i){ var dt = new Date(wk.start); dt.setDate(wk.start.getDate()+i); return isoDate(dt); });
  var todayStr = todayISO();

  var scroll = document.createElement("div");
  scroll.className = "planner-scroll";
  var table = document.createElement("table");
  table.className = "planner-grid";

  var thead = document.createElement("thead");
  var headRow = document.createElement("tr");
  headRow.appendChild(document.createElement("th"));
  DAYS.forEach(function(d, i){
    var th = document.createElement("th");
    var isToday = dates[i]===todayStr;
    if(isToday) th.className = "planner-today";
    th.innerHTML = DAY_LABEL[d]+'<br><span class="mono" style="font-weight:400">'+fmtDate(dates[i]).split(", ").slice(1).join(", ")+(isToday?" · today":"")+'</span>';
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  orderedBlocksFor(kidId).forEach(function(block){
    var tr = document.createElement("tr");
    var labelTd = document.createElement("td");
    labelTd.className = "planner-row-label";
    labelTd.innerHTML = '<div class="prl-icon">'+block.icon+'</div><div class="prl-name">'+escapeHtml(block.label)+'</div><div class="prl-time">'+(BLOCK_SUGGESTED_TIME[block.key]||"")+'</div>';
    tr.appendChild(labelTd);

    dates.forEach(function(iso){
      var td = document.createElement("td");
      td.className = "planner-cell"+(iso===todayStr?" planner-today-col":"");
      if(block.key==="morning" || block.key==="showTeach"){
        var isDone = blockComplete(block.key, kidId, iso, {});
        td.appendChild(plannerJournalChip(isDone, block.key==="morning" ? "journal" : "reflection"));
      } else {
        var tasks = assignmentsFor(kidId, iso).filter(function(a){ return blockKeyFor(a)===block.key; });
        if(!tasks.length){
          var empty = document.createElement("div");
          empty.className = "planner-empty";
          empty.textContent = "—";
          td.appendChild(empty);
        } else {
          tasks.forEach(function(a){ td.appendChild(plannerCompactTask(a)); });
        }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  els.view.appendChild(scroll);
}

/* Day: one date at a time, prev/next to move around, same six blocks as a simple vertical list. */
function renderPlannerDay(kidId){
  var iso = state.plannerDate;
  var nav = document.createElement("div");
  nav.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:12px";
  var prevBtn = document.createElement("button");
  prevBtn.className = "reward-skip";
  prevBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  prevBtn.textContent = "← Prev day";
  prevBtn.onclick = function(){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()-1); state.plannerDate=isoDate(d); renderView(); };
  var label = document.createElement("div");
  label.style.cssText = "flex:1;text-align:center;font-weight:700";
  label.textContent = fmtDate(iso) + (iso===todayISO() ? " (today)" : "");
  var nextBtn = document.createElement("button");
  nextBtn.className = "reward-skip";
  nextBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  nextBtn.textContent = "Next day →";
  nextBtn.onclick = function(){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1); state.plannerDate=isoDate(d); renderView(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  els.view.appendChild(nav);

  var list = assignmentsFor(kidId, iso);
  var tasksByBlock = {};
  list.forEach(function(a){ var k=blockKeyFor(a); (tasksByBlock[k]=tasksByBlock[k]||[]).push(a); });

  orderedBlocksFor(kidId).forEach(function(block){
    var card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "margin-bottom:10px;padding:12px 14px";
    var head = document.createElement("div");
    head.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px";
    head.innerHTML = '<span style="font-size:18px">'+block.icon+'</span><div style="flex:1;font-weight:700">'+escapeHtml(block.label)+'</div>'+
      '<span class="muted mono" style="font-size:11px">'+(BLOCK_SUGGESTED_TIME[block.key]||"")+'</span>';
    card.appendChild(head);
    if(block.key==="morning" || block.key==="showTeach"){
      var isDone = blockComplete(block.key, kidId, iso, {});
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.style.cssText = isDone ? "background:var(--success-soft);color:var(--success)" : "background:var(--paper);color:var(--text-dim);border:1px solid var(--border)";
      chip.textContent = isDone ? "✅ done" : "not yet";
      card.appendChild(chip);
    } else {
      var tasks = tasksByBlock[block.key]||[];
      if(!tasks.length){
        var empty = document.createElement("div");
        empty.className = "muted";
        empty.style.fontSize = "13px";
        empty.textContent = "Nothing assigned";
        card.appendChild(empty);
      } else {
        tasks.forEach(function(a){ card.appendChild(taskRow(a)); });
      }
    }
    els.view.appendChild(card);
  });
}

/* Month: a compact school-day calendar (Mon-Fri columns only) with a done/total badge per day —
   tap a day to jump into Day view for it. */
function renderPlannerMonth(kidId){
  var anchor = new Date(state.plannerDate+"T00:00:00");
  var year = anchor.getFullYear(), month = anchor.getMonth();

  var nav = document.createElement("div");
  nav.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:12px";
  var prevBtn = document.createElement("button");
  prevBtn.className = "reward-skip";
  prevBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  prevBtn.textContent = "← Prev month";
  prevBtn.onclick = function(){ state.plannerDate = isoDate(new Date(year, month-1, 1)); renderView(); };
  var label = document.createElement("div");
  label.style.cssText = "flex:1;text-align:center;font-weight:700";
  label.textContent = anchor.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  var nextBtn = document.createElement("button");
  nextBtn.className = "reward-skip";
  nextBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  nextBtn.textContent = "Next month →";
  nextBtn.onclick = function(){ state.plannerDate = isoDate(new Date(year, month+1, 1)); renderView(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  els.view.appendChild(nav);

  var scroll = document.createElement("div");
  scroll.className = "planner-scroll";
  var table = document.createElement("table");
  table.className = "planner-grid";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  DAYS.forEach(function(d){ var th=document.createElement("th"); th.textContent=DAY_LABEL[d]; hr.appendChild(th); });
  thead.appendChild(hr);
  table.appendChild(thead);

  var firstOfMonth = new Date(year, month, 1);
  var startIdx = todayIdxFor(firstOfMonth); // 0=Mon..6=Sun, days before month start in that week's Monday
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startIdx);
  var todayStr = todayISO();

  var tbody = document.createElement("tbody");
  for(var week=0; week<6; week++){
    var tr = document.createElement("tr");
    var anyInMonth = false;
    for(var day=0; day<5; day++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + week*7 + day);
      var inMonth = d.getMonth()===month;
      if(inMonth) anyInMonth = true;
      var iso = isoDate(d);
      var td = document.createElement("td");
      td.className = "planner-cell"+(iso===todayStr?" planner-today-col":"");
      if(!inMonth) td.style.opacity = "0.35";
      var dayAssignments = assignmentsFor(kidId, iso);
      var doneCt = dayAssignments.filter(function(a){return a.done;}).length;
      td.style.cursor = "pointer";
      td.innerHTML = '<div style="font-weight:700;font-size:12px;margin-bottom:4px">'+d.getDate()+'</div>'+
        (dayAssignments.length ? '<div class="planner-chip-line" style="background:var(--paper);border:1px solid var(--border)">'+doneCt+'/'+dayAssignments.length+'</div>' : '<div class="planner-empty">—</div>');
      td.onclick = function(clickedIso){ return function(){ state.plannerDate = clickedIso; state.plannerView = "day"; renderView(); }; }(iso);
      tr.appendChild(td);
    }
    if(anyInMonth || week===0) tbody.appendChild(tr);
    if(!anyInMonth && week>0) break;
  }
  table.appendChild(tbody);
  scroll.appendChild(table);
  els.view.appendChild(scroll);
}

function csvEscape(v){
  var s = String(v==null ? "" : v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* Builds a CSV covering every completed quest for a kid — date completed, subject, standard,
   title, xp, estimated minutes — plus subject-hours and standards-covered summary rows, for
   portfolio reviews or district reporting. Downloads directly in the browser, no server needed. */
function exportProgressCSV(kidId){
  var kd = kidData(kidId);
  var done = assignmentsFor(kidId, null).filter(function(a){ return a.done && a.doneAt; })
    .sort(function(a,b){ return new Date(a.doneAt)-new Date(b.doneAt); });

  var lines = [];
  lines.push(["Forge Academy — Year-End Progress Summary"].map(csvEscape).join(","));
  lines.push(["Student", kd.name].map(csvEscape).join(","));
  lines.push(["Generated", new Date().toLocaleString()].map(csvEscape).join(","));
  lines.push("");
  lines.push(["Georgia Home Study Law Compliance (O.C.G.A. § 20-2-690.1)"].map(csvEscape).join(","));
  lines.push(["Attendance Days Logged", (kd.attendanceCount||0)+" / "+GA_ANNUAL_DAYS_TARGET].map(csvEscape).join(","));
  lines.push("");

  /* A quest tagged with crossSubjects (e.g. the VM-install lessons — reading the docs, writing
     up the guide, computer-science concepts, and real OS history all at once) gets its full
     minutes credited to EVERY subject it counts toward, not split between them — that's genuine
     integrated instructional time, not double-booked time. The overall Total below still counts
     each quest's minutes once, so it isn't inflated by that per-subject crediting. */
  var bySubjHours = {}, standards = {}, totalMins = 0;
  done.forEach(function(a){
    var mins = estMinutesFor(a);
    totalMins += mins;
    subjectsFor(a).forEach(function(s){ bySubjHours[s] = (bySubjHours[s]||0) + mins; });
    if(a.standard) standards[a.standard] = true;
  });
  /* Morning Launch and Show & Teach are real daily reflection/self-direction practice but aren't
     tagged assignments, so without this they'd never show up in subject hours at all. Credited to
     ELA — Morning Launch now runs on the mood+goal tracker rather than free writing, but choosing
     both is still the same kind of daily reflection habit the credit was meant to recognize. */
  (state.journalEntries||[]).filter(function(j){ return j.kidId===kidId && j.launchMood && j.launchGoal; }).forEach(function(){
    totalMins += JOURNAL_EST_MINUTES;
    bySubjHours["ELA"] = (bySubjHours["ELA"]||0) + JOURNAL_EST_MINUTES;
  });
  (state.reflections||[]).filter(function(r){ return r.kidId===kidId; }).forEach(function(){
    totalMins += REFLECTION_EST_MINUTES;
    bySubjHours["ELA"] = (bySubjHours["ELA"]||0) + REFLECTION_EST_MINUTES;
  });
  lines.push(["Subject Hours Summary (estimated; a cross-tagged quest counts fully toward each subject; Morning Launch/Show & Teach credited to ELA)"].map(csvEscape).join(","));
  lines.push(["Subject","Estimated Hours"].map(csvEscape).join(","));
  Object.keys(bySubjHours).forEach(function(s){
    lines.push([s, (bySubjHours[s]/60).toFixed(1)].map(csvEscape).join(","));
  });
  lines.push(["Total (each quest counted once)", (totalMins/60).toFixed(1)].map(csvEscape).join(","));
  lines.push("");
  lines.push(["Standards Covered", Object.keys(standards).sort().join("; ")].map(csvEscape).join(","));
  lines.push("");

  lines.push(["Quest Log"].map(csvEscape).join(","));
  lines.push(["Date Completed","Subject","Standard","Title","XP Earned","Minutes","Minutes Source"].map(csvEscape).join(","));
  done.forEach(function(a){
    var when = new Date(a.doneAt);
    lines.push([
      when.toLocaleDateString(),
      a.subject||"",
      a.standard||"",
      a.title||"",
      a.xp||0,
      estMinutesFor(a),
      a.actualMinutes>0 ? "logged" : "estimated"
    ].map(csvEscape).join(","));
  });

  var csv = lines.join("\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = "AcademyLog_Progress_"+kd.name.replace(/[^a-z0-9]+/gi,"_")+"_"+todayISO()+".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast("📄 Progress report downloaded");
}

function renderQuestLogForKid(container, kidId){

  kidTitle.textContent = "📋 " + kidData(kidId).name + "'s Quest Log";
  container.appendChild(kidTitle);

  var all = assignmentsFor(kidId, null);
  var bySubj = {};
  all.forEach(function(a){
    subjectsFor(a).forEach(function(s){
      bySubj[s] = bySubj[s] || {done:0,total:0};
      bySubj[s].total++;
      if(a.done) bySubj[s].done++;
    });
  });
  var card = document.createElement("div");
  card.className = "card";
  var subjects = Object.keys(bySubj);
  if(!subjects.length){
    card.innerHTML = '<div class="empty">Add some quests to see subject progress.</div>';
  } else {
    subjects.forEach(function(s){
      var st = bySubj[s];
      var pct = Math.round(st.done/st.total*100);
      var key = SUBJECT_COLOR[s] || "gold";
      var color = pct>=80 ? "success" : pct>=40 ? key : "coral";

  container.appendChild(card);

  var wk = weekBoundsMonFri();

    if(!a.done || !a.doneAt) return;

        '</div>'+
        '<div class="task-xp">'+coveredCt+'/5</div>';

    });

        '<div style="display:flex;align-items:center;gap:4px;flex:none">'+
          '<input type="number" min="0" step="5" class="actual-min-input" style="width:56px;padding:5px 6px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-size:12.5px" placeholder="'+estMinutesFor(a)+'" value="'+(a.actualMinutes||"")+'">'+
          '<span class="muted" style="font-size:11px">min</span>'+
        '</div>';

        if(!db) return;
        var updates = {actualMinutes: v>0 ? v : null};
        if(state.assignments[a.id]) Object.assign(state.assignments[a.id], updates);
        db.doc("assignments/"+a.id).update(updates);

      });
      rcard.appendChild(row);
    });
  }
  container.appendChild(rcard);

  var gameTitle = document.createElement("div");

  gameTitle.textContent = "Arcade";
  els.view.appendChild(gameTitle);

  gameGrid.className = "subj-grid";

    b.onclick = function(){ startMiniGame(g.id); };
    gameGrid.appendChild(b);
  });
  els.view.appendChild(gameGrid);

  var qs = state.questions.filter(function(q){ return q.kidId===state.activeKid || q.kidId==="any"; });

  /* ---- Study Guides: grouped by studyGuide -> topic, replay-as-many-times mode ---- */
  var guides = {};
  qs.forEach(function(q){
    if(!q.studyGuide) return;
    guides[q.studyGuide] = guides[q.studyGuide] || {};
    var t = q.topic || "General";
    guides[q.studyGuide][t] = (guides[q.studyGuide][t]||0)+1;
  });
  var guideNames = Object.keys(guides);
  if(guideNames.length){
    var gTitle = document.createElement("div");
    gTitle.className = "section-title";
    gTitle.textContent = "Study Guides";
    els.view.appendChild(gTitle);
    guideNames.forEach(function(gname){
      var topics = guides[gname];
      var topicNames = Object.keys(topics);
      var total = topicNames.reduce(function(s,t){return s+topics[t];},0);
      var card = document.createElement("div");
      card.className = "card";
      card.style.marginBottom = "12px";
      var head = document.createElement("div");
      head.className = "task";
      head.style.cursor = "pointer";
      head.innerHTML =
        '<div class="task-body">'+
          '<div class="task-title">'+escapeHtml(gname)+'</div>'+
          '<div class="task-sub">'+total+' questions across '+topicNames.length+' topics &middot; play as many times as you want, then check it off on your paper study guide</div>'+
        '</div><div class="task-xp">▶</div>';
      head.onclick = function(){ startQuiz(null, gname); };
      card.appendChild(head);
      topicNames.forEach(function(t){
        var row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = '<div class="bar-lbl" style="width:auto;flex:1">'+escapeHtml(t)+'</div><div class="bar-pct mono">'+topics[t]+' q</div>';
        card.appendChild(row);
      });
      els.view.appendChild(card);
    });
  }

  var bySubject = {};
  qs.forEach(function(q){ bySubject[q.subject]=(bySubject[q.subject]||0)+1; });

  var title = document.createElement("div");
  title.className="section-title";
  title.textContent = "Pick a Subject";
  els.view.appendChild(title);

  var grid = document.createElement("div");
  grid.className = "subj-grid";
  var subjects = Object.keys(bySubject);
  if(!subjects.length){
    var e = document.createElement("div"); e.className="card empty"; e.textContent="No questions yet — add some below to build the question bank.";
    els.view.appendChild(e);
  } else {
    subjects.forEach(function(s){
      var b = document.createElement("button");
      b.className = "subj-btn";
      b.innerHTML = '<div class="n">'+bySubject[s]+' questions</div><div class="t">'+escapeHtml(s)+'</div>';
      b.onclick = function(){ startQuiz(s); };
      grid.appendChild(b);
    });
    els.view.appendChild(grid);
  }

  var title2 = document.createElement("div");
  title2.className = "section-title";
  title2.textContent = "Add a Question";
  els.view.appendChild(title2);
  els.view.appendChild(questionForm());
}

/* Troubleshooting helper: strips HTML from each VM_INSTALL_HELP step, tokenizes it and the kid's
   typed error text, and scores steps by shared keywords — a lightweight stand-in for a chatbot
   that doesn't need a live LLM call. Not "real" AI, just keyword matching against known fixes. */
var TROUBLESHOOT_STOPWORDS = {"the":1,"and":1,"for":1,"with":1,"this":1,"that":1,"your":1,"you":1,"from":1,"into":1,"than":1,"then":1,"have":1,"will":1,"most":1,"only":1,"same":1,"either":1,"instead":1,"here":1,"there":1,"about":1};
function stripHtml(s){ return s.replace(/<[^>]+>/g,""); }
function tokenize(s){
  return stripHtml(s).toLowerCase().match(/[a-z0-9]+/g)||[];
}
/* excludeIndices lets a follow-up ("still stuck") build on the last message instead of just
   handing back the same step again — a kid who already tried the top match needs the NEXT-best
   idea, not a dead end that repeats itself. */
function findTroubleshootMatches(vmHelp, query, excludeIndices){
  var qTokens = tokenize(query).filter(function(t){ return t.length>=4 && !TROUBLESHOOT_STOPWORDS[t]; });
  if(!qTokens.length) return [];
  var excluded = excludeIndices || [];
  var scored = vmHelp.steps.map(function(step, i){
    var stepTokens = tokenize(step);
    var score = qTokens.reduce(function(sum, t){ return sum + (stepTokens.indexOf(t)>=0 ? 1 : 0); }, 0);
    return {step:step, index:i, score:score};
  }).filter(function(m){ return m.score>0 && excluded.indexOf(m.index)<0; });
  scored.sort(function(a,b){ return b.score-a.score; });
  return scored.slice(0,3);
}

/* work blocks: an ordered list of {type:"text", text} / {type:"image", url} entries,
   letting a kid interleave typed notes and pictures like a simple word doc.
   Falls back to migrating the older single submission/screenshot fields on first open. */
function normalizeBlocks(a){
  if(Array.isArray(a.workBlocks) && a.workBlocks.length) return a.workBlocks.slice();
  var out = [];
  if(a.submission) out.push({type:"text", text:a.submission});
  if(a.screenshotUrl) out.push({type:"image", url:a.screenshotUrl});
  if(out.length===0) out.push({type:"text", text:""});
  return out;
}
function hasWork(a){
  return !!((a.workBlocks && a.workBlocks.some(function(b){ return (b.type==="text" && b.text) || (b.type==="image" && b.url) || (b.type==="audio" && b.url); })) || a.submission || a.screenshotUrl);
}

}

  /* A passage with line breaks (steps to actually DO, one per line) renders as a numbered list;
     a passage without any (a flowing story/explanation) renders as a plain paragraph — same field,
     the content itself decides which it needs. Either way the listen button reads the whole thing
     aloud, steps and all, in order. */
  var passageLines = a.passage ? a.passage.split("\n").filter(function(l){ return l.trim(); }) : [];

     "Here's the Idea / See It Done / Your Turn…" sections get their own headings instead of

  function checklistPassageHtml(text, tick){

    var labeled = lines.length>1 && lines.every(function(l){ return /^[^—]{3,40} — /.test(l); });
    lines.forEach(function(l){
      var m = l.match(/^([^—]{3,40}) — ([\s\S]*)$/);

        out += '<div style="font-weight:700;margin:10px 0 4px">'+escapeHtml(m[1])+'</div>';

      } else {
        out += row(l);
      }
    });
    return out;
  }
  var passageHtml = a.passage
    ? '<div style="margin-bottom:14px;padding:12px 14px;border-radius:10px;background:var(--paper);border:1px solid var(--border)">'+
        '<div style="font-weight:700;margin-bottom:6px">📖 Lesson '+speakerBtnHtml()+'</div>'+
        (passageLines.length>1 && (isAnnaMode || /^[^—]{3,40} — /.test(passageLines[0]))
          ? checklistPassageHtml(a.passage, isAnnaMode || retroLook)
          : passageLines.length>1 && retroLook

/* Leader view is PIN-gated: a kid tapping the Leader tab shouldn't land straight in review/edit
   controls. The PIN hash syncs via Supabase (al_settings, one row per household) so it works
   across devices; unlocked state itself is per-browser-tab (sessionStorage) so it doesn't persist
   forever, but also doesn't demand the PIN again on every render this session. */
function sha256Hex(str){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,"0"); }).join("");
  });
}
function setLeaderUnlocked(v){
  state.leaderUnlocked = v;
  try{ if(v) sessionStorage.setItem("al_leader_unlocked","1"); else sessionStorage.removeItem("al_leader_unlocked"); } catch(e){ /* private browsing — just won't persist across renders in this tab */ }
}
function saveLeaderPin(pin){
  return sha256Hex(pin).then(function(hash){
    state.leaderPinHash = hash;
    return sb.from("al_settings").upsert({household_id:HOUSEHOLD_ID, leader_pin_hash:hash}, {onConflict:"household_id"});
  });
}
function verifyLeaderPin(pin){
  return sha256Hex(pin).then(function(hash){ return hash===state.leaderPinHash; });
}

function renderLeaderPinGate(){
  var card = document.createElement("div");
  card.className = "card";
  card.style.cssText = "padding:24px 20px;max-width:340px;margin:20px auto";
  var isSettingUp = !state.leaderPinHash || state.changingPin;
  card.innerHTML =
    '<div style="text-align:center;font-size:32px;margin-bottom:8px">🔒</div>'+
    '<div style="text-align:center;font-weight:700;margin-bottom:4px">'+(isSettingUp ? "Set a Leader PIN" : "Enter Leader PIN")+'</div>'+
    '<div class="muted" style="text-align:center;font-size:12.5px;margin-bottom:16px">'+(isSettingUp ? "Keeps the Leader tools separate from the kids' screen — pick a 4+ digit PIN." : "This is the leader-only area.")+'</div>'+
    '<input type="password" inputmode="numeric" class="pin-input" placeholder="PIN" style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:4px;font-size:20px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--paper);color:var(--text);margin-bottom:10px">'+
    (isSettingUp ? '<input type="password" inputmode="numeric" class="pin-confirm" placeholder="Confirm PIN" style="width:100%;box-sizing:border-box;text-align:center;letter-spacing:4px;font-size:20px;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--paper);color:var(--text);margin-bottom:10px">' : '')+
    '<div class="pin-error" style="color:var(--coral);font-size:12.5px;text-align:center;min-height:1em;margin-bottom:8px"></div>'+
    '<button class="primary-btn pin-submit" style="width:100%">'+(isSettingUp ? "Set PIN" : "Unlock")+'</button>'+
    (state.changingPin ? '<button class="reward-skip pin-cancel" style="width:100%;opacity:1;margin-top:8px;color:var(--text-dim)">Cancel</button>' : '');
  var pinInput = card.querySelector(".pin-input");
  var cancelBtn = card.querySelector(".pin-cancel");
  if(cancelBtn) cancelBtn.onclick = function(){ state.changingPin = false; renderView(); };
  var errorEl = card.querySelector(".pin-error");
  function submit(){
    var pin = pinInput.value.trim();
    if(pin.length<4){ errorEl.textContent = "PIN needs to be at least 4 digits."; return; }
    if(isSettingUp){
      var confirmEl = card.querySelector(".pin-confirm");
      if(pin!==confirmEl.value.trim()){ errorEl.textContent = "PINs don't match."; return; }
      saveLeaderPin(pin).then(function(){ state.changingPin = false; setLeaderUnlocked(true); toast("🔒 Leader PIN set"); renderView(); });
    } else {
      verifyLeaderPin(pin).then(function(ok){
        if(ok){ setLeaderUnlocked(true); renderView(); }
        else { errorEl.textContent = "Wrong PIN — try again."; pinInput.value = ""; pinInput.focus(); }
      });
    }
  }
  card.querySelector(".pin-submit").onclick = submit;
  pinInput.addEventListener("keydown", function(e){ if(e.key==="Enter" && !isSettingUp) submit(); });
  els.view.appendChild(card);
}

/* Kid-facing "Completed" folder: finished work moves here instead of piling up on Today/Planner.
   Any leader note attached (whether from an approval or a flag) shows right on the card, and a
   fresh note is marked unread until the kid actually opens this folder — that's what drives the
   "X new" badge on the tab itself. */
function renderCompletedFolder(){
  els.view.innerHTML = "";
  var kidId = state.activeKid;

  var title = document.createElement("div");
  title.className = "section-title";
  title.textContent = "📁 Completed Work";
  els.view.appendChild(title);

  var intro = document.createElement("p");
  intro.className = "muted";
  intro.style.cssText = "font-size:13px;margin:2px 0 14px";
  intro.textContent = "Everything you've finished lives here. If your leader left you a note, it'll show right on the card.";
  els.view.appendChild(intro);

  var done = Object.keys(state.assignments).map(function(id){ return Object.assign({id:id}, state.assignments[id]); })
    .filter(function(a){ return a.kidId===kidId && a.done; })
    .sort(function(x,y){ return (y.doneAt||"").localeCompare(x.doneAt||""); });

  if(!done.length){
    var empty = document.createElement("div");
    empty.className = "muted";
    empty.style.cssText = "text-align:center;padding:30px 0";
    empty.textContent = "Nothing finished yet — get to work! 💪";
    els.view.appendChild(empty);
    return;
  }

  var anyUnreadCleared = false;
  done.forEach(function(a){
    var card = document.createElement("div");
    card.className = "qz-card";
    card.style.marginBottom = "12px";
    var hasNote = !!a.reviewNote;
    var isUnread = hasNote && a.noteUnread;
    var statusChip = a.reviewStatus==="approved"
      ? '<span class="chip" style="background:var(--success-soft);color:var(--success)">✅ approved</span>'
      : a.reviewStatus==="flagged"
        ? '<span class="chip" style="background:var(--coral-soft);color:var(--coral)">🚩 needs another look</span>'
        : '<span class="chip" style="background:var(--paper);color:var(--text-dim);border:1px solid var(--border)">done</span>';
    var noteHtml = "";
    if(hasNote){
      noteHtml = '<div style="margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--gold-soft);font-size:13.5px">'+
        (isUnread ? '<b>🔔 New note from your leader:</b> ' : '<b>Note from your leader:</b> ')+escapeHtml(a.reviewNote)+
      '</div>';
    }
    card.innerHTML =
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px">'+
        '<div>'+subjectChip(a.subject)+'</div>'+statusChip+
      '</div>'+
      '<p class="qz-q" style="font-size:15px;margin-bottom:0">'+escapeHtml(displayTitle(a))+'</p>'+
      noteHtml;
    els.view.appendChild(card);

    if(isUnread){
      anyUnreadCleared = true;
      if(state.assignments[a.id]) state.assignments[a.id].noteUnread = false;
      db.doc("assignments/"+a.id).update({noteUnread:false});
    }
  });
  if(anyUnreadCleared) updateCompletedTabBadge();
}

      kd.weekendExtrasOn = !on;
      state.kids[k.id] = kd;
      if(db) db.doc("kids/"+k.id).update({weekendExtrasOn: !on});
      renderView();
    };
    row.appendChild(label);
    row.appendChild(btn);
    card.appendChild(row);
  });
  return card;
}

/* Leader: fix or restore a streak. Shows what the app has, suggests what the real streak is from the
   days work was actually finished, and lets you set it by hand. Setting it also marks it as kept
   alive through the last school day, so the next lesson done continues it instead of restarting. */
function suggestedStreak(kidId){
  var days = {};
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId===kidId && a.done && a.doneAt) days[new Date(a.doneAt).toDateString()] = true;
  });
  var d = new Date(); d.setHours(0,0,0,0);
  if(d.getDay()===0 || d.getDay()===6) d = prevSchoolDay(new Date(d.getTime()+86400000));
  else if(!days[d.toDateString()]) d = prevSchoolDay(d);
  var n = 0;
  while(days[d.toDateString()]){ n++; d = prevSchoolDay(d); }
  return n;
}

function applyStreak(kidId, field, dateField, n){
  var kd = kidData(kidId), upd = {};
  upd[field] = n;
  if(n>0){
    var today = new Date(); today.setHours(0,0,0,0);
    var todayWeekday = today.getDay()!==0 && today.getDay()!==6;
    // Keep it alive: counted through the last school day, so the next lesson continues it.
    upd[dateField] = (todayWeekday ? prevSchoolDay(today) : prevSchoolDay(new Date(today.getTime()+86400000))).toDateString();
    if(dateField==="lastCompletedDate" && todayWeekday){
      var did = Object.keys(state.assignments).some(function(id){ var a = state.assignments[id]; return a.kidId===kidId && a.done && a.doneAt && new Date(a.doneAt).toDateString()===today.toDateString(); });
      if(did) upd[dateField] = today.toDateString();
    }
  } else upd[dateField] = null;
  Object.assign(kd, upd); state.kids[kidId] = kd;
  if(db) db.doc("kids/"+kidId).update(upd);
  toast((kd.name||kidId)+"'s streak is now "+n);
  renderView(); renderXpBar();
}

function importCurriculumSet(items, label){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidId = state.activeKid;
  var kidName = kidData(kidId).name;
  var itemTitles = items.map(function(i){ return i.title; });
  sb.from("al_assignments").select("title").eq("kid_id", kidId).then(function(res){
    var existingTitles = (res.data||[]).map(function(r){ return r.title; });
    var alreadyHave = itemTitles.filter(function(t){ return existingTitles.indexOf(t)!==-1; }).length;
    if(alreadyHave>0){
      var proceed = window.confirm(kidName+' already has '+alreadyHave+' of these '+items.length+' assignments (looks like "'+label+'" was already imported). Importing again will create duplicates — continue anyway?');
      if(!proceed) return;
    }
    var defaultStart = nextMondayISO();
    var startStr = window.prompt('Start "'+label+'" for '+kidName+' on which Monday? (YYYY-MM-DD)', defaultStart);
    if(!startStr) return;
    var startDate = new Date(startStr+"T00:00:00");
    if(isNaN(startDate.getTime())){ toast("Couldn't read that date — try YYYY-MM-DD"); return; }
    var ok = window.confirm('This adds '+items.length+' new assignments for '+kidName+', starting '+fmtDate(startStr)+'. Continue?');
    if(!ok) return;
    items.forEach(function(item){
      var week = Math.floor(item.d/5), weekday = item.d%5;
      var d = new Date(startDate);
      d.setDate(d.getDate() + week*7 + weekday);
      db.collection("assignments").add({
        kidId: kidId, date: isoDate(d), subject: item.subject, title: item.title,
        xp: item.xp, done:false, doneAt:null,
        materials: item.materials||null, video: item.video||null, standard: item.standard||null,
        createdAt: new Date().toISOString()
      });
    });
    toast("📦 "+label+" added to "+kidName+"'s Week!");
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}

function removeDuplicateAssignments(kidId){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  sb.from("al_assignments").select("id,date,title,created_at").eq("kid_id", kidId).then(function(res){
    var rows = res.data || [];
    var groups = {};
    rows.forEach(function(r){
      var key = r.date+"::"+r.title;
      (groups[key] = groups[key]||[]).push(r);
    });
    var toDelete = [];
    Object.keys(groups).forEach(function(key){
      var g = groups[key];
      if(g.length<2) return;
      g.sort(function(a,b){ return (a.created_at||"").localeCompare(b.created_at||""); });
      toDelete = toDelete.concat(g.slice(1)); // keep the earliest, delete the rest
    });
    if(!toDelete.length){ toast(kidName+" has no duplicate assignments — nothing to clean up!"); return; }
    var ok = window.confirm('Found '+toDelete.length+' duplicate assignment(s) for '+kidName+' (same date + title). Remove the extras and keep one of each? This can\'t be undone.');
    if(!ok) return;
    Promise.all(toDelete.map(function(r){ return sb.from("al_assignments").delete().eq("id", r.id); }))
      .then(function(){ toast("🧹 Removed "+toDelete.length+" duplicate(s) for "+kidName+"!"); syncSoon(); })
      .catch(function(err){ console.error(err); toast("⚠️ Cleanup failed — check your connection and try again"); });
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}

/* Catches a different shape of duplicate than removeDuplicateAssignments: the SAME lesson
   re-imported onto a LATER date (e.g. a curriculum re-sync leaving a stray extra copy of "Read
   the Windows 98 section..." a week after the original), rather than two copies on the same day.
   Only ever removes an incomplete duplicate and only when a genuinely earlier copy of the exact
   same title exists — never touches something the kid has already done. */
function removeDuplicateTitlesAcrossDates(kidId){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  var byTitle = {};
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId || !a.date || !a.title) return;
    (byTitle[a.title] = byTitle[a.title] || []).push(Object.assign({id:id}, a));
  });
  var toDelete = [];
  Object.keys(byTitle).forEach(function(title){
    var g = byTitle[title];
    if(g.length<2) return;
    g.sort(function(a,b){ return a.date.localeCompare(b.date); });
    // keep the earliest-dated copy; only remove later copies that are still incomplete
    g.slice(1).forEach(function(dup){ if(!dup.done) toDelete.push(dup); });
  });
  if(!toDelete.length){ toast(kidName+" has no same-title duplicates on different dates — nothing to clean up!"); return; }
  console.log(kidName+": found "+toDelete.length+" later duplicate(s) to remove (keeping the earliest-dated copy of each):");
  console.table(toDelete.map(function(a){ return {id:a.id, date:a.date, title:a.title}; }));
  var ok = window.confirm('Found '+toDelete.length+' lesson(s) for '+kidName+' that exist twice on different dates (keeping the earlier date, removing the later incomplete copy). Remove them? This can\'t be undone.');
  if(!ok) return;
  Promise.all(toDelete.map(function(a){ return sb.from("al_assignments").delete().eq("id", a.id); }))
    .then(function(){ toast("🧹 Removed "+toDelete.length+" stray duplicate(s) for "+kidName+"!"); syncSoon(); })
    .catch(function(err){ console.error(err); toast("⚠️ Cleanup failed — check your connection and try again"); });
}

function markLegacyOsInstallsComplete(kidId){
  if(!db){ console.log("Not connected yet — try again in a moment"); return; }
  var titleMatches = [
    "start installing Windows 98", "Finish the Windows 98 install",
    "start installing Windows XP", "Finish the XP install",
    "Make a bootable Windows 7 USB", "Boot a computer from your Windows 7 USB"
  ];

    var a = state.assignments[id];
    return a.kidId===kidId && !a.done && titleMatches.some(function(t){ return a.title.indexOf(t)>=0; });
  });
  if(!matched.length){ console.log("markLegacyOsInstallsComplete: no matching open assignments found for "+kidId); return; }
  var xpTotal = 0;
  var now = new Date().toISOString();
  matched.forEach(function(id){
    var a = state.assignments[id];
    a.done = true;
    a.doneAt = now;
    xpTotal += a.xp || 0;
    db.doc("assignments/"+id).update({done:true, doneAt:now});
  });
  if(state.kids[kidId]){
    state.kids[kidId].xp = (state.kids[kidId].xp||0) + xpTotal;
    db.doc("kids/"+kidId).update({xp: state.kids[kidId].xp});
  }
  console.log("markLegacyOsInstallsComplete: marked "+matched.length+" assignment(s) done, awarded "+xpTotal+" XP.");
  renderView();
}

function nextMondayISO(){
  var d = new Date();
  var day = d.getDay(); // 0=Sun..6=Sat
  var addDays = day===1 ? 7 : ((8-day)%7)||7; // next Monday, always in the future
  d.setDate(d.getDate()+addDays);
  return isoDate(d);
}

/* ---------- Legacy data reset: wipe everything except a named curriculum set, apply a new schedule ---------- */
var RYAN_WEEKLY_RHYTHM_BLOCKS = (function(){
  var DAILY = [
    {time:"9:00a", activity:"Morning Launch — pick today's project piece; journal entry: yesterday's progress + today's goal"},
    {time:"9:20a", activity:"Math in the Machine — byte/KB/MB/GB conversions, binary, RAM math, timeline math"},

    {time:"1:45p", activity:"Show & Teach — he teaches you or a sibling what he did today"}
  ];
  var blocks = [];
  DAYS.forEach(function(day){

function resetKidLegacyData(kidId, keepSet, keepLabel){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  var keepTitles = keepSet.map(function(i){ return i.title; });
  toast("Checking "+kidName+"'s data…");
  Promise.all([
    sb.from("al_assignments").select("id,title").eq("kid_id", kidId),
    sb.from("al_questions").select("id").eq("kid_id", kidId)
  ]).then(function(results){
    var assignRows = results[0].data || [];
    var qRows = results[1].data || [];
    var toDelete = assignRows.filter(function(r){ return keepTitles.indexOf(r.title)===-1; });
    var msg = 'This will permanently remove '+toDelete.length+' old assignment(s) and '+qRows.length+' study-guide question(s) for '+kidName+
      ' (everything except "'+keepLabel+'"), and replace '+kidName+"'s weekly schedule. This can't be undone. Continue?";
    if(!window.confirm(msg)) return;
    var deletes = toDelete.map(function(r){ return sb.from("al_assignments").delete().eq("id", r.id); })
      .concat(qRows.map(function(r){ return sb.from("al_questions").delete().eq("id", r.id); }));
    Promise.all(deletes).then(function(){
      // Avoid upsert()'s onConflict, which needs a DB-level unique constraint on kid_id
      // that this table may not actually have — check for an existing row instead.
      return sb.from("al_schedule").select("kid_id").eq("kid_id", kidId);
    }).then(function(selRes){
      if(selRes.error) throw selRes.error;
      var exists = selRes.data && selRes.data.length>0;
      if(exists){
        return sb.from("al_schedule").update({ blocks: RYAN_WEEKLY_RHYTHM_BLOCKS }).eq("kid_id", kidId);
      }
      return sb.from("al_schedule").insert({ kid_id: kidId, household_id: HOUSEHOLD_ID, blocks: RYAN_WEEKLY_RHYTHM_BLOCKS });
    }).then(function(res){
      if(res && res.error){ console.error("Academy Log reset error:", res.error); toast("⚠️ Reset partly failed — check your connection and try again"); }
      else toast("🧹 "+kidName+"'s old data cleared — fresh schedule applied!");
      syncSoon();
    }).catch(function(err){ console.error(err); toast("⚠️ Reset failed — check your connection and try again"); });
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}

  {d:6, subject:"Science", passage:"Gather first — A strip of tissue or light paper, tape, a ruler, a fan (a desk fan or a computer fan), and an adult nearby for safety. Keep fingers away from the blades.\nYour Turn — 1. Tape the tissue strip to a stick or the edge of a table. 2. Hold it at three distances from the running fan and measure with the ruler how high it lifts each time. 3. Write the three measurements. 4. Notice which fan settings and distances move the air most. 5. Find two simple machines in a computer or gadget (a screw is an inclined plane wrapped around a rod; a button can be a lever).\nCheck Yourself — Can you say how moving air helps keep a computer cool?", title:"Late-90s PCs added bigger cooling fans. Read about how fans move air (forces & motion).", xp:10, standard:"S4P3", materials:"https://kids.britannica.com/students/article/fan/274175", video:"https://www.youtube.com/watch?v=5F76jSb2Byg"},
