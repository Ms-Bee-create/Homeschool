/* ---------- Weekly Thought Experiments for Ryan ----------
   Philosophy for Children (P4C) — structured discussion of open questions, not graded, no right
   answer — has real research behind it for critical thinking gains in this age range. One a week,
   tagged "Live Lesson" so it lands in his Main Project block. Several tie directly into his own
   interests: the Ring of Gyges (would you still follow rules if you could never get caught?) lines
   up almost exactly with the Cyber Lab safety framing already in his curriculum doc. No fabricated
   sources — these are the standard, long-established thought experiments, adapted in plain language. */
var RYAN_THOUGHT_EXPERIMENTS = [
  {d:0, title:"Thought Experiment: Minecraft Beat Itself (No Player Required)",
    materials:"https://www.pcgamer.com/games/survival-crafting/minecraft-beat-minecraft-after-2-billion-years/",
    passage:"A YouTuber named RedLogic ran a simulation of a Minecraft world with zero players in it, fast-forwarded through 2 billion simulated years of random mob behavior.\nHere's the chain reaction that happened purely by chance: an Enderman randomly picked up a carved pumpkin and placed it on snow, which accidentally built a snow golem. Snow golems throw snowballs at creepers, which made the creepers explode. Over billions of years, enough creeper explosions randomly chipped away at the Ender Dragon's health until, eventually, it died — and the game \"rolled credits\" with nobody playing at all.\nIf something wins a game by pure random chance, with zero intention behind it, did it actually \"win\"? What's the difference between winning and just being the result of enough random tries over enough time?\nThis is the same idea as the \"infinite monkey theorem\" — given enough time, random chance can eventually produce something that looks exactly like it was done on purpose. Can you think of anything in real life (science, evolution, even your own Minecraft builds) where something useful happened by accident rather than by plan?"},
  {d:5, title:"Thought Experiment: The Switch Problem",
    passage:"A runaway cart is about to hit 5 people tied to the tracks. You're standing next to a switch — pull it, and the cart goes to a side track instead, where it will hit 1 person.\nDo you pull the switch? Why or why not?\nIs there a difference between pulling the switch (causing 1 death to prevent 5) and doing nothing (letting 5 die but not directly causing anyone's death)? Talk it through — there's no right answer, just a good argument."},
  {d:10, title:"Thought Experiment: The Ship of Theseus",
    passage:"A ship gets repaired over many years — every single plank eventually gets replaced, one at a time, until none of the original wood is left.\nIs it still the same ship? If not, at what exact point did it stop being the same ship?\nNow think about your own body — nearly all your cells get replaced over your lifetime. Are you still \"you\"? What actually makes something the same thing over time?"},
  {d:15, title:"Thought Experiment: The Ring of Gyges",
    passage:"Imagine you found a ring that made you completely invisible whenever you wanted — no one could ever see you or catch you doing anything.\nWould you still follow the rules? Why or why not?\nThis is basically the real question behind cybersecurity ethics — a hacker with skill can often act without getting caught. What's the difference between someone who could break the rules and doesn't, and someone who just never had the chance to?"},
  {d:20, title:"Thought Experiment: The Teleporter Problem",
    passage:"Imagine a teleporter that scans every atom in your body, builds an exact perfect copy somewhere else, and destroys the original.\nIs the person who steps out the same person who stepped in, or a brand-new person who just thinks they're you?\nWhat if the machine had a glitch and didn't destroy the original — now there are two of you. Which one is the \"real\" you?"},
  {d:25, title:"Thought Experiment: The Sorites Paradox (the Heap)",
    passage:"A pile of 10,000 grains of sand is definitely a \"heap.\" If you remove just one grain, it's still a heap. Keep removing grains one at a time — at what exact number does it stop being a heap?\nThere's no obvious answer. What does that tell you about words like \"heap,\" \"tall,\" or \"old\" — do they have exact definitions, or fuzzy ones? Can you think of another word like that?"},

var syncTimer = null;
function syncSoon(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 250); }

/* Sync: polls Supabase, but only does real work when something changed.
   - A failed query used to come back as empty data and wipe the screen; now any error skips the update.
   - Drawings/photos live in work_blocks, the heaviest column. Routine polls leave it out and reuse the
     copy already loaded, re-fetching only the rows whose submitted_at changed. A full load runs on
     start and every 5 minutes.
   - Nothing is replaced or re-rendered when the data is identical to last time, which also stops a
     poll from overwriting an optimistic local change that is still being saved.
   - Hidden tabs don't poll; coming back to the tab syncs immediately. */
var syncState = {running:false, again:false, lastFull:0, lightCols:null, sig:""};
var lastTouchAt = Date.now();
function syncAll(force){
  if(!HOUSEHOLD_ID) return;
  if(syncState.running){ syncState.again = true; return; }
  syncState.running = true;
  var needFull = force===true || !syncState.lightCols || (Date.now()-syncState.lastFull > 900000);
  var assignQ = sb.from("al_assignments").select(needFull ? "*" : syncState.lightCols).eq("household_id", HOUSEHOLD_ID);
  Promise.all([
    sb.from("al_kids").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_schedule").select("*").eq("household_id", HOUSEHOLD_ID),
    assignQ,
    sb.from("al_questions").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_journal").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_reflections").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_settings").select("*").eq("household_id", HOUSEHOLD_ID)
  ]).then(function(results){
    for(var ri=0; ri<results.length; ri++){
      if(results[ri].error){
        if(!needFull) syncState.lightCols = null; // fall back to a full load next time
        return;
      }
    }
    var kidsRows = results[0].data || [], schedRows = results[1].data || [], assignRows = results[2].data || [], qRows = results[3].data || [];
    var journalRows = results[4].data || [], reflectionRows = results[5].data || [];
    var settingsRow = (results[6].data || [])[0];

    var needWork = [];
    if(needFull){
      syncState.lastFull = Date.now();
      if(assignRows.length) syncState.lightCols = Object.keys(assignRows[0]).filter(function(k){ return k!=="work_blocks"; }).join(",");
    } else {
      assignRows.forEach(function(r){
        var prev = state.assignments[r.id];
        if(prev && prev.workBlocks!==undefined && (r.submitted_at||null)===(prev.submittedAt||null)) r.work_blocks = prev.workBlocks;
        else if(r.submitted_at) needWork.push(r.id);
      });
    }

    var sigData = JSON.stringify([kidsRows, schedRows,
      assignRows.map(function(r){ var c = Object.assign({}, r); delete c.work_blocks; return c; }),
      qRows, journalRows, reflectionRows, settingsRow ? settingsRow.leader_pin_hash : null]);
    var changed = sigData!==syncState.sig;
    syncState.sig = sigData;

    if(changed){
      state.leaderPinHash = settingsRow ? settingsRow.leader_pin_hash || null : null;
      state.kids = {};
      kidsRows.forEach(function(r){ state.kids[r.id] = fromRow("kids", r); });
      state.schedules = {};
      schedRows.forEach(function(r){ state.schedules[r.kid_id] = { blocks: r.blocks || [] }; });
      state.assignments = {};
      assignRows.forEach(function(r){ state.assignments[r.id] = fromRow("assignments", r); });
      state.questions = qRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("questions", r)); });
      state.journalEntries = journalRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("journal", r)); });
      state.reflections = reflectionRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("reflections", r)); });
    }
    KIDS.forEach(function(k){ if(state.kids[k.id]) stampAttendance(k.id); });
    if(!changed) return;
    updateLibraryTabVisibility();
    if(!state.migrationsRan){ state.migrationsRan = true; runAutoMigrations(); }
    renderKidbar(); renderXpBar();
    if(whoGateEl.style.display!=="none") renderWhoGate();
    /* Never re-render out from under someone mid-keystroke — the poll still refreshes the
       underlying data, it just holds off replacing the DOM (and wiping unsaved text) until the
       field loses focus. Same root cause as the earlier lesson-detail work-box fix, generalized
       so it covers Morning Launch/Show & Teach and anything typed anywhere, not just that one page.
       Also holds off while a file input's native picker might still be open (state.fileInputActive)
       — see the window "focus" listener below for why. */
    if(!state.quiz && !state.miniGame && state.lessonDetailId==null && !isTypingInFormField() && !state.fileInputActive) renderView();

    if(needWork.length){
      sb.from("al_assignments").select("id,work_blocks").in("id", needWork).then(function(res){
        if(res.error || !res.data) return;
        res.data.forEach(function(r){ if(state.assignments[r.id]) state.assignments[r.id].workBlocks = r.work_blocks; });
        if(!state.quiz && !state.miniGame && state.lessonDetailId==null && !isTypingInFormField() && !state.fileInputActive) renderView();
      });
    }
  }).catch(function(){
    if(!needFull) syncState.lightCols = null;
  }).then(function(){
    syncState.running = false;
    if(syncState.again){ syncState.again = false; syncSoon(); }
  });
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) syncAll(); });
function isTypingInFormField(){
  var el = document.activeElement;
  if(!el) return false;
  var tag = el.tagName;
  return tag==="TEXTAREA" || (tag==="INPUT" && el.type!=="checkbox" && el.type!=="radio" && el.type!=="file");
}

/* A tapped file input opens the native OS picker, which can stay open for a while (browsing a
   video library takes a lot longer than snapping a photo) — long enough for the background sync
   to fire mid-browse, rebuild the DOM underneath it, and swap in a fresh upload button the user
   never actually sees. Their file then lands on the old, orphaned button instead of the one on
   screen, and it looks like nothing happened. Suspending the sync's re-render for the whole time a
   file input is "active" (tap until the browser window regains focus, since opening/closing any
   native picker blurs/refocuses the tab) closes that gap the same way the typing guard already
   does for text fields. */
state.fileInputActive = false;
document.addEventListener("click", function(e){
  if(e.target && e.target.tagName==="INPUT" && e.target.type==="file") state.fileInputActive = true;
}, true);
window.addEventListener("focus", function(){
  if(!state.fileInputActive) return;
  state.fileInputActive = false;
  /* Give the input's own change handler a moment to run first (it fires around the same time as
     this focus event, order isn't guaranteed across browsers) before catching up on any render
     the sync held back while the picker was open. */
  setTimeout(function(){
    if(!state.quiz && !state.miniGame && state.lessonDetailId==null && !isTypingInFormField()) renderView();
  }, 300);
});

/* ---------- Momma Money deposit (works now — this is a real webpage, not sandboxed) ---------- */
function mmDepositLevelUp(kidId, lvl){
  var memberId = MM_MEMBERS[kidId];
  if(!memberId) return Promise.resolve(false);
  return sb.from("transactions").insert({
    household_id: HOUSEHOLD_ID, member_id: memberId, type: "earn", amount: lvl.bonus,
    description: "Academy Log — Level " + lvl.newLevel + " bonus", status: "approved"
  }).then(function(r){
    if(r.error) throw r.error;
    return true;
  });
}
// Hook the deposit into the existing level-up flow (defined earlier in this file)
logLevelUpReward = function(kidId, lvl){
  if(db) db.collection("rewards").add({ kidId: kidId, type:"level-up", level: lvl.newLevel, amount: lvl.bonus, at: new Date().toISOString() });
  mmDepositLevelUp(kidId, lvl).then(function(deposited){
    if(deposited){
      db.doc("kids/"+kidId).update({ mommaMoney: 0 });
      if(kidId===state.activeKid) toast("$"+lvl.bonus+" deposited to Momma Money! 💰");
    }
    showLevelUpBanner(kidId, lvl);
  }).catch(function(){ showLevelUpBanner(kidId, lvl); });
};

/* ---------- Who's using this? gate ----------
   Shown on every fresh app open (never remembered/skipped) so switching devices, closing the tab,
   or just picking the app back up never leaves it silently sitting on whoever used it last —
   that's exactly how an answer ended up submitted under the wrong kid's name. A full-screen
   overlay blocks all interaction with the dashboard underneath until a profile is tapped. */
var whoGateEl = document.getElementById("whoGate");
function renderWhoGate(){
  var optsEl = document.getElementById("whoGateOptions");
  optsEl.innerHTML = "";
  KIDS.forEach(function(k){
    var kd = kidData(k.id);
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "who-gate-opt";
    btn.style.setProperty("--kc", "var(--"+kd.color+")");
    btn.style.setProperty("--kc-soft", "var(--"+kd.color+"-soft)");
    var av = avatarFor(k.id);
    var avatarHtmlStr = av
      ? '<img class="who-gate-opt-avatar" src="'+escapeHtml(av.file)+'" alt="">'
      : '<div class="who-gate-opt-avatar-fallback">'+(kd.name||"?").trim().slice(0,1).toUpperCase()+'</div>';
    btn.innerHTML = avatarHtmlStr + '<div class="who-gate-opt-name">'+escapeHtml(kd.name)+'</div>';
    btn.onclick = function(){
      state.activeKid = k.id;
      state.profileMenuOpen = false; state.tab = "home";
      whoGateEl.style.display = "none";
      renderAll();
    };
    optsEl.appendChild(btn);
  });
  var lb = document.createElement("button");
  lb.type = "button"; lb.className = "who-gate-opt";
  lb.style.setProperty("--kc", "var(--ink)"); lb.style.setProperty("--kc-soft", "var(--gold-soft)");
  lb.innerHTML = '<div class="who-gate-opt-avatar-fallback">\uD83D\uDD11</div><div class="who-gate-opt-name">Leader</div>';
  lb.onclick = function(){
    state.leaderMode = true; state.profileMenuOpen = false;
    whoGateEl.style.display = "none";
    renderAll();
  };
  optsEl.appendChild(lb);
}
function showWhoGate(){
  renderWhoGate();
  whoGateEl.style.display = "flex";
}

/* ---------- login gate ---------- */
var loginEl = document.getElementById("loginGate");
var appEl = document.getElementById("appRoot");
function showApp(){
  loginEl.style.display = "none";
  appEl.style.display = "";
  updateLibraryTabVisibility();
  renderKidbar(); renderXpBar(); renderView();
  showWhoGate();
  syncAll();
  /* Background sync is the biggest thing talking to Supabase (7 tables per device per tick), so it
     runs every 30 seconds instead of 8, and pauses entirely while nobody has touched this screen
     for 3 minutes (a tablet left open overnight), catching up the moment someone does. */
  setInterval(function(){ if(!document.hidden && Date.now()-lastTouchAt < 180000) syncAll(); }, 30000);
  ["pointerdown","keydown","touchstart"].forEach(function(evt){
    document.addEventListener(evt, function(){
      var wasIdle = Date.now()-lastTouchAt >= 180000;
      lastTouchAt = Date.now();
      if(wasIdle && !document.hidden) syncAll();
    }, {passive:true});
  });
}
function tryRestoreSession(){
  sb.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(session){ HOUSEHOLD_ID = session.user.id; showApp(); }
  });
}
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var email = document.getElementById("loginEmail").value.trim();
  var pass = document.getElementById("loginPass").value;
  var errEl = document.getElementById("loginError");
  var btn = document.getElementById("loginBtn");
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "Connecting…";
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
    btn.disabled = false; btn.textContent = "Log In";
    if(res.error){ errEl.textContent = res.error.message; return; }
    HOUSEHOLD_ID = res.data.session.user.id;
    showApp();
  });
});
tryRestoreSession();

})();
</script>
