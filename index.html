  {"subject": "Science", "skillId": "anna-sci-life-cycles", "standard": "S2L1", "rev": 1, "dayOffset": 13, "stage": "mixed", "xp": 15, "title": "Science: Mixed Review — Life Cycles & Habitats", "quiz": [{"q": "Which comes first in a butterfly's life cycle?", "choices": ["Egg", "Chrysalis", "Caterpillar", "Adult"], "answerIndex": 0, "explain": "Egg is always first — egg → caterpillar → chrysalis → butterfly, in that order."}, {"type": "order", "q": "Put the ladybug's life cycle in order.", "items": ["Egg", "Larva", "Pupa", "Adult"], "explain": "A ladybug goes egg, larva, pupa, adult."}, {"q": "Why can't a caterpillar just stay a caterpillar forever?", "choices": ["It has to grow and change to become an adult that can reproduce", "Caterpillars get bored", "It's against the rules", "Caterpillars don't like leaves"], "answerIndex": 0, "explain": "Every stage of a life cycle exists so the animal can eventually grow into an adult and have offspring of its own."}, {"type": "match", "q": "Match each need to the stage that has it.", "pairs": [["Eats leaves", "Caterpillar"], ["Drinks nectar", "Butterfly"], ["Needs a safe, still spot", "Chrysalis"]], "explain": "Each stage has its own needs, so the habitat has to change too."}]},
  {"subject": "Science", "skillId": "anna-sci-life-cycles", "standard": "S2L1", "rev": 1, "dayOffset": 17, "stage": "apply", "xp": 15, "title": "Science: Final Bug Journal Entry", "passage": "Gather first — Your bug drawings and pictures from this month.\nYour Turn — 1. Look back through everything you made about your bug. 2. Take one last picture of your bug or its habitat with Show it. 3. Use Tell it to answer: has it moved to a new life stage since you started watching? What's the most surprising thing you learned?\nCheck Yourself — Did you say at least one new thing you didn't know in the beginning?"},
  {"subject": "Science", "skillId": "anna-sci-life-cycles", "standard": "S2L1", "rev": 1, "dayOffset": 21, "stage": "apply", "xp": 10, "title": "Science: October Wrap-Up — Habitat Show & Tell", "passage": "Gather first — Your Life Cycle Cards, your bug pictures and drawings, and a grown-up to be your audience.\nYour Turn — 1. Lay your Life Cycle Cards out in a circle, in order. 2. Give a grown-up a 1-minute tour: point to each stage, say what it needs and where it lives. 3. Record your tour with Tell it.\nCheck Yourself — Did your tour include every stage and what it needs? Next month you'll see how weather and seasons change habitats as it gets colder."},

  // --- Social Studies: Creek & Cherokee Nations (SS2H2) — hands-on rewrite (rev:1): map marking, town drawing, Three Sisters model, click-only checks ---
  {"subject": "Social Studies", "skillId": "anna-ss-creek-cherokee", "standard": "SS2H2", "rev": 1, "dayOffset": 0, "stage": "teach", "xp": 10, "title": "Social Studies: Creek & Cherokee Nations — Here's the Idea", "materials": "https://www.georgiaencyclopedia.org/articles/history-archaeology/cherokee-indians/", "passage": "Gather first — A map of Georgia (ask a grown-up to print one, or use an atlas page), two different colored crayons or stickers, and paper.\nHere's the Idea — Before Georgia was even called Georgia, two groups of people already lived here: the Creek and the Cherokee.\nSee It Done — The Cherokee lived up in the north Georgia mountains. The Creek lived along the rivers in the middle and south. Both grew corn, beans, and squash together, called the Three Sisters, because the three plants help each other grow.\nYour Turn — 1. Find the north Georgia mountains on your map and mark them with one color for the Cherokee. 2. Find the rivers in the middle and south and mark them with the other color for the Creek. 3. Take a picture of your map with Show it. 4. Tell it: where did each nation live, and what did both grow? You can read the Cherokee article above with a grown-up for more.\nCheck Yourself — Can you point to where each nation lived without looking at your notes? Your quiz is also waiting in the Academy Log Arena: Georgia's First People & Founders."},
  {"subject": "Related Arts", "skillId": "anna-ss-creek-cherokee", "standard": "SS2H2", "rev": 1, "crossSubjects": ["Social Studies"], "dayOffset": 5, "stage": "apply", "xp": 15, "title": "Design Studio: Show What You Know — Creek & Cherokee", "passage": "Gather first — A big piece of paper, pencil, crayons or markers, and your Georgia map. Ask a grown-up to read the Cherokee article above with you.\nHere's the Idea — The land where people live changes how they build their towns. This week you will build two towns, so today you plan them.\nYour Turn — 1. Fold your paper in half. 2. On one side draw a Creek river-town, on the other a Cherokee mountain-town. 3. In each town, draw or label at least one home, one food they grew (corn, beans, or squash), and one thing that makes that nation special. 4. Take a picture with Show it and Tell it how the two towns are different.\nCheck Yourself — Could someone tell which town is Creek and which is Cherokee just by looking, without you explaining?", "materials": "https://www.georgiaencyclopedia.org/articles/history-archaeology/cherokee-indians/"},
  {"subject": "Social Studies", "skillId": "anna-ss-creek-cherokee", "standard": "SS2H2", "rev": 1, "dayOffset": 5, "stage": "practice", "xp": 15, "title": "Social Studies: Practice — Creek & Cherokee Details", "passage": "Gather first — Your map from the first lesson.\nYour Turn — 1. Look at your map. 2. Do the Quick Check below. Click to match and sort, no typing needed.\nCheck Yourself — If you miss one, find the answer on your map and try again later.", "quiz": [{"type": "sort", "q": "Sort each fact: Cherokee, Creek, or Both.", "categories": ["Cherokee", "Creek", "Both"], "items": [{"t": "Lived in the north Georgia mountains", "c": 0}, {"t": "Built towns along rivers in middle and south Georgia", "c": 1}, {"t": "Grew corn, beans, and squash together", "c": 2}], "explain": "The Cherokee lived in the mountains, the Creek along rivers, and both grew the Three Sisters."}, {"type": "match", "q": "Match each of the Three Sisters to its job.", "pairs": [["Corn", "Gives beans something to climb"], ["Beans", "Add food back to the soil"], ["Squash", "Big leaves shade out weeds"]], "explain": "The three plants help each other grow, which is why they are called sisters."}, {"q": "What were the 'Three Sisters' the Creek and Cherokee grew together?", "choices": ["Corn, beans, and squash", "Apples, oranges, and pears", "Wheat, rice, and oats", "Cotton, tobacco, and rice"], "answerIndex": 0, "explain": "Corn, beans, and squash were grown together because each plant helps the other two grow."}]},
  {"subject": "Social Studies", "skillId": "anna-ss-creek-cherokee", "standard": "SS2H2", "rev": 1, "dayOffset": 9, "stage": "apply", "xp": 15, "title": "Social Studies: Field Report — Corn, Beans & Squash", "passage": "Gather first — A drinking straw or stick (the corn), a pipe cleaner or string (the bean vine), a big paper leaf (the squash), a cup or ball of clay to stand it in, and a camera.\nHere's the Idea — Corn, beans, and squash grew in the same garden because each one helps the others.\nYour Turn — 1. Stand the straw up in clay. That is your corn. 2. Wind the pipe cleaner up the straw. That is your bean vine climbing the corn. 3. Lay the big paper leaf on the ground around the bottom. That is your squash shading out weeds. 4. If you can, plant real seeds in a pot too. 5. Take a picture with Show it and Tell it how each plant helps the other two.\nCheck Yourself — Can you explain why growing all three together works better than growing just one?"},
  {"subject": "Social Studies", "skillId": "anna-ss-creek-cherokee", "standard": "SS2H2", "rev": 1, "dayOffset": 13, "stage": "mixed", "xp": 15, "title": "Social Studies Capstone — Then vs. Now", "passage": "Gather first — Two circles of yarn or string (or two circles drawn on paper) that overlap in the middle, and a few small objects or drawings.\nYour Turn — 1. Pick one thing the Creek or Cherokee did, like growing their own food, building homes, or making tools. 2. Label one circle Then and the other Now. 3. Put or draw things in each circle, and put what is the same where the circles overlap. 4. Take a picture with Show it and Tell it one way it is the same and one way it is different.\nCheck Yourself — Did you find at least one thing that stayed the same?"},

  // --- ELA: Story Elements & Central Message (ELAGSE2RL2-RL5) — hands-on rewrite (rev:1): story cards, acting out, click-only checks ---
  {"subject": "ELA", "skillId": "anna-ela-story-elements", "standard": "ELAGSE2RL2-RL5", "rev": 1, "dayOffset": 0, "stage": "teach", "xp": 10, "title": "ELA: Story Elements & Central Message", "materials": "https://storylineonline.net/books/clark-the-shark/", "passage": "Gather first — The chapter book you read last night, 3 paper cards or sticky notes, a pencil, and a stuffed animal or two.\nHere's the Idea — Every story has a main character who wants something, a problem that gets in the way, and a message underneath it all (the lesson the story is really about).\nSee It Done — In The Three Little Pigs: the characters are the pigs, the problem is a wolf who wants to blow their houses down, and the message is that working hard and building carefully keeps you safe.\nYour Turn — 1. Label your 3 cards: Character, Problem, Message. 2. Think about last night's chapter and draw a picture on each card. 3. Use your cards and a stuffed animal to retell the chapter, touching each card as you go. 4. Take a picture of your cards with Show it. Or click the link above to watch Clark the Shark and make cards for that story instead.\nCheck Yourself — Did your retelling include the character, the problem, AND the message, not just what happened?"},
  {"subject": "ELA", "skillId": "anna-ela-story-elements", "standard": "ELAGSE2RL2-RL5", "rev": 1, "dayOffset": 1, "stage": "practice", "xp": 15, "title": "ELA: Practice — Story Elements", "passage": "Gather first — Your 3 story cards from yesterday.\nYour Turn — 1. Look at your cards. 2. Do the Quick Check below. Click to match and sort, no typing needed.\nCheck Yourself — If you miss one, read the hint and try the same idea on your cards.", "quiz": [{"type": "match", "q": "Match each story part to what it means.", "pairs": [["Character", "Who the story is about"], ["Problem", "What gets in the way"], ["Message", "The lesson underneath"]], "explain": "A story has a character who wants something, a problem in the way, and a message about the lesson."}, {"type": "sort", "q": "Sort each part of The Three Little Pigs.", "categories": ["Character", "Problem", "Message"], "items": [{"t": "The three little pigs", "c": 0}, {"t": "A wolf wants to blow their houses down", "c": 1}, {"t": "Working hard and building carefully keeps you safe", "c": 2}, {"t": "The hungry wolf", "c": 0}], "explain": "Characters are who is in the story, the problem is what goes wrong, and the message is the lesson."}, {"q": "What is the 'central message' of a story?", "choices": ["How many pages it has", "The lesson or idea underneath the events", "The illustrator's name", "The chapter number"], "answerIndex": 1, "explain": "The central message is the deeper idea the story is really about, underneath what literally happens."}]},
  {"subject": "ELA", "skillId": "anna-ela-story-elements", "standard": "ELAGSE2RL2-RL5", "rev": 1, "dayOffset": 5, "stage": "practice", "xp": 15, "title": "ELA: Practice — A New Chapter", "passage": "Gather first — Tonight's new chapter and your 3 story cards (or new blank ones).\nYour Turn — 1. Read tonight's chapter. 2. Fill in a fresh set of Character, Problem, and Message cards. 3. Does the problem from before get solved, or is it still going? Tell it out loud.\nCheck Yourself — Could someone who hasn't read the chapter understand the story from your cards?", "quiz": [{"type": "order", "q": "Put these events from The Three Little Pigs in order.", "items": ["The pigs build three houses", "The wolf blows down the straw house", "The wolf blows down the stick house", "The wolf can't knock down the brick house"], "explain": "The wolf wins against the weaker houses first, and the brick house finally stops him."}, {"q": "If a character's problem gets solved by the end of a story, what usually comes right after?", "choices": ["A resolution or happy ending", "The story starts over", "Nothing changes", "A new character is born"], "answerIndex": 0, "explain": "Once the main problem is solved, the story wraps up. That wrap-up part is called the resolution."}]},
  {"subject": "ELA", "skillId": "anna-ela-story-elements", "standard": "ELAGSE2RL2-RL5", "rev": 1, "dayOffset": 9, "stage": "apply", "xp": 15, "title": "ELA: Show What You Know — Story Map", "materials": "https://storylineonline.net/books/clark-the-shark/", "passage": "Gather first — A sheet of paper, a pencil, and crayons.\nYour Turn — 1. Fold your paper into 4 boxes and label them Character, Setting, Problem, and Message. 2. Fill in all four boxes for your favorite book or chapter by drawing, with a few words if you like. 3. Take a picture of your story map with Show it. 4. Use Tell it to explain your map to someone who hasn't read the story.\nCheck Yourself — Could someone else understand the whole story from your map?"},
  {"subject": "ELA", "skillId": "anna-ela-story-elements", "standard": "ELAGSE2RL2-RL5", "rev": 1, "dayOffset": 13, "stage": "mixed", "xp": 15, "title": "ELA Capstone — Retell Your Favorite Story", "passage": "Gather first — Stuffed animals or toys to be your actors, and a grown-up for an audience.\nYour Turn — 1. Pick your favorite story from this month. 2. Put on a tiny show with your stuffed animals that retells the whole story. 3. Make sure your show has the character, the problem, and the message. 4. Record it with Tell it, or take a picture of your show with Show it.\nCheck Yourself — Did your show skip straight to what happened, or did it include the message?"},

  // --- Design Studio: standalone creative rotation — her Daily Rhythm has Design Studio/Art as
  // its own dedicated block, not something that only shows up when another subject's apply day
  // happens to be visual. These fill the gap days so Creative Studio isn't empty. ---
  // --- Design Studio, Week 1 project: Bug Hotel (ties to life cycles; VA2.CR.2) — builds Mon-Thu, opens Friday ---
  {"subject": "Related Arts", "crossSubjects": ["Science"], "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "dayOffset": 0, "title": "Design Studio: Bug Hotel, Day 1 — Plan Your Hotel", "passage": "Gather first — Paper, pencil, a ruler or tape measure, an empty shoebox or cardboard box from the recycling, and your craft box.\nHere's the Idea — This week you are an architect! You will build a Bug Hotel with one room for each stage of a butterfly's life: egg, caterpillar, chrysalis, and butterfly. Today you plan it. Builders always plan first.\nSee It Done — A plan is a quick drawing that says what goes where. Here is one: Room 1 (egg) is small and hidden under a leaf. Room 2 (caterpillar) has lots of leaves to eat. Room 3 (chrysalis) is quiet and safe. Room 4 (butterfly) has flowers. Each room will use a different thing from your craft box.\nYour Turn — 1. Measure how long and how tall your box is with the ruler, and write the numbers on your plan. 2. Draw the front of your hotel and split it into 4 rooms. 3. Label each room: egg, caterpillar, chrysalis, butterfly. 4. Next to each room, draw or write what it needs from your Life Cycle work. 5. Pick something from your craft box for each need, like green felt for leaves or pom poms for flowers. 6. Take a picture of your plan with Show it.\nCheck Yourself — Does every room give its bug what it needs? Look at your Life Cycle Cards."},
  {"subject": "Related Arts", "crossSubjects": ["Science"], "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "dayOffset": 1, "title": "Design Studio: Bug Hotel, Day 2 — Build the Rooms", "passage": "Gather first — Your plan, your box, cardboard strips or stiff paper, craft sticks from the craft box, scissors, and glue or tape.\nHere's the Idea — Walls make rooms. Today you build the inside of the hotel.\nSee It Done — To make a wall that stands up: cut a cardboard strip as tall as your box. Fold 1 inch at each end to make little feet. Glue the feet to the floor of the box. Now it stands on its own, like a room divider.\nYour Turn — 1. Look at your plan and cut the strips you need to split the box into 4 rooms. 2. Fold the feet and glue each wall into place. 3. Let it dry while you make a ladder or ramp from craft sticks that connects two of the rooms. 4. Check that each room is big enough for the things you planned. 5. Take a picture with Show it.\nCheck Yourself — Do your walls stand up by themselves? Does your box match the number of rooms on your plan?"},
  {"subject": "Related Arts", "crossSubjects": ["Science"], "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "dayOffset": 2, "title": "Design Studio: Bug Hotel, Day 3 — Furnish the Habitats", "passage": "Gather first — Your hotel, the craft box (felt, pom poms, beads, floss, craft sticks), scissors, and glue.\nHere's the Idea — A habitat gives a bug everything it needs. Today every room gets what its bug needs, and every craft object stands for something real.\nSee It Done — Green felt cut into leaf shapes is the caterpillar's food. A small white pom pom or bead hidden under a leaf is an egg. Pom poms in many colors glued on a stem are flowers.\nYour Turn — 1. Egg room: hide a tiny white bead or pom pom under a felt leaf. 2. Caterpillar room: glue several green felt leaves. 3. Chrysalis room: hang a brown felt wrap from a craft stick with floss, so it dangles safe and still. 4. Butterfly room: make flowers from pom poms and felt. 5. Take a picture of each room with Show it.\nCheck Yourself — Point to each room and say what it has that the bug needs."},
  {"subject": "Related Arts", "crossSubjects": ["Science"], "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "dayOffset": 3, "title": "Design Studio: Bug Hotel, Day 4 — Make the Bugs and Signs", "passage": "Gather first — Your hotel, felt, pom poms, googly eyes, pipe cleaners or floss, craft sticks, markers, and glue.\nHere's the Idea — Hotels have guests and signs! Today you make the four bugs that will stay, and a sign for each room.\nSee It Done — A caterpillar is a row of 4 or 5 pom poms in a line with a face of googly eyes. A butterfly is two felt wings on a pipe cleaner body.\nYour Turn — 1. Make a caterpillar from pom poms. 2. Make a butterfly from felt wings and a pipe cleaner. 3. Make a small egg and a chrysalis that fit your rooms. 4. Make a sign for each room on a craft stick saying the stage and what it needs. 5. Put each bug in its room and take a picture with Show it.\nCheck Yourself — Is each bug in the room that matches its stage?"},
  {"subject": "Related Arts", "crossSubjects": ["Science"], "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "dayOffset": 4, "title": "Design Studio: Bug Hotel, Day 5 — Open the Hotel!", "passage": "Gather first — Your finished Bug Hotel, a grown-up for your guest, and a camera.\nHere's the Idea — Artists and builders share what they made. Today is opening day.\nYour Turn — 1. Fix or add anything that is not finished yet. 2. Take a picture of the whole hotel with Show it. 3. Give a grown-up a tour room by room and record it with Tell it. Say what each room has for its bug and why. 4. Tell one thing you would change if you built it again.\nCheck Yourself — Did your tour tell the whole life cycle in order, from egg to butterfly?"},
  // --- Design Studio weeks 2-4 (one project a day, building all week and opened on Friday): Two Georgia Towns, Place Value Museum, Nursery Floor Plan ---
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Social Studies"], "dayOffset": 6, "title": "Design Studio: Two Georgia Towns, Day 2 — Shape the Land", "passage": "Gather first — Two pieces of cardboard or two box lids, blue, green and brown felt, scissors, and glue.\nHere's the Idea — Builders start with the land. The Cherokee lived in the north Georgia mountains and the Creek lived along rivers.\nSee It Done — Cut a long wavy strip of blue felt and glue it across the middle of a board. That is a river. Fold a brown felt triangle and stand it on its base. That is a mountain.\nYour Turn — 1. On one board, glue green felt for the land and a blue felt river for the Creek river-town. 2. On the other board, build tall felt mountains for the Cherokee mountain-town. 3. Make a craft stick sign for each board. 4. Take a picture with Show it.\nCheck Yourself — Do your river and mountains match the places on your Georgia map?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Social Studies"], "dayOffset": 7, "title": "Design Studio: Two Georgia Towns, Day 3 — Plant the Three Sisters", "passage": "Gather first — Craft sticks, floss or pipe cleaners, green felt, yellow and orange pom poms, glue, and your two boards.\nHere's the Idea — Both nations grew corn, beans, and squash together. Today you plant a Three Sisters garden in each town.\nSee It Done — A craft stick standing up is the corn stalk, with a yellow pom pom glued on as the ear. Floss wound around the stick is the bean vine. A big green felt leaf on the ground with an orange pom pom is the squash.\nYour Turn — 1. Make a corn stalk, a bean vine, and a squash for the Creek town garden. 2. Make a second set for the Cherokee town. 3. Glue each garden onto its board. 4. Take a picture with Show it and Tell it how each plant helps the other two.\nCheck Yourself — Does each garden have all three sisters, each doing its job?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Social Studies"], "dayOffset": 8, "title": "Design Studio: Two Georgia Towns, Day 4 — Homes and People", "passage": "Gather first — Felt, craft sticks, wooden peg dolls, markers, glue, and the Cherokee article from Day 1.\nHere's the Idea — People made their homes from what they had around them. Today you build homes and add people to each town.\nSee It Done — Craft sticks standing side by side can be walls and folded felt can be a roof. Use the article and your drawing from Day 1 to decide what your homes should look like.\nYour Turn — 1. Look at your Day 1 drawing and the article. 2. Build two homes for each town. 3. Make a peg doll person for each town and put them by the gardens. 4. Take a picture with Show it.\nCheck Yourself — Did you use at least one idea from the article or your drawing?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Social Studies"], "dayOffset": 9, "title": "Design Studio: Two Georgia Towns, Day 5 — Open the Museum", "passage": "Gather first — Your two finished towns and a grown-up visitor.\nHere's the Idea — Today your towns become a museum exhibit.\nYour Turn — 1. Fix or add anything you want. 2. Take a picture of both towns with Show it. 3. Give your visitor a tour and record it with Tell it. Say where each nation lived, what they grew, and one thing that is the same in both towns.\nCheck Yourself — Did your tour mention the river, the mountains, and the Three Sisters?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 10, "title": "Design Studio: Place Value Museum, Day 1 — Plan Your Exhibits", "passage": "Gather first — Paper, pencil, and your craft box.\nHere's the Idea — A museum shows things you can see. This week you build place value exhibits out of real pieces.\nSee It Done — The number 136 is 1 hundred, 3 tens, and 6 ones. Show it with 1 hundred-flat, 3 craft sticks that each have 10 dots (tens), and 6 pom poms (ones).\nYour Turn — 1. Pick two numbers between 110 and 159 whose tens digit is 5 or less. 2. Write each as hundreds, tens, and ones. 3. Plan the pieces: a pom pom is 1 one, a craft stick with 10 dots is 1 ten, and a flat made of 10 ten-sticks is 1 hundred. 4. Count how many ten-sticks you need in all, including the 10 for the flat. 5. Take a picture of your plan with Show it.\nCheck Yourself — Do the pieces in your plan add up to your numbers?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 11, "title": "Design Studio: Place Value Museum, Day 2 — Make the Tens", "passage": "Gather first — About 20 craft sticks, markers, pom poms or beads, and your plan.\nHere's the Idea — A ten is ten ones all together. Today you make your tens.\nSee It Done — Draw 10 dots on one craft stick and count them by ones to check. That one stick is 1 ten.\nYour Turn — 1. Make the ten-sticks your plan needs for the tens digits of your two numbers. 2. Count the dots on each stick to be sure there are 10. 3. Count your sticks by tens out loud. 4. Put the ones in a cup. 5. Take a picture with Show it.\nCheck Yourself — Does each stick have exactly 10 dots?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 12, "title": "Design Studio: Place Value Museum, Day 3 — Build the Hundred", "passage": "Gather first — 10 more ten-sticks (dots drawn), a square of felt, glue, and markers.\nHere's the Idea — Ten tens make one hundred. Today you bundle your tens into a hundred-flat.\nSee It Done — Lay 10 ten-sticks side by side and glue them onto a felt square. That whole flat is 1 hundred.\nYour Turn — 1. Make 10 ten-sticks. 2. Glue them side by side onto the felt square to make a hundred-flat. 3. Count the sticks by tens out loud to 100. 4. Take a picture with Show it and Tell it how ten tens make a hundred.\nCheck Yourself — Can you count your flat by tens and end at 100?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 13, "title": "Design Studio: Place Value Museum, Day 4 — Build the Exhibits", "passage": "Gather first — Felt, markers, sticky notes or paper for signs, and all your pieces.\nHere's the Idea — A museum exhibit has the thing and a sign that tells about it.\nSee It Done — Make a felt mat with three columns labeled hundreds, tens, and ones. Put the pieces in the right columns. The sign says the number and the expanded form, like 100 + 30 + 6.\nYour Turn — 1. Make a place value mat for each exhibit. 2. Put the hundred-flat, ten-sticks, and ones in the right columns for each number. 3. Write a sign for each with the number and its expanded form. 4. Take a picture with Show it.\nCheck Yourself — Does each sign match the pieces on its mat?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 15, "title": "Design Studio: Nursery Floor Plan, Day 1 — Measure the Room", "passage": "Gather first — A tape measure, paper, pencil, and a grown-up to help.\nHere's the Idea — Real builders measure before they build. Dad is turning one room into two, so you can make a plan of the new nursery.\nSee It Done — Hold the end of the tape measure at one wall and have a grown-up read the number at the other wall. Measure twice to be sure.\nYour Turn — 1. With a grown-up, measure how long and how wide the new nursery is, to the nearest whole foot. 2. Measure how wide each of the two doorways is, in inches. 3. Sketch the room as a rectangle and write the numbers on it. 4. Take a picture with Show it.\nCheck Yourself — Did you measure each thing twice and get the same number?"},
  {"subject": "Related Arts", "skillId": "anna-design-studio", "stage": "apply", "standard": "VA2.CR.2", "xp": 15, "rev": 1, "crossSubjects": ["Math"], "dayOffset": 16, "title": "Design Studio: Nursery Floor Plan, Day 2 — Build the Walls", "passage": "Gather first — A big piece of cardboard, craft sticks, glue, and your measurements.\nHere's the Idea — A model can use small things to stand for big things. In this model 1 craft stick stands for 1 foot of the real room.\nSee It Done — If the room is 10 feet wide, glue 10 craft sticks end to end along one side. Every foot in the room is one stick in your model.\nYour Turn — 1. Use sticks to make the four walls of the room, one stick per foot. 2. Leave a gap in the wall for each doorway, as many sticks wide as the doorway measured in feet, rounding to the nearest foot. 3. Take a picture with Show it.\nCheck Yourself — Count the sticks on each wall. Do they match your measurements?"},

ory, the problem is what goes wrong, and the message is the lesson."}, {"q": "Who watched the basket to see what would happen?", "choices": ["Miriam, his sister", "Pharaoh", "Aaron", "Joseph"], "answerIndex": 0, "explain": "Miriam watched from a distance and then helped find a nurse."}]},
  {"dayOffset": 45, "subject": "Faith", "title": "Moses and the Bush That Didn't Burn Up", "xp": 15, "standard": "ELAGSE2RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=kXl4PYCx46g", "rev": 1, "passage": "Gather first — Green felt for a bush, red, orange and yellow felt for flames, glue, paper for a sign, and a peg doll.\nHere's the Idea — Moses grew up and became a shepherd. One day he saw something strange: a bush on fire that did not burn up.\nSee It Done — God spoke to Moses from the bush and told him to take off his sandals because the ground was holy. God asked Moses to help the Hebrew people, and when Moses felt nervous, God said, I will be with you. God also gave Moses his brother Aaron to help.\nYour Turn — 1. Glue flames onto the bush but keep the leaves green, to show a bush that burns without burning up. 2. Take your shoes off and stand on a pretend holy-ground mat like Moses. 3. Make a sign that says I will be with you. 4. Retell the story with your doll and bush. 5. Take a picture with Show it and Tell it a time you felt nervous and someone helped.\nCheck Yourself — Can you say what God promised Moses?", "quiz": [{"type": "order", "q": "Put the burning bush story in order.", "items": ["Moses watches his sheep", "Moses sees a bush on fire that does not burn up", "God speaks to Moses", "God sends Moses to help his people"], "explain": "Moses noticed the bush first, then God spoke and sent him."}, {"type": "match", "q": "Match each part to what it means.", "pairs": [["The bush on fire but not burned up", "A strange sign that got Moses' attention"], ["Taking off his sandals", "The ground was holy"], ["I will be with you", "God's promise to help Moses"]], "explain": "Each part helped Moses understand that God was calling him and would help."}, {"q": "Who did God give to help Moses?", "choices": ["Aaron, his brother", "Noah", "Jacob", "Abraham"], "answerIndex": 0, "explain": "God gave Moses his brother Aaron to help him."}]},

le go free."}]},

  {"dayOffset": 10, "subject": "Faith", "title": "The Full System Backup (Noah's Ark)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=VA6MZ613K7Y", "passage": "Gather first — Minecraft in Creative mode, your notebook, a calculator or paper, and the video link above.\nHere's the Idea — When a system is badly broken, you restore from a backup. Noah's ark was a kind of backup: his family and two of every kind of animal were saved while the flood reset everything else.\nSee It Done — The Bible gives the ark's size in cubits: 300 long, 50 wide, 30 tall. A cubit is about 1.5 feet, so 300 cubits is 300 times 1.5, which is 450 feet. In Minecraft, let 1 block stand for 10 feet. Then the ark is 45 blocks long.\nYour Turn — 1. Watch the video. 2. In your notebook change all three cubit sizes into feet, then into blocks (1 block is 10 feet) and round to a whole block. 3. Build the ark in Minecraft to your numbers. 4. Add a deck with pairs of animals in pens. 5. Take screenshots or use Show it, and Tell it how you decided the size. 6. Think it through: if you could only save a few things, how would you decide what makes the cut?\nCheck Yourself — Does your build match your block numbers for length, width, and height?", "quiz": [{"type": "build", "q": "The ark was 300 cubits long and a cubit is about 1.5 feet. Build the length in feet.", "target": 450, "places": ["hundreds", "tens", "ones"], "explain": "300 times 1.5 is 450, so the ark was about 450 feet long."}, {"type": "order", "q": "Put the Noah story in order.", "items": ["Noah builds the ark", "The animals come in two by two", "The flood comes", "God sends a rainbow as a promise"], "explain": "Noah built the ark first, then the animals and his family went in, then the flood, then the rainbow."}, {"type": "match", "q": "Match each part to what it shows.", "pairs": [["The flood", "A reset of the old broken state"], ["Two of each animal", "A backup so each kind could co   {"dayOffset": 15, "subject": "Faith", "title": "The Merge Conflict (Tower of Babel)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=vY-PDpuROUY", "ssCredit": true, "passage": "Gather first — Minecraft in Creative mode, signs, your notebook, a partner, and the video link above.\nHere's the Idea — When people on one team can no longer understand each other's work, that is like a merge conflict: nothing lines up. After the flood everyone shared one language and built a tower to make themselves famous instead of spreading out.\nSee It Done — God mixed up their languages, so they could not coordinate, and they spread out. That is part of why people speak so many languages today. Spreading out was what they were supposed to do in the first place.\nYour Turn — 1. Watch the video. 2. In Minecraft, build the before: one big village with a tower in the middle. 3. Build the after: several small settlements spread far apart. 4. Test it: write a short message on a sign using a simple code you invent (for example, shift every letter by one) and see if your partner can read it without the key. 5. Take screenshots or use Show it and Tell it how the code relates to the story. 6. Think it through: how is being forced to split up a fix and not only a punishment?\nCheck Yourself — Can your partner read your sign once you give them the key?", "quiz": [{"type": "order", "q": "Put the Tower of Babel story in order.", "items": ["Everyone speaks one language", "People build a giant tower", "God mixes up their languages", "People spread out across the earth"], "explain": "The story goes from one language, to the tower, to mixed languages, to spreading out."}, {"type": "match", "q": "Match each part to what happened.", "pairs": [["The tower", "People wanted to make themselves famous"], ["Mixed-up languages", "They could not understand each other"], ["Spreading out", "People settled across the earth"]], "explain": "The tower was about   {"dayOffset": 20, "subject": "Faith", "title": "The Fork (Abraham's Promise)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=zUhs-MWoTbg", "ssCredit": true, "passage": "Gather first — Minecraft in Creative mode, signs, your notebook, and the video link above.\nHere's the Idea — A fork in a project means choosing a new direction before you can see how it will turn out. God asked Abraham to leave home and promised to make his family a great nation that would bless the world.\nSee It Done — Abraham did not have the whole map. He trusted the promise and went. Example of a fork you know: you start a Minecraft world from a copy of someone else's build and take it in your own direction.\nYour Turn — 1. Watch the video. 2. In Minecraft, build Abraham's starting camp in one place and a marked new land far away in another. 3. Connect them with a long path and place a sign every 50 blocks, then count the signs. 4. Take screenshots or use Show it and Tell it what Abraham knew at the start and what he did not know yet. 5. Think it through: what would you have to commit to before seeing the outcome if you trusted the person asking?\nCheck Yourself — Can you say what God promised and what Abraham still did not know?", "quiz": [{"type": "sort", "q": "Sort what Abraham knew from what he didn't know yet.", "categories": ["Knew at the start", "Did not know yet"], "items": [{"t": "God's promise to make his family a great nation", "c": 0}, {"t": "Exactly what the new land would look like", "c": 1}, {"t": "That the whole world would be blessed through his family", "c": 0}, {"t": "How the whole plan would play out", "c": 1}], "explain": "Abraham had the promise but not the whole plan."}, {"type": "order", "q": "Put Abraham's story in order.", "items": ["God makes a promise", "Abraham leaves home", "Abraham travels to a new land"], "explain": "God spoke first, then Abraham left, then he traveled where God sent him."}, {"q": "What   {"dayOffset": 25, "subject": "Faith", "title": "The Bad Trade (Jacob & Esau)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=ONue2HsLw_s", "passage": "Gather first — Minecraft in Creative mode, chests and signs, your notebook, and the video link above.\nHere's the Idea — A trade-off is choosing between two things. A bad trade gives up something valuable for something small. Esau, Isaac's older son, gave up his birthright (his special share) for one bowl of stew because he was hungry.\nSee It Done — Example: spending all your allowance today on a snack means you cannot buy something bigger next month. The snack is a short-term want and the saving is a long-term value.\nYour Turn — 1. Watch the video. 2. In Minecraft, build two stations: a quick reward (a small chest with a few items, built fast) and a long-term value (a large chest in a big room, built slowly). 3. Put a sign on each saying what it stands for. 4. In your notebook make a two-column table and list three decisions from your own life with a short-term want in one column and the long-term value in the other. 5. Take screenshots or use Show it, and Tell it which one Esau picked and what it cost him.\nCheck Yourself — Could you explain why the trade was bad, not only what it was?", "quiz": [{"type": "sort", "q": "Is each one a want right now, or something that lasts?", "categories": ["A want right now", "Something that lasts"], "items": [{"t": "A bowl of stew when you are hungry", "c": 0}, {"t": "The birthright", "c": 1}, {"t": "A snack before dinner", "c": 0}, {"t": "A promise your family keeps", "c": 1}], "explain": "The stew is a short-term want and the birthright is a special share that lasts."}, {"type": "match", "q": "Match each person to what happened.", "pairs": [["Esau", "Traded his birthright for stew"], ["Jacob", "Got the birthright in the trade"]], "explain": "Esau gave up his birthright and Jacob received it."}, {"q": "What kind of trade-off does this story show?", "choices": ["A fair, well-thought-out deal", "A short-term want beating a long-term asset", "No trade-off at all", "Long-term planning every time"], "answerIndex": 1, "explain": "Esau picked what he wanted right now over something far more valuable."}], "rev": 1},
  {"dayOffset": 30, "subject": "Faith", "title": "The Hostile Fork (Joseph, Sold Out)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=DJNmqG-Np8g", "passage": "Gather first — Minecraft in Creative mode, signs, your notebook, and the video link above.\nHere's the Idea — Competition on a team can be healthy, but jealousy that is not dealt with can turn on a teammate. Joseph's brothers were jealous of him because their father openly favored him, so they sold him into slavery in Egypt.\nSee It Done — Healthy competition looks like practicing harder after a teammate wins. Jealousy looks like wishing a teammate would fail.\nYour Turn — 1. Watch the video. 2. In Minecraft, build the before: the family camp with Joseph's tent set apart with a bright banner. 3. Build the after: a road leading far away to Egypt with Joseph alone at the end. 4. In your notebook draw a two-column chart, healthy competition and jealousy, with three examples in each. 5. Take screenshots or use Show it and Tell it where you would draw the line.\nCheck Yourself — Could you tell a teammate the difference between the two columns?", "quiz": [{"type": "order", "q": "Put the story in order.", "items": ["Jacob gives Joseph a special coat", "The brothers get jealous", "The brothers sell Joseph into slavery in Egypt"], "explain": "The favoritism led to jealousy, and the jealousy led to the brothers selling Joseph."}, {"type": "sort", "q": "Healthy competition or jealousy?", "categories": ["Healthy competition", "Jealousy"], "items": [{"t": "Cheering when a teammate wins", "c": 0}, {"t": "Hiding a teammate's tools so they lose", "c": 1}, {"t": "Practicing harder to get better", "c": 0}, {"t": "Wishing someone would fail", "c": 1}], "explain": "Healthy competition makes everyone better, while jealousy tries to hurt others."}, {"q": "Why were Joseph's brothers jealous of him?", "choices": ["He was older", "Their father favored him, including a special   {"dayOffset": 35, "subject": "Faith", "title": "The Merge Back (Joseph Forgives)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=75hIRyuEIKA", "passage": "Gather first — Minecraft in Creative mode, chests and signs, your notebook, and the video link above.\nHere's the Idea — Merging back after a real conflict is harder than avoiding the person forever. Years after being sold, Joseph was a leader in Egypt, and when a famine came his brothers arrived needing food.\nSee It Done — Joseph had all the power to get revenge and chose forgiveness, and he helped his whole family. Example of the same idea: a teammate who ruined your build asks for help and you help anyway.\nYour Turn — 1. Watch the video. 2. In Minecraft, build Egypt's grain store: a large building with rows of chests labeled by year. 3. Build the brothers' camp in a dry desert and a road to Egypt. 4. Build the reunion scene where Joseph meets his brothers. 5. Take screenshots or use Show it and Tell it why forgiving was harder than revenge. 6. Think it through: what makes forgiveness possible when you have the power to get even?\nCheck Yourself — Can you explain what Joseph chose and why it mattered for his family?", "quiz": [{"type": "order", "q": "Put the story in order.", "items": ["A famine comes", "Joseph's brothers go to Egypt for food", "Joseph recognizes his brothers", "Joseph forgives them and helps his family"], "explain": "The famine sent the brothers to Egypt, where Joseph recognized them and forgave them."}, {"type": "match", "q": "Match each person to what they did.", "pairs": [["Joseph", "Forgave instead of getting revenge"], ["The brothers", "Came to Egypt needing food"]], "explain": "Joseph chose forgiveness, and the brothers came because of the famine."}, {"q": "Why call this a merge back and not just an ending?", "choices": ["Because nothing changed", "Because the broken relationship was actively repaired", "Because Joseph left Egypt", "Because the brothers never spoke again"], "answerIndex": 1, "explain": "Joseph chose to repair the relationship instead of just avoiding his brothers."}], "rev": 1},

afely on the river", "To sell it", "To hide from Aaron", "For a game"], "answerIndex": 0, "explain": "A waterproof basket let Moses float safely on the Nile."}]},
  {"dayOffset": 45, "subject": "Faith", "title": "The Unexpected Alert (The Burning Bush)", "xp": 20, "standard": "ELAGSE4RL2", "crossSubjects": ["ELA"], "video": "https://www.youtube.com/watch?v=kXl4PYCx46g", "rev": 1, "passage": "Gather first — Minecraft in Creative mode, your notebook, and the video link above.\nHere's the Idea — Some alerts only matter if you stop and look. Moses saw a bush that burned without burning up, and he turned aside to look. That is when God spoke to him.\nSee It Done — God told Moses to take off his sandals because the ground was holy, then asked him to help the Hebrew people. Moses felt unqualified, and God said, I will be with you. God also gave Moses his brother Aaron as a helper, so he was not doing the job alone.\nYour Turn — 1. Watch the video. 2. In Minecraft, build a bush from leaves and add orange stained glass or lights to look like flames that do not burn it. 3. Build Moses' shepherd area with a fence and sheep. 4. Make a sign: I will be with you. 5. Take screenshots or use Show it and Tell how Moses responded. 6. Think it through in your notebook: what do you do when a job feels too big, and who could be your Aaron?\nCheck Yourself — Can you say what Moses was asked to do and what God promised him?", "quiz": [{"type": "order", "q": "Put the story in order.", "items": ["Moses tends sheep", "He sees a bush on fire that does not burn up", "God speaks and asks him to help his people", "God promises to be with him and sends Aaron to help"], "explain": "Moses noticed the bush, God spoke, and God promised help."}, {"type": "match", "q": "Match each part to what it shows.", "pairs": [["The bush that does not burn up", "A strange sign Moses had to stop and notice"], ["Taking off his sandals", "The ground was holy"], ["Aaron", "A helper so Moses was not alone"]], "explain": "Each part helps explain how God called Moses and supported him."}, {"q": "What did God say when Moses felt unsure?", "choices": ["I will be with you", "Go alone"   {title:"Math: Which Number Is Bigger?", passage:"Gather first — Paper and a pencil.\nHere's the Idea — To compare numbers, look at the hundreds first. If they match, look at the tens, then the ones. Example: 582 vs 528. Both have 5 hundreds. 8 tens is more than 2 tens, so 582 is bigger. We write 582 > 528.\nYour Turn — 1. Write three pairs of 3-digit numbers that start with the same digit. 2. For each pair circle the bigger one and write > or <. 3. Tell Mom which digit decided it.\nCheck Yourself — Did you look at the biggest spot first?"},
  {title:"Math: Add Tens — Make a Ten Trade", passage:"Gather first — About 30 buttons.\nHere's the Idea — When you have 10 ones you can trade them for 1 ten. Example: 8 ones + 5 ones = 13 ones. That is 1 ten and 3 ones, so 8 + 5 = 13.\nYour Turn — 1. Make 7 ones and 6 ones with buttons. 2. Push them together and trade 10 buttons for 1 ten (a small pile or a rubber band). 3. Say how many tens and ones you have, then write the answer. 4. Try 9 + 4 and 8 + 8 the same way.\nCheck Yourself — Does your answer match your tens and ones?"},
  {title:"Math: Skip Count and Find the Pattern", passage:"Gather first — Paper and a pencil.\nHere's the Idea — Skip counting jumps by the same amount each time. By 5s: 5, 10, 15, 20. By 10s: 10, 20, 30. Each jump adds the same number.\nYour Turn — 1. Skip count by 5s from 5 up to 100 and write it down. 2. Skip count by 10s from 130 up to 230. 3. Circle any number that shows up in both lists. 4. Tell Mom what pattern you notice in the ones digits when counting by 5s.\nCheck Yourself — Did the ones digits switch between 5 and 0?"},

  {"d": 0, "subject": "Independent", "title": "JohnnyOS Design Brief: name your operating system and plan version 1.0", "xp": 15, "standard": "ELAGSE4W4", "stage": "teach", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — A design brief is a short plan that says who it is for, what it does, and what is in it. Real operating systems start with one. Example brief: \"Name: SamOS 1.0. For: my cousin Sam. Look: green text on black. It will have: 1) a boot screen, 2) a command prompt with 4 commands, 3) a dinosaur trivia app.\"\nYour Turn — 1. Pick the name (JohnnyOS, or invent something cooler). 2. Write what Johnny loves and the look you want (colors, logo idea). 3. List exactly 3 things version 1.0 will do. Keep it small enough to finish in 4 weeks. 4. Show your brief to Mom for a thumbs up.\nCheck Yourself — Could someone who has never met Johnny read your brief and picture the operating system?"},
  {"d": 0, "subject": "Reading", "title": "Read: What is an operating system? (kernel, shell, and apps)", "xp": 10, "standard": "ELAGSE4RI1", "stage": "teach", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — An operating system (OS) is the software that runs a computer and lets people use it. It has three big parts. The kernel is the core: it talks to the hardware, memory, and files. The shell is where you give commands, either by typing or by clicking. Apps are the programs you actually use. Linux is a kernel that a student named Linus Torvalds started in 1991, and anyone can read and share it. People bundle the Linux kernel with a shell and apps and give it a name, like Ubuntu. That bundle is called a distribution. A Chromebook runs ChromeOS, which is built on the Linux kernel, and it can also run a small Linux computer in a safe box on the same laptop. Your JohnnyOS will run in that box and use the Linux kernel underneath, while you write the shell, the apps, and the look. That is how many real systems are made too.\nYour Turn — 1. Write the three parts of an OS in your own words. 2. Draw a picture with the kernel at the bottom, then the shell, then the apps on top. 3. Write which part you will build yourself for JohnnyOS and which part Linux gives you.\nCheck Yourself — Can you explain the difference between the kernel and the shell?"},
  {"d": 1, "subject": "Independent", "title": "Turn on Linux on the Chromebook: the computer JohnnyOS will live on", "xp": 20, "standard": "3-5.F", "stage": "teach", "passage": "Gather first — The Kompanio Chromebook, plugged in and on Wi-Fi, and a grown-up. Do NOT use Developer Mode or erase anything; this route is safe and needs no wipe.\nHere's the Idea — ChromeOS has Linux built in. You just switch it on in Settings. This gives JohnnyOS a Linux kernel to run on.\nSee It Done — Open Settings, go to Advanced, then Developers, and find \"Linux development environment\". If you cannot find it, search Settings for the word Linux.\nYour Turn — 1. Click Turn on. 2. Pick a username and a disk size. About 20 GB is plenty. 3. Wait for it to finish. It can take several minutes. 4. When the Terminal window opens, take a screenshot. 5. Write one sentence about what you see.\nCheck Yourself — Do you have a Terminal window with a blinking cursor?", "help": "johnnyos"},
  {"d": 2, "subject": "Independent", "title": "Terminal Basics: build the JohnnyOS folder tree", "xp": 20, "standard": "3-5.F", "stage": "teach", "passage": "Gather first — The Terminal app on the Chromebook.\nHere's the Idea — Real operating systems keep files in organized folders. The terminal lets you build them with typed commands: pwd (print where you are), ls (list what is here), cd (change folder), mkdir (make a folder).\nSee It Done — Type pwd and press Enter. It shows something like /home/yourname. Type mkdir practice and press Enter. Type ls and you will see practice. Type cd practice, then pwd again. Now the path ends with /practice. Type cd .. to go back up one level.\nYour Turn — 1. Run pwd and ls. 2. Make a folder called johnnyos with mkdir. 3. Go in with cd and make two folders inside it: apps and art. 4. Run ls to check. 5. Screenshot the Terminal.\nCheck Yourself — Does ls inside johnnyos show apps and art?", "help": "johnnyos"},
  {"d": 3, "subject": "Math", "title": "Disk space math: how big will JohnnyOS be?", "xp": 15, "standard": "4.NR.1/4.NR.2", "stage": "practice", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — Every operating system has an install size, measured in gigabytes (GB). A good builder adds up what is needed and checks it fits. Example: if the Linux disk is 20 GB, Python needs 1 GB, and a paint program needs 2 GB, then 1 + 2 = 3 GB used, and 20 - 3 = 17 GB left.\nYour Turn — 1. Look at your design brief. 2. Guess how many GB each part might need (a small game maybe 1 GB, a paint program 2 GB). 3. Add them up. 4. Subtract from 20 GB. 5. Write how much space is left.\nCheck Yourself — Does your used space plus your space left equal 20?", "quiz": [{"q": "The Linux disk is 20 GB. You plan to use 3 GB for Python and 5 GB for an art program. How much is left?", "choices": ["12 GB", "15 GB", "18 GB", "8 GB"], "answerIndex": 0, "explain": "3 + 5 = 8 GB used, and 20 - 8 = 12 GB left."}]},
  {"d": 4, "subject": "Independent", "title": "Update Linux and install Python: the tools JohnnyOS needs", "xp": 20, "standard": "3-5.F", "stage": "practice", "passage": "Gather first — The Terminal and Wi-Fi.\nHere's the Idea — apt is the app store of Linux. sudo means \"do this as the boss of the computer\", so use it only for commands you trust and understand. Example: sudo apt update asks the store for the newest list of apps. Python is the language you will write JohnnyOS in.\nSee It Done — Type: sudo apt update && sudo apt upgrade. Press Enter. If it asks Do you want to continue, type y and press Enter. When it stops, type python3 --version. You should see a version number.\nYour Turn — 1. Run the update line above with a grown-up watching. 2. Run python3 --version. 3. If Python is missing, run sudo apt install python3. 4. Screenshot the version number.\nCheck Yourself — Does the Terminal print a version number for Python?", "help": "johnnyos"},
  {"d": 5, "subject": "Independent", "title": "Boot screen: make JohnnyOS print a startup sequence", "xp": 20, "standard": "3-5.F", "stage": "teach", "passage": "Gather first — The Terminal, inside your johnnyos folder (use cd johnnyos).\nHere's the Idea — When a computer starts it shows boot messages. A program is a list of instructions saved in a file. print() shows words on the screen, and time.sleep(1) pauses for one second. nano is a simple text editor that works in the terminal.\nSee It Done — Type nano boot.py and press Enter. Type these lines: import time, then print(\"Loading kernel...\"), then time.sleep(1), then print(\"OK\"). Press Ctrl + O then Enter to save, then Ctrl + X to leave. Run it with python3 boot.py. The words appear with a pause.\nYour Turn — 1. Make boot.py. 2. Print at least 4 boot messages with pauses, like Loading kernel, Starting apps, Checking games. 3. End with a big \"Welcome to JohnnyOS 1.0\" line. 4. Run it and screenshot the result.\nCheck Yourself — Does every print line have quotation marks and parentheses?", "help": "johnnyos"},
  {"d": 6, "subject": "Independent", "title": "Login screen: ask for a username with input() and variables", "xp": 20, "standard": "3-5.F", "stage": "practice", "passage": "Gather first — Your Terminal in johnnyos.\nHere's the Idea — A variable is a labeled box that holds a value. input() asks the player a question and puts the answer in the box. Example: name = input(\"Username? \") then print(\"Welcome, \" + name). This is a pretend login for fun. Never type a real password into your own programs.\nYour Turn — 1. Make login.py. 2. Ask for a username and a favorite color. 3. Print a welcome line that uses both answers. 4. Run it three times with different answers.\nCheck Yourself — Does each answer show up in the right place in the welcome line?", "help": "johnnyos"},
  {"d": 7, "subject": "Math", "title": "Binary: how the kernel counts everything", "xp": 15, "standard": "4.PAR.3", "stage": "practice", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — Computers count with only 0 and 1, called binary. Each spot is worth double the one to its right: 8, 4, 2, 1. Example: 10 = 8 + 2, so it is 1010 (one 8, no 4, one 2, no 1).\nYour Turn — 1. Write the numbers 1 to 15 in binary using the 8-4-2-1 spots. 2. Write Johnny's age in binary. 3. Find the pattern in the last digit as you count up. 4. Think of a place in JohnnyOS to show a binary number, like the version number.\nCheck Yourself — Does adding up the spots you marked give the number back?", "quiz": [{"q": "What is 12 in binary using the 8-4-2-1 spots?", "choices": ["1100", "1010", "1001", "0110"], "answerIndex": 0, "explain": "12 = 8 + 4, so the 8 spot and the 4 spot are 1 and the others are 0: 1100."}]},
  {"d": 8, "subject": "Independent", "title": "Build the shell: a JohnnyOS command prompt with a loop and if/else", "xp": 25, "standard": "3-5.F", "stage": "practice", "passage": "Gather first — Your Terminal in johnnyos.\nHere's the Idea — The shell waits for commands and runs them. A while loop repeats until something changes, and if/elif checks which command was typed. Example: while True: cmd = input(\"johnny> \") then if cmd == \"hello\": print(\"Hi!\") elif cmd == \"exit\": break. Indentation (the spaces at the start of a line) matters in Python.\nYour Turn — 1. Make johnnyos.py. 2. Make a prompt that shows johnny> and waits for a command. 3. Add the commands help (lists the commands), hello, time, and exit. 4. For anything else print a friendly \"Unknown command\". 5. Test every command.\nCheck Yourself — Does exit leave the shell, and does help list every command you made?", "help": "johnnyos"},
  {"d": 9, "subject": "Reading", "title": "Write the JohnnyOS welcome text and release notes", "xp": 10, "standard": "ELAGSE4W4", "stage": "practice", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — Real operating systems come with release notes that say what is new. Good writing for a gift is about the person. Use a specific memory, not just \"you are nice\". Example: instead of \"You are fun\", write \"I laughed when you built a tower taller than us in Minecraft.\"\nYour Turn — 1. Write 3 specific memories or things you like about Johnny. 2. Turn them into a welcome message of 4 to 6 sentences for the first screen. 3. Write release notes for version 1.0 with 3 bullet points of what it can do. 4. Read it out loud once and fix any sentence that sounds odd.\nCheck Yourself — Does your message mention at least one real thing only Johnny would recognize?"},
  {"d": 10, "subject": "Independent", "title": "Build app 1: a trivia app, \"How well do you know Johnny?\"", "xp": 25, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — Terminal in johnnyos, your design brief.\nHere's the Idea — An app is a program the shell can start. A list holds many items in order, and a for loop can go through all of them. Example: questions = [(\"Favorite color?\", \"blue\"), (\"Pet's name?\", \"Max\")] then for q, a in questions: ask each one and compare the answer.\nYour Turn — 1. Make apps/trivia.py (inside the apps folder). 2. Write at least 5 questions about Johnny with the right answers. 3. Keep a score variable that goes up by 1 on each right answer. 4. Print the score at the end with a friendly message. 5. Play it once as a tester.\nCheck Yourself — Does the score match the number of questions you answered correctly?", "help": "johnnyos"},
  {"d": 11, "subject": "Related Arts", "title": "Build app 2: the JohnnyOS logo and ASCII art wallpaper", "xp": 20, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — Terminal in johnnyos and a sheet of graph paper.\nHere's the Idea — ASCII art is a picture made from letters and symbols. Plan it on graph paper first, one character per square. Every OS has a logo. Example: a simple logo can use _ and | and * for the shape. In Python, print each row on its own print() line (use triple quotes to print many lines at once).\nYour Turn — 1. Sketch the JohnnyOS logo and one wallpaper picture (Johnny's favorite thing) on graph paper. 2. Type them into art/logo.py and art/wallpaper.py. 3. Run them and adjust until they look right.\nCheck Yourself — Do the rows line up in a straight column when it runs?", "help": "johnnyos"},
  {"d": 12, "subject": "Independent", "title": "Build the launcher: connect your apps to the shell", "xp": 25, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — Your files so far: boot.py, johnnyos.py, apps/trivia.py, art/logo.py, plus a guess-the-number game if you made one.\nHere's the Idea — A real shell can start other programs. In Python, import subprocess and subprocess.run([\"python3\", \"apps/trivia.py\"]) starts another file. Example: elif cmd == \"trivia\": subprocess.run([\"python3\", \"apps/trivia.py\"]).\nYour Turn — 1. Add commands to johnnyos.py for trivia, logo, and a guess-the-number game (write guess.py in apps if you want it). 2. Show the logo when the shell starts and list the apps in help. 3. Test each command and make sure you return to the prompt after an app ends.\nCheck Yourself — Can you reach every app from the prompt and exit without an error?", "help": "johnnyos"},
  {"d": 13, "subject": "Math", "title": "Scoring math: points, bonus, and fair scores", "xp": 15, "standard": "4.NR.1/4.NR.2", "stage": "apply", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — App scores use multiplication and addition. Example: 7 right answers at 10 points each = 7 x 10 = 70. A bonus of 25 points makes 70 + 25 = 95.\nYour Turn — 1. Decide how many points each right answer in your trivia is worth. 2. Add a bonus for finishing. 3. Work out the highest possible score by hand. 4. Check that your app's top score matches your math.\nCheck Yourself — Does your hand answer match what the app prints on a perfect run?", "quiz": [{"q": "A trivia app has 8 questions worth 15 points each plus a 20 point bonus. What is the top score?", "choices": ["140", "128", "120", "143"], "answerIndex": 0, "explain": "8 x 15 = 120, and 120 + 20 = 140."}]},
  {"d": 14, "subject": "Independent", "title": "Boot into JohnnyOS: start it when the Terminal opens (with a safe backup)", "xp": 25, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — The Terminal, a grown-up beside you.\nHere's the Idea — Linux has a hidden file called .bashrc that runs every time the Terminal opens. Adding one line there starts JohnnyOS automatically, like a computer booting into its desktop. Because it is a settings file, you always make a backup first so you can undo any mistake. Keep an exit command in your shell so you can always get back to the normal terminal.\nSee It Done — Type cp ~/.bashrc ~/.bashrc.backup and press Enter. That copies the file. If anything goes wrong later, cp ~/.bashrc.backup ~/.bashrc puts it back.\nYour Turn — 1. Make the backup. 2. Type nano ~/.bashrc and go to the very bottom with the arrow keys. 3. Add one line: cd ~/johnnyos && python3 boot.py && python3 johnnyos.py. 4. Save with Ctrl + O, Enter, Ctrl + X. 5. Close and reopen the Terminal and check that JohnnyOS starts. 6. Type exit and check you can still reach the normal prompt.\nCheck Yourself — Does JohnnyOS start by itself when a new Terminal opens, and can you leave it?", "help": "johnnyos"},
  {"d": 15, "subject": "Independent", "title": "Test and fix: bug hunt with a grown-up", "xp": 20, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — Your whole johnnyos folder and a grown-up tester.\nHere's the Idea — A bug is a mistake in a program. Builders find them by testing like a real user, trying odd things on purpose. Example: type a command that does not exist, or letters when an app asks for a number, and see what happens.\nYour Turn — 1. Hand the Chromebook to your tester and say nothing. Watch where they get stuck. 2. Write down every problem. 3. Fix at least 3 problems. 4. Test again.\nCheck Yourself — Can a new person use every command without your help?", "help": "johnnyos"},
  {"d": 16, "subject": "Independent", "title": "Teach-Back: explain JohnnyOS like a real operating system", "xp": 15, "standard": "ELAGSE4SL4", "stage": "apply", "passage": "Gather first — JohnnyOS running on the Chromebook.\nHere's the Idea — If you can explain something to someone else, you really understand it. Use the three parts of an OS: the kernel, the shell, and the apps. Example: \"Linux is the kernel underneath. My johnnyos.py is the shell that waits for commands. Trivia and the logo are the apps.\"\nYour Turn — 1. Show Mom JohnnyOS starting up. 2. Point to which part is the kernel, which is the shell, and which are the apps. 3. Explain what a variable, a loop, and an if do, using your own code as examples. 4. Tell her one thing that was hard and how you solved it. 5. Answer one question from her.\nCheck Yourself — Could Mom explain one part of JohnnyOS back to you?"},
  {"d": 17, "subject": "Reading", "title": "Write the JohnnyOS user manual for Johnny", "xp": 15, "standard": "ELAGSE4W2", "stage": "apply", "passage": "Gather first — Paper and a pencil.\nHere's the Idea — Good instructions are short numbered steps in the order they happen. Example: 1. Open the Terminal from the launcher. 2. JohnnyOS starts by itself. 3. Type help to see the commands.\nYour Turn — 1. Write 5 to 7 numbered steps for Johnny to start JohnnyOS and use it. 2. List every command with one line about what it does. 3. Add a tip for what to do if something gets stuck (press Ctrl + C, or type exit). 4. Read it to someone who has never seen it and fix any step they could not follow.\nCheck Yourself — Could a friend follow it without asking you any questions?"},
  {"d": 18, "subject": "Independent", "title": "Release JohnnyOS 1.0: polish, back up, and wrap it", "xp": 20, "standard": "3-5.F", "stage": "apply", "passage": "Gather first — The Chromebook, the user manual, and wrapping supplies.\nHere's the Idea — A real release is tested, tidy, and has a version number. Copy your work somewhere safe so nothing is lost. Example: cp -r johnnyos johnnyos-backup makes a full backup copy of the folder.\nYour Turn — 1. Make the backup copy with cp -r. 2. Make sure the boot screen and welcome message say version 1.0. 3. Run JohnnyOS from a fresh Terminal one more time. 4. Make sure the Chromebook is charged and ask a grown-up to check the settings. 5. Wrap it and attach the user manual. 6. Take a photo for your portfolio.\nCheck Yourself — Does everything work from a fresh start?", "help": "johnnyos"},
  {"d": 19, "subject": "Live Lesson", "title": "Launch Day: present JohnnyOS and give it to Johnny", "xp": 20, "standard": "ELAGSE4SL4", "stage": "apply", "passage": "Gather first — The wrapped Chromebook and your notes.\nHere's the Idea — Presenting a project means telling the story: why you made it, how you built it, and what you learned. Example opening: \"I made this because Johnny loves games, and I wanted to build him an operating system no store sells.\"\nYour Turn — 1. Practice a 1-minute speech out loud. 2. Include one thing you built, one problem you fixed, and one thing you learned about operating systems. 3. Give Johnny the gift and show him how to start JohnnyOS. 4. Afterwards write 3 sentences about how it felt.\nCheck Yourself — Did you speak clearly and look at your listener?"}

var RYAN_JOHNNY_OLD_TITLES = ["Johnny's Birthday Build: Design Brief — plan the Linux gift", "Read: What is Linux, and why is it inside a Chromebook?", "Turn on Linux on the Chromebook (with a grown-up beside you)", "Terminal Basics: pwd, ls, cd, mkdir — make the johnny-arcade folder", "Disk space math: plan how much room the gift needs", "Update Linux and install Python with apt", "Your first Python program: write a birthday message with nano", "Python practice: ask a question with input() and use a variable", "Binary birthday: write a number in binary, then ASCII patterns", "Python practice: loops and if/else — build a guess-the-number game", "Read and plan: write the words for Johnny's birthday card", "Build: a trivia game \"How well do you know Johnny?\"", "Build: ASCII art birthday card for the terminal", "Build: an arcade menu that picks a game", "Scoring math: points, bonus, and fair scores", "Make the terminal greet Johnny when it opens (with a safe backup)", "Test and fix: bug hunt with a grown-up", "Teach-Back: explain how the arcade works to Mom", "Write the instruction card for Johnny", "Finish the gift: clean up, back up, and get it ready", "Gift Day: present the Linux Arcade and give it to Johnny"];
/* Ryan's month-long gift project: JohnnyOS, his own operating system for his friend Johnny, built on the
   Kompanio Chromebook using ChromeOS's built-in Linux kernel (the safe route from the Xubuntu Chromebook
   Guide: no developer mode, no wipe). Each new skill is taught with a worked example first, then
   practiced, then used in the build, and it ends with a teach-back and a gift-day presentation.
   No links on purpose: everything he needs is in the lesson text. */
function addRyanJohnnyBuild(kidId){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var start = packStart();
  var existingTitles = Object.keys(state.assignments).map(function(id){ return state.assignments[id]; })
    .filter(function(a){ return a.kidId===kidId; }).map(function(a){ return a.title; });
  var added = 0;
  RYAN_JOHNNY_BUILD.forEach(function(item){
    if(existingTitles.indexOf(item.title)!==-1) return;
    var d = addSchoolDays(start, item.d);
    db.collection("assignments").add({
      kidId: kidId, date: isoDate(d), subject: item.subject, title: item.title,
      xp: item.xp, done:false, doneAt:null, standard: item.standard||null, stage: item.stage||null,
      passage: item.passage||null, quiz: item.quiz||null, installHelp: item.help||null, skillId: "ryan-linux-birthday-build",
      createdAt: new Date().toISOString()
    });
    added++;
  });
  console.log("addRyanJohnnyBuild: added "+added+" of "+RYAN_JOHNNY_BUILD.length+" assignment(s) for "+kidId);
}
/* Adds the project once, the first time the app opens after this update. If any lesson from it
   already exists (done, moved, or still waiting), it never adds again, so deleting one is safe. */
/* Upgrades unfinished lessons from the first "Birthday Arcade" version to the JohnnyOS version in place.
   Finished lessons and anything with saved work are left exactly as they were. */
function patchRyanJohnnyOS(){
  if(!db) return;
  var n = 0, newTitles = RYAN_JOHNNY_BUILD.map(function(x){ return x.title; });
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!=="kid2" || a.skillId!=="ryan-linux-birthday-build") return;
    var iNew = newTitles.indexOf(a.title), iOld = RYAN_JOHNNY_OLD_TITLES.indexOf(a.title);
    var i = iNew>=0 ? iNew : iOld;
    if(i<0) return;
    var it = RYAN_JOHNNY_BUILD[i], upd = {};
    // The stuck-helper (installHelp) can be added to any of them, even finished ones.
    if((it.help||null)!==(a.installHelp||null)) upd.installHelp = it.help||null;
    // Version 1 lessons that have not been started are upgraded to the JohnnyOS text.
    if(iNew<0 && !a.done && !hasWork(a)) Object.assign(upd, {title:it.title, passage:it.passage, quiz:it.quiz||null, subject:it.subject, standard:it.standard||null, stage:it.stage||null, xp:it.xp});
    if(!Object.keys(upd).length) return;
    Object.assign(a, upd);
    db.doc("assignments/"+id).update(upd);
    n++;
  });
  if(n) console.log("patchRyanJohnnyOS: updated "+n+" lesson(s)");
}
function autoAddRyanJohnnyBuild(){
  if(!db) return;
  var has = Object.keys(state.assignments).some(function(id){ var a = state.assignments[id]; return a.kidId==="kid2" && a.skillId==="ryan-linux-birthday-build"; });
  if(!has) addRyanJohnnyBuild("kid2");
}
function runAutoMigrations(){
  if(!db) return;
  try{
    patchFaithRetag("kid1"); patchFaithRetag("kid2");
    patchAnnaCreativeStudioRetag();
    patchShowTeachTitleCollisions("kid2");
    patchAnnaLessonContent();
    retireAnnaFillerLessons();
    patchKid2Content();
    moveWeekendLessonsToMonday();
    fillAnnaDailyBasics();
    patchRyanJohnnyOS();
    autoAddRyanJohnnyBuild();
  }catch(e){ console.error("auto-migration error", e); }
}
/* School runs Monday to Friday. Anything unfinished, with no saved work, that is dated for a coming
   Saturday or Sunday moves to the next Monday (this is how a Design Studio lesson ended up on a
   Sunday). Past dates are left alone so nothing looks like it vanished. */
function moveWeekendLessonsToMonday(){
  if(!db) return;
  var today = todayISO(), moved = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if((a.kidId!=="kid1" && a.kidId!=="kid2") || a.done || !a.date || a.date<today || !isWeekendIso(a.date) || hasWork(a)) return;
    var mon = isoDate(addSchoolDays(new Date(a.date+"T00:00:00"), 1));
    a.date = mon; db.doc("assignments/"+id).update({date:mon}); moved++;
  });
  if(moved) console.log("moveWeekendLessonsToMonday: moved "+moved+" lesson(s)");
}

/* ---------- Leader: Helper chats (what Ryan asked the AI troubleshooter) ---------- */
function helperChatsCard(){
  var wrap = document.createElement("div");
  wrap.className = "card";
  wrap.style.marginBottom = "10px";
  var det = document.createElement("details");
  var openKey = detailsOpenKey("leader","all",false,"helperchats");
  var body = document.createElement("div");
  var loaded = false;
  function load(){
    var fresh = state.helperChats && (Date.now()-state.helperChats.at) < 60000;
    if(!fresh) body.innerHTML = '<div class="muted" style="font-size:13px;margin-top:8px">Loading…</div>';
    var p = fresh ? Promise.resolve(state.helperChats.res) : sb.from("al_ai_chats").select("*").eq("household_id", HOUSEHOLD_ID).order("created_at", {ascending:false}).limit(300);
    p.then(function(res){
      if(!fresh && !res.error) state.helperChats = {at: Date.now(), res: res};
      body.innerHTML = "";
      if(res.error){
        body.innerHTML = '<div class="muted" style="font-size:13px;margin-top:8px">Couldn\'t load chats ('+escapeHtml(res.error.message||"error")+'). Has the al_ai_chats table been created?</div>';
        return;
      }
      var rows = res.data || [];
      if(!rows.length){
        body.innerHTML = '<div class="muted" style="font-size:13px;margin-top:8px">No helper chats yet.</div>';
        return;
      }
      var groups = {}, order = [];
      rows.slice().reverse().forEach(function(r){
        var day = (r.created_at||"").slice(0,10);
        var key = r.kid_id+"|"+day+"|"+(r.assignment_title||"");
        if(!groups[key]){ groups[key] = {kid:r.kid_id, day:day, title:r.assignment_title||"(lesson)", msgs:[]}; order.push(key); }
        groups[key].msgs.push(r);
      });
      order.reverse().forEach(function(key){
        var g = groups[key];
        var gd = document.createElement("details");
        gd.style.cssText = "border-top:1px solid var(--border);padding:8px 0";
        var gk = detailsOpenKey("leader","chat",false,key);
        if(isDetailsOpen(gk)) gd.open = true;
        gd.addEventListener("toggle", function(){ setDetailsOpen(gk, gd.open); });

/* Start day for the next pack added. Null = today. Weekly packs step in whole school weeks, so
   starting on a Wednesday puts every weekly lesson on a Wednesday. A weekend start rolls to Monday. */
var packStartISO = null;
function packStart(){
  var d = new Date((packStartISO||todayISO())+"T00:00:00");
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}
function packStartChoices(){
  var out = [], d = new Date(todayISO()+"T00:00:00"), names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  while(out.length<10){
    if(d.getDay()!==0 && d.getDay()!==6){
      var label = (out.length===0 && isoDate(d)===todayISO() ? "Today — " : "")+names[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate();
      out.push({iso:isoDate(d), label:label});
    }
    d.setDate(d.getDate()+1);
  }
  return out;
}
