<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Academy | Quest Log</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#1c5738; --paper:#faf3e6; --raised:#ffffff; --border:#ecdfc4;
  --text:#2b3128; --text-dim:#7a7562;
  --gold:#c8952d; --gold-soft:#f4e3ba;
  --teal:#2e7d52; --teal-soft:#dcece1;
  --coral:#b5602f; --coral-soft:#f5e2d3;
  --success:#3f8f52; --success-soft:#e0f0e3;
  --warn:#c8952d;
  --shadow: 0 1px 2px rgba(28,87,56,.07), 0 6px 16px rgba(28,87,56,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9dfc2; --paper:#12181420; --paper:#131a15; --raised:#1b2420; --border:#2c3a2e;
    --text:#eae4d2; --text-dim:#9ea38f;
    --gold:#e0b155; --gold-soft:#3a3320;
    --teal:#6bbf8c; --teal-soft:#1c3327;
    --coral:#e29a68; --coral-soft:#3a2a1e;
    --success:#7dcf93; --success-soft:#1e3324;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#e9dfc2; --paper:#131a15; --raised:#1b2420; --border:#2c3a2e;
  --text:#eae4d2; --text-dim:#9ea38f;
  --gold:#e0b155; --gold-soft:#3a3320;
  --teal:#6bbf8c; --teal-soft:#1c3327;
  --coral:#e29a68; --coral-soft:#3a2a1e;
  --success:#7dcf93; --success-soft:#1e3324;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:"Nunito Sans",system-ui,sans-serif;padding-inline:16px;padding-block:18px 40px;min-height:100%}
h1,h2,h3,.disp{font-family:"Poppins",system-ui,sans-serif;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:840px;margin:0 auto}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:var(--shadow);object-fit:cover;display:block}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--text-dim);margin-top:1px}
.date-pill{font-size:12px;color:var(--text-dim);background:var(--raised);border:1px solid var(--border);padding:6px 10px;border-radius:999px}

/* kid switcher */
.kidbar{display:flex;gap:10px;margin-bottom:16px}
.kid-card{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--border);background:var(--raised);cursor:pointer;text-align:left;transition:border-color .15s,transform .1s}
.kid-card:active{transform:scale(.98)}
.kid-card.active{border-color:var(--kc)}
.kid-avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--kc-soft);color:var(--kc);display:flex;align-items:center;justify-content:center;font-family:"Poppins";font-weight:600;font-size:15px}
.kid-meta{min-width:0}
.kid-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-lvl{font-size:11px;color:var(--text-dim)}
.kid-name[contenteditable]{outline:none;border-bottom:1px dashed transparent}
.kid-name[contenteditable]:focus{border-color:var(--kc)}

/* xp bar */
.xpbar-row{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.xpbar-track{flex:1;height:10px;border-radius:999px;background:var(--gold-soft);overflow:hidden;position:relative}
.xpbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#e8c063);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-label{font-size:12px;color:var(--text-dim);white-space:nowrap}
.streak{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--coral);font-weight:700;white-space:nowrap}
.mm-badge{flex:none;display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--ink);background:var(--gold-soft);padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:"JetBrains Mono"}

/* reward banner */
.reward-card{background:linear-gradient(155deg,var(--gold),#a9762a);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);color:#fff}
.reward-card h3{margin:0 0 3px;font-size:16px}
.reward-card p{margin:0 0 12px;font-size:12.5px;opacity:.92}
.reward-opts{display:flex;gap:8px;flex-wrap:wrap}
.reward-opt{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.55);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px}
.reward-opt:hover{background:rgba(255,255,255,.3)}
.reward-skip{background:none;border:none;color:#fff;opacity:.75;font-size:12.5px;font-weight:700;padding:10px 6px;text-decoration:underline}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 4px;font-size:13px;font-weight:700;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;margin-right:10px}
.tab.active{color:var(--ink);border-color:var(--gold)}

/* cards */
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:20px 0 8px}
.section-title:first-child{margin-top:0}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:.15s}
.check.done{background:var(--success);border-color:var(--success)}
.check svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:.15s}
.check.done svg{opacity:1;transform:scale(1)}
.task-body{flex:1;min-width:0}
.task-title{font-weight:700;font-size:14.5px}
.task-title.done{text-decoration:line-through;color:var(--text-dim)}
.task-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.task-xp{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;font-family:"JetBrains Mono"}
.del{background:none;border:none;color:var(--text-dim);font-size:16px;padding:2px 4px;line-height:1;opacity:.5}
.del:hover{opacity:1;color:var(--coral)}
.empty{padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px}

/* add form */
.addrow{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
.addrow input,.addrow select{flex:1;min-width:110px;font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--paper);color:var(--text)}
.addrow button{flex:none;padding:9px 14px;border-radius:9px;border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px}

/* schedule */
.day-block{margin-bottom:14px}
.day-head{font-family:"Poppins";font-weight:600;font-size:14px;margin:0 0 6px 2px;color:var(--ink)}
.slot{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);align-items:center}
.slot:last-child{border-bottom:none}
.slot-time{font-family:"JetBrains Mono";font-size:11.5px;color:var(--text-dim);width:56px;flex:none}
.slot-body[contenteditable]{flex:1;font-size:13.5px;font-weight:600;outline:none;border-radius:6px;padding:2px 4px}
.slot-body[contenteditable]:focus{background:var(--paper)}

/* week planner grid */
.planner-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 16px;padding:0 4px}
.planner-grid{width:100%;border-collapse:separate;border-spacing:6px;min-width:640px}
.planner-grid th{text-align:left;font-family:"Poppins";font-weight:600;font-size:12.5px;color:var(--text-dim);padding:2px 8px 6px}
.planner-grid th.planner-today{color:var(--gold)}
.planner-row-label{width:120px;vertical-align:top;padding:10px 8px 0 2px!important}
.planner-row-label .prl-icon{font-size:17px}
.planner-row-label .prl-name{font-weight:700;font-size:12.5px;margin-top:2px}
.planner-row-label .prl-time{font-family:"JetBrains Mono";font-size:10.5px;color:var(--text-dim)}
.planner-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;vertical-align:top;min-width:118px}
.planner-cell.planner-today-col{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.planner-chip-line{font-size:11px;padding:3px 7px;border-radius:999px;display:inline-block}
.planner-task{display:flex;align-items:flex-start;gap:5px;margin-bottom:5px;cursor:pointer}
.planner-task:last-child{margin-bottom:0}
.planner-task .check{width:18px;height:18px;flex:none;margin-top:1px}
.planner-task .pt-title{font-size:11.5px;line-height:1.3;color:var(--text)}
.planner-task .pt-title.done{text-decoration:line-through;color:var(--text-dim)}
.planner-empty{font-size:11px;color:var(--text-dim);opacity:.7}

/* progress */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-family:"JetBrains Mono";font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-lbl{width:82px;flex:none;font-size:12.5px;font-weight:700}
.bar-track{flex:1;height:9px;border-radius:999px;background:var(--paper);overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:999px}
.bar-pct{width:36px;flex:none;text-align:right;font-family:"JetBrains Mono";font-size:11.5px;color:var(--text-dim)}
.compare{display:flex;gap:10px}
.compare>div{flex:1}

/* arena */
.arena-hero{background:linear-gradient(155deg,var(--kc,var(--gold)),color-mix(in srgb, var(--kc,var(--gold)) 60%, #000));border-radius:16px;padding:20px;color:#fff;margin-bottom:16px;box-shadow:var(--shadow)}
.arena-hero h2{margin:0 0 4px;font-size:19px}
.arena-hero p{margin:0;font-size:13px;opacity:.9}
.subj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.subj-btn{padding:16px 12px;border-radius:14px;border:1px solid var(--border);background:var(--raised);text-align:left;box-shadow:var(--shadow)}
.subj-btn .n{font-size:11px;color:var(--text-dim)}
.subj-btn .t{font-family:"Poppins";font-weight:600;font-size:15px;margin-top:2px}
.qz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);font-family:"JetBrains Mono"}
.qz-timer{font-weight:700;color:var(--coral)}
.qz-card{background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.qz-q{font-family:"Poppins";font-weight:600;font-size:18px;margin:0 0 16px}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qz-opt{padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:var(--paper);font-weight:700;font-size:14px;text-align:center}
.qz-opt.correct{border-color:var(--success);background:var(--success-soft)}
.qz-opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.qz-result{text-align:center;padding:10px}
.qz-result .big{font-family:"Poppins";font-size:30px;margin:6px 0}
.primary-btn{background:var(--ink);color:var(--paper);border:none;padding:12px 20px;border-radius:11px;font-weight:700;font-size:14px;margin-top:14px}
.qform{display:flex;flex-direction:column;gap:8px}
.qform input,.qform select{font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--paper);color:var(--text)}
.qform .opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--text-dim);font-size:12.5px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

.login-wrap{max-width:360px;margin:80px auto;padding:0 16px}
.login-card{background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.login-card h1{font-size:20px;margin:0 0 4px}
.login-card p{color:var(--text-dim);font-size:13px;margin:0 0 18px}
.login-card input{width:100%;font:inherit;font-size:14px;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:var(--paper);color:var(--text);margin-bottom:10px}
.login-card button{width:100%;padding:12px;border-radius:10px;border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px}
.login-err{color:var(--coral);font-size:12.5px;margin:-2px 0 10px;min-height:1em}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap" id="loginGate">
  <div class="login-card">
    <h1>Forge Academy</h1>
    <p>Sign in with your Momma Money account to sync Anna &amp; Ryan's progress.</p>
    <form id="loginForm">
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <div class="login-err" id="loginError"></div>
      <button id="loginBtn" type="submit">Log In</button>
    </form>
  </div>
</div>
<div id="appRoot" style="display:none">


<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <img class="brand-mark" src="logo.png" alt="Forge Academy">
      <div>
        <h1>Forge Academy | Quest Log</h1>
        <div class="sub">Forge Academy &mdash; Student Portal &middot; part of the <a href="https://ms-bee-create.github.io/momma-money/" target="_blank" rel="noopener" style="color:var(--gold);font-weight:700;text-decoration:none">Momma Money</a> family</div>
      </div>
    </div>
    <div class="date-pill" id="datePill"></div>
  </div>

  <div class="kidbar" id="kidbar"></div>
  <div class="xpbar-row" id="xpbarRow"></div>
  <div id="rewardBanner"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="today">Today</button>
    <button class="tab" data-tab="week">Planner</button>
    <button class="tab" id="libraryTabBtn" data-tab="library">Library</button>
    <button class="tab" data-tab="arena">Arena</button>
    <button class="tab" data-tab="leader">Leader</button>
  </div>

  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

</div>
<script>
(function(){
"use strict";

var KIDS = [
  {id:"kid1", defaultName:"2nd Grader", color:"teal"},
  {id:"kid2", defaultName:"4th Grader", color:"coral"}
];
var DAYS = ["Mon","Tue","Wed","Thu","Fri"];
var DAY_LABEL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
var SUBJECT_COLOR = {
  "Math":"gold","ELA":"teal","Reading":"teal","Science":"coral","Social Studies":"gold",
  "Related Arts":"success","Live Lesson":"teal","Independent":"gold","Computer Science":"teal"
};
/* Rough time-on-task estimate per subject, used only for the exported hours report — the app has
   no in-lesson timer, so this is a stand-in based on typical lesson length, not measured time.
   Independent/Computer Science lean high on purpose (this is where VM installs and real project
   work live, and those routinely run long) so the default is usually close without needing a
   manual fix every time — logging actualMinutes is for the real outliers, not the norm. */
var SUBJECT_EST_MINUTES = {
  "Math":30,"ELA":30,"Reading":30,"Science":30,"Social Studies":30,
  "Related Arts":30,"Live Lesson":45,"Independent":90,"Computer Science":90
};
/* Lessons with hands-on VM/OS setup help attached (installHelp) run especially long —
   troubleshooting an install is real, open-ended deep work — so they default even higher than
   the already-bumped Independent/Computer Science estimate. */
var INSTALL_HELP_EST_MINUTES = 120;
/* Journal (Morning Launch) and Show & Teach aren't tagged assignments, so without this they'd get
   zero hour credit at all even on a day he spent a real hour writing a thoughtful entry. */
var JOURNAL_EST_MINUTES = 45;
var REFLECTION_EST_MINUTES = 20;

/* A flat guess is fine for a typical lesson, but badly undercounts a long, deep-work session
   (e.g. hours of real VM troubleshooting/reasoning) — actualMinutes, when the leader logs it,
   always wins over any guess. */
function estMinutesFor(a){
  if(a.actualMinutes>0) return a.actualMinutes;
  if(a.installHelp) return INSTALL_HELP_EST_MINUTES;
  return SUBJECT_EST_MINUTES[a.subject] || 30;
}
/* Every subject a quest counts toward for hours/coverage tracking — its primary subject plus any
   crossSubjects tags. An install/setup quest like "set up VirtualBox" is filed under Independent
   for scheduling, but the actual work is reading technical docs, writing up what happened,
   computer-science concepts, and (for the Retro OS Museum track) real OS history — so it should
   get hour credit in all of those, not just Independent. */
function subjectsFor(a){
  var list = [a.subject];
  if(Array.isArray(a.crossSubjects)) a.crossSubjects.forEach(function(s){ if(list.indexOf(s)<0) list.push(s); });
  return list;
}
/* Total estimated minutes for one kid on one day, including the journal/reflection blocks that
   aren't tagged assignments and would otherwise get zero hour credit no matter how long they took. */
function dailyEngagementMinutes(kidId, iso){
  var mins = assignmentsFor(kidId, iso).reduce(function(sum,a){ return sum + estMinutesFor(a); }, 0);
  if(journalEntryFor(kidId, iso)) mins += JOURNAL_EST_MINUTES;
  if(reflectionFor(kidId, iso)) mins += REFLECTION_EST_MINUTES;
  return mins;
}
function weekBoundsMonFri(ref){
  var d = ref ? new Date(ref) : new Date();
  var idx = todayIdxFor(d);
  var mon = new Date(d); mon.setHours(0,0,0,0); mon.setDate(d.getDate()-idx);
  var fri = new Date(mon); fri.setDate(mon.getDate()+4); fri.setHours(23,59,59,999);
  return {start:mon, end:fri};
}
function todayIdxFor(d){ var day = d.getDay(); return day===0?6:day-1; }
/* Georgia Home Study Law (O.C.G.A. § 20-2-690.1) tracking targets — 180 attendance days/year,
   ~4.5 hours/day. attendanceCount is a running tally of distinct calendar days the kid was
   active in the app; lastAttendanceDate guards against double-counting the same day. */
var GA_ANNUAL_DAYS_TARGET = 180;
var GA_DAILY_HOURS_TARGET = 4.5;
function stampAttendance(kidId){
  var kd = kidData(kidId);
  var todayStr = todayISO();
  if(kd.lastAttendanceDate === todayStr) return;
  var updates = {attendanceCount: (kd.attendanceCount||0)+1, lastAttendanceDate: todayStr};
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  if(db) db.doc("kids/"+kidId).update(updates);
}
var CROSS_CURRICULAR_BONUS_XP = 5;

/* Calm Mode / Focus Mode toggles — per kid, per device (localStorage, not synced), since these
   are about how a specific kid's screen behaves right now, not data the leader needs to see. */
function getModeFlag(key, kidId){
  try{ return localStorage.getItem(key+"_"+kidId)==="1"; } catch(e){ return false; }
}
function setModeFlag(key, kidId, val){
  try{ localStorage.setItem(key+"_"+kidId, val?"1":"0"); } catch(e){ /* private browsing etc — just won't persist */ }
}
function isFocusMode(kidId){ return getModeFlag("al_focus", kidId); }
function isCalmMode(kidId){ return getModeFlag("al_calm", kidId); }
function getModeFlagStr(key, kidId){
  try{ return localStorage.getItem(key+"_"+kidId); } catch(e){ return null; }
}
function setModeFlagStr(key, kidId, val){
  try{ localStorage.setItem(key+"_"+kidId, val); } catch(e){ /* private browsing etc — just won't persist */ }
}

var state = {
  activeKid: "kid1",
  tab: "today",
  kids: {}, // id -> data
  assignments: {}, // id -> data (kid+day+subject+title+xp+done)
  schedules: {}, // kidId -> {blocks:[]}
  questions: [],
  quiz: null, // active quiz state
  miniGame: null, // active arcade mini-game state (Space Mission / Parkour Course)
  mathGuideOpen: false, // whether the Math Field Guide view is showing

function todayIdx(){ var d = new Date().getDay(); return d===0?6:d-1; } // 0=Mon..6=Sun
function todayKey(){ var i = todayIdx(); return i<5 ? DAYS[i] : null; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoDate(new Date()); }
function fmtDate(iso){
  if(!iso) return "";
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}

els.datePill.textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});

function toast(msg){
  els.toast.textContent = msg;

  toast._t = setTimeout(function(){ els.toast.classList.remove("show"); }, 1800);
}

function levelFor(xp){ return Math.floor(xp/100)+1; }
function progressFor(xp){ return xp % 100; }

function kidData(id){

/* ---------- render: kid switcher + xp bar ---------- */

/* ---------- helpers ---------- */
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
/* dateFilter: null = all of this kid's assignments; a "YYYY-MM-DD" string = exact date; a function(date)->bool = predicate */
function assignmentsFor(kidId, dateFilter){
  return Object.keys(state.assignments).map(function(id){ return Object.assign({id:id}, state.assignments[id]); })
    .filter(function(a){
      if(a.kidId!==kidId) return false;
      if(dateFilter==null) return true;
      if(typeof dateFilter==="function") return dateFilter(a.date);
      return a.date===dateFilter;
    })
    .sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (a.date||"").localeCompare(b.date||"") || (a.subject||"").localeCompare(b.subject||""); });
}
function subjectChip(subject){
  var key = SUBJECT_COLOR[subject] || "gold";
  return '<span class="chip" style="background:var(--'+key+'-soft);color:var(--'+key+')">'+escapeHtml(subject)+'</span>';
}

function materialsLinkHtml(materials){
  var m = materials.trim();
  if(/^https?:\/\//i.test(m)){
    return '<a href="'+escapeHtml(m)+'" target="_blank" rel="noopener" style="color:var(--teal);font-weight:700;text-decoration:none">🔗 Open materials</a>';
  }
  return '📎 '+escapeHtml(m);
}

function videoLinkHtml(video){
  var v = video.trim();
  if(/^https?:\/\//i.test(v)){
    return '<a href="'+escapeHtml(v)+'" target="_blank" rel="noopener" style="color:var(--coral);font-weight:700;text-decoration:none">🎥 Watch video</a>';
  }
  return '🎥 '+escapeHtml(v);
}

/* Speaks text aloud via the Web Speech API so a kid can hear instructions read
   instead of/alongside reading them himself. Silently no-ops if unsupported. */
function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95;
  window.speechSynthesis.speak(u);
}
function speakerBtnHtml(){
  return '<button class="speak-btn" title="Read aloud" aria-label="Read aloud" style="border:none;background:none;cursor:pointer;font-size:15px;padding:0 4px;line-height:1;vertical-align:middle">🔊</button>';
}

function taskRow(a){
  var row = document.createElement("div");

      '<div class="task-title'+(a.done?" done":"")+'">'+escapeHtml(a.title)+' '+speakerBtnHtml()+'</div>'+
      '<div class="task-sub">'+subjectChip(a.subject)+' &nbsp;'+(a.date ? fmtDate(a.date) : (DAY_LABEL[a.day]||""))+
        (a.standard ? ' &nbsp;<span class="chip" style="background:var(--paper);color:var(--text-dim);border:1px solid var(--border)">'+escapeHtml(a.standard)+'</span>' : '')+
        (a.crossCurricular ? ' &nbsp;<span class="chip" style="background:var(--gold-soft);color:var(--gold)">🔀 cross-curricular +'+CROSS_CURRICULAR_BONUS_XP+' XP</span>' : '')+
        (hasWork(a) ? ' &nbsp;<span class="chip" style="background:var(--teal-soft);color:var(--teal)">📝 work saved</span>' : '')+
        (a.reviewStatus==="flagged" ? ' &nbsp;<span class="chip" style="background:var(--coral-soft);color:var(--coral)">🚩 needs another look</span>' : '')+
      '</div>'+

    '</div>'+
    '<div class="task-xp">+'+a.xp+' XP</div>'+

  row.querySelector(".check").onclick = function(){ toggleAssignment(a); };
  row.querySelector(".del").onclick = function(){ if(db) db.doc("assignments/"+a.id).delete(); };
  row.querySelector(".speak-btn").onclick = function(e){ e.stopPropagation(); speak(a.title); };
  var linkEls = row.querySelectorAll(".task-body a");
  Array.prototype.forEach.call(linkEls, function(el){ el.addEventListener("click", function(e){ e.stopPropagation(); }); });
  row.querySelector(".task-body").onclick = function(){ state.lessonDetailId = a.id; renderView(); };
  return row;
}

function toggleAssignment(a){
  if(!db) return;
  var willDone = !a.done;
  var doneAt = willDone ? new Date().toISOString() : null;
  if(state.assignments[a.id]){ state.assignments[a.id].done = willDone; state.assignments[a.id].doneAt = doneAt; renderView(); }
  db.doc("assignments/"+a.id).update({done: willDone, doneAt: doneAt});
  var kd = kidData(a.kidId);
  var oldXp = kd.xp||0;
  var bonusXp = (willDone && a.crossCurricular) ? CROSS_CURRICULAR_BONUS_XP : 0;
  var delta = willDone ? (a.xp+bonusXp) : -a.xp;
  var newXp = Math.max(0, oldXp + delta);
  var updates = {xp: newXp};
  var newStreakDay = false;
  if(willDone){
    var last = kd.lastCompletedDate;
    var todayStr = new Date().toDateString();
    if(last !== todayStr){
      var y = new Date(); y.setDate(y.getDate()-1);
      updates.streak = (last === y.toDateString()) ? (kd.streak||0)+1 : 1;
      updates.lastCompletedDate = todayStr;
      newStreakDay = true;
    }
  }
  var lvl = willDone ? levelUpBonus(oldXp, newXp) : {gained:0, bonus:0, newLevel:levelFor(newXp)};
  if(lvl.gained>0) updates.mommaMoney = (kd.mommaMoney||0) + lvl.bonus;
  Object.assign(kd, updates);
  state.kids[a.kidId] = kd;
  db.doc("kids/"+a.kidId).update(updates);
  if(willDone) toast(bonusXp ? "+"+a.xp+" XP + "+bonusXp+" cross-curricular bonus! 🎉" : "+"+a.xp+" XP! Nice work 🎉");
  if(a.kidId===state.activeKid) renderXpBar();
  if(newStreakDay && a.kidId===state.activeKid && !isCalmMode(a.kidId)) celebrate();
  if(lvl.gained>0){
    logLevelUpReward(a.kidId, lvl);
  }
}

/* Victory chime (synthesized tone, no audio asset needed) + lightweight CSS confetti,
   fired once per day when a kid's streak first advances. */
function celebrate(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    [523.25, 659.25, 783.99].forEach(function(freq, i){
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      osc.connect(gain); gain.connect(ctx.destination);
      var start = ctx.currentTime + i*0.12;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.25, start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start+0.35);
      osc.start(start); osc.stop(start+0.4);
    });
  } catch(e){ /* Web Audio unavailable — skip the chime, confetti still plays */ }

  var colors = ["#ffb703","#fb8500","#219ebc","#8ecae6","#2a9d8f"];
  for(var i=0; i<28; i++){
    var piece = document.createElement("div");
    var color = colors[i % colors.length];
    var left = Math.random()*100;
    var delay = Math.random()*0.3;
    var duration = 1.1 + Math.random()*0.6;
    var rotate = Math.random()*360;
    piece.style.cssText = "position:fixed;top:-12px;left:"+left+"vw;width:8px;height:14px;background:"+color+
      ";z-index:9999;pointer-events:none;opacity:0.9;transform:rotate("+rotate+"deg);"+
      "animation:confetti-fall "+duration+"s ease-in "+delay+"s forwards";
    document.body.appendChild(piece);
    (function(el, d, del){ setTimeout(function(){ el.remove(); }, (d+del)*1000+50); })(piece, duration, delay);
  }
}
if(!document.getElementById("confettiKeyframes")){
  var kf = document.createElement("style");
  kf.id = "confettiKeyframes";
  kf.textContent = "@keyframes confetti-fall{to{top:100vh;opacity:0.2;transform:rotate(540deg)}}";
  document.head.appendChild(kf);
}

/* $3 Momma Money per level gained; called after any XP change */
function levelUpBonus(oldXp, newXp){
  var oldLevel = levelFor(Math.max(0,oldXp));
  var newLevel = levelFor(Math.max(0,newXp));
  var gained = Math.max(0, newLevel-oldLevel);
  return {gained: gained, bonus: gained*3, newLevel: newLevel};
}
function logLevelUpReward(kidId, lvl){
  if(db) db.collection("rewards").add({kidId: kidId, type:"level-up", level: lvl.newLevel, amount: lvl.bonus, at: new Date().toISOString()});
  showLevelUpBanner(kidId, lvl);
}
function showLevelUpBanner(kidId, lvl){
  if(kidId!==state.activeKid){ return; }
  var card = document.createElement("div");
  card.className = "reward-card";
  card.innerHTML =
    '<h3>🎉 Level '+lvl.newLevel+'!</h3>'+
    '<p>+$'+lvl.bonus+' Momma Money — add it on the Momma Money site when you get a chance. It\'s also tallied below for reference.</p>'+
    '<button class="reward-skip" id="lvlDismiss" style="color:#fff;opacity:1">Nice!</button>';
  els.rewardBanner.innerHTML = "";
  els.rewardBanner.appendChild(card);
  document.getElementById("lvlDismiss").onclick = function(){ els.rewardBanner.innerHTML=""; };
}

/* ---------- Today: guided daily blocks ----------
   The day is broken into a fixed sequence of blocks. A block "unlocks" only once every block
   before it is complete — later blocks render locked and dimmed. This is deliberate: Ryan does
   better with one clear next step than a flat list he can skim past, and it mirrors the
   "what do I do next" structure that works for him elsewhere (see Leader's Guide, Show & Teach). */
var DAILY_BLOCKS = [
  {key:"morning", label:"Morning Launch", icon:"🌅"},
  {key:"math", label:"Math in the Machine", icon:"🧮", subjects:["Math"]},
  {key:"reading", label:"Reading Block", icon:"📖", subjects:["ELA","Reading"]},
  {key:"project", label:"Main Project", icon:"🛠️", subjects:["Independent","Related Arts","Live Lesson"]},
  {key:"sciSocial", label:"Science & Social Studies", icon:"🔬", subjects:["Science","Social Studies"]},
  {key:"showTeach", label:"Show & Teach", icon:"🎤"}
];
function blockKeyFor(a){
  if(a.block) return a.block;
  for(var i=0;i<DAILY_BLOCKS.length;i++){
    var b = DAILY_BLOCKS[i];
    if(b.subjects && b.subjects.indexOf(a.subject)>=0) return b.key;
  }
  return "project";
}
function journalEntryFor(kidId, iso){
  return (state.journalEntries||[]).filter(function(j){ return j.kidId===kidId && j.date===iso; })[0] || null;
}
function reflectionFor(kidId, iso){
  return (state.reflections||[]).filter(function(r){ return r.kidId===kidId && r.date===iso; })[0] || null;
}
function blockComplete(blockKey, kidId, iso, tasksByBlock){
  if(blockKey==="morning"){
    var j = journalEntryFor(kidId, iso);
    return !!(j && j.yesterday && j.today);
  }
  if(blockKey==="showTeach") return !!reflectionFor(kidId, iso);
  var tasks = tasksByBlock[blockKey] || [];
  if(!tasks.length) return true; // nothing assigned to this block today — auto-pass, don't block the day on it
  return tasks.every(function(a){ return a.done; });
}
function disablePaste(el){ el.addEventListener("paste", function(e){ e.preventDefault(); }); }

function renderModeToggleRow(kidId){
  var row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap";
  var focusOn = isFocusMode(kidId), calmOn = isCalmMode(kidId);

  var focusBtn = document.createElement("button");
  focusBtn.type = "button";
  focusBtn.className = "reward-skip";
  focusBtn.style.cssText = "opacity:1;border:1px solid var(--border);font-size:12.5px;padding:6px 10px;"+
    (focusOn ? "background:var(--gold-soft);color:var(--ink);font-weight:700" : "background:var(--card);color:var(--text-dim)");
  focusBtn.textContent = focusOn ? "🎯 Focus Mode: ON" : "🎯 Focus Mode";
  focusBtn.onclick = function(){ setModeFlag("al_focus", kidId, !focusOn); renderAll(); };
  row.appendChild(focusBtn);

  var calmBtn = document.createElement("button");
  calmBtn.type = "button";
  calmBtn.className = "reward-skip";
  calmBtn.style.cssText = "opacity:1;border:1px solid var(--border);font-size:12.5px;padding:6px 10px;"+
    (calmOn ? "background:var(--teal-soft);color:var(--ink);font-weight:700" : "background:var(--card);color:var(--text-dim)");
  calmBtn.textContent = calmOn ? "🧘 Calm Mode: ON" : "🧘 Calm Mode";
  calmBtn.onclick = function(){ setModeFlag("al_calm", kidId, !calmOn); renderView(); };
  row.appendChild(calmBtn);

  if(calmOn){
    var breakBtn = document.createElement("button");
    breakBtn.type = "button";
    breakBtn.className = "reward-skip";
    breakBtn.style.cssText = "opacity:1;border:1px solid var(--border);font-size:12.5px;padding:6px 10px;background:var(--card);color:var(--text-dim)";
    breakBtn.textContent = "☕ Take a Break";
    breakBtn.onclick = function(){ logBreak(kidId); };
    row.appendChild(breakBtn);
  }
  return row;
}

function renderToday(){
  els.view.innerHTML = "";
  var kidId = state.activeKid;
  var iso = todayISO();
  var focusOn = isFocusMode(kidId);

  var title = document.createElement("div");
  title.className = "section-title";
  title.textContent = fmtDate(iso) + "'s Daily Rhythm";
  els.view.appendChild(title);
  els.view.appendChild(renderModeToggleRow(kidId));

  var list = assignmentsFor(kidId, iso);
  var tasksByBlock = {};
  list.forEach(function(a){
    var k = blockKeyFor(a);
    tasksByBlock[k] = tasksByBlock[k] || [];
    tasksByBlock[k].push(a);
  });

  var firstIncompleteIdx = DAILY_BLOCKS.length;
  for(var i=0;i<DAILY_BLOCKS.length;i++){
    if(!blockComplete(DAILY_BLOCKS[i].key, kidId, iso, tasksByBlock)){ firstIncompleteIdx = i; break; }
  }

  state.lastBlockIdx = state.lastBlockIdx || {};
  if(state.lastBlockIdx[kidId]!=null && firstIncompleteIdx > state.lastBlockIdx[kidId]){
    var justDone = DAILY_BLOCKS[state.lastBlockIdx[kidId]];
    var next = DAILY_BLOCKS[firstIncompleteIdx];
    if(justDone) toast("🎉 "+justDone.label+" complete!"+(next?" Next: "+next.label:""));
  }
  state.lastBlockIdx[kidId] = firstIncompleteIdx;

  DAILY_BLOCKS.forEach(function(block, idx){
    /* Focus Mode: show only the one block that's actually actionable right now — no
       collapsed-done trail, no preview of what's coming. */
    if(focusOn && idx!==firstIncompleteIdx) return;
    els.view.appendChild(renderDailyBlockCard(block, kidId, iso, tasksByBlock[block.key]||[],
      idx<firstIncompleteIdx, idx===firstIncompleteIdx));
  });

  if(firstIncompleteIdx>=DAILY_BLOCKS.length){
    var done = document.createElement("div");
    done.className = "card empty";
    done.style.marginTop="12px";
    done.innerHTML = "🏁 <b>All of today's blocks complete!</b> Streak locked in.";
    els.view.appendChild(done);
  }
}

/* Order is a suggestion, not a lock: every block is always tappable, in any order. The current
   (first-incomplete) block auto-expands so there's still a clear "what's next," but nothing stops
   him from jumping ahead to a later block or back to review a done one. */
function renderDailyBlockCard(block, kidId, iso, tasks, isDone, isActive){
  var card = document.createElement("div");
  card.className = "card";
  card.style.marginBottom = "10px";
  if(isActive) card.style.borderColor = "var(--gold)";

  var hasOverride = !!(state.expandedBlocks && (block.key in state.expandedBlocks));
  var showBody = hasOverride ? state.expandedBlocks[block.key] : isActive;

  var head = document.createElement("div");
  head.style.cssText = "display:flex;align-items:center;gap:10px;cursor:pointer";
  head.innerHTML =
    '<span style="font-size:20px">'+(isDone?"✅":block.icon)+'</span>'+
    '<div style="flex:1">'+
      '<div style="font-weight:700">'+escapeHtml(block.label)+(isActive?' <span class="chip" style="background:var(--gold-soft);color:var(--gold);font-size:10.5px;vertical-align:middle">up next</span>':'')+'</div>'+
      (isDone ? '<div class="muted" style="font-size:12px">'+(showBody?"Tap to collapse":"Done — tap to review")+'</div>' : '')+
    '</div>';
  head.onclick = function(){
    state.expandedBlocks = state.expandedBlocks || {};
    state.expandedBlocks[block.key] = !showBody;
    renderView();
  };
  card.appendChild(head);

  if(showBody){
    var body = document.createElement("div");
    body.style.marginTop = "10px";
    if(block.key==="morning"){
      body.appendChild(renderMorningLaunch(kidId, iso));
    } else if(block.key==="showTeach"){
      body.appendChild(renderShowTeach(kidId, iso));
    } else if(!tasks.length){
      var empty = document.createElement("div");
      empty.className = "muted";
      empty.style.fontSize = "13px";
      empty.textContent = "Nothing assigned to this block today.";
      body.appendChild(empty);
    } else {
      tasks.forEach(function(a){ body.appendChild(taskRow(a)); });
    }
    card.appendChild(body);
  }
  return card;
}

function renderMorningLaunch(kidId, iso){
  var wrap = document.createElement("div");
  var existing = journalEntryFor(kidId, iso);
  wrap.innerHTML =

    '<label style="display:block;font-size:12.5px;font-weight:600;margin-bottom:4px">Today\'s goal — what are you aiming for?</label>'+
    '<textarea class="jl-today" rows="2" maxlength="240" style="width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:10px;box-sizing:border-box" placeholder="Type it in your own words — no pasting"></textarea>'+
    '<button class="primary-btn jl-save" style="margin-top:0">💾 Save & continue</button>';

      db.doc("journal/"+existing.id).update({yesterday:y, today:t});
    } else {

function renderShowTeach(kidId, iso){
  var wrap = document.createElement("div");
  var existing = reflectionFor(kidId, iso);
  wrap.innerHTML =
    '<div class="muted" style="font-size:12.5px;margin-bottom:8px">Pick ONE thing you fixed, figured out, or got working today — show it, don\'t just tell it.</div>'+
    '<textarea class="st-text" rows="2" maxlength="200" style="width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);margin-bottom:10px;box-sizing:border-box" placeholder="One-sentence reflection (or upload audio/photo/video instead) — no pasting"></textarea>'+
    '<div class="st-upload-row" style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"></div>'+
    '<div class="st-uploaded muted" style="font-size:12px;margin-bottom:8px"></div>'+
    '<button class="primary-btn st-save">💾 Save Show &amp; Teach</button>';
  var textEl = wrap.querySelector(".st-text");
  textEl.value = existing && existing.type==="text" ? existing.text||"" : "";
  disablePaste(textEl);

  var uploadedNote = wrap.querySelector(".st-uploaded");
  var pendingUpload = existing && existing.type!=="text" ? {type:existing.type, url:existing.url} : null;
  if(pendingUpload) uploadedNote.textContent = "Saved "+pendingUpload.type+" attached.";

  var uploadRow = wrap.querySelector(".st-upload-row");
  function makeUploadBtn(label, accept, type){
    var lbl = document.createElement("label");
    lbl.className = "reward-skip";
    lbl.style.cssText = "color:var(--ink);opacity:1;border:1px solid var(--border);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px";
    lbl.textContent = label;
    var input = document.createElement("input");
    input.type = "file"; input.accept = accept; input.style.display = "none";
    input.onchange = function(){
      var file = input.files[0];
      if(!file || !HOUSEHOLD_ID) return;
      var path = HOUSEHOLD_ID+"/show-teach/"+kidId+"/"+iso+"-"+Date.now()+"-"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      lbl.textContent = "Uploading…";
      sb.storage.from("lesson-uploads").upload(path, file).then(function(res){
        lbl.textContent = label;
        if(res.error){ toast("⚠️ Couldn't upload — check your connection and try again"); return; }
        var url = sb.storage.from("lesson-uploads").getPublicUrl(path).data.publicUrl;
        pendingUpload = {type:type, url:url};
        uploadedNote.textContent = type+" ready — tap Save to finish.";
      });
    };
    lbl.appendChild(input);
    return lbl;
  }
  uploadRow.appendChild(makeUploadBtn("🎙️ Audio", "audio/*", "audio"));
  uploadRow.appendChild(makeUploadBtn("📸 Photo", "image/*", "photo"));
  uploadRow.appendChild(makeUploadBtn("🎥 Video", "video/*", "video"));

  wrap.querySelector(".st-save").onclick = function(){
    if(!db) return;
    var text = textEl.value.trim();
    var payload;
    if(pendingUpload) payload = {type: pendingUpload.type, url: pendingUpload.url, text: text || null};
    else if(text) payload = {type:"text", text: text, url: null};
    else { toast("Add a sentence or an upload first"); return; }
    if(existing && existing.id){
      Object.assign(existing, payload);
      db.doc("reflections/"+existing.id).update(payload);
    } else {
      var newId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random();
      var localEntry = Object.assign({id:newId, kidId:kidId, date:iso, createdAt:new Date().toISOString()}, payload);
      state.reflections = state.reflections || [];
      state.reflections.push(localEntry);
      db.collection("reflections").add(localEntry);
    }
    toast("🎤 Show & Teach saved!");
    renderView();
  };
  return wrap;
}

/* ---------- Planner (Day / Week / Month) ---------- */
/* Non-editable, presentational only — a suggested rhythm to the day, not a schedule to maintain.
   Replaces the old free-text "Daily Rhythm" time editor per feedback that it wasn't worth keeping
   as a separate, always-slightly-stale thing to hand-edit. */
var BLOCK_SUGGESTED_TIME = {
  morning:"9:00a", math:"9:20a", reading:"10:30a", project:"11:15a", sciSocial:"1:00p", showTeach:"1:45p"
};
function plannerCompactTask(a){
  var el = document.createElement("div");
  el.className = "planner-task";
  el.innerHTML =
    '<button class="check'+(a.done?" done":"")+'" aria-label="Mark complete" style="width:18px;height:18px;flex:none"><svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg></button>'+
    '<span class="pt-title'+(a.done?" done":"")+'">'+escapeHtml(a.title.length>50?a.title.slice(0,50)+"…":a.title)+'</span>';
  el.querySelector(".check").onclick = function(e){ e.stopPropagation(); toggleAssignment(a); };
  el.onclick = function(){ state.lessonDetailId = a.id; renderView(); };
  return el;
}
function plannerJournalChip(done, label){
  var el = document.createElement("div");
  el.className = "planner-chip-line";
  el.style.cssText = "background:"+(done?"var(--success-soft)":"var(--paper)")+";color:"+(done?"var(--success)":"var(--text-dim)")+(done?"":";border:1px solid var(--border)");
  el.textContent = done ? "✅ "+label : "— "+label;
  return el;
}

function plannerViewSwitcher(kidId){
  var row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-bottom:14px";
  ["day","week","month"].forEach(function(v){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "reward-skip";
    var active = (state.plannerView||"week")===v;
    b.style.cssText = "opacity:1;border:1px solid var(--border);font-size:12.5px;padding:6px 14px;text-transform:capitalize;"+
      (active ? "background:var(--gold-soft);color:var(--ink);font-weight:700" : "background:var(--card);color:var(--text-dim)");
    b.textContent = v;
    b.onclick = function(){ state.plannerView = v; setModeFlagStr("al_plannerView", kidId, v); renderView(); };
    row.appendChild(b);
  });
  return row;
}

function renderPlanner(){
  els.view.innerHTML = "";
  var kidId = state.activeKid;
  if(state.plannerView==null) state.plannerView = getModeFlagStr("al_plannerView", kidId) || "week";
  if(!state.plannerDate) state.plannerDate = todayISO();

  var title = document.createElement("div");
  title.className = "section-title";
  title.textContent = "📅 Planner — " + kidData(kidId).name;
  els.view.appendChild(title);
  els.view.appendChild(plannerViewSwitcher(kidId));

  if(state.plannerView==="day") renderPlannerDay(kidId);
  else if(state.plannerView==="month") renderPlannerMonth(kidId);
  else renderPlannerWeek(kidId);

  if(state.plannerView==="week"){
    var wk = weekBoundsMonFri();
    var title2 = document.createElement("div");
    title2.className = "section-title";
    title2.style.marginTop = "16px";
    title2.textContent = "Upcoming Quests (beyond this week)";
    els.view.appendChild(title2);
    var afterThisWeek = isoDate(wk.end);
    var upcoming = assignmentsFor(kidId, function(d){ return d>afterThisWeek; });
    var byDate = {}, order = [];
    upcoming.forEach(function(a){ if(!byDate[a.date]){ byDate[a.date]=[]; order.push(a.date); } byDate[a.date].push(a); });
    order.sort();
    if(!order.length){
      var e = document.createElement("div");
      e.className = "card empty";
      e.textContent = "Nothing upcoming yet.";
      els.view.appendChild(e);
    }
    order.forEach(function(dt){
      var head = document.createElement("div");
      head.className = "day-head";
      head.style.marginTop = "10px";
      head.textContent = fmtDate(dt);
      els.view.appendChild(head);
      var card = document.createElement("div");
      card.className = "card";
      byDate[dt].forEach(function(a){ card.appendChild(taskRow(a)); });
      els.view.appendChild(card);
    });
  }
}

/* Week: days as columns, the six daily blocks as rows — a real planner grid instead of a long
   stacked list, so a whole week is visible (and comparable) at a glance. */
function renderPlannerWeek(kidId){
  var wk = weekBoundsMonFri();
  var dates = DAYS.map(function(d,i){ var dt = new Date(wk.start); dt.setDate(wk.start.getDate()+i); return isoDate(dt); });
  var todayStr = todayISO();

  var scroll = document.createElement("div");
  scroll.className = "planner-scroll";
  var table = document.createElement("table");
  table.className = "planner-grid";

  var thead = document.createElement("thead");
  var headRow = document.createElement("tr");
  headRow.appendChild(document.createElement("th"));
  DAYS.forEach(function(d, i){
    var th = document.createElement("th");
    var isToday = dates[i]===todayStr;
    if(isToday) th.className = "planner-today";
    th.innerHTML = DAY_LABEL[d]+'<br><span class="mono" style="font-weight:400">'+fmtDate(dates[i]).split(", ").slice(1).join(", ")+(isToday?" · today":"")+'</span>';
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  var tbody = document.createElement("tbody");
  DAILY_BLOCKS.forEach(function(block){
    var tr = document.createElement("tr");
    var labelTd = document.createElement("td");
    labelTd.className = "planner-row-label";
    labelTd.innerHTML = '<div class="prl-icon">'+block.icon+'</div><div class="prl-name">'+escapeHtml(block.label)+'</div><div class="prl-time">'+(BLOCK_SUGGESTED_TIME[block.key]||"")+'</div>';
    tr.appendChild(labelTd);

    dates.forEach(function(iso){
      var td = document.createElement("td");
      td.className = "planner-cell"+(iso===todayStr?" planner-today-col":"");
      if(block.key==="morning" || block.key==="showTeach"){
        var isDone = block.key==="morning" ? !!(function(){ var j=journalEntryFor(kidId, iso); return j && j.yesterday && j.today; })() : !!reflectionFor(kidId, iso);
        td.appendChild(plannerJournalChip(isDone, block.key==="morning" ? "journal" : "reflection"));
      } else {
        var tasks = assignmentsFor(kidId, iso).filter(function(a){ return blockKeyFor(a)===block.key; });
        if(!tasks.length){
          var empty = document.createElement("div");
          empty.className = "planner-empty";
          empty.textContent = "—";
          td.appendChild(empty);
        } else {
          tasks.forEach(function(a){ td.appendChild(plannerCompactTask(a)); });
        }
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  els.view.appendChild(scroll);
}

/* Day: one date at a time, prev/next to move around, same six blocks as a simple vertical list. */
function renderPlannerDay(kidId){
  var iso = state.plannerDate;
  var nav = document.createElement("div");
  nav.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:12px";
  var prevBtn = document.createElement("button");
  prevBtn.className = "reward-skip";
  prevBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  prevBtn.textContent = "← Prev day";
  prevBtn.onclick = function(){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()-1); state.plannerDate=isoDate(d); renderView(); };
  var label = document.createElement("div");
  label.style.cssText = "flex:1;text-align:center;font-weight:700";
  label.textContent = fmtDate(iso) + (iso===todayISO() ? " (today)" : "");
  var nextBtn = document.createElement("button");
  nextBtn.className = "reward-skip";
  nextBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  nextBtn.textContent = "Next day →";
  nextBtn.onclick = function(){ var d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+1); state.plannerDate=isoDate(d); renderView(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  els.view.appendChild(nav);

  var list = assignmentsFor(kidId, iso);
  var tasksByBlock = {};
  list.forEach(function(a){ var k=blockKeyFor(a); (tasksByBlock[k]=tasksByBlock[k]||[]).push(a); });

  DAILY_BLOCKS.forEach(function(block){
    var card = document.createElement("div");
    card.className = "card";
    card.style.cssText = "margin-bottom:10px;padding:12px 14px";
    var head = document.createElement("div");
    head.style.cssText = "display:flex;align-items:center;gap:8px;margin-bottom:8px";
    head.innerHTML = '<span style="font-size:18px">'+block.icon+'</span><div style="flex:1;font-weight:700">'+escapeHtml(block.label)+'</div>'+
      '<span class="muted mono" style="font-size:11px">'+(BLOCK_SUGGESTED_TIME[block.key]||"")+'</span>';
    card.appendChild(head);
    if(block.key==="morning" || block.key==="showTeach"){
      var isDone = block.key==="morning" ? !!(function(){ var j=journalEntryFor(kidId, iso); return j && j.yesterday && j.today; })() : !!reflectionFor(kidId, iso);
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.style.cssText = isDone ? "background:var(--success-soft);color:var(--success)" : "background:var(--paper);color:var(--text-dim);border:1px solid var(--border)";
      chip.textContent = isDone ? "✅ done" : "not yet";
      card.appendChild(chip);
    } else {
      var tasks = tasksByBlock[block.key]||[];
      if(!tasks.length){
        var empty = document.createElement("div");
        empty.className = "muted";
        empty.style.fontSize = "13px";
        empty.textContent = "Nothing assigned";
        card.appendChild(empty);
      } else {
        tasks.forEach(function(a){ card.appendChild(taskRow(a)); });
      }
    }
    els.view.appendChild(card);
  });
}

/* Month: a compact school-day calendar (Mon-Fri columns only) with a done/total badge per day —
   tap a day to jump into Day view for it. */
function renderPlannerMonth(kidId){
  var anchor = new Date(state.plannerDate+"T00:00:00");
  var year = anchor.getFullYear(), month = anchor.getMonth();

  var nav = document.createElement("div");
  nav.style.cssText = "display:flex;align-items:center;gap:10px;margin-bottom:12px";
  var prevBtn = document.createElement("button");
  prevBtn.className = "reward-skip";
  prevBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  prevBtn.textContent = "← Prev month";
  prevBtn.onclick = function(){ state.plannerDate = isoDate(new Date(year, month-1, 1)); renderView(); };
  var label = document.createElement("div");
  label.style.cssText = "flex:1;text-align:center;font-weight:700";
  label.textContent = anchor.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  var nextBtn = document.createElement("button");
  nextBtn.className = "reward-skip";
  nextBtn.style.cssText = "opacity:1;border:1px solid var(--border);padding:6px 12px";
  nextBtn.textContent = "Next month →";
  nextBtn.onclick = function(){ state.plannerDate = isoDate(new Date(year, month+1, 1)); renderView(); };
  nav.appendChild(prevBtn); nav.appendChild(label); nav.appendChild(nextBtn);
  els.view.appendChild(nav);

  var scroll = document.createElement("div");
  scroll.className = "planner-scroll";
  var table = document.createElement("table");
  table.className = "planner-grid";
  var thead = document.createElement("thead");
  var hr = document.createElement("tr");
  DAYS.forEach(function(d){ var th=document.createElement("th"); th.textContent=DAY_LABEL[d]; hr.appendChild(th); });
  thead.appendChild(hr);
  table.appendChild(thead);

  var firstOfMonth = new Date(year, month, 1);
  var startIdx = todayIdxFor(firstOfMonth); // 0=Mon..6=Sun, days before month start in that week's Monday
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startIdx);
  var todayStr = todayISO();

  var tbody = document.createElement("tbody");
  for(var week=0; week<6; week++){
    var tr = document.createElement("tr");
    var anyInMonth = false;
    for(var day=0; day<5; day++){
      var d = new Date(gridStart);
      d.setDate(gridStart.getDate() + week*7 + day);
      var inMonth = d.getMonth()===month;
      if(inMonth) anyInMonth = true;
      var iso = isoDate(d);
      var td = document.createElement("td");
      td.className = "planner-cell"+(iso===todayStr?" planner-today-col":"");
      if(!inMonth) td.style.opacity = "0.35";
      var dayAssignments = assignmentsFor(kidId, iso);
      var doneCt = dayAssignments.filter(function(a){return a.done;}).length;
      td.style.cursor = "pointer";
      td.innerHTML = '<div style="font-weight:700;font-size:12px;margin-bottom:4px">'+d.getDate()+'</div>'+
        (dayAssignments.length ? '<div class="planner-chip-line" style="background:var(--paper);border:1px solid var(--border)">'+doneCt+'/'+dayAssignments.length+'</div>' : '<div class="planner-empty">—</div>');
      td.onclick = function(clickedIso){ return function(){ state.plannerDate = clickedIso; state.plannerView = "day"; renderView(); }; }(iso);
      tr.appendChild(td);
    }
    if(anyInMonth || week===0) tbody.appendChild(tr);
    if(!anyInMonth && week>0) break;
  }
  table.appendChild(tbody);
  scroll.appendChild(table);
  els.view.appendChild(scroll);
}

function csvEscape(v){
  var s = String(v==null ? "" : v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
/* Builds a CSV covering every completed quest for a kid — date completed, subject, standard,
   title, xp, estimated minutes — plus subject-hours and standards-covered summary rows, for
   portfolio reviews or district reporting. Downloads directly in the browser, no server needed. */
function exportProgressCSV(kidId){
  var kd = kidData(kidId);
  var done = assignmentsFor(kidId, null).filter(function(a){ return a.done && a.doneAt; })
    .sort(function(a,b){ return new Date(a.doneAt)-new Date(b.doneAt); });

  var lines = [];
  lines.push(["Forge Academy — Year-End Progress Summary"].map(csvEscape).join(","));
  lines.push(["Student", kd.name].map(csvEscape).join(","));
  lines.push(["Generated", new Date().toLocaleString()].map(csvEscape).join(","));
  lines.push("");
  lines.push(["Georgia Home Study Law Compliance (O.C.G.A. § 20-2-690.1)"].map(csvEscape).join(","));
  lines.push(["Attendance Days Logged", (kd.attendanceCount||0)+" / "+GA_ANNUAL_DAYS_TARGET].map(csvEscape).join(","));
  lines.push("");

  /* A quest tagged with crossSubjects (e.g. the VM-install lessons — reading the docs, writing
     up the guide, computer-science concepts, and real OS history all at once) gets its full
     minutes credited to EVERY subject it counts toward, not split between them — that's genuine
     integrated instructional time, not double-booked time. The overall Total below still counts
     each quest's minutes once, so it isn't inflated by that per-subject crediting. */
  var bySubjHours = {}, standards = {}, totalMins = 0;
  done.forEach(function(a){
    var mins = estMinutesFor(a);
    totalMins += mins;
    subjectsFor(a).forEach(function(s){ bySubjHours[s] = (bySubjHours[s]||0) + mins; });
    if(a.standard) standards[a.standard] = true;
  });
  /* Morning Launch and Show & Teach are real daily writing/reflection practice but aren't tagged
     assignments, so without this they'd never show up in subject hours at all. Credited to ELA. */
  (state.journalEntries||[]).filter(function(j){ return j.kidId===kidId && j.yesterday && j.today; }).forEach(function(){
    totalMins += JOURNAL_EST_MINUTES;
    bySubjHours["ELA"] = (bySubjHours["ELA"]||0) + JOURNAL_EST_MINUTES;
  });
  (state.reflections||[]).filter(function(r){ return r.kidId===kidId; }).forEach(function(){
    totalMins += REFLECTION_EST_MINUTES;
    bySubjHours["ELA"] = (bySubjHours["ELA"]||0) + REFLECTION_EST_MINUTES;
  });
  lines.push(["Subject Hours Summary (estimated; a cross-tagged quest counts fully toward each subject; Morning Launch/Show & Teach credited to ELA)"].map(csvEscape).join(","));
  lines.push(["Subject","Estimated Hours"].map(csvEscape).join(","));
  Object.keys(bySubjHours).forEach(function(s){
    lines.push([s, (bySubjHours[s]/60).toFixed(1)].map(csvEscape).join(","));
  });
  lines.push(["Total (each quest counted once)", (totalMins/60).toFixed(1)].map(csvEscape).join(","));
  lines.push("");
  lines.push(["Standards Covered", Object.keys(standards).sort().join("; ")].map(csvEscape).join(","));
  lines.push("");

  lines.push(["Quest Log"].map(csvEscape).join(","));
  lines.push(["Date Completed","Subject","Standard","Title","XP Earned","Minutes","Minutes Source"].map(csvEscape).join(","));
  done.forEach(function(a){
    var when = new Date(a.doneAt);
    lines.push([
      when.toLocaleDateString(),
      a.subject||"",
      a.standard||"",
      a.title||"",
      a.xp||0,
      estMinutesFor(a),
      a.actualMinutes>0 ? "logged" : "estimated"
    ].map(csvEscape).join(","));
  });

  var csv = lines.join("\n");
  var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = "AcademyLog_Progress_"+kd.name.replace(/[^a-z0-9]+/gi,"_")+"_"+todayISO()+".csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
  toast("📄 Progress report downloaded");
}

/* Troubleshooting helper: strips HTML from each VM_INSTALL_HELP step, tokenizes it and the kid's
   typed error text, and scores steps by shared keywords — a lightweight stand-in for a chatbot
   that doesn't need a live LLM call. Not "real" AI, just keyword matching against known fixes. */
var TROUBLESHOOT_STOPWORDS = {"the":1,"and":1,"for":1,"with":1,"this":1,"that":1,"your":1,"you":1,"from":1,"into":1,"than":1,"then":1,"have":1,"will":1,"most":1,"only":1,"same":1,"either":1,"instead":1,"here":1,"there":1,"about":1};
function stripHtml(s){ return s.replace(/<[^>]+>/g,""); }
function tokenize(s){
  return stripHtml(s).toLowerCase().match(/[a-z0-9]+/g)||[];
}
function findTroubleshootMatches(vmHelp, query){
  var qTokens = tokenize(query).filter(function(t){ return t.length>=4 && !TROUBLESHOOT_STOPWORDS[t]; });
  if(!qTokens.length) return [];
  var scored = vmHelp.steps.map(function(step, i){
    var stepTokens = tokenize(step);
    var score = qTokens.reduce(function(sum, t){ return sum + (stepTokens.indexOf(t)>=0 ? 1 : 0); }, 0);
    return {step:step, index:i, score:score};
  }).filter(function(m){ return m.score>0; });
  scored.sort(function(a,b){ return b.score-a.score; });
  return scored.slice(0,3);
}

/* work blocks: an ordered list of {type:"text", text} / {type:"image", url} entries,
   letting a kid interleave typed notes and pictures like a simple word doc.
   Falls back to migrating the older single submission/screenshot fields on first open. */
function normalizeBlocks(a){
  if(Array.isArray(a.workBlocks) && a.workBlocks.length) return a.workBlocks.slice();
  var out = [];
  if(a.submission) out.push({type:"text", text:a.submission});
  if(a.screenshotUrl) out.push({type:"image", url:a.screenshotUrl});
  if(out.length===0) out.push({type:"text", text:""});
  return out;
}
function hasWork(a){
  return !!((a.workBlocks && a.workBlocks.some(function(b){ return (b.type==="text" && b.text) || (b.type==="image" && b.url); })) || a.submission || a.screenshotUrl);
}

function importCurriculumSet(items, label){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidId = state.activeKid;
  var kidName = kidData(kidId).name;
  var itemTitles = items.map(function(i){ return i.title; });
  sb.from("al_assignments").select("title").eq("kid_id", kidId).then(function(res){
    var existingTitles = (res.data||[]).map(function(r){ return r.title; });
    var alreadyHave = itemTitles.filter(function(t){ return existingTitles.indexOf(t)!==-1; }).length;
    if(alreadyHave>0){
      var proceed = window.confirm(kidName+' already has '+alreadyHave+' of these '+items.length+' assignments (looks like "'+label+'" was already imported). Importing again will create duplicates — continue anyway?');
      if(!proceed) return;
    }
    var defaultStart = nextMondayISO();
    var startStr = window.prompt('Start "'+label+'" for '+kidName+' on which Monday? (YYYY-MM-DD)', defaultStart);
    if(!startStr) return;
    var startDate = new Date(startStr+"T00:00:00");
    if(isNaN(startDate.getTime())){ toast("Couldn't read that date — try YYYY-MM-DD"); return; }
    var ok = window.confirm('This adds '+items.length+' new assignments for '+kidName+', starting '+fmtDate(startStr)+'. Continue?');
    if(!ok) return;
    items.forEach(function(item){
      var week = Math.floor(item.d/5), weekday = item.d%5;
      var d = new Date(startDate);
      d.setDate(d.getDate() + week*7 + weekday);
      db.collection("assignments").add({
        kidId: kidId, date: isoDate(d), subject: item.subject, title: item.title,
        xp: item.xp, done:false, doneAt:null,
        materials: item.materials||null, video: item.video||null, standard: item.standard||null,
        createdAt: new Date().toISOString()
      });
    });
    toast("📦 "+label+" added to "+kidName+"'s Week!");
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}

function removeDuplicateAssignments(kidId){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  sb.from("al_assignments").select("id,date,title,created_at").eq("kid_id", kidId).then(function(res){
    var rows = res.data || [];
    var groups = {};
    rows.forEach(function(r){
      var key = r.date+"::"+r.title;
      (groups[key] = groups[key]||[]).push(r);
    });
    var toDelete = [];
    Object.keys(groups).forEach(function(key){
      var g = groups[key];
      if(g.length<2) return;
      g.sort(function(a,b){ return (a.created_at||"").localeCompare(b.created_at||""); });
      toDelete = toDelete.concat(g.slice(1)); // keep the earliest, delete the rest
    });
    if(!toDelete.length){ toast(kidName+" has no duplicate assignments — nothing to clean up!"); return; }
    var ok = window.confirm('Found '+toDelete.length+' duplicate assignment(s) for '+kidName+' (same date + title). Remove the extras and keep one of each? This can\'t be undone.');
    if(!ok) return;
    Promise.all(toDelete.map(function(r){ return sb.from("al_assignments").delete().eq("id", r.id); }))
      .then(function(){ toast("🧹 Removed "+toDelete.length+" duplicate(s) for "+kidName+"!"); syncSoon(); })
      .catch(function(err){ console.error(err); toast("⚠️ Cleanup failed — check your connection and try again"); });
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}

/* Catches a different shape of duplicate than removeDuplicateAssignments: the SAME lesson
   re-imported onto a LATER date (e.g. a curriculum re-sync leaving a stray extra copy of "Read
   the Windows 98 section..." a week after the original), rather than two copies on the same day.
   Only ever removes an incomplete duplicate and only when a genuinely earlier copy of the exact
   same title exists — never touches something the kid has already done. */
function removeDuplicateTitlesAcrossDates(kidId){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  var byTitle = {};
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId || !a.date || !a.title) return;
    (byTitle[a.title] = byTitle[a.title] || []).push(Object.assign({id:id}, a));
  });
  var toDelete = [];
  Object.keys(byTitle).forEach(function(title){
    var g = byTitle[title];
    if(g.length<2) return;
    g.sort(function(a,b){ return a.date.localeCompare(b.date); });
    // keep the earliest-dated copy; only remove later copies that are still incomplete
    g.slice(1).forEach(function(dup){ if(!dup.done) toDelete.push(dup); });
  });
  if(!toDelete.length){ toast(kidName+" has no same-title duplicates on different dates — nothing to clean up!"); return; }
  console.log(kidName+": found "+toDelete.length+" later duplicate(s) to remove (keeping the earliest-dated copy of each):");
  console.table(toDelete.map(function(a){ return {id:a.id, date:a.date, title:a.title}; }));
  var ok = window.confirm('Found '+toDelete.length+' lesson(s) for '+kidName+' that exist twice on different dates (keeping the earlier date, removing the later incomplete copy). Remove them? This can\'t be undone.');
  if(!ok) return;
  Promise.all(toDelete.map(function(a){ return sb.from("al_assignments").delete().eq("id", a.id); }))
    .then(function(){ toast("🧹 Removed "+toDelete.length+" stray duplicate(s) for "+kidName+"!"); syncSoon(); })
    .catch(function(err){ console.error(err); toast("⚠️ Cleanup failed — check your connection and try again"); });
}

function nextMondayISO(){
  var d = new Date();
  var day = d.getDay(); // 0=Sun..6=Sat
  var addDays = day===1 ? 7 : ((8-day)%7)||7; // next Monday, always in the future
  d.setDate(d.getDate()+addDays);
  return isoDate(d);
}

/* ---------- Legacy data reset: wipe everything except a named curriculum set, apply a new schedule ---------- */
var RYAN_WEEKLY_RHYTHM_BLOCKS = (function(){
  var DAILY = [
    {time:"9:00a", activity:"Morning Launch — pick today's project piece; journal entry: yesterday's progress + today's goal"},
    {time:"9:20a", activity:"Math in the Machine — byte/KB/MB/GB conversions, binary, RAM math, timeline math"},
    {time:"10:15a", activity:"Break"},
    {time:"10:30a", activity:"Reading Block — tech history, OS manuals, computing biographies, his level, his pick"},
    {time:"11:15a", activity:"Main Project Block — VM build/restore, hardware teardown, cyber-lab, or energy/science"},
    {time:"12:15p", activity:"Lunch"},
    {time:"1:00p", activity:"Science / Social Studies (alternating)"},
    {time:"1:45p", activity:"Show & Teach — he teaches you or a sibling what he did today"}
  ];
  var blocks = [];
  DAYS.forEach(function(day){
    DAILY.forEach(function(b){ blocks.push({day:day, time:b.time, activity:b.activity}); });
  });
  return blocks;
})();

function resetKidLegacyData(kidId, keepSet, keepLabel){
  if(!db){ toast("Not connected yet — try again in a moment"); return; }
  var kidName = kidData(kidId).name;
  var keepTitles = keepSet.map(function(i){ return i.title; });
  toast("Checking "+kidName+"'s data…");
  Promise.all([
    sb.from("al_assignments").select("id,title").eq("kid_id", kidId),
    sb.from("al_questions").select("id").eq("kid_id", kidId)
  ]).then(function(results){
    var assignRows = results[0].data || [];
    var qRows = results[1].data || [];
    var toDelete = assignRows.filter(function(r){ return keepTitles.indexOf(r.title)===-1; });
    var msg = 'This will permanently remove '+toDelete.length+' old assignment(s) and '+qRows.length+' study-guide question(s) for '+kidName+
      ' (everything except "'+keepLabel+'"), and replace '+kidName+"'s weekly schedule. This can't be undone. Continue?";
    if(!window.confirm(msg)) return;
    var deletes = toDelete.map(function(r){ return sb.from("al_assignments").delete().eq("id", r.id); })
      .concat(qRows.map(function(r){ return sb.from("al_questions").delete().eq("id", r.id); }));
    Promise.all(deletes).then(function(){
      // Avoid upsert()'s onConflict, which needs a DB-level unique constraint on kid_id
      // that this table may not actually have — check for an existing row instead.
      return sb.from("al_schedule").select("kid_id").eq("kid_id", kidId);
    }).then(function(selRes){
      if(selRes.error) throw selRes.error;
      var exists = selRes.data && selRes.data.length>0;
      if(exists){
        return sb.from("al_schedule").update({ blocks: RYAN_WEEKLY_RHYTHM_BLOCKS }).eq("kid_id", kidId);
      }
      return sb.from("al_schedule").insert({ kid_id: kidId, household_id: HOUSEHOLD_ID, blocks: RYAN_WEEKLY_RHYTHM_BLOCKS });
    }).then(function(res){
      if(res && res.error){ console.error("Academy Log reset error:", res.error); toast("⚠️ Reset partly failed — check your connection and try again"); }
      else toast("🧹 "+kidName+"'s old data cleared — fresh schedule applied!");
      syncSoon();
    }).catch(function(err){ console.error(err); toast("⚠️ Reset failed — check your connection and try again"); });
  }).catch(function(err){ console.error(err); toast("⚠️ Couldn't check existing data — try again"); });
}
