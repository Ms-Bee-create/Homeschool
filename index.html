<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge Academy | Quest Log</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forge Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pixelify+Sans:wght@500;700&family=Poppins:wght@600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --ink:#1c5738; --paper:#faf3e6; --raised:#ffffff; --border:#ecdfc4;
  --text:#2b3128; --text-dim:#7a7562;
  --gold:#c8952d; --gold-soft:#f4e3ba;
  --teal:#2e7d52; --teal-soft:#dcece1;
  --coral:#b5602f; --coral-soft:#f5e2d3;
  --pink:#c94f8c; --pink-soft:#f9dfec;
  --success:#3f8f52; --success-soft:#e0f0e3;
  --warn:#c8952d;
  --shadow: 0 1px 2px rgba(28,87,56,.07), 0 6px 16px rgba(28,87,56,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9dfc2; --paper:#12181420; --paper:#131a15; --raised:#1b2420; --border:#2c3a2e;
    --text:#eae4d2; --text-dim:#9ea38f;
    --gold:#e0b155; --gold-soft:#3a3320;
    --teal:#6bbf8c; --teal-soft:#1c3327;
    --coral:#e29a68; --coral-soft:#3a2a1e;
    --pink:#e685b8; --pink-soft:#3a2030;
    --success:#7dcf93; --success-soft:#1e3324;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#e9dfc2; --paper:#131a15; --raised:#1b2420; --border:#2c3a2e;
  --text:#eae4d2; --text-dim:#9ea38f;
  --gold:#e0b155; --gold-soft:#3a3320;
  --teal:#6bbf8c; --teal-soft:#1c3327;
  --coral:#e29a68; --coral-soft:#3a2a1e;
  --pink:#e685b8; --pink-soft:#3a2030;
  --success:#7dcf93; --success-soft:#1e3324;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:"Nunito Sans",system-ui,sans-serif;padding-inline:16px;padding-block:18px 40px;min-height:100%}
h1,h2,h3,.disp{font-family:"Poppins",system-ui,sans-serif;text-wrap:balance}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:840px;margin:0 auto}
a{color:inherit}
button{font:inherit;cursor:pointer}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:50%;flex:none;box-shadow:var(--shadow);object-fit:cover;display:block}
.brand h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--text-dim);margin-top:1px}
.date-pill{font-size:12px;color:var(--text-dim);background:var(--raised);border:1px solid var(--border);padding:6px 10px;border-radius:999px}

/* kid switcher */
.kidbar{display:flex;gap:10px;margin-bottom:16px}
.kid-card{flex:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--border);background:var(--raised);cursor:pointer;text-align:left;transition:border-color .15s,transform .1s}
.kid-card:active{transform:scale(.98)}
.kid-card.active{border-color:var(--kc)}
.kid-avatar{width:36px;height:36px;border-radius:50%;flex:none;background:var(--kc-soft);color:var(--kc);display:flex;align-items:center;justify-content:center;font-family:"Poppins";font-weight:600;font-size:15px}
.kid-meta{min-width:0}
.kid-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-lvl{font-size:11px;color:var(--text-dim)}
.kid-name[contenteditable]{outline:none;border-bottom:1px dashed transparent}
.kid-name[contenteditable]:focus{border-color:var(--kc)}
.kid-name-row{display:flex;align-items:center;gap:5px}
.kid-name-edit-btn{border:none;background:none;padding:0;cursor:pointer;font-size:11px;opacity:.6;flex:none}
.kid-name-edit-btn:hover{opacity:1}
.kid-avatar-img{width:36px;height:36px;border-radius:50%;flex:none;object-fit:cover;border:2px solid var(--border)}

/* Profile dropdown switcher — replaces the old side-by-side kid cards with one compact control */
.profile-switch{position:relative;margin-bottom:16px}
.profile-trigger{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--kc);background:var(--raised);cursor:pointer;text-align:left}
.profile-trigger-chevron{margin-left:auto;color:var(--text-dim);font-size:12px;flex:none}
.profile-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;background:var(--raised);border:2px solid var(--border);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:none}
.profile-menu.open{display:block}
.profile-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.profile-row.active{background:var(--kc-soft)}
.profile-row-avatar-btn{border:none;background:none;padding:0;cursor:pointer;flex:none}
.avatar-change-link{font-size:11px;color:var(--text-dim);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;font-family:inherit}
.avatar-picker-grid{display:flex;gap:8px;flex-wrap:wrap;padding:8px 4px 4px}
.avatar-pick-opt{width:44px;height:44px;border-radius:50%;object-fit:cover;cursor:pointer;border:3px solid transparent;display:block}
.avatar-pick-opt.selected{border-color:var(--gold)}

/* ===== Who's using this? gate — shown every time the app opens, before anything else is
   interactive, so a kid can never end up quietly answering as the wrong profile because it just
   remembered whoever used it last. ===== */
.who-gate{position:fixed;inset:0;z-index:9999;background:rgba(10,8,4,.92);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.who-gate-card{background:var(--raised);border-radius:20px;padding:28px 22px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.who-gate-title{font-family:"Poppins";font-weight:700;font-size:22px;margin-bottom:6px}
.who-gate-sub{color:var(--text-dim);font-size:13.5px;margin-bottom:20px}
.who-gate-options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.who-gate-opt{width:130px;padding:16px 10px;border-radius:16px;border:2px solid var(--border);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .12s ease,border-color .12s ease}
.who-gate-opt:active{transform:scale(.96)}
.who-gate-opt-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}
.who-gate-opt-avatar-fallback{width:64px;height:64px;border-radius:50%;background:var(--kc-soft);color:var(--kc);display:flex;align-items:center;justify-content:center;font-family:"Poppins";font-weight:700;font-size:24px}
.who-gate-opt-name{font-weight:700;font-size:14.5px}

/* xp bar */
.xpbar-row{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow)}
.xpbar-track{flex:1;height:10px;border-radius:999px;background:var(--gold-soft);overflow:hidden;position:relative}
.xpbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),#e8c063);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp-label{font-size:12px;color:var(--text-dim);white-space:nowrap}
.streak{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--coral);font-weight:700;white-space:nowrap}
.mm-badge{flex:none;display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;color:var(--ink);background:var(--gold-soft);padding:2px 8px;border-radius:999px;white-space:nowrap;font-family:"JetBrains Mono"}

/* reward banner */
.reward-card{background:linear-gradient(155deg,var(--gold),#a9762a);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);color:#fff}
.reward-card h3{margin:0 0 3px;font-size:16px}
.reward-card p{margin:0 0 12px;font-size:12.5px;opacity:.92}
.reward-opts{display:flex;gap:8px;flex-wrap:wrap}
.reward-opt{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.55);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px}
.reward-opt:hover{background:rgba(255,255,255,.3)}
.reward-skip{background:none;border:none;color:#fff;opacity:.75;font-size:12.5px;font-weight:700;padding:10px 6px;text-decoration:underline}

/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 4px;font-size:13px;font-weight:700;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;white-space:nowrap;margin-right:10px}
.tab.active{color:var(--ink);border-color:var(--gold)}

/* cards */
.section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:20px 0 8px}
.section-title:first-child{margin-top:0}
.card{background:var(--raised);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:none}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center;background:var(--paper);transition:.15s}
.check.done{background:var(--success);border-color:var(--success)}
.check svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.5);transition:.15s}
.check.done svg{opacity:1;transform:scale(1)}
.task-body{flex:1;min-width:0}
.task-title{font-weight:700;font-size:14.5px}
.task-title.done{text-decoration:line-through;color:var(--text-dim)}
.task-sub{font-size:11.5px;color:var(--text-dim);margin-top:1px}
.chip{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.task-xp{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;font-family:"JetBrains Mono"}
.del{background:none;border:none;color:var(--text-dim);font-size:16px;padding:2px 4px;line-height:1;opacity:.5}
.del:hover{opacity:1;color:var(--coral)}
.empty{padding:24px 14px;text-align:center;color:var(--text-dim);font-size:13px}

/* add form */
.addrow{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
.addrow input,.addrow select{flex:1;min-width:110px;font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--paper);color:var(--text)}
.addrow button{flex:none;padding:9px 14px;border-radius:9px;border:none;background:var(--ink);color:var(--paper);font-weight:700;font-size:13px}

/* schedule */
.day-block{margin-bottom:14px}
.day-head{font-family:"Poppins";font-weight:600;font-size:14px;margin:0 0 6px 2px;color:var(--ink)}
.slot{display:flex;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border);align-items:center}
.slot:last-child{border-bottom:none}
.slot-time{font-family:"JetBrains Mono";font-size:11.5px;color:var(--text-dim);width:56px;flex:none}
.slot-body[contenteditable]{flex:1;font-size:13.5px;font-weight:600;outline:none;border-radius:6px;padding:2px 4px}
.slot-body[contenteditable]:focus{background:var(--paper)}

/* week planner grid */
.planner-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 16px;padding:0 4px}
.planner-grid{width:100%;border-collapse:separate;border-spacing:6px;min-width:640px}
.planner-grid th{text-align:left;font-family:"Poppins";font-weight:600;font-size:12.5px;color:var(--text-dim);padding:2px 8px 6px}
.planner-grid th.planner-today{color:var(--gold)}
.planner-row-label{width:120px;vertical-align:top;padding:10px 8px 0 2px!important}
.planner-row-label .prl-icon{font-size:17px}
.planner-row-label .prl-name{font-weight:700;font-size:12.5px;margin-top:2px}
.planner-row-label .prl-time{font-family:"JetBrains Mono";font-size:10.5px;color:var(--text-dim)}
.planner-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px;vertical-align:top;min-width:118px}
.planner-cell.planner-today-col{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.planner-chip-line{font-size:11px;padding:3px 7px;border-radius:999px;display:inline-block}
.planner-task{display:flex;align-items:flex-start;gap:5px;margin-bottom:5px;cursor:pointer}
.planner-task:last-child{margin-bottom:0}
.planner-task .check{width:18px;height:18px;flex:none;margin-top:1px}
.planner-task .pt-title{font-size:11.5px;line-height:1.3;color:var(--text)}
.planner-task .pt-title.done{text-decoration:line-through;color:var(--text-dim)}
.planner-empty{font-size:11px;color:var(--text-dim);opacity:.7}

/* progress */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-family:"JetBrains Mono";font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.bar-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border)}
.bar-row:last-child{border-bottom:none}
.bar-lbl{width:82px;flex:none;font-size:12.5px;font-weight:700}
.bar-track{flex:1;height:9px;border-radius:999px;background:var(--paper);overflow:hidden;border:1px solid var(--border)}
.bar-fill{height:100%;border-radius:999px}
.bar-pct{width:36px;flex:none;text-align:right;font-family:"JetBrains Mono";font-size:11.5px;color:var(--text-dim)}
.compare{display:flex;gap:10px}
.compare>div{flex:1}

/* arena */
.arena-hero{background:linear-gradient(155deg,var(--kc,var(--gold)),color-mix(in srgb, var(--kc,var(--gold)) 60%, #000));border-radius:16px;padding:20px;color:#fff;margin-bottom:16px;box-shadow:var(--shadow)}
.arena-hero h2{margin:0 0 4px;font-size:19px}
.arena-hero p{margin:0;font-size:13px;opacity:.9}
.subj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.subj-btn{padding:16px 12px;border-radius:14px;border:1px solid var(--border);background:var(--raised);text-align:left;box-shadow:var(--shadow)}
.subj-btn .n{font-size:11px;color:var(--text-dim)}
.subj-btn .t{font-family:"Poppins";font-weight:600;font-size:15px;margin-top:2px}
.qz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--text-dim);font-family:"JetBrains Mono"}
.qz-timer{font-weight:700;color:var(--coral)}
.qz-card{background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.qz-q{font-family:"Poppins";font-weight:600;font-size:18px;margin:0 0 16px}
.qz-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qz-opt{padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:var(--paper);font-weight:700;font-size:14px;text-align:center}
.qz-opt.correct{border-color:var(--success);background:var(--success-soft)}
.qz-opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.qz-result{text-align:center;padding:10px}
.qz-result .big{font-family:"Poppins";font-size:30px;margin:6px 0}
.primary-btn{background:var(--ink);color:var(--paper);border:none;padding:12px 20px;border-radius:11px;font-weight:700;font-size:14px;margin-top:14px}
.qform{display:flex;flex-direction:column;gap:8px}
.qform input,.qform select{font:inherit;font-size:13px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);background:var(--paper);color:var(--text)}
.qform .opts4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.muted{color:var(--text-dim);font-size:12.5px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ---------- Kid skins (pastel rainbow for Anna, retro PC for Ryan) + wandering pet + day-plan bar ---------- */
body.anna-skin{
  --ink:#3b2a5a; --paper:#fff1f8; --raised:#ffffff; --border:#e8e2f5;
  --text:#3b2a5a; --text-dim:#8c7cb0;
  --gold:#e08f00; --gold-soft:#fff0c7;
  --teal:#1f9f82; --teal-soft:#d7f7ec;
  --coral:#e2566a; --coral-soft:#ffe3e6;
  --pink:#d6459a; --pink-soft:#ffe0ef;
  --success:#1f9f82; --success-soft:#d7f7ec;
  --shadow:0 6px 16px rgba(115,77,179,.16);
  background:linear-gradient(135deg,#fff1f8,#eaf4ff) fixed;
}
body.anna-skin h1,body.anna-skin h2,body.anna-skin h3,body.anna-skin .disp,body.anna-skin .qz-q,body.anna-skin .section-title{font-family:"Fredoka","Poppins",system-ui,sans-serif}
body.anna-skin .qz-card,body.anna-skin .card{border-radius:28px;border-color:transparent}
body.anna-skin .chip{border-radius:999px}
body.anna-skin .kid-card.active{box-shadow:0 0 0 4px color-mix(in srgb,var(--kc) 22%,transparent)}
body.anna-skin input.chk{accent-color:#ff7eb6;width:26px!important;height:26px!important}

body.ryan-skin{
  --ink:#000080; --paper:#dcdcdc; --raised:#c0c0c0; --border:#7a7a7a;
  --text:#0a0a0a; --text-dim:#3d3d3d;
  --gold:#6b5000; --gold-soft:#f1e8a8;
  --teal:#00605c; --teal-soft:#b9e3de;
  --coral:#8f3300; --coral-soft:#f0cdb2;
  --pink:#7d1a63; --pink-soft:#e9c3dd;
  --success:#0b5d0b; --success-soft:#c3e5c3;
  --shadow:none;
  background:#008080 fixed;
}
body.ryan-skin h1,body.ryan-skin h2,body.ryan-skin h3,body.ryan-skin .disp,body.ryan-skin .qz-q{font-family:"Pixelify Sans","JetBrains Mono",monospace}
body.ryan-skin .section-title{font-family:"Pixelify Sans","JetBrains Mono",monospace;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;padding:5px 10px;letter-spacing:.04em;margin-top:16px}
body.ryan-skin .card,body.ryan-skin .qz-card,body.ryan-skin .kid-card,body.ryan-skin .date-pill,body.ryan-skin .plan-bar{
  border:0;border-radius:0;
  box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
body.ryan-skin .chip{border-radius:0}
/* The whole app sits in one gray window on the teal desktop, so nothing is ever dark text on teal. */
body.ryan-skin .wrap{background:#c0c0c0;padding:14px 16px 24px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
body.ryan-skin .card,body.ryan-skin .qz-card,body.ryan-skin .kid-card{background:#d4d0c8}
body.ryan-skin .primary-btn,body.ryan-skin button.tab{border-radius:0;background:#c0c0c0;color:#000;
  box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf}
body.ryan-skin button.tab.active{box-shadow:inset 1px 1px #0a0a0a,inset -1px -1px #fff,inset 2px 2px #808080,inset -2px -2px #dfdfdf;font-weight:800}
body.ryan-skin .toast{border-radius:0;background:#ffffe1;color:#000;border:1px solid #000}
body.ryan-skin .tabs,body.ryan-skin .tabbar{background:transparent}

body.pet-on{padding-bottom:130px}
#kidPet{position:fixed;left:0;right:0;bottom:0;height:112px;pointer-events:none;z-index:30;display:none}
body.anna-skin #kidPet{background:linear-gradient(to top,rgba(190,232,207,.85),rgba(190,232,207,0) 70%)}
body.ryan-skin #kidPet{background:linear-gradient(to top,#c0c0c0 0,#c0c0c0 34px,rgba(192,192,192,0) 35px);border-top:0}
body.pet-on #kidPet{display:block}
#kidPet .walker{position:absolute;bottom:4px;left:0;width:112px;height:93px;padding:0;border:0;background:none;pointer-events:auto;will-change:transform}
#kidPet .walker svg{width:100%;height:100%;overflow:visible;animation:petbob .5s ease-in-out infinite}
@keyframes petbob{50%{transform:translateY(-5px)}}
#kidPet .walker.hop svg{animation:pethop .6s ease}
@keyframes pethop{30%{transform:translateY(-34px) rotate(-3deg)}60%{transform:translateY(0)}78%{transform:translateY(-10px)}}
#kidPet .say{position:absolute;bottom:104px;left:0;max-width:250px;background:#fff;color:var(--ink);border-radius:20px;padding:10px 14px;font-weight:800;font-size:15px;line-height:1.3;box-shadow:var(--shadow);opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
body.ryan-skin #kidPet .say{border-radius:0;background:#ffffe1;color:#000;border:1px solid #000;font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700}
#kidPet .say.show{opacity:1;transform:none}
.petfx{position:fixed;pointer-events:none;z-index:31;animation:petfx 1.3s forwards;font-size:22px}
@keyframes petfx{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
#petCtl{position:fixed;right:10px;bottom:10px;z-index:32;display:none;gap:6px}
body.anna-skin #petCtl,body.ryan-skin #petCtl{display:flex}
#petCtl button{background:#fff;color:#9b6bff;border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;box-shadow:var(--shadow);opacity:.92}
body.ryan-skin #petCtl button{border-radius:0;background:#c0c0c0;color:#000;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;font-family:"JetBrains Mono",monospace}


#petPanel{position:fixed;right:10px;bottom:48px;width:min(94vw,400px);max-height:62vh;overflow:auto;background:var(--raised);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:33;display:none}
body.ryan-skin #petPanel{border-radius:0;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf,0 8px 24px rgba(0,0,0,.35)}
#petPanel .pp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:17px}
#petPanel .pp-x{background:none;border:0;font-size:18px;padding:4px 8px;color:var(--text-dim)}
#petPanel .pp-sub{font-weight:800;font-size:13px;margin:12px 0 6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
#petPanel .pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
#petPanel .pp-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:14px;border:2px solid var(--border);background:var(--paper);text-align:center;color:var(--text)}
body.ryan-skin #petPanel .pp-tile{border-radius:0}
#petPanel .pp-tile.on{border-color:var(--teal);background:var(--teal-soft)}
#petPanel .pp-tile.locked .pp-art{filter:grayscale(1);opacity:.55}
#petPanel .pp-art svg{width:84px;height:70px}
#petPanel .pp-name{font-size:12.5px;font-weight:800;line-height:1.2}
#petPanel .pp-state{font-size:11px;color:var(--text-dim);font-weight:700}
#petPanel .pp-note{font-size:12px;color:var(--text-dim);margin-top:10px;line-height:1.4}

/* Anna's lesson page: header card, star trail, coach bubble, rainbow meter, big step rows */
body.anna-skin .a-head{margin-bottom:14px}
.a-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.a-xp{font-weight:800;font-size:15px;color:var(--gold)}
h1.a-title{font-size:clamp(24px,5vw,34px);line-height:1.15;margin:0 0 14px}
.a-trail{display:flex;align-items:flex-start;margin:6px 0 14px}
.a-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px;font-family:"Fredoka",sans-serif;font-weight:500;font-size:15px;max-width:76px;text-align:center}
.a-dot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:22px;color:#fff;transition:all .3s}
.a-dot svg{width:24px;height:24px}
.a-step.done .a-dot{background:var(--c)}
.a-step.now .a-dot{background:#ff7eb6;box-shadow:0 0 0 7px rgba(255,126,182,.3);animation:apulse 1.8s ease-in-out infinite}
.a-step.now{font-weight:700}
.a-step.todo .a-dot{background:#fff;border:3px dashed #b79cff;color:#b79cff}
.a-step.todo{color:var(--text-dim)}
.a-link{flex:1;height:8px;border-radius:4px;margin-top:18px;background:var(--border);min-width:14px;transition:background .4s}
.a-link.on{background:linear-gradient(90deg,var(--a),var(--b))}
@keyframes apulse{50%{box-shadow:0 0 0 12px rgba(255,126,182,.12)}}
.a-coach{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.a-pet{width:84px;height:70px;flex:none}
.a-bubble{position:relative;background:#fff;border:2px solid #f0e6ff;border-radius:20px;padding:12px 16px;font-weight:800;font-size:17px;line-height:1.3;box-shadow:var(--shadow)}
.a-bubble::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.a-meter .a-mtxt{font-family:"Fredoka",sans-serif;font-weight:600;font-size:16px;margin-bottom:6px}
.a-stripes{display:flex;gap:6px}
.a-stripes i{flex:1;height:16px;border-radius:8px;background:#fff;border:2px solid #f0e6ff;transition:background .4s}
body.anna-skin label.arow{align-items:center!important;gap:14px!important;padding:12px 14px;border:2px solid var(--border);border-radius:20px;font-size:18px!important;line-height:1.35!important;background:#fff;transition:transform .12s,background .2s,border-color .2s;margin-bottom:10px!important}
body.anna-skin label.arow:hover{transform:translateY(-2px)}
body.anna-skin label.arow:has(input:checked){background:var(--teal-soft);border-color:#bfeedd;color:#3d7f6c}
body.anna-skin label.arow:not(:has(input:checked)){border-color:#ffb3d7}
body.anna-skin button.a-bigbtn{font-family:"Fredoka",sans-serif!important;font-weight:700!important;font-size:21px!important;border-radius:22px!important;box-shadow:var(--shadow);transition:transform .12s}
body.anna-skin button.a-bigbtn:hover{transform:translateY(-3px)}
body.anna-skin button.a-bigbtn:active{transform:scale(.97)}

/* Anna's new look on every page */

body.anna-skin .subj-btn{border:0;border-radius:26px;padding:22px 16px;min-height:104px;color:#fff;box-shadow:var(--shadow);transition:transform .12s}

body.anna-skin .tt-title{font-family:"Fredoka",sans-serif;font-size:24px!important;color:#d6459a}
body.anna-skin .tt-treats{font-size:22px;letter-spacing:2px}
.tt-sub{font-family:"Nunito Sans",sans-serif;font-size:14px;font-weight:700;color:var(--text-dim);margin-top:2px}

body.anna-skin .quiz-wrap button{border-radius:18px!important;border:2px solid #ffd0e6!important;font-family:"Fredoka",sans-serif!important;font-size:18px!important;padding:12px 16px!important;transition:transform .12s}

.treat{position:fixed;z-index:40;font-size:34px;pointer-events:none;animation:treatdrop .9s ease-in forwards}
@keyframes treatdrop{0%{transform:translateY(-170px) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}

/* Place Value Playground: blocks that glow, pop and trade up (click or drag) */
.pv-card{padding:18px 20px}
.pv-title{font-family:"Fredoka","Poppins",sans-serif;font-weight:700;font-size:24px;margin-bottom:4px}
.pv-sub{font-size:15px;line-height:1.45;margin-bottom:10px;color:var(--text-dim);font-weight:700}
.pv-big{text-align:center;margin:6px 0 12px}
.pv-num{font-family:"Fredoka","Poppins",sans-serif;font-size:56px;font-weight:700;line-height:1}
.pv-parts{font-size:16px;font-weight:800;margin-top:4px}
.pv-sum{font-size:13px;color:var(--text-dim);margin-top:2px}
.pv-mats{display:flex;gap:10px;flex-wrap:wrap}
.pv-col{flex:1;min-width:160px;padding:10px;border-radius:20px;border:3px dashed var(--bc,#9ab);background:var(--bg,var(--paper));transition:box-shadow .2s,transform .2s}
.pv-h{--bc:#b79cff;--bg:#f4efff}.pv-t{--bc:#4aa8f0;--bg:#e9f4ff}.pv-o{--bc:#5cc9a8;--bg:#e6f9f2}
.pv-label{font-family:"Fredoka","Poppins",sans-serif;font-weight:700;font-size:18px;text-align:center;margin-bottom:6px}
.pv-body{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;min-height:120px;padding:4px}
.pv-minus{display:block;margin:8px auto 0;border:0;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;color:var(--text-dim)}
.pv-minus:disabled{opacity:.4}
.pv-piece{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pv-cube{width:22px;height:22px;border-radius:6px;background:#5cc9a8;border:2px solid #2f9f80;display:inline-block}
.pv-rod{width:22px;height:96px;border-radius:6px;border:2px solid #2d83c9;background:repeating-linear-gradient(to bottom,#8cc4f2 0,#8cc4f2 8px,#2d83c9 8px,#2d83c9 9.6px);display:inline-block}
.pv-flat{width:64px;height:64px;border-radius:8px;border:2px solid #8b6bd6;background:#cdbcf6;display:inline-grid;place-items:center;font-family:"Fredoka",sans-serif;font-weight:700;font-size:16px;color:#4b2e9a}
.pv-rodrow{display:flex;gap:3px;align-items:flex-end;padding:6px;border-radius:12px;cursor:grab;touch-action:none;width:100%;justify-content:center}
.pv-rodrow .pv-rod{width:15px}
.pv-frame{display:grid;grid-template-columns:repeat(5,24px);gap:3px;padding:5px;border-radius:10px;border:2px solid #9ab;background:#fff}
.pv-frame .pv-cell{width:24px;height:24px;border-radius:6px;border:1px dashed #b8c4cc}
.pv-frame .pv-cube{width:24px;height:24px}
.pv-full{border-color:#e8a21a!important;background:#fff6dd!important;cursor:grab;touch-action:none;animation:pvhint 1.4s ease-in-out infinite}
@keyframes pvhint{50%{box-shadow:0 0 0 5px rgba(232,162,26,.3)}}

/* Weekend Extras — Ryan's own idea: an optional, no-pressure set of cards that shows up on
   Saturday/Sunday when a leader has switched it on for that kid. No XP, no completion checkbox,
   nothing to review — but he asked for something closer to a real project he can pick from, with
   old-tech videos, rather than one thin sentence. Each item pairs a real video/article with a

var WEEKEND_EXTRAS = [

  {title:"Browse the Windows 95 icon gallery", blurb:"See how many of these you recognize from your own install.", link:"https://commons.wikimedia.org/wiki/Category:Windows_95_icons",
    steps:["Browse the gallery and pick your favorite icon.","Open Paint (or any pixel-art tool) and set up a small grid to draw on.","Recreate the icon pixel-by-pixel, matching the colors as closely as you can.","Put yours next to the original and see how close you got."]},
  {title:"Tinker idea: speed-run a boot", blurb:"No video for this one — just you and a stopwatch.", link:null,

  {title:"Explore the Computer History Museum's channel", blurb:"Real historic computers, lectures, and machines most people have never heard of.", link:"https://www.youtube.com/user/computerhistory",

function isWeekendIso(iso){
  var dow = new Date(iso+"T00:00:00").getDay();
  return dow===0 || dow===6;

/* Same 3 picks all day (and if he checks back later), a different trio most weekends — keyed off
   the date so it doesn't reshuffle on every render, rotating through the whole pool over several
   weekends rather than showing the same set every time. */
function weekendExtrasFor(iso){
  var n = WEEKEND_EXTRAS.length;
  var dayNum = Math.floor(new Date(iso+"T00:00:00").getTime()/86400000);
  var base = ((dayNum % n) + n) % n;
  return [WEEKEND_EXTRAS[base], WEEKEND_EXTRAS[(base+1)%n], WEEKEND_EXTRAS[(base+2)%n]];
}
function renderWeekendExtraCard(kidId, iso){

  head.innerHTML = '<span style="font-size:18px">🎮</span><div style="font-weight:700">Weekend Extras — totally optional, pick whichever sounds fun (or none)</div>';
  card.appendChild(head);
  picks.forEach(function(extra, i){
    var item = document.createElement("div");
    item.style.cssText = "padding:10px 0;"+(i<picks.length-1 ? "border-bottom:1px solid var(--border)" : "");
    item.innerHTML =
      '<div style="font-weight:600;font-size:14.5px;margin-bottom:3px">'+escapeHtml(extra.title)+'</div>'+
      '<div class="muted" style="font-size:12.5px;margin-bottom:5px">'+escapeHtml(extra.blurb)+'</div>'+
      (extra.link ? '<div style="margin-bottom:6px">'+(/youtube\.com|youtu\.be/i.test(extra.link) ? videoLinkHtml(extra.link) : materialsLinkHtml(extra.link))+'</div>' : '')+
      '<div style="font-size:13px;font-weight:600;margin-bottom:2px">Project idea:</div>'+
      '<ol style="margin:0 0 0 18px;padding:0;font-size:13px">'+extra.steps.map(function(s){ return '<li style="margin-bottom:3px">'+escapeHtml(s)+'</li>'; }).join("")+'</ol>';
    card.appendChild(item);

}

var SUBJECT_COLOR = {
  "Math":"gold","ELA":"teal","Reading":"teal","Science":"coral","Social Studies":"gold",
  "Related Arts":"success","Live Lesson":"teal","Independent":"gold","Computer Science":"teal"
};
/* Rough time-on-task estimate per subject, used only for the exported hours report — the app has
   no in-lesson timer, so this is a stand-in based on typical lesson length, not measured time.
   Independent/Computer Science lean high on purpose (this is where VM installs and real project
   work live, and those routinely run long) so the default is usually close without needing a
   manual fix every time — logging actualMinutes is for the real outliers, not the norm. */
var SUBJECT_EST_MINUTES = {
  "Math":30,"ELA":30,"Reading":30,"Science":30,"Social Studies":30,
  "Related Arts":30,"Live Lesson":45,"Independent":90,"Computer Science":90
};
/* Lessons with hands-on VM/OS setup help attached (installHelp) run especially long —
   troubleshooting an install is real, open-ended deep work — so they default even higher than
   the already-bumped Independent/Computer Science estimate. */
var INSTALL_HELP_EST_MINUTES = 120;
/* Journal (Morning Launch) and Show & Teach aren't tagged assignments, so without this they'd get
   zero hour credit at all even on a day he spent a real hour writing a thoughtful entry. */
var JOURNAL_EST_MINUTES = 45;
var REFLECTION_EST_MINUTES = 20;

/* A flat guess is fine for a typical lesson, but badly undercounts a long, deep-work session
   (e.g. hours of real VM troubleshooting/reasoning) — actualMinutes, when the leader logs it,
   always wins over any guess. */
function estMinutesFor(a){
  if(a.actualMinutes>0) return a.actualMinutes;
  if(a.installHelp) return INSTALL_HELP_EST_MINUTES;
  return SUBJECT_EST_MINUTES[a.subject] || 30;
}
/* Every subject a quest counts toward for hours/coverage tracking — its primary subject plus any
   crossSubjects tags. An install/setup quest like "set up VirtualBox" is filed under Independent
   for scheduling, but the actual work is reading technical docs, writing up what happened,
   computer-science concepts, and (for the Retro OS Museum track) real OS history — so it should
   get hour credit in all of those, not just Independent. */
function subjectsFor(a){
  var list = [a.subject];
  if(Array.isArray(a.crossSubjects)) a.crossSubjects.forEach(function(s){ if(list.indexOf(s)<0) list.push(s); });
  return list;
}
/* Total estimated minutes for one kid on one day, including the journal/reflection blocks that
   aren't tagged assignments and would otherwise get zero hour credit no matter how long they took. */
function dailyEngagementMinutes(kidId, iso){
  var mins = assignmentsFor(kidId, iso).reduce(function(sum,a){ return sum + estMinutesFor(a); }, 0);
  if(journalEntryFor(kidId, iso)) mins += JOURNAL_EST_MINUTES;
  if(reflectionFor(kidId, iso)) mins += REFLECTION_EST_MINUTES;
  return mins;
}
function weekBoundsMonFri(ref){
  var d = ref ? new Date(ref) : new Date();
  var idx = todayIdxFor(d);
  var mon = new Date(d); mon.setHours(0,0,0,0); mon.setDate(d.getDate()-idx);
  var fri = new Date(mon); fri.setDate(mon.getDate()+4); fri.setHours(23,59,59,999);
  return {start:mon, end:fri};
}
function todayIdxFor(d){ var day = d.getDay(); return day===0?6:day-1; }
/* Georgia Home Study Law (O.C.G.A. § 20-2-690.1) tracking targets — 180 attendance days/year,
   ~4.5 hours/day. attendanceCount is a running tally of distinct calendar days the kid was
   active in the app; lastAttendanceDate guards against double-counting the same day. */
var GA_ANNUAL_DAYS_TARGET = 180;
var GA_DAILY_HOURS_TARGET = 4.5;
function stampAttendance(kidId){
  var kd = kidData(kidId);
  var todayStr = todayISO();
  if(kd.lastAttendanceDate === todayStr) return;
  var updates = {attendanceCount: (kd.attendanceCount||0)+1, lastAttendanceDate: todayStr};
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  if(db) db.doc("kids/"+kidId).update(updates);
}

function todayIdx(){ var d = new Date().getDay(); return d===0?6:d-1; } // 0=Mon..6=Sun
function todayKey(){ var i = todayIdx(); return i<5 ? DAYS[i] : null; }
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayISO(){ return isoDate(new Date()); }

/* Persisted open/closed state for <details> elements, so expanding one doesn't silently collapse
   again on the next re-render or a full page reload — every collapsible section in the app should
   use this instead of relying on the browser's own (render-cycle-local) open state. Stored in
   localStorage, scoped by a caller-built key, so it survives a hard reload, not just an in-memory
   re-render. */
function detailsOpenKey(scope, who, shared, name){
  return "al_details_"+scope+"_"+who+"_"+(shared?"shared":"own")+"_"+name;
}
function isDetailsOpen(key){
  try{ return localStorage.getItem(key)==="1"; } catch(e){ return false; }
}
function setDetailsOpen(key, isOpen){
  try{ if(isOpen) localStorage.setItem(key, "1"); else localStorage.removeItem(key); } catch(e){}
}
/* Same idea, tri-state: a block's manual expand/collapse override needs to distinguish "no
   override yet, use the default" from "explicitly closed" — a plain isOpen boolean can't tell
   those apart, so this stores "1"/"0"/absent and returns null when there's no override at all. */
function getSectionOverride(key){
  try{
    var v = localStorage.getItem(key);
    return v===null ? null : v==="1";
  } catch(e){ return null; }
}
function setSectionOverride(key, isOpen){
  try{ localStorage.setItem(key, isOpen ? "1" : "0"); } catch(e){}
}
/* The most recent school day before d, skipping weekends — so a streak built Mon-Fri doesn't
   break just because there's no school on Saturday/Sunday. */
function prevSchoolDay(d){
  var p = new Date(d); p.setDate(p.getDate()-1);
  while(p.getDay()===0 || p.getDay()===6){ p.setDate(p.getDate()-1); }
  return p;
}
/* A streak survives as long as no school day was skipped. Last counted on or after the most recent
   school day before today (a Friday, or a Sunday catch-up lesson) still counts, so a weekend never
   breaks it. Dates are stored as Date.toDateString() text. */
function streakIntact(lastStr){
  if(!lastStr) return false;
  var last = new Date(lastStr); if(isNaN(last)) return false;
  last.setHours(0,0,0,0);
  var prev = prevSchoolDay(new Date()); prev.setHours(0,0,0,0);
  return last.getTime() >= prev.getTime();
}
/* n school days after d (skipping weekends) — used to space out review questions. */
function addSchoolDays(d, n){
  var p = new Date(d);
  while(n>0){
    p.setDate(p.getDate()+1);
    if(p.getDay()!==0 && p.getDay()!==6) n--;
  }
  return p;
}
/* Mastery Loop core mechanic: a missed quiz question doesn't just get an instant reworded retry
   and then disappear forever — it resurfaces a few school days later as its own tiny review
   assignment, so the skill actually comes back until it's solid. Dedups against anything already
   queued for the same source question so re-missing it in the same session doesn't spam the day. */
function queueSkillReview(kidId, sourceAssignment, item){
  if(!db || !sourceAssignment) return;
  var already = Object.keys(state.assignments).some(function(id){
    var x = state.assignments[id];
    return x.kidId===kidId && x.reviewOf===sourceAssignment.id && x.quiz && x.quiz[0] && x.quiz[0].q===item.q;
  });
  if(already) return;
  var due = addSchoolDays(new Date(), 3);
  db.collection("assignments").add({
    kidId: kidId, date: isoDate(due), subject: sourceAssignment.subject,
    title: "🔁 Review: " + (sourceAssignment.skillId || sourceAssignment.title),
    xp: 5, done: false, doneAt: null, stage: "review",
    skillId: sourceAssignment.skillId || null, reviewOf: sourceAssignment.id || null,
    quiz: [JSON.parse(JSON.stringify(item))],
    createdAt: new Date().toISOString()
  });
}
function fmtDate(iso){
  if(!iso) return "";
  var d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
}

els.datePill.textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"});

/* Avatar (image if picked, initials-circle fallback otherwise) as its own reusable chunk of HTML,
   used both on the trigger button and in each dropdown row. */
function avatarHtml(kidId, className){
  var kd = kidData(kidId);
  var av = avatarFor(kidId);
  if(av) return '<img class="'+className+'-img" src="'+escapeHtml(av.file)+'" alt="">';
  var initials = (kd.name||"?").trim().slice(0,1).toUpperCase();
  return '<div class="'+className+'">'+initials+'</div>';
}

function renderAvatarPickerGrid(kidId, container){
  container.className = "avatar-picker-grid";
  var currentKey = kidData(kidId).avatarKey;
  container.innerHTML = AVATARS.map(function(a){
    return '<img class="avatar-pick-opt'+(a.key===currentKey?' selected':'')+'" data-avatar-key="'+a.key+'" src="'+escapeHtml(a.file)+'" alt="'+escapeHtml(a.label)+'" title="'+escapeHtml(a.label)+'">';
  }).join("");
  container.querySelectorAll(".avatar-pick-opt").forEach(function(img){
    img.onclick = function(e){
      e.stopPropagation();
      var key = img.dataset.avatarKey;
      var kd = kidData(kidId);
      kd.avatarKey = key;
      if(db) db.doc("kids/"+kidId).update({avatarKey: key});
      renderAll();
    };
  });
}

/* Compact profile-switcher dropdown: one trigger button showing the active kid, opening a small
   menu to switch kids or change either kid's avatar — replaces the old side-by-side kid cards so
   the top of the screen stays a single control instead of two full-width blocks. */
function renderKidbar(){
  els.kidbar.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "profile-switch";
  var activeKd = kidData(state.activeKid);
  wrap.style.setProperty("--kc", "var(--"+activeKd.color+")");
  wrap.style.setProperty("--kc-soft", "var(--"+activeKd.color+"-soft)");

  var trigger = document.createElement("button");
  trigger.type = "button";
  trigger.className = "profile-trigger";
  if(state.leaderMode){
    wrap.style.setProperty("--kc", "var(--ink)"); wrap.style.setProperty("--kc-soft", "var(--gold-soft)");
    trigger.innerHTML = '<div class="kid-avatar">\uD83D\uDD11</div><div class="kid-meta"><div class="kid-name">Leader</div><div class="kid-lvl">Mom &amp; Dad tools</div></div>'+
      '<span class="profile-trigger-chevron">'+(state.profileMenuOpen?'\u25B2':'\u25BC')+'</span>';
  } else trigger.innerHTML =
    avatarHtml(state.activeKid, "kid-avatar") +
    '<div class="kid-meta">'+
      '<div class="kid-name">'+escapeHtml(activeKd.name)+'</div>'+
      '<div class="kid-lvl">Level '+levelFor(activeKd.xp)+' &middot; '+activeKd.xp+' XP</div>'+
    '</div>'+
    (activeKd.mommaMoney ? '<div class="mm-badge">$'+activeKd.mommaMoney+'</div>' : '')+
    '<span class="profile-trigger-chevron">'+(state.profileMenuOpen?'▲':'▼')+'</span>';
  trigger.onclick = function(){ state.profileMenuOpen = !state.profileMenuOpen; renderKidbar(); };
  wrap.appendChild(trigger);

  var menu = document.createElement("div");
  menu.className = "profile-menu" + (state.profileMenuOpen ? " open" : "");
  KIDS.forEach(function(k){
    var kd = kidData(k.id);
    var row = document.createElement("div");
    row.className = "profile-row" + (!state.leaderMode && state.activeKid===k.id ? " active" : "");
    row.style.setProperty("--kc-soft", "var(--"+kd.color+"-soft)");

    var avatarBtn = document.createElement("button");
    avatarBtn.type = "button";
    avatarBtn.className = "profile-row-avatar-btn";
    avatarBtn.innerHTML = avatarHtml(k.id, "kid-avatar");
    row.appendChild(avatarBtn);

    var meta = document.createElement("div");
    meta.className = "kid-meta";
    meta.style.flex = "1";
    meta.innerHTML =
      '<div class="kid-name-row">'+
        '<span class="kid-name" data-kid="'+k.id+'" spellcheck="false">'+escapeHtml(kd.name)+'</span>'+
        '<button type="button" class="kid-name-edit-btn" title="Rename">✏️</button>'+
      '</div>'+
      '<div class="kid-lvl">Level '+levelFor(kd.xp)+' &middot; '+kd.xp+' XP</div>'+
      '<button type="button" class="avatar-change-link">Change avatar</button>'+
      '<div class="avatar-picker-holder"></div>';
    row.appendChild(meta);
    /* Whether the grid is open lives in state, not just this row's DOM — the background sync
       rebuilds the whole kidbar every few seconds, and a purely-local "is it open" flag would get
       silently reset (and the grid would look like it slammed shut) on every one of those rebuilds. */
    if(state.avatarPickerOpenFor===k.id){
      var openGrid = document.createElement("div");
      meta.querySelector(".avatar-picker-holder").appendChild(openGrid);
      renderAvatarPickerGrid(k.id, openGrid);
    }

    row.addEventListener("click", function(){
      cleanupMiniGame(); if(state.quiz) state.quiz=null; state.mathGuideOpen=false; state.placeValueOpen=false; state.leaderGuideOpen=false; state.lessonDetailId=null;
      state.activeKid = k.id; state.profileMenuOpen = false; state.tab = "home";
      if(state.leaderMode){ state.leaderMode = false; setLeaderUnlocked(false); }
      renderAll();
    });

    /* The name itself is plain text now — only the pencil button turns editing on, so tapping a
       row to switch/select a kid can never accidentally drop them into rename mode. */
    var nameEl = meta.querySelector(".kid-name");
    var editBtn = meta.querySelector(".kid-name-edit-btn");
    nameEl.addEventListener("click", function(e){ e.stopPropagation(); });
    editBtn.addEventListener("click", function(e){
      e.stopPropagation();
      nameEl.contentEditable = "true";
      nameEl.focus();
      document.execCommand && document.execCommand("selectAll", false, null);
    });
    nameEl.addEventListener("blur", function(){
      nameEl.contentEditable = "false";
      var v = nameEl.textContent.trim().slice(0,24) || kd.name;
      if(v !== kd.name){
        kd.name = v;
        if(db) db.doc("kids/"+k.id).update({name:v});
        renderAll();
      }
    });
    nameEl.addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); nameEl.blur(); } });

    var changeLink = meta.querySelector(".avatar-change-link");
    changeLink.addEventListener("click", function(e){
      e.stopPropagation();
      state.avatarPickerOpenFor = (state.avatarPickerOpenFor===k.id) ? null : k.id;
      renderKidbar();
    });

    menu.appendChild(row);
  });
  var leaderRow = document.createElement("div");
  leaderRow.className = "profile-row" + (state.leaderMode ? " active" : "");
  leaderRow.style.setProperty("--kc-soft", "var(--gold-soft)");
  leaderRow.innerHTML = '<button type="button" class="profile-row-avatar-btn"><div class="kid-avatar">\uD83D\uDD11</div></button>'+
    '<div class="kid-meta" style="flex:1"><div class="kid-name-row"><span class="kid-name">Leader</span></div><div class="kid-lvl">Mom &amp; Dad tools (PIN)</div></div>';
  leaderRow.addEventListener("click", function(){
    cleanupMiniGame(); if(state.quiz) state.quiz=null; state.mathGuideOpen=false; state.placeValueOpen=false; state.leaderGuideOpen=false; state.lessonDetailId=null;
    state.leaderMode = true; state.profileMenuOpen = false;
    renderAll();
  });
  menu.appendChild(leaderRow);
  wrap.appendChild(menu);

  els.kidbar.appendChild(wrap);
}

/* Closes the profile dropdown and any open avatar picker on a click anywhere outside the
   profile-switch control, instead of requiring the kid's name/row specifically. One listener on
   document, added once — renderKidbar() rebuilds the whole .profile-switch tree on every render,
   so there's nothing here to re-attach. */
document.addEventListener("click", function(e){
  if(!state.profileMenuOpen && state.avatarPickerOpenFor==null) return;
  if(e.target.closest(".profile-switch")) return;
  state.profileMenuOpen = false;
  state.avatarPickerOpenFor = null;
  renderKidbar();
});

function renderXpBar(){
  els.xpbarRow.style.display = state.leaderMode ? "none" : "";
  if(state.leaderMode) return;
  var kd = kidData(state.activeKid);
  var pct = progressFor(kd.xp);
  var kc = "var(--"+kd.color+")";
  els.xpbarRow.innerHTML =
    '<span class="xp-label mono">Lv '+levelFor(kd.xp)+'</span>'+
    '<div class="xpbar-track"><div class="xpbar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,'+kc+',color-mix(in srgb,'+kc+' 60%, white))"></div></div>'+
    '<span class="xp-label mono">'+pct+'/100</span>'+
    '<span class="streak">🔥 '+(kd.streak||0)+'</span>';
}

/* ---------- tabs ---------- */
els.tabs.addEventListener("click", function(e){
  var b = e.target.closest(".tab");
  if(!b) return;
  Array.prototype.forEach.call(els.tabs.querySelectorAll(".tab"), function(t){ t.classList.remove("active"); });
  b.classList.add("active");
  state.tab = b.dataset.tab;
  if(state.quiz) state.quiz = null;
  state.mathGuideOpen = false;
  state.placeValueOpen = false;
  state.leaderGuideOpen = false;
  state.lessonDetailId = null;
  cleanupMiniGame();
  renderView();
});

/* Counts finished work with a leader note the active kid hasn't opened yet, so the Completed tab
   can show a "1 new" style badge instead of him having to check every finished item for feedback. */
function countUnreadNotes(kidId){
  var n = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId===kidId && a.noteUnread && a.reviewNote) n++;
  });
  return n;
}

function updateCompletedTabBadge(){
  var btn = document.getElementById("completedTabBtn");
  if(!btn) return;
  var n = countUnreadNotes(state.activeKid);
  btn.innerHTML = "📁 Completed" + (n>0 ? ' <span class="chip" style="background:var(--coral);color:#fff;padding:1px 7px;font-size:11px;margin-left:2px">'+n+' new</span>' : "");
}

/* Focus Mode hides every tab but Today so a kid can't wander off into Arena/Library mid-block —
   the Focus Mode toggle itself lives on Today, so it's always reachable to turn back off. */
function updateFocusModeTabVisibility(){
  els.tabs.style.display = state.leaderMode ? "none" : "";

function petHas(kid, grant){
  if(grant.indexOf("pet:")===0 && (PET_FREE[kid]||[]).indexOf(grant.slice(4))>=0) return true;
  return !!(petOwned[kid] && petOwned[kid][grant]);
}
/* Which pets/accessories has each kid actually bought? Reads the Momma Money shop: an approved spend
   whose reward item has a "grants" value. Pending ones show as "waiting for Mom". If the grants
   column has not been added yet the query errors and everyone just keeps their free pets. */
function loadPetOwnership(force){
  if(petLoading || typeof sb==="undefined" || !sb || !HOUSEHOLD_ID) return;
  if(!force && Date.now()-petLoadedAt < 60000) return;
  petLoading = true;
  Promise.all([
    sb.from("reward_items").select("id,grants").eq("household_id", HOUSEHOLD_ID).not("grants","is",null),
    sb.from("transactions").select("member_id,reward_item_id,status").eq("household_id", HOUSEHOLD_ID).eq("type","spend").not("reward_item_id","is",null)
  ]).then(function(res){
    petLoading = false; petLoadedAt = Date.now();
    if(res[0].error || res[1].error) return;
    var g = {}, kidOf = {}, owned = {kid1:{}, kid2:{}}, pend = {kid1:{}, kid2:{}};
    (res[0].data||[]).forEach(function(r){ g[r.id] = r.grants; });
    Object.keys(MM_MEMBERS).forEach(function(k){ kidOf[MM_MEMBERS[k]] = k; });
    (res[1].data||[]).forEach(function(t){
      var kid = kidOf[t.member_id], gr = g[t.reward_item_id];
      if(!kid || !gr) return;
      if(t.status==="approved") owned[kid][gr] = true; else if(t.status==="pending") pend[kid][gr] = true;
    });
    petOwned = owned; petPending = pend;
    applyPetLook(); if(petPanelOpen()) renderPetPanel();
  }).catch(function(){ petLoading = false; });
}

  var def = petDef(id);
  if(!def || !petHas(kid, "pet:"+def.id)) def = petDef(PET_FREE[kid][0]);
  return def;
}

  if(head && def.top) h += '<use href="#acc-'+head+'" transform="translate('+def.top[0]+' '+def.top[1]+')"/>';

  if(!p){ p = document.createElement("div"); p.id = "petPanel"; document.body.appendChild(p); }
  p.style.display = "block";
  var cur = petCur(), wornHead = petWorn("head"), wornFace = petWorn("face");
  function tile(kind, d, owned, pending, active){
    var thumb = kind==="pet"
      ? '<svg viewBox="0 0 230 190" aria-hidden="true">'+petArt(d, null, null)+'</svg>'
      : '<svg viewBox="-40 -56 80 70" aria-hidden="true"><use href="#acc-'+d.id+'" transform="translate(0 '+(d.slot==="face"?-10:0)+')"/></svg>';
    var label = active ? (kind==="pet" ? "Out now" : "Wearing") : owned ? (kind==="pet" ? "Bring out" : "Wear it") : pending ? "Waiting for Mom" : "$"+d.price+" in the shop";
    return '<button type="button" class="pp-tile'+(active?' on':'')+(owned?'':' locked')+'" data-kind="'+kind+'" data-id="'+d.id+'">'+
      '<span class="pp-art">'+thumb+'</span><span class="pp-name">'+escapeHtml(d.short||d.name)+'</span><span class="pp-state">'+label+'</span></button>';
  }
  var petTiles = PET_DEFS.map(function(d){

        if(!petHas(kidNow, "pet:"+id)){ toast(petPending[kidNow]["pet:"+id] ? "Waiting for Mom or Dad to approve it." : d.short+" costs $"+d.price+" in the Momma Money shop."); return; }
        petLS(petWhichKey(), id); applyPetLook(); petHop(); petSay(d.hi || ("Hi! I am "+d.short+"!"));
      } else {
        var a = accDef(id);
        if(!petHas(kidNow, "acc:"+id)){ toast(petPending[kidNow]["acc:"+id] ? "Waiting for Mom or Dad to approve it." : a.name+" costs $"+a.price+" in the Momma Money shop."); return; }
        var key = petAccKey(a.slot);
        petLS(key, petLS(key)===id ? "" : id); applyPetLook(); petHop();
      }
      renderPetPanel();
    };
  });
}

   edit times, add ideas, and grant extra learning time for the day. The plan lives in al_kids.day_plan
   (jsonb); until a kid has one saved, DEFAULT_PLAN is used. Break/lunch entries are not lesson blocks. */
var PLAN_EXTRA_LABELS = {

};
var PLAN_IDEAS = {
  kid1:{
    move:["Rainbow dance party: dance to 3 songs","Gallop like a unicorn around the yard 10 times","Hopscotch with chalk outside","Hula hoop or jump rope: how many in a row?","Animal walk race: bunny hops, bear crawl, crab walk"],

  }

function planMins(hhmm){ var p = String(hhmm||"0:0").split(":"); return (+p[0]||0)*60 + (+p[1]||0); }
function fmtClock(m){ var h = Math.floor(m/60), mm = m%60, ap = h>=12 ? "pm" : "am"; h = h%12 || 12; return h+":"+(mm<10?"0":"")+mm+ap; }
function getDayPlan(kidId){
  var def = DEFAULT_PLAN[kidId]; if(!def) return null;
  var saved = kidData(kidId).dayPlan;
  var plan = {end:def.end, items:def.items.slice(), extraUntil:0, ideas:[]};
  if(saved && typeof saved==="object"){
    if(saved.end) plan.end = saved.end;
    if(Array.isArray(saved.items) && saved.items.length) plan.items = saved.items;
    plan.extraUntil = +saved.extraUntil || 0;
    if(Array.isArray(saved.ideas)) plan.ideas = saved.ideas;
  }
  return plan;
}
function planItemInfo(kidId, key){
  var b = blocksForKid(kidId).filter(function(x){ return x.key===key; })[0];
  if(b) return {label:b.label, icon:b.icon, block:true};
  var e = PLAN_EXTRA_LABELS[key] || {label:key, icon:"⏰"};
  return {label:e.label, icon:e.icon, block:false};
}
/* Where is this kid in the clock right now? "off" = weekend or no plan; "before" = before the first
   block; "running" = inside item idx; "extra" = past the end time but a parent granted extra time;
   "over" = past the end time (or extra time ran out). */
function planNow(kidId, now){
  var plan = getDayPlan(kidId); if(!plan) return {phase:"off"};
  var dow = now.getDay(); if(dow===0 || dow===6) return {phase:"off"};
  var m = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  var end = planMins(plan.end);
  var items = plan.items.map(function(it){ return {key:it[0], start:planMins(it[1])}; }).sort(function(a,b){ return a.start-b.start; });
  items.forEach(function(it, i){ it.stop = i<items.length-1 ? items[i+1].start : end; });
  if(m < items[0].start) return {phase:"before", start:items[0].start, plan:plan};
  if(m >= end){
    if(plan.extraUntil && now.getTime() < plan.extraUntil)
      return {phase:"extra", plan:plan, end:end, extraMins:Math.ceil((plan.extraUntil-now.getTime())/60000)};
    return {phase:"over", plan:plan, end:end};
  }
  for(var i=0;i<items.length;i++){
    if(m>=items[i].start && m<items[i].stop){
      return {phase:"running", idx:i, item:items[i], items:items, plan:plan, end:end, m:m,
        minsLeft:Math.ceil(items[i].stop-m), endLeft:Math.ceil(end-m), next:items[i+1]||null};
    }
  }
  return {phase:"off"};
}
function planIsOver(kidId){ return planNow(kidId, new Date()).phase==="over"; }
function planIdeasFor(kidId, count){
  var pool = PLAN_IDEAS[kidId]; if(!pool) return [];
  var plan = getDayPlan(kidId), out = [];
  [["move","Move your body"],["make","Make something"],["quiet","Quiet time"]].forEach(function(c){
    out.push({tag:c[1], text:petPick(pool[c[0]])});
  });
  if(plan && plan.ideas.length) out.push({tag:"Mom's pick", text:petPick(plan.ideas)});
  return out.slice(0, count||4);
}
function planBarEl(kidId){

  }
  var info = planItemInfo(kidId, st.item.key), nxt = st.next ? planItemInfo(kidId, st.next.key) : null;
  var span = st.item.stop - st.item.start, frac = Math.max(0, Math.min(1, (st.m - st.item.start)/span));
  var screenOff = !info.block && st.item.key!=="catchup";

      planIdeasFor(kidId, 2).map(function(i){ return '<div class="idea"><small>'+escapeHtml(i.tag)+'</small>'+escapeHtml(i.text)+'</div>'; }).join("")+'</div>';
  } else if(st.endLeft<=10){

  return bar;
}
var planTimer = null, planPrevPhase = {}, planPrevIdx = {}, planSeen = {};
function planTickOnce(){
  if(state.leaderMode) return;

/* dateFilter: null = all of this kid's assignments; a "YYYY-MM-DD" string = exact date; a function(date)->bool = predicate */

/* Speaks text aloud via the Web Speech API so a kid can hear instructions read
   instead of/alongside reading them himself. Silently no-ops if unsupported. */

  window.speechSynthesis.speak(u);
}

/* ---------- Click-only Quick Check types (laptop/trackpad friendly: no dragging) ----------
   Each builder draws its own UI into qRow and calls done(true|false) once when the kid presses
   Check. Low-stakes by design: she can undo/rearrange freely until she checks, and a miss just
   shows the right answer plus the explanation. Item shapes:
   {type:"order", q, items:[correct order...], explain}
   {type:"build", q, target:236, places:["hundreds","tens","ones"], explain}
   {type:"sort",  q, categories:["A","B"], items:[{t:"text", c:0}], explain}
   {type:"match", q, pairs:[["left","right"],...], explain} */
function quizBtn(text, primary){
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = text;
  b.style.cssText = "padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:"+(primary?"var(--gold-soft)":"var(--card)")+";color:var(--text);font:inherit;font-size:15px;cursor:pointer;text-align:left";
  return b;
}
function shuffled(arr){
  var a2 = arr.slice();
  for(var i=a2.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t = a2[i]; a2[i] = a2[j]; a2[j] = t; }
  return a2;
}
function quizCheckRow(qRow, onCheck, onUndo){
  var row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-top:10px";
  var undo = quizBtn("↩ Start over");
  var check = quizBtn("✓ Check", true);
  check.style.fontWeight = "700";
  check.disabled = true; check.style.opacity = ".5";
  undo.onclick = onUndo; check.onclick = onCheck;
  row.appendChild(undo); row.appendChild(check);
  qRow.appendChild(row);
  return {row:row, undo:undo, check:check, ready:function(ok){ check.disabled = !ok; check.style.opacity = ok ? "1" : ".5"; }, lock:function(){ undo.disabled = true; check.disabled = true; row.style.opacity = ".6"; }};
}
function quizReveal(qRow, text){
  var r = document.createElement("div");
  r.style.cssText = "margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--success-soft);border:1px solid var(--success);font-size:13px";
  r.textContent = text;
  qRow.appendChild(r);
}
var INTERACTIVE_QUIZ = {
  order: function(item, qRow, done){
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;flex-direction:column;gap:6px";
    var seq = [];
    var opts = shuffled(item.items);
    var btns = opts.map(function(txt){
      var b = quizBtn(txt);
      b.onclick = function(){
        if(seq.indexOf(txt)>=0) return;
        seq.push(txt);
        refresh();
      };
      wrap.appendChild(b);
      return b;
    });
    var ctl;
    function refresh(){
      btns.forEach(function(b, i){
        var pos = seq.indexOf(opts[i]);
        b.textContent = (pos>=0 ? (pos+1)+". " : "")+opts[i];
        b.style.background = pos>=0 ? "var(--gold-soft)" : "var(--card)";
      });
      ctl.ready(seq.length===item.items.length);
    }
    ctl = quizCheckRow(qRow, function(){
      var ok = seq.every(function(x, i){ return x===item.items[i]; });
      ctl.lock(); btns.forEach(function(b){ b.disabled = true; });
      btns.forEach(function(b, i){ var pos = seq.indexOf(opts[i]); b.style.background = (item.items[pos]===opts[i]) ? "var(--success-soft)" : "var(--coral-soft)"; });
      if(!ok) quizReveal(qRow, "Right order: "+item.items.join(" → "));
      done(ok);
    }, function(){ seq = []; refresh(); });
    qRow.insertBefore(wrap, ctl.row);
    refresh();
  },
  build: function(item, qRow, done){
    var places = item.places || ["hundreds","tens","ones"];
    var mult = places.length===3 ? [100,10,1] : places.length===2 ? [10,1] : [1];
    var vals = places.map(function(){ return 0; });
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end";
    var shows = [];
    var total = document.createElement("div");
    total.style.cssText = "margin-top:8px;font-size:18px;font-weight:700";
    places.forEach(function(name, i){
      var col = document.createElement("div");
      col.style.cssText = "text-align:center";
      var lbl = document.createElement("div");
      lbl.style.cssText = "font-size:13px;margin-bottom:4px";
      lbl.textContent = name;
      var plus = quizBtn("+"); plus.style.padding = "10px 18px";
      var minus = quizBtn("−"); minus.style.padding = "10px 18px";
      var show = document.createElement("div");
      show.style.cssText = "font-size:26px;font-weight:700;margin:4px 0;min-width:48px";
      shows.push(show);
      plus.onclick = function(){ if(vals[i]<9){ vals[i]++; refresh(); } };
      minus.onclick = function(){ if(vals[i]>0){ vals[i]--; refresh(); } };
      col.appendChild(lbl); col.appendChild(plus); col.appendChild(show); col.appendChild(minus);
      wrap.appendChild(col);
    });
    var ctl;
    function sum(){ return vals.reduce(function(t, v, i){ return t+v*mult[i]; }, 0); }
    function refresh(){
      shows.forEach(function(sh, i){ sh.textContent = vals[i]; });
      total.textContent = "Your number: "+sum();
      ctl.ready(true);
    }
    ctl = quizCheckRow(qRow, function(){
      var ok = sum()===item.target;
      ctl.lock();
      if(!ok) quizReveal(qRow, "The number was "+item.target+".");
      done(ok);
    }, function(){ vals = vals.map(function(){ return 0; }); refresh(); });
    qRow.insertBefore(wrap, ctl.row);
    qRow.insertBefore(total, ctl.row);
    refresh();
  },
  sort: function(item, qRow, done){
    var cats = item.categories;
    var pool = shuffled(item.items.map(function(it, i){ return {t:it.t, c:it.c, id:i}; }));
    var placed = {}; // id -> category index
    var selected = null;
    var poolWrap = document.createElement("div");
    poolWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px";
    var catWrap = document.createElement("div");
    catWrap.style.cssText = "display:flex;flex-direction:column;gap:6px";
    var ctl;
    function refresh(){
      poolWrap.innerHTML = "";
      pool.forEach(function(it){
        if(placed[it.id]!=null) return;
        var b = quizBtn(it.t);
        if(selected===it.id){ b.style.background = "var(--gold-soft)"; b.style.borderColor = "var(--gold)"; }
        b.onclick = function(){ selected = (selected===it.id ? null : it.id); refresh(); };
        poolWrap.appendChild(b);
      });
      catWrap.innerHTML = "";
      cats.forEach(function(cat, ci){
        var box = document.createElement("div");
        box.style.cssText = "padding:8px;border:2px dashed var(--border);border-radius:10px";
        var head = quizBtn("📥 "+cat, selected!=null);
        head.style.fontWeight = "700";
        head.onclick = function(){ if(selected!=null){ placed[selected] = ci; selected = null; refresh(); } };
        box.appendChild(head);
        var chips = document.createElement("div");
        chips.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:6px";
        pool.forEach(function(it){
          if(placed[it.id]!==ci) return;
          var chip = quizBtn(it.t + " ✕");
          chip.style.fontSize = "13.5px"; chip.style.padding = "7px 10px";
          chip.onclick = function(){ delete placed[it.id]; refresh(); };
          chips.appendChild(chip);
        });
        box.appendChild(chips);
        catWrap.appendChild(box);
      });
      ctl.ready(pool.every(function(it){ return placed[it.id]!=null; }));
    }
    ctl = quizCheckRow(qRow, function(){
      var wrong = pool.filter(function(it){ return placed[it.id]!==it.c; });
      ctl.lock();
      if(wrong.length) quizReveal(qRow, wrong.map(function(it){ return it.t+" → "+cats[it.c]; }).join("; "));
      done(wrong.length===0);
    }, function(){ placed = {}; selected = null; refresh(); });
    qRow.insertBefore(poolWrap, ctl.row);
    qRow.insertBefore(catWrap, ctl.row);
    refresh();
  },
  match: function(item, qRow, done){
    var lefts = item.pairs.map(function(p, i){ return {t:p[0], id:i}; });
    var rights = shuffled(item.pairs.map(function(p, i){ return {t:p[1], id:i}; }));
    var link = {}; // left id -> right id
    var selLeft = null;
    var grid = document.createElement("div");
    grid.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:6px 14px";
    var ctl;
    function refresh(){
      grid.innerHTML = "";
      var leftCol = document.createElement("div"), rightCol = document.createElement("div");
      leftCol.style.cssText = rightCol.style.cssText = "display:flex;flex-direction:column;gap:6px";
      var usedRights = Object.keys(link).map(function(k){ return link[k]; });
      lefts.forEach(function(l){
        var linked = link[l.id]!=null;
        var b = quizBtn((linked ? "🔗 " : "")+l.t);
        if(selLeft===l.id){ b.style.background = "var(--gold-soft)"; b.style.borderColor = "var(--gold)"; }
        if(linked) b.style.background = "var(--teal-soft)";
        b.onclick = function(){
          if(linked){ delete link[l.id]; selLeft = null; }
          else selLeft = (selLeft===l.id ? null : l.id);
          refresh();
        };
        leftCol.appendChild(b);
      });
      rights.forEach(function(r){
        var taken = usedRights.indexOf(r.id)>=0;
        var b = quizBtn((taken ? "🔗 " : "")+r.t);
        if(taken) b.style.background = "var(--teal-soft)";
        b.onclick = function(){
          if(taken || selLeft==null) return;
          link[selLeft] = r.id; selLeft = null; refresh();
        };
        rightCol.appendChild(b);
      });
      grid.appendChild(leftCol); grid.appendChild(rightCol);
      ctl.ready(Object.keys(link).length===lefts.length);
    }
    ctl = quizCheckRow(qRow, function(){
      var wrong = lefts.filter(function(l){ return link[l.id]!==l.id; });
      ctl.lock();
      if(wrong.length) quizReveal(qRow, item.pairs.map(function(p){ return p[0]+" = "+p[1]; }).join("; "));
      done(wrong.length===0);
    }, function(){ link = {}; selLeft = null; refresh(); });
    qRow.insertBefore(grid, ctl.row);
    refresh();
  }
};

/* ---------- Place Value Playground: ten-frames, ten-rods, hundred-flats (click only) ----------
   A digital version of the base-ten blocks Anna also uses with real buttons/beans. 10 ones fill a
   ten-frame and can be bundled into a ten-rod; 10 rods bundle into a hundred-flat (and back).
   State lives in state.pv so a background sync re-render never wipes what she built. */
function placeValuePlaygroundCard(){
  var wrap = document.createElement("div");
  wrap.className = "card";
  wrap.style.marginTop = "10px";
  var head = document.createElement("div");
  head.className = "task";
  head.style.cursor = "pointer";
  head.innerHTML = '<div class="task-body"><div class="task-title">🔟 Place Value Playground</div>'+
    '<div class="task-sub">Fill ten-frames, bundle tens and hundreds, and build numbers</div></div><div class="task-xp">▶</div>';
  head.onclick = function(){ state.placeValueOpen = true; renderView(); };
  wrap.appendChild(head);
  return wrap;
}
function renderPlaceValueTool(){
  els.view.innerHTML = "";
  var pv = state.pv = state.pv || {h:0, t:0, o:0, target:null, msg:"", glow:null, anim:null, busy:false};
  function total(){ return pv.h*100 + pv.t*10 + pv.o; }
  function draw(){ renderPlaceValueTool(); }
  function say(m){ pv.msg = m; draw(); }
  function pop(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext, ctx = new AC(), o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "triangle"; o.frequency.setValueAtTime(420, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime+.12);
      g.gain.setValueAtTime(.0001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime+.25);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.3);
    }catch(e){}
  }
  /* Ten of something glows, then pops into one of the next place. Chains (10 tens -> a hundred). */
  function glowThenBundle(col){
    pv.busy = true; pv.glow = col; pv.msg = ""; draw();
    setTimeout(function(){
      if(!state.placeValueOpen || state.pv!==pv) return;
      if(col==="o"){ pv.o -= 10; pv.t++; pv.anim = "t"; pv.msg = "10 ones made 1 ten! Pop!"; }
      else { pv.t -= 10; pv.h++; pv.anim = "h"; pv.msg = "10 tens made 1 hundred! Pop!"; }
      pv.glow = null; pv.busy = false; pop();
      if(state.activeKid==="kid1") petSay(col==="o" ? "10 ones make 1 ten! Pop!" : "10 tens make 1 hundred! Wow!");
      draw();
      if(col==="o" && pv.t===10) glowThenBundle("t");
    }, 750);
  }
  function addOne(col){
    if(pv.busy) return;
    var add = col==="h" ? 100 : col==="t" ? 10 : 1;
    if(total()+add>999){ return say("That is the biggest number we can build: 999!"); }
    if(col==="h") pv.h++; else if(col==="t") pv.t++; else pv.o++;
    pv.msg = ""; pv.anim = null;
    if(col==="o" && pv.o===10) return glowThenBundle("o");
    if(col==="t" && pv.t===10) return glowThenBundle("t");
    draw();
  }
  function manualBundle(col){ if(!pv.busy) glowThenBundle(col); }
  function breakApart(kind){
    if(pv.busy) return;
    if(kind==="t"){ pv.t--; pv.o += 10; pv.msg = "You broke 1 ten into 10 ones."; }
    else { pv.h--; pv.t += 10; pv.msg = "You broke 1 hundred into 10 tens."; }
    pv.anim = null; draw();
  }
  function takeAway(kind){
    if(pv.busy) return;
    if(kind==="o") pv.o--; else if(kind==="t") pv.t--; else if(kind==="h") pv.h--;
    else if(kind==="frame") pv.o -= 10; else if(kind==="row") pv.t -= 10;
    pv.msg = ""; pv.anim = null; draw();
  }
  var HINT = {o:"Ones go in the ones place.", t:"Tens go in the tens place.", h:"Hundreds go in the hundreds place."};
  /* What happens when a piece is clicked (kind) or dropped on a place ("o","t","h") or the trash. */
  function clickPiece(kind){
    if(kind==="bin-o") return addOne("o");
    if(kind==="bin-t") return addOne("t");
    if(kind==="bin-h") return addOne("h");
    if(kind==="t" || kind==="h") return breakApart(kind);
    if(kind==="frame") return manualBundle("o");
    if(kind==="row") return manualBundle("t");
    say("A single one stays a one. Get 10 ones to make a ten!");
  }
  function dropPiece(kind, where){
    if(where==="trash"){ if(kind.indexOf("bin-")===0) return; return takeAway(kind); }
    if(!where) return;
    if(kind==="bin-o") return where==="o" ? addOne("o") : say(HINT.o);
    if(kind==="bin-t") return where==="t" ? addOne("t") : say(HINT.t);
    if(kind==="bin-h") return where==="h" ? addOne("h") : say(HINT.h);
    if(kind==="t" && where==="o") return breakApart("t");
    if(kind==="h" && where==="t") return breakApart("h");
    if(kind==="frame" && where==="t") return manualBundle("o");
    if(kind==="row" && where==="h") return manualBundle("t");
    if(kind==="o") return say("One block alone stays a one. Make 10 to trade up!");
    say("Try clicking it, or drag it to the place it turns into.");
  }
  function startDrag(e, kind, el){
    if(e.button!=null && e.button!==0) return;
    if(pv.busy) return;
    e.preventDefault();
    var r = el.getBoundingClientRect(), ghost = el.cloneNode(true), moved = false, sx = e.clientX, sy = e.clientY;
    ghost.className += " pv-ghost"; ghost.style.width = r.width+"px"; ghost.style.height = r.height+"px";
    function place(x, y){ ghost.style.left = (x - r.width/2)+"px"; ghost.style.top = (y - r.height/2)+"px"; }
    function move(ev){
      if(!moved && Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>7){ moved = true; document.body.appendChild(ghost); el.style.opacity = ".35"; }
      if(moved) place(ev.clientX, ev.clientY);
    }
    function up(ev){
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      ghost.remove(); el.style.opacity = "";

    var inFrame = Math.min(10, Math.max(0, pv.o - f*10)), frame = document.createElement("div"), full = inFrame===10;

/* Leader review: the lesson exactly as the kid sees it (instructions, links, quiz with answers),
   read-only, so reviewing their work has the context of what was asked. */
function lessonContextEl(a){
  var det = document.createElement("details");
  det.style.cssText = "margin:0 0 10px;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px solid var(--border)";
  var key = detailsOpenKey("review","lesson",false,String(a.id));
  if(isDetailsOpen(key)) det.open = true;
  det.addEventListener("toggle", function(){ setDetailsOpen(key, det.open); });
  var sm = document.createElement("summary");
  sm.style.cssText = "cursor:pointer;font-weight:700;font-size:13.5px";
  sm.textContent = "📖 See the full lesson as assigned";
  det.appendChild(sm);
  var html = "";
  var meta = [];
  if(a.date) meta.push(fmtDate(a.date));
  if(a.standard) meta.push("Standard "+a.standard);
  if(a.stage) meta.push("Stage: "+a.stage);
  if(Array.isArray(a.crossSubjects) && a.crossSubjects.length) meta.push("Also credits "+a.crossSubjects.join(", "));
  meta.push(a.xp+" XP");
  html += '<div class="muted" style="font-size:12px;margin:8px 0">'+escapeHtml(meta.join(" · "))+'</div>';
  if(a.passage){
    html += a.passage.split("\n").filter(function(l){ return l.trim(); }).map(function(l){
      var m = l.match(/^([^—]{3,40}) — ([\s\S]*)$/);
      return m ? '<div style="font-size:13.5px;line-height:1.5;margin-bottom:6px"><b>'+escapeHtml(m[1])+':</b> '+escapeHtml(m[2])+'</div>'
               : '<div style="font-size:13.5px;line-height:1.5;margin-bottom:6px">'+escapeHtml(l)+'</div>';
    }).join("");
  } else {
    html += '<div class="muted" style="font-size:13px;margin-bottom:6px">No written instructions on this lesson.</div>';
  }
  if(a.video) html += '<div style="margin:6px 0">'+videoLinkHtml(a.video)+'</div>';
  if(a.materials) html += '<div style="margin:6px 0">'+materialsLinkHtml(a.materials)+'</div>';
  if(Array.isArray(a.quiz) && a.quiz.length){
    html += '<div style="font-weight:700;font-size:13px;margin:10px 0 4px">🎯 Quick Check ('+a.quiz.length+' question'+(a.quiz.length>1?'s':'')+')</div>';
    html += a.quiz.map(function(q, i){
      var ans;
      if(q.type==="order") ans = "Order: "+q.items.join(" → ");
      else if(q.type==="build") ans = "Build "+q.target;
      else if(q.type==="sort") ans = (q.items||[]).map(function(it){ return it.t+" → "+q.categories[it.c]; }).join("; ");
      else if(q.type==="match") ans = (q.pairs||[]).map(function(pr){ return pr[0]+" = "+pr[1]; }).join("; ");
      else ans = (q.choices||[])[q.answerIndex];
      return '<div style="font-size:13px;margin-bottom:6px"><b>'+(i+1)+'.</b> '+escapeHtml(q.q)+
        '<div class="muted" style="font-size:12.5px">Answer: '+escapeHtml(ans==null?"":ans)+(q.explain?' — '+escapeHtml(q.explain):'')+'</div></div>';
    }).join("");
  }
  var body = document.createElement("div");
  body.innerHTML = html;
  det.appendChild(body);
  return det;
}
