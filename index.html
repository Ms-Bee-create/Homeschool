function questionForm(){
  var wrap = document.createElement("div");
  wrap.className = "card";
  var inner = document.createElement("div");
  inner.className = "qform";
  inner.style.padding = "14px";
  inner.innerHTML =
    '<input class="qf-q" placeholder="Question (e.g. What is 7 x 8?)" maxlength="120">'+
    '<div class="opts4">'+
      '<input class="qf-o0" placeholder="Choice A">'+
      '<input class="qf-o1" placeholder="Choice B">'+
      '<input class="qf-o2" placeholder="Choice C">'+
      '<input class="qf-o3" placeholder="Choice D">'+
    '</div>'+
    '<div class="addrow" style="padding:0">'+
      '<select class="qf-subject">'+Object.keys(SUBJECT_COLOR).map(function(s){return '<option>'+s+'</option>';}).join("")+'</select>'+
      '<select class="qf-answer"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select>'+
      '<button class="af-add">Save</button>'+
    '</div>';
  wrap.appendChild(inner);
  inner.querySelector(".af-add").onclick = function(){
    var q = inner.querySelector(".qf-q").value.trim();
    var choices = [0,1,2,3].map(function(i){ return inner.querySelector(".qf-o"+i).value.trim(); });
    if(!q || choices.some(function(c){return !c;}) || !db) return;
    db.collection("questions").add({
      subject: inner.querySelector(".qf-subject").value,
      answerIndex: Number(inner.querySelector(".qf-answer").value),
      q: q, choices: choices, kidId: state.activeKid, xp: 15
    });
    toast("Question added to the bank!");
    inner.querySelector(".qf-q").value="";
    [0,1,2,3].forEach(function(i){ inner.querySelector(".qf-o"+i).value=""; });
  };
  return wrap;
}

/* ---------- Arcade mini-games (Space Mission / Parkour Course) ---------- */
function grantXP(kidId, amount){
  if(!db || amount<=0) return;
  var kd = kidData(kidId);
  var oldXp = kd.xp||0, newXp = oldXp+amount;
  var lvl = levelUpBonus(oldXp, newXp);
  var updates = {xp:newXp};
  if(lvl.gained>0) updates.mommaMoney = (kd.mommaMoney||0)+lvl.bonus;
  Object.assign(kd, updates);
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update(updates);
  if(kidId===state.activeKid) renderXpBar();
  if(lvl.gained>0) logLevelUpReward(kidId, lvl);
}

function grantMommaMoney(kidId, amount){
  if(!db || amount<=0) return;
  var kd = kidData(kidId);
  var newMoney = (kd.mommaMoney||0)+amount;
  kd.mommaMoney = newMoney;
  state.kids[kidId] = kd;
  db.doc("kids/"+kidId).update({mommaMoney: newMoney});
  if(kidId===state.activeKid) renderXpBar();
}

function cleanupMiniGame(){
  var mg = state.miniGame;
  if(mg){
    if(mg.raf) cancelAnimationFrame(mg.raf);
    if(mg.timeoutId) clearTimeout(mg.timeoutId);
    if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
    if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  }
  state.miniGame = null;
}

function startMiniGame(type){
  var qs = state.questions.filter(function(q){ return q.kidId===state.activeKid || q.kidId==="any"; });
  var key = type==="space" ? "ela" : "math";
  var pool = qs.filter(function(q){
    var sg = (q.studyGuide||"").toLowerCase();
    return sg.indexOf(key)>-1 && sg.indexOf("cfa")>-1;
  });
  if(!pool.length){
    pool = qs.filter(function(q){ return (q.subject||"").toLowerCase().indexOf(key)>-1; });
  }
  pool = pool.slice().sort(function(){ return Math.random()-.5; });
  state.miniGame = {
    type: type, pool: pool, qIdx: 0, fuel: 0, score: 0, lives: 3, running: false, raf: null, timeoutId: null,
    ship: {}, asteroids: [], boosting: false,
    runner: {}, platforms: []
  };
  renderArena();
}

function stopMiniGame(){
  cleanupMiniGame();
  renderArena();
}

function openMiniGameQuestion(){
  var mg = state.miniGame;
  if(!mg || !mg.pool.length) return;
  if(mg.raf){ cancelAnimationFrame(mg.raf); mg.raf=null; }
  mg.running = false;
  var q = mg.pool[mg.qIdx % mg.pool.length];
  els.view.innerHTML = "";
  var card = document.createElement("div");
  card.className = "qz-card";
  var opts = document.createElement("div");
  opts.className = "qz-opts";
  var letters = ["A","B","C","D"];
  q.choices.forEach(function(c,i){
    var b = document.createElement("button");
    b.className = "qz-opt";
    b.textContent = letters[i]+".  "+c;
    b.onclick = function(){ answerMiniGameQuestion(i,q); };
    opts.appendChild(b);
  });
  card.innerHTML = '<p class="qz-q">'+escapeHtml(q.q)+'</p>';
  card.appendChild(opts);
  els.view.appendChild(card);
}

function answerMiniGameQuestion(choiceIdx, q){
  var mg = state.miniGame;
  if(!mg) return;
  var correct = choiceIdx===q.answerIndex;
  var opts = document.querySelectorAll(".qz-opt");
  opts.forEach(function(btn,i){
    btn.disabled = true;
    if(i===q.answerIndex) btn.classList.add("correct");
    else if(i===choiceIdx) btn.classList.add("wrong");
  });
  if(correct){
    mg.fuel += (mg.type==="space" ? 10 : 3);
    toast(mg.type==="space" ? "+10 Fuel Units! ⛽" : "+3 Jump Energy! ⚡");
  } else {
    toast("Not quite — no fuel this round");
  }
  mg.qIdx++;
  mg.timeoutId = setTimeout(function(){
    if(state.miniGame!==mg) return; // kid navigated away before this fired
    renderArena();
  }, 900);
}

function renderMiniGame(){
  var mg = state.miniGame;
  els.view.innerHTML = "";

  var head = document.createElement("div");
  head.className = "qz-head";
  head.innerHTML = '<span>'+(mg.type==="space" ? "🚀 Space Mission" : "🏃 Parkour Course")+' &middot; Score '+mg.score+'</span>'+
    '<span class="qz-timer" style="color:var(--gold)">'+(mg.type==="space" ? "⛽ "+mg.fuel : "⚡ "+mg.fuel)+'</span>';
  els.view.appendChild(head);

  var card = document.createElement("div");
  card.className = "qz-card";
  card.style.padding = "14px";
  var canvas = document.createElement("canvas");
  canvas.width = 320; canvas.height = 280;
  canvas.style.cssText = "width:100%;max-width:320px;display:block;margin:0 auto;border-radius:12px;background:linear-gradient(180deg,#0b1830,#142845)";
  card.appendChild(canvas);

  var ctr = document.createElement("div");
  ctr.style.cssText = "display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap";
  if(mg.type==="space"){
    ctr.innerHTML =
      '<button class="primary-btn" id="mgLeft" style="margin:0">◀</button>'+
      '<button class="primary-btn" id="mgBoost" style="margin:0;background:var(--gold)">🚀 Boost (10⛽)</button>'+
      '<button class="primary-btn" id="mgRight" style="margin:0">▶</button>';
  } else {
    ctr.innerHTML =
      '<button class="primary-btn" id="mgLeft" style="margin:0">◀</button>'+
      '<button class="primary-btn" id="mgJump" style="margin:0;background:var(--gold)">⬆ Jump (1⚡)</button>'+
      '<button class="primary-btn" id="mgRight" style="margin:0">▶</button>';
  }
  card.appendChild(ctr);

  var qbtn = document.createElement("button");
  qbtn.className = "reward-skip";
  qbtn.style.cssText = "color:var(--ink);opacity:1;display:block;margin:10px auto 0";
  qbtn.textContent = mg.pool.length ? "❓ Answer a question for "+(mg.type==="space" ? "fuel" : "energy") : "No study-guide questions in the bank yet";
  qbtn.disabled = !mg.pool.length;
  qbtn.onclick = function(){ openMiniGameQuestion(); };
  card.appendChild(qbtn);

  var backBtn = document.createElement("button");
  backBtn.className = "reward-skip";
  backBtn.style.cssText = "color:var(--text-dim);opacity:1;display:block;margin:8px auto 0";
  backBtn.textContent = "← Back to Arena";
  backBtn.onclick = function(){ stopMiniGame(); };
  card.appendChild(backBtn);

  els.view.appendChild(card);

  var ctx = canvas.getContext("2d");
  if(mg.type==="space"){
    wireSpaceControls(ctr);
    if(!mg.running){ mg.running = true; spaceLoop(ctx, canvas); }
  } else {
    wireParkourControls(ctr);
    if(!mg.running){ mg.running = true; parkourLoop(ctx, canvas); }
  }
}

function wireSpaceControls(ctr){
  var mg = state.miniGame;
  var left = ctr.querySelector("#mgLeft"), right = ctr.querySelector("#mgRight"), boost = ctr.querySelector("#mgBoost");
  var mv = null;
  ["mousedown","touchstart"].forEach(function(ev){
    left.addEventListener(ev, function(e){ e.preventDefault(); mv=-1; });
    right.addEventListener(ev, function(e){ e.preventDefault(); mv=1; });
  });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    left.addEventListener(ev, function(){ mv=null; });
    right.addEventListener(ev, function(){ mv=null; });
  });
  mg._mv = function(){ return mv; };
  boost.onclick = function(){
    if(mg.boosting) return;
    if(mg.fuel<10){ toast("Need 10 fuel to boost!"); return; }
    mg.fuel -= 10; mg.boosting = true;
  };
  if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
  if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  mg._keydown = function(e){ if(e.key==="ArrowLeft") mv=-1; if(e.key==="ArrowRight") mv=1; };
  mg._keyup = function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight") mv=null; };
  document.addEventListener("keydown", mg._keydown);
  document.addEventListener("keyup", mg._keyup);
}

function spaceLoop(ctx, canvas){
  var mg = state.miniGame;
  if(!mg || mg.type!=="space" || !mg.running) return;
  if(mg.ship.x===undefined) mg.ship.x = canvas.width/2;
  if(mg.ship.y===undefined) mg.ship.y = canvas.height-30;
  if(mg.padX===undefined) mg.padX = 40+Math.random()*(canvas.width-80);
  mg.frame = (mg.frame||0)+1;

  var mv = mg._mv ? mg._mv() : null;
  if(mv && !mg.boosting) mg.ship.x += mv*4;
  mg.ship.x = Math.max(16, Math.min(canvas.width-16, mg.ship.x));

  if(!mg.boosting){
    if(mg.frame%40===0) mg.asteroids.push({x:20+Math.random()*(canvas.width-40), y:-10, r:10+Math.random()*8, vy:1.5+Math.random()*1.5});
    mg.asteroids.forEach(function(a){ a.y += a.vy; });
    mg.asteroids.forEach(function(a){
      var dx=a.x-mg.ship.x, dy=a.y-mg.ship.y;
      if(Math.sqrt(dx*dx+dy*dy) < a.r+12) a.hit=true;
    });
    var hitAny = mg.asteroids.some(function(a){ return a.hit; });
    mg.asteroids = mg.asteroids.filter(function(a){ return !a.hit && a.y<canvas.height+20; });
    if(hitAny){
      mg.lives = Math.max(0, mg.lives-1);
      mg.flash = 8;
      toast("💥 Hit! "+mg.lives+" lives left");
      if(mg.lives<=0){ mg.lives=3; mg.fuel=Math.max(0,mg.fuel-5); toast("Ship reset — careful out there!"); }
    }
  } else {
    mg.ship.y -= 5;
    if(mg.ship.y<=30){
      mg.boosting = false;

  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "rgba(255,255,255,.5)";

  ctx.fillRect(mg.padX-24, 20, 48, 8);
  ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("LANDING PAD", mg.padX, 16);
  ctx.fillStyle = "#b5602f";
  mg.asteroids.forEach(function(a){ ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); });
  ctx.fillStyle = mg.flash>0 ? "#ff5555" : "#6bbf8c";
  if(mg.flash>0) mg.flash--;
  ctx.beginPath();
  ctx.moveTo(mg.ship.x, mg.ship.y-14);

  ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";

function wireParkourControls(ctr){
  var mg = state.miniGame;
  var left = ctr.querySelector("#mgLeft"), right = ctr.querySelector("#mgRight"), jumpBtn = ctr.querySelector("#mgJump");
  var mv = null;
  ["mousedown","touchstart"].forEach(function(ev){
    left.addEventListener(ev, function(e){ e.preventDefault(); mv=-1; });
    right.addEventListener(ev, function(e){ e.preventDefault(); mv=1; });
  });
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(function(ev){
    left.addEventListener(ev, function(){ mv=null; });
    right.addEventListener(ev, function(){ mv=null; });
  });
  mg._mv = function(){ return mv; };
  function doJump(){
    if(mg.runner.jumping) return;
    if(mg.fuel<1){ toast("Need jump energy!"); return; }
    mg.fuel -= 1; mg.runner.jumping = true; mg.runner.vy = -11;
  }
  jumpBtn.onclick = doJump;
  if(mg._keydown) document.removeEventListener("keydown", mg._keydown);
  if(mg._keyup) document.removeEventListener("keyup", mg._keyup);
  mg._keydown = function(e){
    if(e.code==="Space"){ e.preventDefault(); doJump(); }
    if(e.key==="ArrowLeft") mv=-1;
    if(e.key==="ArrowRight") mv=1;
  };
  mg._keyup = function(e){ if(e.key==="ArrowLeft"||e.key==="ArrowRight") mv=null; };
  document.addEventListener("keydown", mg._keydown);
  document.addEventListener("keyup", mg._keyup);
}

/* Vertical platformer: the runner leaps upward from platform to platform (like a climbing tower),
   moving left/right to line up each jump. The camera scrolls up as he climbs higher, new platforms
   spawn above, and falling off the bottom just respawns him on fresh ground — no harsh penalty. */
function parkourLoop(ctx, canvas){
  var mg = state.miniGame;
  if(!mg || mg.type!=="parkour" || !mg.running) return;
  var groundY = canvas.height-40;

  function resetLadder(){
    mg.runner.x = canvas.width/2; mg.runner.y = groundY; mg.runner.vy = 0; mg.runner.jumping = false;
    mg.platforms = [{x: canvas.width/2-30, y: groundY, w:60, flag:false, scored:true}];
  }
  if(mg.runner.y===undefined) resetLadder();
  mg.frame = (mg.frame||0)+1;

  var mv = mg._mv ? mg._mv() : null;
  if(mv) mg.runner.x += mv*3.5;
  if(mg.runner.x < -14) mg.runner.x = canvas.width+14;
  if(mg.runner.x > canvas.width+14) mg.runner.x = -14;

  if(mg.runner.jumping){
    mg.runner.vy += 0.5;
    mg.runner.y += mg.runner.vy;
    if(mg.runner.vy>0){
      mg.platforms.forEach(function(p){
        if(p.landed) return;
        var withinX = mg.runner.x > p.x-6 && mg.runner.x < p.x+p.w+6;
        var withinY = mg.runner.y >= p.y-4 && mg.runner.y <= p.y+8;
        if(withinX && withinY){
          mg.runner.y = p.y; mg.runner.vy = 0; mg.runner.jumping = false;
          if(!p.scored){
            p.scored = true; mg.score++;
            grantXP(state.activeKid, p.flag?20:5);
            toast(p.flag ? "🚩 Flag platform! +20 XP" : "+5 XP");
          }
        }
      });
    }
  }

  // camera: keep the runner from climbing past the upper third of the view by scrolling the world down
  var scrollLine = canvas.height*0.4;
  if(mg.runner.y < scrollLine){
    var scrollAmt = scrollLine - mg.runner.y;
    mg.runner.y += scrollAmt;
    mg.platforms.forEach(function(p){ p.y += scrollAmt; });
  }

  // keep the ladder stocked with platforms above the highest one
  while(mg.platforms.length && mg.platforms[mg.platforms.length-1].y > -20){
    var top = mg.platforms[mg.platforms.length-1];
    var newY = top.y - (55+Math.random()*30);
    var newX = 20+Math.random()*(canvas.width-100);
    mg.platforms.push({x:newX, y:newY, w:60, flag:(mg.platforms.length%4===0)});
  }
  mg.platforms = mg.platforms.filter(function(p){ return p.y < canvas.height+30; });

  if(mg.runner.y > canvas.height+20){
    toast("Fell! Climb again 🧗");
    resetLadder();
  }

  ctx.clearRect(0,0,canvas.width,canvas.height);
  mg.platforms.forEach(function(p){
    ctx.fillStyle = "#e0b155";
    ctx.fillRect(p.x, p.y+4, p.w, 10);
    if(p.flag){
      ctx.fillStyle = "#b5602f";
      ctx.fillRect(p.x+p.w/2-1, p.y-20, 2, 24);
      ctx.fillRect(p.x+p.w/2+1, p.y-20, 10, 8);
    }
  });
  ctx.fillStyle = "#6bbf8c";
  ctx.beginPath(); ctx.arc(mg.runner.x, mg.runner.y-10, 14, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("Score "+mg.score, 8, 16);

  mg.raf = requestAnimationFrame(function(){ parkourLoop(ctx, canvas); });
}

function startQuiz(subject, studyGuide){
  var pool = state.questions.filter(function(q){
    if(q.kidId!==state.activeKid && q.kidId!=="any") return false;
    if(studyGuide) return q.studyGuide===studyGuide;
    return q.subject===subject;
  });
  pool = pool.slice().sort(function(){return Math.random()-.5;});
  if(!studyGuide) pool = pool.slice(0,8); // subject quick-fire stays short; study guide mode covers everything so it can be replayed like a full study session
  state.quiz = {subject: subject, studyGuide: studyGuide||null, pool: pool, idx:0, score:0, xpEarned:0, phase:"question", timer:studyGuide?25:15, timerHandle:null, timeoutId:null};
  renderArena();
  armTimer();
}

function armTimer(){
  clearInterval(state.quiz.timerHandle);
  state.quiz.timer = state.quiz.studyGuide ? 25 : 15;
  state.quiz.timerHandle = setInterval(function(){
    if(!state.quiz) return clearInterval(state.quiz.timerHandle);
    state.quiz.timer--;
    var t = document.getElementById("qzTimer");
    if(t) t.textContent = Math.max(0,state.quiz.timer)+"s";
    if(state.quiz.timer<=0){

function answerQuiz(choiceIdx){
  var quiz = state.quiz;
  if(!quiz || quiz.phase!=="question") return;
  clearInterval(quiz.timerHandle);
  quiz.phase = "reveal";
  var q = quiz.pool[quiz.idx];
  var correct = choiceIdx===q.answerIndex;
  if(correct){ quiz.score++; quiz.xpEarned += (q.xp||15); }
  var opts = document.querySelectorAll(".qz-opt");
  opts.forEach(function(btn,i){
    btn.disabled = true;
    if(i===q.answerIndex) btn.classList.add("correct");
    else if(i===choiceIdx) btn.classList.add("wrong");
  });
  if(correct) toast("+"+(q.xp||15)+" XP!"); else toast("Not quite — keep going");
  quiz.timeoutId = setTimeout(function(){
    if(state.quiz!==quiz) return; // kid navigated away before this fired
    quiz.idx++;
    if(quiz.idx>=quiz.pool.length){
      quiz.phase = "done";
      if(quiz.xpEarned>0 && db){
        var kd = kidData(state.activeKid);
        var oldXp = kd.xp||0, newXp = oldXp+quiz.xpEarned;
        var lvl = levelUpBonus(oldXp, newXp);
        var updates = {xp: newXp};
        if(lvl.gained>0) updates.mommaMoney = (kd.mommaMoney||0) + lvl.bonus;
        Object.assign(kd, updates);
        state.kids[state.activeKid] = kd;
        db.doc("kids/"+state.activeKid).update(updates);
        if(lvl.gained>0){ logLevelUpReward(state.activeKid, lvl); }
      }
      renderArena();
    } else {
      quiz.phase = "question";
      renderArena();
      armTimer();
    }
  }, 900);
}

function doc(path){
  var parts = path.split("/"), coll = parts[0], id = parts[1];
  var table = TABLE[coll], keyCol = KEY_COL[coll];
  return {
    update: function(partial){
      return sb.from(table).update(toRow(coll, partial)).eq(keyCol, id).then(checkWriteError);
    },
    set: function(full){
      return sb.from(table).update(toRow(coll, full)).eq(keyCol, id).then(checkWriteError);
    },
    delete: function(){
      return sb.from(table).delete().eq(keyCol, id).then(checkWriteError);
    },
    onSnapshot: function(){ /* no-op: this build polls instead of pushing live snapshots per-doc */ }
  };
}
function collection(coll){
  var table = TABLE[coll];
  return {
    add: function(obj){
      var id = obj.id || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random());
      var row = toRow(coll, obj);
      row.id = id; row.household_id = HOUSEHOLD_ID;
      return sb.from(table).insert(row).then(checkWriteError);
    },
    onSnapshot: function(){ /* no-op: this build polls instead of pushing live snapshots per-collection */ }
  };
}

/* Read-only: prints (via console.table) each curriculum assignment's stored date next to what
   date it "should" be if the 5-day Mon-Fri cadence were followed exactly from the Day-0 lesson's
   own actual date — and flags any that landed on a real Saturday/Sunday. Does not change anything;
   run this first to see how far a schedule has drifted before deciding whether/how to fix it. */
function diagnoseScheduleDates(kidId){
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){ byTitle[item.title] = item.d; });
  var rows = [];
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId) return;
    var d = byTitle[a.title];
    if(d==null) return;
    rows.push({id:id, d:d, subject:a.subject, title:a.title, date:a.date, done:a.done});
  });
  rows.sort(function(x,y){ return x.d-y.d; });
  var anchorRow = rows.filter(function(r){ return r.d===0; })[0];
  if(!anchorRow){ console.log("diagnoseScheduleDates: couldn't find a Day 0 assignment to anchor from."); return []; }
  var anchorDate = new Date(anchorRow.date+"T00:00:00");
  var out = rows.map(function(r){
    var week = Math.floor(r.d/5), weekday = r.d%5;
    var expected = new Date(anchorDate);
    expected.setDate(expected.getDate() + week*7 + weekday);
    var expectedISO = isoDate(expected);
    var dow = expected.getDay();
    return {
      day: r.d, subject: r.subject, title: r.title.length>55 ? r.title.slice(0,55)+"…" : r.title,
      storedDate: r.date, expectedFromDay0: expectedISO,
      mismatch: r.date!==expectedISO,
      fallsOnWeekend: (dow===0||dow===6),
      done: r.done
    };
  });
  console.table(out);
  return out;
}

/* Read-only, full-picture audit of one kid's assignments — run this first whenever something

function auditAssignments(kidId){

  console.log("=== auditAssignments("+kidId+") — "+full.length+" total assignments ===");

  var duplicates = [];

  console.log("=== Duplicates (same date + title) — "+duplicates.length+" row(s) ===");
  if(duplicates.length) console.table(duplicates.map(function(a){ return {id:a.id, date:a.date, title:a.title, done:a.done}; }));

  var staleIncomplete = all.filter(function(a){ return a.date && a.date<todayStr && !a.done; });

  if(staleIncomplete.length) console.table(staleIncomplete.map(function(a){ return {id:a.id, date:a.date, subject:a.subject, title:a.title}; }));

  if(noDate.length) console.table(noDate.map(function(a){ return {id:a.id, subject:a.subject, title:a.title}; }));

  console.log("=== Everything touching Reading/ELA (own subject OR cross-tagged) — "+readingRelated.length+" row(s) ===");
  console.table(readingRelated.map(function(a){

  }));

  return {full:full, duplicates:duplicates, staleIncomplete:staleIncomplete, noDate:noDate, readingRelated:readingRelated};

/* Moves every NOT-YET-DONE curriculum assignment onto a fresh Monday-through-Friday-only schedule
   starting today (or the next school day, if today's a weekend) — grouping same-day lessons (across
   subjects) together so the sequence stays intact. Anything already marked done is left completely
   untouched (its date and completion stay as-is), so already-finished work is never re-dated or lost. */
function schoolDayOffset(start, i){
  var result = new Date(start);
  var count = 0;
  while(count < i){
    result.setDate(result.getDate()+1);
    var day = result.getDay();
    if(day!==0 && day!==6) count++;
  }
  return result;
}
function rescheduleFromToday(kidId){
  if(!db) return;
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){ byTitle[item.title] = item.d; });
  var groups = {};
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId || a.done) return;
    var d = byTitle[a.title];
    if(d==null) return;
    (groups[d] = groups[d]||[]).push(id);
  });
  var days = Object.keys(groups).map(Number).sort(function(x,y){ return x-y; });
  if(!days.length){ console.log("rescheduleFromToday: nothing to move — everything matched is already done."); return; }
  var today = new Date();
  var todayDow = today.getDay();
  var start = todayDow===6 ? schoolDayOffset(today,2) : todayDow===0 ? schoolDayOffset(today,1) : today;
  var count = 0;
  days.forEach(function(d, i){
    var iso = isoDate(schoolDayOffset(start, i));
    groups[d].forEach(function(id){
      state.assignments[id].date = iso;
      db.doc("assignments/"+id).update({date: iso});
      count++;
    });
  });
  console.log("rescheduleFromToday: moved "+count+" not-yet-done assignment(s) onto a Mon–Fri-only schedule starting "+isoDate(start)+".");
  renderView();
}

    var updates = {};
    if(match.mathSkill && a.mathSkill!==match.mathSkill) updates.mathSkill = match.mathSkill;
    if(match.practice && JSON.stringify(a.practice)!==JSON.stringify(match.practice)) updates.practice = match.practice;
    if(Object.keys(updates).length===0) return;
    Object.assign(state.assignments[id], updates);
    db.doc("assignments/"+id).update(updates);
    count++;
  });
  console.log("patchMathLessons: updated "+count+" assignment(s)");
  renderView();
}

/* Patches already-imported Independent "install Windows XX" lessons (matched by exact title) with
   the new installHelp field, so the VM troubleshooting steps show up on lessons imported before
   this content existed. */
function patchInstallHelp(kidId){
  if(!db) return;
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){
    if(item.installHelp) byTitle[item.title] = item.installHelp;
  });
  var count = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId) return;
    var help = byTitle[a.title];
    if(!help || a.installHelp===help) return;
    Object.assign(state.assignments[id], {installHelp: help});
    db.doc("assignments/"+id).update({installHelp: help});
    count++;
  });
  console.log("patchInstallHelp: updated "+count+" assignment(s)");
  renderView();
}

/* Backfills crossSubjects onto already-imported VM install/setup lessons (matched by title, same
   as patchInstallHelp) — these are filed under "Independent" for scheduling, but the real work is
   reading technical docs, writing up the guide, computer-science concepts, and (Retro OS Museum)
   actual OS history, so they should count toward hours/coverage in all of those subjects too. */
function patchVMLessonCrossSubjects(kidId){
  if(!db) return;
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){
    if(item.crossSubjects) byTitle[item.title] = item.crossSubjects;
  });
  var count = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId) return;
    var cs = byTitle[a.title];
    if(!cs || (Array.isArray(a.crossSubjects) && a.crossSubjects.join(",")===cs.join(","))) return;
    Object.assign(state.assignments[id], {crossSubjects: cs});
    db.doc("assignments/"+id).update({crossSubjects: cs});
    count++;
  });
  console.log("patchVMLessonCrossSubjects: updated "+count+" assignment(s)");
  renderView();
}

/* Patches already-imported lessons (matched by exact title, any subject) with whatever materials/
   video/standard the curriculum template currently has — covers the general case where a lesson
   was imported before a real link was added to CURRICULUM_RETRO_OS_MONTH1, so the stored assignment
   is missing (or has an outdated) materials/video URL and shows as plain unclickable text instead
   of a link. Only fills in fields the template actually has; never clears an existing value. */
function patchLessonLinks(kidId){
  if(!db) return;
  var byTitle = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){ byTitle[item.title] = item; });
  var count = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId) return;
    var match = byTitle[a.title];
    if(!match) return;
    var updates = {};
    ["materials","video","standard"].forEach(function(field){
      if(match[field] && a[field]!==match[field]) updates[field] = match[field];
    });
    if(Object.keys(updates).length===0) return;
    Object.assign(state.assignments[id], updates);
    db.doc("assignments/"+id).update(updates);
    count++;
  });
  console.log("patchLessonLinks: updated "+count+" assignment(s)");
  renderView();
}

function patchHistoryReadingLinks(kidId){
  if(!db) return;
  var byStandard = {};
  CURRICULUM_RETRO_OS_MONTH1.forEach(function(item){
    if(item.subject==="Social Studies" && item.standard && /^SS4H/.test(item.standard)) byStandard[item.standard] = item;
  });
  var count = 0;
  Object.keys(state.assignments).forEach(function(id){
    var a = state.assignments[id];
    if(a.kidId!==kidId || a.subject!=="Social Studies") return;
    var match = byStandard[a.standard];
    if(!match) return;
    var updates = {};
    if(match.title && a.title!==match.title) updates.title = match.title;
    if(match.materials && a.materials!==match.materials) updates.materials = match.materials;
    if(match.quiz) updates.quiz = match.quiz;
    if(match.quizRetry) updates.quizRetry = match.quizRetry;
    if(Object.keys(updates).length===0) return;
    Object.assign(state.assignments[id], updates);
    db.doc("assignments/"+id).update(updates);
    count++;
  });
  console.log("patchHistoryReadingLinks: updated "+count+" assignment(s)");
  renderView();
}
window.patchHistoryReadingLinks = patchHistoryReadingLinks;

function seedArenaQuestions(kidId){
  if(!db) return;
  var existing = {};
  state.questions.forEach(function(q){ existing[q.subject+"||"+q.q] = true; });
  var added = 0;
  ARENA_QUESTION_SEED.forEach(function(item){
    if(existing[item.subject+"||"+item.q]) return;
    db.collection("questions").add({subject:item.subject, q:item.q, choices:item.choices, answerIndex:item.answerIndex, kidId:kidId, xp:15});
    added++;
  });
  console.log("seedArenaQuestions: added "+added+" question(s)");
}

/* One-time maintenance utilities — intentionally not in the UI, run from the browser console when actually needed:
   removeDuplicateAssignments(state.activeKid)   — cleans up accidental double-imports
   resetKidLegacyData(state.activeKid, CURRICULUM_RETRO_OS_MONTH1, "Retro OS Museum — Month 1") — one-time legacy wipe
   patchMathLessons(state.activeKid)             — adds the math field guide + extra practice to already-imported lessons
   seedArenaQuestions(state.activeKid)           — adds a starter mix of quiz questions across every subject
   diagnoseScheduleDates(state.activeKid)        — read-only: prints each lesson's date vs. its expected day-in-sequence
   rescheduleFromToday(state.activeKid)          — moves not-yet-done lessons onto a Mon-Fri-only schedule starting today; leaves done work untouched
   patchInstallHelp(state.activeKid)             — adds the VM install troubleshooting card to already-imported install lessons
   patchLessonLinks(state.activeKid)             — backfills materials/video/standard on any already-imported lesson from the current curriculum template */

window.removeDuplicateTitlesAcrossDates = removeDuplicateTitlesAcrossDates;

window.CURRICULUM_RETRO_OS_MONTH1 = CURRICULUM_RETRO_OS_MONTH1;

var syncTimer = null;
function syncSoon(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 250); }

function syncAll(){
  if(!HOUSEHOLD_ID) return;
  Promise.all([
    sb.from("al_kids").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_schedule").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_assignments").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_questions").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_journal").select("*").eq("household_id", HOUSEHOLD_ID),
    sb.from("al_reflections").select("*").eq("household_id", HOUSEHOLD_ID)
  ]).then(function(results){
    var kidsRows = results[0].data || [], schedRows = results[1].data || [], assignRows = results[2].data || [], qRows = results[3].data || [];
    var journalRows = results[4].data || [], reflectionRows = results[5].data || [];
    state.kids = {};
    kidsRows.forEach(function(r){ state.kids[r.id] = fromRow("kids", r); });
    state.schedules = {};
    schedRows.forEach(function(r){ state.schedules[r.kid_id] = { blocks: r.blocks || [] }; });
    state.assignments = {};
    assignRows.forEach(function(r){ state.assignments[r.id] = fromRow("assignments", r); });
    state.questions = qRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("questions", r)); });
    state.journalEntries = journalRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("journal", r)); });
    state.reflections = reflectionRows.map(function(r){ return Object.assign({ id: r.id }, fromRow("reflections", r)); });
    KIDS.forEach(function(k){ if(state.kids[k.id]) stampAttendance(k.id); });
    updateLibraryTabVisibility();
    renderKidbar(); renderXpBar();
    /* Never re-render out from under someone mid-keystroke — the poll still refreshes the
       underlying data, it just holds off replacing the DOM (and wiping unsaved text) until the
       field loses focus. Same root cause as the earlier lesson-detail work-box fix, generalized
       so it covers Morning Launch/Show & Teach and anything typed anywhere, not just that one page. */
    if(!state.quiz && !state.miniGame && state.lessonDetailId==null && !isTypingInFormField()) renderView();
  }).catch(function(){});
}
function isTypingInFormField(){
  var el = document.activeElement;
  if(!el) return false;
  var tag = el.tagName;
  return tag==="TEXTAREA" || (tag==="INPUT" && el.type!=="checkbox" && el.type!=="radio" && el.type!=="file");
}

/* ---------- Momma Money deposit (works now — this is a real webpage, not sandboxed) ---------- */
function mmDepositLevelUp(kidId, lvl){
  var memberId = MM_MEMBERS[kidId];
  if(!memberId) return Promise.resolve(false);
  return sb.from("transactions").insert({
    household_id: HOUSEHOLD_ID, member_id: memberId, type: "earn", amount: lvl.bonus,
    description: "Academy Log — Level " + lvl.newLevel + " bonus", status: "approved"
  }).then(function(r){
    if(r.error) throw r.error;
    return true;
  });
}
// Hook the deposit into the existing level-up flow (defined earlier in this file)
logLevelUpReward = function(kidId, lvl){
  if(db) db.collection("rewards").add({ kidId: kidId, type:"level-up", level: lvl.newLevel, amount: lvl.bonus, at: new Date().toISOString() });
  mmDepositLevelUp(kidId, lvl).then(function(deposited){
    if(deposited){
      db.doc("kids/"+kidId).update({ mommaMoney: 0 });
      if(kidId===state.activeKid) toast("$"+lvl.bonus+" deposited to Momma Money! 💰");
    }
    showLevelUpBanner(kidId, lvl);
  }).catch(function(){ showLevelUpBanner(kidId, lvl); });
};

/* ---------- login gate ---------- */
var loginEl = document.getElementById("loginGate");
var appEl = document.getElementById("appRoot");
function showApp(){
  loginEl.style.display = "none";
  appEl.style.display = "";
  updateLibraryTabVisibility();
  renderKidbar(); renderXpBar(); renderView();
  syncAll();
  setInterval(syncAll, 4000);
}
function tryRestoreSession(){
  sb.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(session){ HOUSEHOLD_ID = session.user.id; showApp(); }
  });
}
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  var email = document.getElementById("loginEmail").value.trim();
  var pass = document.getElementById("loginPass").value;
  var errEl = document.getElementById("loginError");
  var btn = document.getElementById("loginBtn");
  errEl.textContent = ""; btn.disabled = true; btn.textContent = "Connecting…";
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
    btn.disabled = false; btn.textContent = "Log In";
    if(res.error){ errEl.textContent = res.error.message; return; }
    HOUSEHOLD_ID = res.data.session.user.id;
    showApp();
  });
});
tryRestoreSession();

})();
